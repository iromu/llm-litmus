<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connected — Particle Network</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04060e;
  }

  canvas {
    display: block;
    position: fixed;
    inset: 0;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 10;
  }

  .title {
    position: absolute;
    top: clamp(24px, 6vh, 64px);
    left: 50%;
    transform: translateX(-50%);
    font-family: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
    font-size: clamp(14px, 2.2vw, 22px);
    font-weight: 300;
    letter-spacing: clamp(0.5em, 1.2vw, 0.9em);
    text-transform: uppercase;
    color: rgba(140, 180, 255, 0.55);
    text-shadow: 0 0 24px rgba(80, 140, 255, 0.35), 0 0 60px rgba(80, 140, 255, 0.15);
    user-select: none;
    animation: titleFade 3s ease-out forwards;
  }

  @keyframes titleFade {
    from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .stats {
    position: absolute;
    bottom: clamp(16px, 4vh, 40px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: clamp(20px, 4vw, 48px);
    font-family: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
    font-size: clamp(10px, 1.4vw, 13px);
    font-weight: 400;
    letter-spacing: 0.18em;
    color: rgba(120, 160, 230, 0.4);
    user-select: none;
    white-space: nowrap;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .stat-label {
    text-transform: uppercase;
    font-size: 0.85em;
    color: rgba(100, 140, 210, 0.3);
  }

  .stat-value {
    color: rgba(160, 200, 255, 0.65);
    min-width: 2ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .hint {
    position: absolute;
    bottom: clamp(48px, 10vh, 90px);
    left: 50%;
    transform: translateX(-50%);
    font-family: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
    font-size: clamp(9px, 1.1vw, 11px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(100, 140, 210, 0.22);
    user-select: none;
    animation: hintPulse 4s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay">
  <h1 class="title">Connected</h1>
  <p class="hint">click to spawn &middot; move to attract</p>
  <div class="stats">
    <span class="stat"><span class="stat-label">Nodes</span><span class="stat-value" id="nodeCount">0</span></span>
    <span class="stat"><span class="stat-label">Links</span><span class="stat-value" id="linkCount">0</span></span>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const nodeEl = document.getElementById('nodeCount');
  const linkEl = document.getElementById('linkCount');

  // ---------- Configuration ----------
  const CFG = {
    baseCount: 90,          // particles on desktop
    mobileCount: 45,        // particles on small screens
    maxParticles: 400,      // hard cap (bursts)
    burstCount: 14,         // particles per click burst
    connectDist: 130,       // particle-to-particle link distance
    mouseDist: 180,         // cursor link distance
    speed: 0.35,            // base drift speed multiplier
    pulseSpeed: 0.008,      // sine pulse rate
    lineBaseAlpha: 0.14,    // base alpha for particle links
    mouseLineAlpha: 0.5,    // alpha for cursor links
    trail: 0.28,            // motion-blur fade (lower = longer trails)
    dprCap: 2,              // devicePixelRatio cap for perf
  };

  // ---------- State ----------
  let W = 0, H = 0, dpr = 1;
  let particles = [];
  let mouse = { x: -9999, y: -9999, active: false };
  let linkTotal = 0;
  let time = 0;

  // ---------- Helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

  function isMobile() { return Math.min(window.innerWidth, window.innerHeight) < 520; }

  // ---------- Particle ----------
  class Particle {
    constructor(x, y, burst = false) {
      this.x = x !== undefined ? x : rand(0, W);
      this.y = y !== undefined ? y : rand(0, H);
      const angle = rand(0, Math.PI * 2);
      const spd = burst ? rand(0.8, 2.4) : rand(0.15, 0.6);
      this.vx = Math.cos(angle) * spd * CFG.speed;
      this.vy = Math.sin(angle) * spd * CFG.speed;
      this.r = burst ? rand(1.2, 2.6) : rand(1.4, 3.2);
      this.phase = rand(0, Math.PI * 2);
      // hue: cool blue-cyan range with occasional violet
      this.hue = Math.random() < 0.82 ? rand(195, 225) : rand(255, 285);
      this.born = performance.now();
      this.isBurst = burst;
    }

    update(dt) {
      // gentle attraction toward cursor when close
      if (mouse.active) {
        const d2 = dist2(this.x, this.y, mouse.x, mouse.y);
        if (d2 < CFG.mouseDist * CFG.mouseDist) {
          const d = Math.sqrt(d2) || 1;
          const pull = 0.0035 * (1 - d / CFG.mouseDist);
          this.vx += ((mouse.x - this.x) / d) * pull;
          this.vy += ((mouse.y - this.y) / d) * pull;
        }
      }

      // damping keeps velocities bounded after attraction
      this.vx *= 0.995;
      this.vy *= 0.995;

      // keep a minimum drift so nothing fully stops
      const v = Math.hypot(this.vx, this.vy);
      if (v < 0.08) {
        const a = rand(0, Math.PI * 2);
        this.vx += Math.cos(a) * 0.02;
        this.vy += Math.sin(a) * 0.02;
      }

      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // bounce off walls
      if (this.x < 0)      { this.x = 0;     this.vx = Math.abs(this.vx); }
      else if (this.x > W) { this.x = W;     this.vx = -Math.abs(this.vx); }
      if (this.y < 0)      { this.y = 0;     this.vy = Math.abs(this.vy); }
      else if (this.y > H) { this.y = H;     this.vy = -Math.abs(this.vy); }
    }

    draw(ctx) {
      // alpha pulses via sine
      const pulse = 0.55 + 0.45 * Math.sin(time * CFG.pulseSpeed + this.phase);
      const age = performance.now() - this.born;
      const fadeIn = Math.min(1, age / 600); // fade in over 600ms
      const alpha = pulse * fadeIn;

      // glow halo
      const glowR = this.r * 5;
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowR);
      g.addColorStop(0, `hsla(${this.hue}, 90%, 70%, ${alpha * 0.5})`);
      g.addColorStop(0.4, `hsla(${this.hue}, 85%, 60%, ${alpha * 0.12})`);
      g.addColorStop(1, `hsla(${this.hue}, 80%, 50%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      // core dot
      ctx.fillStyle = `hsla(${this.hue}, 60%, 88%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- Sizing ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // scale connection distances on small screens
    const scale = Math.min(W, H) < 520 ? 0.7 : 1;
    CFG.connectDist = 130 * scale;
    CFG.mouseDist = 180 * scale;
  }

  // ---------- Init ----------
  function seed() {
    particles = [];
    const n = isMobile() ? CFG.mobileCount : CFG.baseCount;
    for (let i = 0; i < n; i++) particles.push(new Particle());
  }

  // ---------- Burst ----------
  function burst(x, y) {
    const room = CFG.maxParticles - particles.length;
    const count = Math.min(CFG.burstCount, room);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(
        x + rand(-12, 12),
        y + rand(-12, 12),
        true
      ));
    }
  }

  // ---------- Render loop ----------
  let lastT = performance.now();

  function frame(now) {
    const dt = Math.min((now - lastT) / 16.67, 3); // normalized to ~60fps units, clamped
    lastT = now;
    time = now;

    // fade previous frame (motion blur)
    ctx.fillStyle = `rgba(4, 6, 14, ${CFG.trail})`;
    ctx.fillRect(0, 0, W, H);

    // update
    for (const p of particles) p.update(dt);

    // ---- connections (particle ↔ particle) ----
    linkTotal = 0;
    const cd2 = CFG.connectDist * CFG.connectDist;
    ctx.lineWidth = 0.6;

    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j];
        const d2 = dist2(a.x, a.y, b.x, b.y);
        if (d2 < cd2) {
          const d = Math.sqrt(d2);
          const t = 1 - d / CFG.connectDist;
          const alpha = CFG.lineBaseAlpha * t * t;
          if (alpha < 0.008) continue;
          linkTotal++;
          const hue = (a.hue + b.hue) / 2;
          ctx.strokeStyle = `hsla(${hue}, 70%, 62%, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // ---- connections (cursor ↔ particles) ----
    if (mouse.active) {
      const md2 = CFG.mouseDist * CFG.mouseDist;
      ctx.lineWidth = 0.9;

      for (const p of particles) {
        const d2 = dist2(p.x, p.y, mouse.x, mouse.y);
        if (d2 < md2) {
          const d = Math.sqrt(d2);
          const t = 1 - d / CFG.mouseDist;
          const alpha = CFG.mouseLineAlpha * t * t;
          if (alpha < 0.01) continue;
          linkTotal++;
          const hue = p.hue;
          ctx.strokeStyle = `hsla(${hue}, 85%, 72%, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
      }

      // radial gradient glow at cursor
      const gr = 90;
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, gr);
      g.addColorStop(0, 'rgba(120, 180, 255, 0.18)');
      g.addColorStop(0.35, 'rgba(90, 150, 255, 0.06)');
      g.addColorStop(1, 'rgba(80, 140, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, gr, 0, Math.PI * 2);
      ctx.fill();

      // cursor ring
      ctx.strokeStyle = 'rgba(150, 200, 255, 0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ---- particles ----
    for (const p of particles) p.draw(ctx);

    // stats (throttled DOM writes)
    if ((now | 0) % 6 === 0) {
      nodeEl.textContent = particles.length;
      linkEl.textContent = linkTotal;
    }

    requestAnimationFrame(frame);
  }

  // ---------- Events ----------
  window.addEventListener('resize', () => { resize(); });

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('mouseleave', () => { mouse.active = false; });

  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (!t) return;
    mouse.x = t.clientX;
    mouse.y = t.clientY;
    mouse.active = true;
  }, { passive: true });

  window.addEventListener('touchend', () => { mouse.active = false; });

  window.addEventListener('click', e => {
    burst(e.clientX, e.clientY);
  });

  window.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    if (!t) return;
    burst(t.clientX, t.clientY);
  }, { passive: true });

  // ---------- Start ----------
  resize();
  seed();
  // paint solid background once before the fade loop starts
  ctx.fillStyle = '#04060e';
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
