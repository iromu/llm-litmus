<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoke — Atmospheric Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0c;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: none;
  }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.25);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    animation: fadeHint 6s ease-in-out forwards;
  }

  @keyframes fadeHint {
    0%, 60% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="smoke"></canvas>
<p class="hint">move your cursor to stir the smoke</p>

<script>
(() => {
  'use strict';

  // ─── Canvas setup ────────────────────────────────────────────────
  const canvas = document.getElementById('smoke');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Paint solid background on resize so we don't get a flash
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // ─── Particle pool ───────────────────────────────────────────────
  const MAX_PARTICLES = 300;
  const particles = new Array(MAX_PARTICLES).fill(null);
  let nextSlot = 0;

  class SmokeParticle {
    constructor() { this.alive = false; }

    spawn(x, y, vx, vy, baseSize, gray) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.age = 0;
      this.maxAge = 120 + Math.random() * 100; // frames
      this.size = baseSize;
      this.growthRate = 0.15 + Math.random() * 0.25;
      this.gray = gray;           // 0..1 brightness of the smoke tone
      this.alpha = 0.35 + Math.random() * 0.2;
      this.turbulence = Math.random() * Math.PI * 2;
      this.turbSpeed = 0.02 + Math.random() * 0.03;
      this.alive = true;
    }

    update(wind) {
      this.age++;
      if (this.age >= this.maxAge) { this.alive = false; return; }

      // Brownian / wind-like turbulence
      this.turbulence += this.turbSpeed;
      const turbX = Math.sin(this.turbulence * 1.7 + this.y * 0.008) * 0.06;
      const turbY = Math.cos(this.turbulence * 1.3 + this.x * 0.006) * 0.03;

      this.vx += (wind + turbX) * 0.02 + (Math.random() - 0.5) * 0.04;
      this.vy += (-0.012 + turbY) * 0.02 + (Math.random() - 0.5) * 0.02;

      // Damping
      this.vx *= 0.985;
      this.vy *= 0.985;

      this.x += this.vx;
      this.y += this.vy;

      // Grow as it ages
      this.size += this.growthRate;

      // Alpha decay — smooth ease-out
      const t = this.age / this.maxAge;
      this.alpha = (0.35 + Math.random() * 0.05) * (1 - t) * (1 - t) * 0.9;
    }

    draw(ctx) {
      if (!this.alive || this.alpha < 0.005) return;
      const g = Math.round(this.gray * 255);
      const r = this.size;
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      grad.addColorStop(0, `rgba(${g},${g},${g + 4},${this.alpha})`);
      grad.addColorStop(0.4, `rgba(${g},${g},${g + 2},${this.alpha * 0.55})`);
      grad.addColorStop(1, `rgba(${g},${g},${g},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = 0; i < MAX_PARTICLES; i++) particles[i] = new SmokeParticle();

  function emit(x, y, vx, vy, size, gray) {
    // Find a dead slot (round-robin scan)
    for (let n = 0; n < MAX_PARTICLES; n++) {
      const idx = (nextSlot + n) % MAX_PARTICLES;
      if (!particles[idx].alive) {
        nextSlot = (idx + 1) % MAX_PARTICLES;
        particles[idx].spawn(x, y, vx, vy, size, gray);
        return;
      }
    }
    // Pool full — overwrite oldest-ish slot
    nextSlot = (nextSlot + 1) % MAX_PARTICLES;
    particles[nextSlot].spawn(x, y, vx, vy, size, gray);
  }

  // ─── Mouse tracking ──────────────────────────────────────────────
  const mouse = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, active: false };

  function setMouse(cx, cy) {
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = cx;
    mouse.y = cy;
    mouse.active = true;
  }

  window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    setMouse(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener('mouseleave', () => { mouse.active = false; });
  window.addEventListener('touchend', () => { mouse.active = false; });

  // ─── Emission logic ──────────────────────────────────────────────
  let frame = 0;

  function emitFromMouse() {
    if (!mouse.active) return;
    const dx = mouse.x - mouse.px;
    const dy = mouse.y - mouse.py;
    const speed = Math.sqrt(dx * dx + dy * dy);
    const count = Math.min(3, 1 + Math.floor(speed / 12));

    for (let i = 0; i < count; i++) {
      const t = i / Math.max(count, 1);
      const ix = mouse.px + dx * t;
      const iy = mouse.py + dy * t;
      emit(
        ix + (Math.random() - 0.5) * 8,
        iy + (Math.random() - 0.5) * 8,
        dx * 0.03 + (Math.random() - 0.5) * 0.5,
        dy * 0.03 - 0.3 + (Math.random() - 0.5) * 0.3,
        12 + Math.random() * 10,
        0.55 + Math.random() * 0.2
      );
    }
  }

  function emitAmbient() {
    // Continuous ambient emission from the bottom edge
    if (frame % 3 !== 0) return;
    const x = Math.random() * W;
    const y = H - 10 + Math.random() * 20;
    emit(
      x,
      y,
      (Math.random() - 0.5) * 0.4,
      -(0.3 + Math.random() * 0.5),
      15 + Math.random() * 15,
      0.35 + Math.random() * 0.2
    );
  }

  // Occasional larger "plume" bursts from the bottom
  function emitPlume() {
    if (Math.random() > 0.008) return;
    const x = Math.random() * W;
    const y = H - 5;
    const n = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      emit(
        x + (Math.random() - 0.5) * 40,
        y + (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 0.6,
        -(0.5 + Math.random() * 0.8),
        20 + Math.random() * 20,
        0.4 + Math.random() * 0.15
      );
    }
  }

  // ─── Wind field (slowly varying global drift) ────────────────────
  let windPhase = 0;

  // ─── Render loop ─────────────────────────────────────────────────
  function tick() {
    frame++;
    windPhase += 0.003;
    const wind = Math.sin(windPhase) * 0.15 + Math.sin(windPhase * 0.37) * 0.08;

    // Trailing fade — semi-transparent dark overlay
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(10, 10, 12, 0.08)';
    ctx.fillRect(0, 0, W, H);

    // Additive blending for soft glow accumulation
    ctx.globalCompositeOperation = 'lighter';

    emitFromMouse();
    emitAmbient();
    emitPlume();

    for (let i = 0; i < MAX_PARTICLES; i++) {
      const p = particles[i];
      if (!p.alive) continue;
      p.update(wind);
      if (p.alive) p.draw(ctx);
    }

    // Subtle vignette pulse for atmosphere
    ctx.globalCompositeOperation = 'source-over';
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${0.03 + Math.sin(frame * 0.005) * 0.015})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(tick);
  }

  // Seed initial particles so the scene isn't empty on load
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * W;
    const y = H * 0.4 + Math.random() * H * 0.6;
    emit(x, y, (Math.random() - 0.5) * 0.3, -(0.2 + Math.random() * 0.4),
         15 + Math.random() * 20, 0.35 + Math.random() * 0.2);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
