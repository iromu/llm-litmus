<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folding Fans — Kinetic Study</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0806; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .hint {
    position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    font-size: clamp(0.7rem, 1.6vw, 0.95rem); letter-spacing: 0.18em;
    color: rgba(235, 210, 170, 0.55); pointer-events: none; user-select: none;
    transition: opacity 2s ease; white-space: nowrap;
  }
  .hint.fade { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Animated folding fans opening and closing"></canvas>
<p class="hint" id="hint">click anywhere to reshape the fans</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  let time = 0;
  let lastTs = 0;
  let fans = [];

  /* ---------- warm palette helpers ---------- */

  // Traditional Japanese fan hues: vermilion, gold, persimmon, amber, rust, rosewood
  function pickHue() {
    const bands = [
      [4, 14],    // deep red / vermilion
      [14, 28],   // persimmon / orange
      [28, 44],   // amber / gold
      [340, 360]  // wraparound rosewood (handled below)
    ];
    const b = bands[Math.floor(Math.random() * bands.length)];
    return b[0] + Math.random() * (b[1] - b[0]);
  }

  function hsla(h, s, l, a) {
    return `hsla(${h.toFixed(1)},${s}%,${l}%,${a})`;
  }

  /* ---------- fan model ---------- */

  function makeFan(x, y, radius, facing) {
    const ribCount = 7 + Math.floor(Math.random() * 6);        // 7..12 ribs
    const baseHue = pickHue();
    const hueSpread = 18 + Math.random() * 30;                  // gradient across ribs
    const openAmp = 0.55 + Math.random() * 0.35;                // radians of swing
    const phase = Math.random() * Math.PI * 2;
    const speed = 0.25 + Math.random() * 0.35;                  // rad/s-ish
    const closedAngle = 0.06 + Math.random() * 0.05;            // near-closed gap
    const fullAngle = 1.9 + Math.random() * 0.7;                // fully open span
    const fabricAlpha = 0.16 + Math.random() * 0.14;
    const ribWidthBase = 1.4 + Math.random() * 1.6;
    const handleLen = radius * (0.16 + Math.random() * 0.1);
    const pivotR = 3.5 + Math.random() * 2.5;
    const lightness = 52 + Math.random() * 14;
    const saturation = 62 + Math.random() * 26;

    return {
      x, y, radius, facing,
      ribCount, baseHue, hueSpread,
      openAmp, phase, speed,
      closedAngle, fullAngle,
      fabricAlpha, ribWidthBase,
      handleLen, pivotR,
      lightness, saturation
    };
  }

  function regenerate() {
    fans = [];
    const count = W < 640 ? 3 : W < 1100 ? 4 : 5;
    const minDim = Math.min(W, H);

    for (let i = 0; i < count; i++) {
      // Distribute fans across the screen with jitter, avoiding exact center overlap
      const col = count === 1 ? 0.5 : i / (count - 1);
      const x = W * (0.12 + 0.76 * col) + (Math.random() - 0.5) * W * 0.1;
      const y = H * (0.3 + Math.random() * 0.4);
      const radius = minDim * (0.16 + Math.random() * 0.13);
      const facing = Math.random() < 0.5 ? 0 : Math.PI; // face up or down
      fans.push(makeFan(x, y, radius, facing));
    }
  }

  /* ---------- drawing ---------- */

  function currentSpan(fan) {
    // Sine-wave oscillation between closedAngle and fullAngle
    const t = time * fan.speed + fan.phase;
    const osc = 0.5 - 0.5 * Math.cos(t);          // 0..1 smooth
    return fan.closedAngle + (fan.fullAngle - fan.closedAngle) * osc;
  }

  function drawFan(fan) {
    const span = currentSpan(fan);
    const dir = fan.facing === 0 ? -1 : 1;         // -1 opens upward, +1 downward
    const startA = fan.facing === 0 ? (-Math.PI / 2 - span / 2) : (Math.PI / 2 - span / 2);

    // Rib endpoints
    const pts = [];
    for (let i = 0; i < fan.ribCount; i++) {
      const f = fan.ribCount === 1 ? 0.5 : i / (fan.ribCount - 1);
      const a = startA + span * f;
      pts.push({
        x: fan.x + Math.cos(a) * fan.radius,
        y: fan.y + Math.sin(a) * fan.radius,
        a, f
      });
    }

    /* -- fabric panels: semi-transparent triangles between adjacent ribs -- */
    for (let i = 0; i < fan.ribCount - 1; i++) {
      const p0 = pts[i], p1 = pts[i + 1];
      const hue = fan.baseHue + fan.hueSpread * ((i + 0.5) / (fan.ribCount - 1));
      const alpha = fan.fabricAlpha * (0.75 + 0.25 * Math.sin(time * 0.7 + fan.phase + i * 0.6));

      // Subtle radial shading: darker toward the pivot
      const grad = ctx.createRadialGradient(fan.x, fan.y, fan.radius * 0.1, fan.x, fan.y, fan.radius);
      grad.addColorStop(0, hsla(hue, fan.saturation, fan.lightness * 0.55, alpha * 0.5));
      grad.addColorStop(0.7, hsla(hue, fan.saturation, fan.lightness, alpha));
      grad.addColorStop(1, hsla(hue, fan.saturation, fan.lightness + 8, alpha * 1.15));

      ctx.beginPath();
      ctx.moveTo(fan.x, fan.y);
      ctx.lineTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Thin seam line along each panel edge for hand-painted crispness
      ctx.beginPath();
      ctx.moveTo(fan.x, fan.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = hsla(hue, fan.saturation, fan.lightness + 14, alpha * 0.9);
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }

    /* -- decorative arc band near the rim (like painted fan borders) -- */
    const bandR = fan.radius * 0.86;
    ctx.beginPath();
    ctx.arc(fan.x, fan.y, bandR, startA, startA + span);
    ctx.strokeStyle = hsla(fan.baseHue + fan.hueSpread * 0.5, fan.saturation, fan.lightness + 18, 0.35);
    ctx.lineWidth = 2.2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(fan.x, fan.y, fan.radius * 0.97, startA, startA + span);
    ctx.strokeStyle = hsla(fan.baseHue, fan.saturation, fan.lightness + 10, 0.3);
    ctx.lineWidth = 1;
    ctx.stroke();

    /* -- ribs: lines with varying width and hue (gradient stroke per rib) -- */
    for (let i = 0; i < fan.ribCount; i++) {
      const p = pts[i];
      const hue = fan.baseHue + fan.hueSpread * p.f;
      const w = fan.ribWidthBase * (1 - 0.45 * Math.abs(p.f - 0.5) * 2); // thicker mid, thinner edges

      const grad = ctx.createLinearGradient(fan.x, fan.y, p.x, p.y);
      grad.addColorStop(0, hsla(hue, fan.saturation, fan.lightness + 20, 0.95));
      grad.addColorStop(0.5, hsla(hue, fan.saturation, fan.lightness, 0.9));
      grad.addColorStop(1, hsla(hue, fan.saturation, fan.lightness - 10, 0.85));

      ctx.beginPath();
      ctx.moveTo(fan.x, fan.y);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = grad;
      ctx.lineWidth = w;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Small bead at rib tip
      ctx.beginPath();
      ctx.arc(p.x, p.y, w * 0.75, 0, Math.PI * 2);
      ctx.fillStyle = hsla(hue, fan.saturation, fan.lightness + 22, 0.9);
      ctx.fill();
    }

    /* -- handle: short stem extending opposite the fan opening -- */
    const handleA = fan.facing === 0 ? Math.PI / 2 : -Math.PI / 2;
    const hx = fan.x + Math.cos(handleA) * fan.handleLen;
    const hy = fan.y + Math.sin(handleA) * fan.handleLen;

    const hGrad = ctx.createLinearGradient(fan.x, fan.y, hx, hy);
    hGrad.addColorStop(0, hsla(fan.baseHue, fan.saturation * 0.6, 30, 0.95));
    hGrad.addColorStop(1, hsla(fan.baseHue, fan.saturation * 0.6, 18, 0.95));

    ctx.beginPath();
    ctx.moveTo(fan.x, fan.y);
    ctx.lineTo(hx, hy);
    ctx.strokeStyle = hGrad;
    ctx.lineWidth = fan.pivotR * 0.9;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Handle cap
    ctx.beginPath();
    ctx.arc(hx, hy, fan.pivotR * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = hsla(fan.baseHue, fan.saturation * 0.5, 14, 0.95);
    ctx.fill();

    /* -- pivot dot: brass-like highlight -- */
    const pvGrad = ctx.createRadialGradient(
      fan.x - fan.pivotR * 0.3, fan.y - fan.pivotR * 0.3, fan.pivotR * 0.1,
      fan.x, fan.y, fan.pivotR
    );
    pvGrad.addColorStop(0, hsla(45, 80, 85, 1));
    pvGrad.addColorStop(0.6, hsla(38, 75, 60, 1));
    pvGrad.addColorStop(1, hsla(30, 70, 35, 1));

    ctx.beginPath();
    ctx.arc(fan.x, fan.y, fan.pivotR, 0, Math.PI * 2);
    ctx.fillStyle = pvGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(fan.x, fan.y, fan.pivotR * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = hsla(45, 90, 92, 0.9);
    ctx.fill();
  }

  /* ---------- render loop ---------- */

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    time += dt;

    // Trailing fade: translucent dark wash instead of full clear
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(10, 8, 6, 0.22)';
    ctx.fillRect(0, 0, W, H);

    // Soft additive glow for luminous warmth
    ctx.globalCompositeOperation = 'lighter';
    for (const fan of fans) drawFan(fan);
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  /* ---------- sizing & events ---------- */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Solid fill on resize so trails don't smear stale pixels
    ctx.fillStyle = '#0a0806';
    ctx.fillRect(0, 0, W, H);
  }

  window.addEventListener('resize', () => { resize(); regenerate(); });

  canvas.addEventListener('pointerdown', () => {
    regenerate();
    hint.classList.add('fade');
  });

  setTimeout(() => hint.classList.add('fade'), 6000);

  resize();
  regenerate();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
