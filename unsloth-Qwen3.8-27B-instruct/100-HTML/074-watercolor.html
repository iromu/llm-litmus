<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watercolor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #f5f0e8; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-family: 'Georgia', serif; font-size: 13px; color: rgba(120,100,80,0.5);
  letter-spacing: 2px; pointer-events: none; user-select: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">click to add watercolor drops</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const drops = [];
const MAX_DROPS = 60;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Drop {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.baseHue = Math.random() * 360;
    this.blobs = [];
    const count = 5 + Math.floor(Math.random() * 8);
    for (let i = 0; i < count; i++) {
      this.blobs.push({
        ox: (Math.random() - 0.5) * 40,
        oy: (Math.random() - 0.5) * 40,
        r: 15 + Math.random() * 35,
        wobblePhase: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.3 + Math.random() * 0.5,
        wobbleAmp: 3 + Math.random() * 8,
        hueOffset: (Math.random() - 0.5) * 30,
        alpha: 0.15 + Math.random() * 0.25
      });
    }
    this.age = 0;
    this.maxAge = 200 + Math.random() * 300;
    this.growRate = 0.3 + Math.random() * 0.4;
    this.currentScale = 0.1;
  }

  update() {
    this.age++;
    const t = Math.min(this.age / 60, 1);
    this.currentScale = 0.1 + 0.9 * (1 - Math.pow(1 - t, 3)) * this.growRate;
  }

  draw(ctx, time) {
    const fade = this.age > this.maxAge ? Math.max(0, 1 - (this.age - this.maxAge) / 100) : 1;
    for (const b of this.blobs) {
      const wobbleX = Math.sin(time * b.wobbleSpeed + b.wobblePhase) * b.wobbleAmp;
      const wobbleY = Math.cos(time * b.wobbleSpeed * 0.7 + b.wobblePhase) * b.wobbleAmp * 0.6;
      const bx = this.x + (b.ox + wobbleX) * this.currentScale;
      const by = this.y + (b.oy + wobbleY) * this.currentScale;
      const br = b.r * this.currentScale;
      const hue = (this.baseHue + b.hueOffset + time * 2) % 360;
      const grad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      grad.addColorStop(0, `hsla(${hue}, 65%, 55%, ${b.alpha * fade})`);
      grad.addColorStop(0.5, `hsla(${hue}, 60%, 50%, ${b.alpha * 0.6 * fade})`);
      grad.addColorStop(1, `hsla(${hue}, 55%, 45%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Seed some initial drops
for (let i = 0; i < 5; i++) {
  drops.push(new Drop(W * 0.2 + Math.random() * W * 0.6, H * 0.2 + Math.random() * H * 0.6));
}

function addDrop(x, y) {
  if (drops.length >= MAX_DROPS) drops.shift();
  drops.push(new Drop(x, y));
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  addDrop(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  for (const t of e.touches) {
    addDrop(t.clientX - rect.left, t.clientY - rect.top);
  }
});

let time = 0;
function animate() {
  time += 0.016;
  // Paper texture background with slight trailing
  ctx.fillStyle = 'rgba(245, 240, 232, 0.03)';
  ctx.fillRect(0, 0, W, H);

  for (let i = drops.length - 1; i >= 0; i--) {
    drops[i].update();
    drops[i].draw(ctx, time);
    if (drops[i].age > drops[i].maxAge + 100) drops.splice(i, 1);
  }
  requestAnimationFrame(animate);
}

// Initial paper fill
ctx.fillStyle = '#f5f0e8';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
