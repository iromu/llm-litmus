<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Reef</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a1a2a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class CoralBranch {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.hue = 280 + Math.random() * 60; // pink-purple
    this.branches = [];
    this.generateBranches(0, -Math.PI / 2, 40 + Math.random() * 50, 4 + Math.floor(Math.random() * 3));
  }

  generateBranches(depth, angle, length, maxDepth) {
    if (depth >= maxDepth || length < 8) return;
    const endX = this.x + Math.cos(angle) * length;
    const endY = this.y + Math.sin(angle) * length;
    this.branches.push({
      startX: depth === 0 ? this.x : undefined,
      startY: depth === 0 ? this.y : undefined,
      endX, endY,
      depth,
      phase: Math.random() * Math.PI * 2
    });

    const spread = 0.4 + Math.random() * 0.3;
    this.generateBranches(depth + 1, angle - spread, length * 0.65, maxDepth);
    this.generateBranches(depth + 1, angle + spread, length * 0.65, maxDepth);
    if (Math.random() > 0.5) {
      this.generateBranches(depth + 1, angle + (Math.random() - 0.5) * 0.2, length * 0.55, maxDepth);
    }
  }

  draw(ctx, time) {
    for (const b of this.branches) {
      const sway = Math.sin(time * 0.8 + b.phase + b.depth * 0.5) * (b.depth * 2);
      const ex = b.endX + sway;
      const ey = b.endY;
      const sx = b.startX !== undefined ? b.startX + sway * 0.5 : this.x;
      const sy = b.startY !== undefined ? b.startY : this.y;

      const alpha = 0.4 + 0.3 * Math.sin(time + b.phase);
      const lightness = 40 + b.depth * 8;

      ctx.strokeStyle = `hsla(${this.hue}, 50%, ${lightness}%, ${alpha})`;
      ctx.lineWidth = Math.max(1, 5 - b.depth);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      const cpx = (sx + ex) / 2 + sway * 0.5;
      const cpy = (sy + ey) / 2;
      ctx.quadraticCurveTo(cpx, cpy, ex, ey);
      ctx.stroke();

      // Tip glow on terminal branches
      if (b.depth >= 3) {
        const tipGlow = ctx.createRadialGradient(ex, ey, 0, ex, ey, 6);
        tipGlow.addColorStop(0, `hsla(${this.hue + 20}, 80%, 70%, ${alpha * 0.5})`);
        tipGlow.addColorStop(1, `hsla(${this.hue + 20}, 80%, 60%, 0)`);
        ctx.fillStyle = tipGlow;
        ctx.beginPath();
        ctx.arc(ex, ey, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

class Fish {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H * 0.2 + Math.random() * H * 0.5;
    this.speed = 0.3 + Math.random() * 0.8;
    this.size = 3 + Math.random() * 5;
    this.hue = 30 + Math.random() * 40; // warm fish colors
    this.wigglePhase = Math.random() * Math.PI * 2;
    this.direction = Math.random() > 0.5 ? 1 : -1;
  }
  update() {
    this.x += this.speed * this.direction;
    this.wigglePhase += 0.1;
    if (this.x > W + 20) this.x = -20;
    if (this.x < -20) this.x = W + 20;
  }
  draw(ctx, time) {
    const wiggle = Math.sin(this.wigglePhase) * 3;
    const x = this.x;
    const y = this.y + wiggle;

    // Body
    ctx.fillStyle = `hsla(${this.hue}, 70%, 55%, 0.6)`;
    ctx.beginPath();
    ctx.ellipse(x, y, this.size, this.size * 0.5, this.direction * 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Tail
    ctx.beginPath();
    ctx.moveTo(x - this.direction * this.size, y);
    ctx.lineTo(x - this.direction * (this.size + 4), y - 3);
    ctx.lineTo(x - this.direction * (this.size + 4), y + 3);
    ctx.closePath();
    ctx.fill();
  }
}

// Create corals along the bottom
const corals = [];
for (let i = 0; i < 8; i++) {
  corals.push(new CoralBranch(W * 0.05 + (i / 8) * W * 0.9 + (Math.random() - 0.5) * 40, H * 0.85 + Math.random() * H * 0.1));
}

// Create fish
const fishes = [];
for (let i = 0; i < 12; i++) {
  fishes.push(new Fish());
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade with ocean color
  ctx.fillStyle = 'rgba(10, 26, 42, 0.1)';
  ctx.fillRect(0, 0, W, H);

  // Light rays from above
  for (let i = 0; i < 3; i++) {
    const rayX = W * 0.2 + i * W * 0.3 + Math.sin(time * 0.2 + i) * 50;
    const grad = ctx.createLinearGradient(rayX, 0, rayX + 30, H);
    grad.addColorStop(0, 'rgba(100, 180, 220, 0.02)');
    grad.addColorStop(1, 'rgba(100, 180, 220, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rayX - 20, 0);
    ctx.lineTo(rayX + 20, 0);
    ctx.lineTo(rayX + 60, H);
    ctx.lineTo(rayX - 60, H);
    ctx.closePath();
    ctx.fill();
  }

  // Draw corals
  for (const coral of corals) {
    coral.draw(ctx, time);
  }

  // Draw fish
  for (const fish of fishes) {
    fish.update();
    fish.draw(ctx, time);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a1a2a';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
