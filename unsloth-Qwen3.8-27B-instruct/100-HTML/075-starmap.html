<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starmap</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0e1a; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 12px; color: rgba(150,170,220,0.4);
  letter-spacing: 3px; pointer-events: none; user-select: none; text-transform: uppercase;
}
.count {
  position: fixed; top: 20px; right: 24px;
  font-family: 'Courier New', monospace; font-size: 11px; color: rgba(150,170,220,0.35);
  letter-spacing: 2px; pointer-events: none; user-select: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">click to add stars</div>
<div class="count" id="count">STARS: 0</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const stars = [];
const countEl = document.getElementById('count');

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Star {
  constructor(x, y, isUser) {
    this.x = x;
    this.y = y;
    this.size = isUser ? 1.5 + Math.random() * 2 : 0.3 + Math.random() * 1.2;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.5 + Math.random() * 1.5;
    this.baseAlpha = 0.4 + Math.random() * 0.6;
    this.isUser = isUser;
    this.label = null;
    if (isUser && Math.random() > 0.5) {
      const names = ['Vega','Altair','Deneb','Rigel','Sirius','Polaris','Antares','Spica','Arcturus','Capella','Procyon','Betelgeuse','Aldebaran','Fomalhaut','Regulus','Mimosa','Achernar','Hadar','Canopus','Bellatrix'];
      this.label = names[Math.floor(Math.random() * names.length)] + '-' + Math.floor(Math.random() * 999);
    }
  }

  draw(ctx, time) {
    const twinkle = 0.5 + 0.5 * Math.sin(time * this.speed + this.phase);
    const alpha = this.baseAlpha * (0.4 + 0.6 * twinkle);
    const r = this.size * (0.8 + 0.4 * twinkle);

    // Glow
    if (r > 1) {
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 4);
      grad.addColorStop(0, `rgba(200, 220, 255, ${alpha * 0.3})`);
      grad.addColorStop(1, 'rgba(200, 220, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Core
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Label
    if (this.label) {
      ctx.fillStyle = `rgba(180, 200, 240, ${alpha * 0.6})`;
      ctx.font = '9px Courier New';
      ctx.fillText(this.label, this.x + r + 4, this.y - 2);
    }
  }
}

// Seed initial stars
for (let i = 0; i < 120; i++) {
  stars.push(new Star(Math.random() * W, Math.random() * H, false));
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  stars.push(new Star(e.clientX - rect.left, e.clientY - rect.top, true));
  countEl.textContent = 'STARS: ' + stars.length;
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  for (const t of e.touches) {
    stars.push(new Star(t.clientX - rect.left, t.clientY - rect.top, true));
  }
  countEl.textContent = 'STARS: ' + stars.length;
});

countEl.textContent = 'STARS: ' + stars.length;

let time = 0;
function animate() {
  time += 0.016;
  ctx.fillStyle = 'rgba(10, 14, 26, 0.08)';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    s.draw(ctx, time);
  }
  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0e1a';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
