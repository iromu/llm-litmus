<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peacock — Iridescent Fan</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0612;
    font-family: Georgia, 'Times New Roman', serif;
  }

  canvas {
    display: block;
    width: 100vw; height: 100vh;
    cursor: pointer;
  }

  .hint {
    position: fixed;
    bottom: 1.4rem; left: 50%;
    transform: translateX(-50%);
    color: rgba(212, 190, 130, 0.55);
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    animation: hintFade 4s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.8; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated iridescent peacock with a fanning tail of feather eyes"></canvas>
<p class="hint">click to regenerate</p>
<script>
'use strict';

/* ============================================================
   Peacock — Iridescent Fan
   Canvas rendering: elliptical body, trigonometric feather
   placement, radial-gradient feather eyes with independent
   pulsing phases, barb lines, sine-based fan breathing,
   HSL color cycling for iridescence, layered depth.
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- seeded RNG (mulberry32) so regeneration is deterministic per seed ---------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- palette & scene state ---------- */
let scene = null;

function buildScene(seed) {
  const rng = mulberry32(seed);

  // Base hue anchors the whole iridescent cycle.
  const baseHue = rng() * 360;
  // Secondary accent hue offset (gold-ish bias sometimes).
  const goldBias = rng() < 0.5 ? 45 : -30;

  // Feather layout: multiple concentric rings (layers) for depth.
  const layers = [];
  const layerCount = 4;
  for (let l = 0; l < layerCount; l++) {
    const frac = (l + 1) / layerCount;           // 0.25 .. 1.0
    const count = Math.round(9 + l * 7);         // 9, 16, 23, 30 feathers
    const radius = 0.30 + frac * 0.62;           // fraction of min-dim
    const eyeR   = 0.045 + frac * 0.055;         // eye spot size
    const hueOff = l * 28 + goldBias * (l % 2 ? 1 : -1);
    layers.push({ count, radius, eyeR, hueOff, phase: rng() * Math.PI * 2 });
  }

  // Body geometry (fractions of min(W,H)).
  const cx = 0.5 + (rng() - 0.5) * 0.08;
  const cy = 0.52 + (rng() - 0.5) * 0.06;
  const bodyScale = 0.16 + rng() * 0.04;

  // Breathing parameters.
  const breathSpeed = 0.35 + rng() * 0.25;       // rad/s
  const breathAmp   = 0.22 + rng() * 0.10;       // fraction of full open

  // Background stars / dust motes.
  const motes = [];
  const moteCount = Math.round(60 + rng() * 50);
  for (let i = 0; i < moteCount; i++) {
    motes.push({
      x: rng(), y: rng(),
      r: 0.4 + rng() * 1.4,
      tw: rng() * Math.PI * 2,
      sp: 0.3 + rng() * 0.8,
      hue: baseHue + rng() * 120 - 60
    });
  }

  return {
    seed, baseHue, goldBias, layers,
    cx, cy, bodyScale,
    breathSpeed, breathAmp,
    motes,
    bornAt: performance.now()
  };
}

scene = buildScene((Math.random() * 1e9) | 0);

canvas.addEventListener('click', () => {
  scene = buildScene((Math.random() * 1e9) | 0);
});

/* ---------- helpers ---------- */
function hsl(h, s, l, a = 1) {
  return `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a})`;
}

/* The fan's current openness in [0..1], driven by a slow sine. */
function fanOpenness(t) {
  const s = scene;
  const raw = Math.sin(t * s.breathSpeed + 0.6);
  // Map [-1,1] -> [minOpen, maxOpen]
  const minO = 0.45, maxO = 1.0;
  return minO + (maxO - minO) * (0.5 + 0.5 * raw) * (1 - s.breathAmp * 0.4)
         + s.breathAmp * 0.3 * (0.5 + 0.5 * raw);
}

/* Full angular span of the fan at openness o. */
function fanSpan(o) {
  return Math.PI * (0.55 + 0.45 * o); // ~99° closed .. ~180° open
}

/* ============================================================
   Drawing
   ============================================================ */

function drawBackground(t) {
  const s = scene;
  const g = ctx.createRadialGradient(W * s.cx, H * s.cy, 0, W * s.cx, H * s.cy, Math.max(W, H) * 0.75);
  const bh = s.baseHue + t * 4;
  g.addColorStop(0,   hsl(bh + 220, 45, 13));
  g.addColorStop(0.5, hsl(bh + 240, 40, 8));
  g.addColorStop(1,   hsl(bh + 260, 50, 4));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Twinkling dust motes.
  for (const m of s.motes) {
    const a = 0.12 + 0.35 * (0.5 + 0.5 * Math.sin(t * m.sp + m.tw));
    ctx.beginPath();
    ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2);
    ctx.fillStyle = hsl(m.hue + t * 6, 60, 70, a);
    ctx.fill();
  }
}

/* Draw one feather: shaft, barbs, and the iridescent "eye". */
function drawFeather(px, py, angle, len, eyeR, hueBase, pulse, t, depthAlpha) {
  const tipX = px + Math.cos(angle) * len;
  const tipY = py + Math.sin(angle) * len;

  ctx.save();
  ctx.globalAlpha = depthAlpha;

  /* --- shaft --- */
  const shaftGrad = ctx.createLinearGradient(px, py, tipX, tipY);
  shaftGrad.addColorStop(0, hsl(hueBase + 180, 55, 22, 0.9));
  shaftGrad.addColorStop(1, hsl(hueBase + 200, 60, 34, 0.5));
  ctx.strokeStyle = shaftGrad;
  ctx.lineWidth = Math.max(1, len * 0.012);
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();

  /* --- barbs: fine lines fanning out from the shaft near the eye --- */
  const barbStart = len * 0.42;
  const barbEnd   = len * 0.98;
  const barbCount = 14;
  const barbSpread = 0.55; // radians each side
  ctx.lineWidth = 0.7;
  for (let b = 0; b < barbCount; b++) {
    const bf = b / (barbCount - 1);            // 0..1 along shaft
    const bx = px + Math.cos(angle) * (barbStart + (barbEnd - barbStart) * bf);
    const by = py + Math.sin(angle) * (barbStart + (barbEnd - barbStart) * bf);
    const spread = (bf - 0.5) * 2 * barbSpread; // widens toward tip
    for (const side of [-1, 1]) {
      const ba = angle + side * (0.12 + Math.abs(spread) * 0.9) * (side > 0 ? 1 : 1);
      const blen = len * (0.10 + 0.16 * (1 - Math.abs(spread))) * (0.7 + 0.3 * Math.sin(t * 1.3 + b));
      const hue = hueBase + 160 + side * 20 + b * 4;
      ctx.strokeStyle = hsl(hue + t * 10, 65, 45, 0.35 * depthAlpha);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(ba) * blen, by + Math.sin(ba) * blen);
      ctx.stroke();
    }
  }

  /* --- the feather EYE: concentric radial-gradient spot --- */
  const ex = px + Math.cos(angle) * len * 0.82;
  const ey = py + Math.sin(angle) * len * 0.82;
  const pr = eyeR * (0.85 + 0.3 * pulse); // pulsing radius

  // Outer glow halo.
  const halo = ctx.createRadialGradient(ex, ey, 0, ex, ey, pr * 2.1);
  const hh = hueBase + t * 18;
  halo.addColorStop(0,   hsl(hh + 40, 90, 60, 0.55));
  halo.addColorStop(0.4, hsl(hh + 90, 85, 45, 0.30));
  halo.addColorStop(1,   hsl(hh + 140, 80, 30, 0));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(ex, ey, pr * 2.1, 0, Math.PI * 2);
  ctx.fill();

  // Teal ring band.
  const ring = ctx.createRadialGradient(ex, ey, pr * 0.55, ex, ey, pr * 1.35);
  ring.addColorStop(0,   hsl(hh + 170, 95, 55, 0.9));
  ring.addColorStop(0.5, hsl(hh + 190, 90, 40, 0.7));
  ring.addColorStop(1,   hsl(hh + 210, 85, 25, 0));
  ctx.fillStyle = ring;
  ctx.beginPath();
  ctx.arc(ex, ey, pr * 1.35, 0, Math.PI * 2);
  ctx.fill();

  // Gold-green mid disc.
  const mid = ctx.createRadialGradient(ex - pr * 0.15, ey - pr * 0.15, 0, ex, ey, pr);
  mid.addColorStop(0,   hsl(hh + 60,  95, 72, 1));
  mid.addColorStop(0.4, hsl(hh + 120, 90, 55, 1));
  mid.addColorStop(0.75,hsl(hh + 180, 85, 40, 1));
  mid.addColorStop(1,   hsl(hh + 230, 80, 28, 1));
  ctx.fillStyle = mid;
  ctx.beginPath();
  ctx.arc(ex, ey, pr, 0, Math.PI * 2);
  ctx.fill();

  // Deep blue core.
  const core = ctx.createRadialGradient(ex, ey, 0, ex, ey, pr * 0.5);
  core.addColorStop(0,   hsl(hh + 250, 95, 65, 1));
  core.addColorStop(0.6, hsl(hh + 260, 90, 35, 1));
  core.addColorStop(1,   hsl(hh + 270, 85, 18, 0.9));
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(ex, ey, pr * 0.5, 0, Math.PI * 2);
  ctx.fill();

  // Tiny bright specular dot.
  ctx.fillStyle = hsl(hh + 200, 30, 95, 0.9);
  ctx.beginPath();
  ctx.arc(ex - pr * 0.18, ey - pr * 0.18, pr * 0.10, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* Draw the peacock body: neck, head, crest, breast. */
function drawBody(t) {
  const s = scene;
  const m = Math.min(W, H);
  const bs = s.bodyScale * m;
  const bx = s.cx * W;
  const by = s.cy * H;
  const bh = s.baseHue + t * 8;

  ctx.save();

  /* --- neck: curved taper from body up to head --- */
  const neckTopX = bx + bs * 0.10;
  const neckTopY = by - bs * 1.55;
  const neckCtrlX = bx - bs * 0.35;
  const neckCtrlY = by - bs * 0.9;

  const neckGrad = ctx.createLinearGradient(bx, by, neckTopX, neckTopY);
  neckGrad.addColorStop(0, hsl(bh + 190, 70, 30));
  neckGrad.addColorStop(0.5, hsl(bh + 170, 80, 42));
  neckGrad.addColorStop(1, hsl(bh + 150, 85, 50));

  ctx.strokeStyle = neckGrad;
  ctx.lineCap = 'round';
  ctx.lineWidth = bs * 0.34;
  ctx.beginPath();
  ctx.moveTo(bx, by - bs * 0.3);
  ctx.quadraticCurveTo(neckCtrlX, neckCtrlY, neckTopX, neckTopY);
  ctx.stroke();

  // Neck highlight streak.
  ctx.strokeStyle = hsl(bh + 160, 90, 65, 0.5);
  ctx.lineWidth = bs * 0.10;
  ctx.beginPath();
  ctx.moveTo(bx - bs * 0.05, by - bs * 0.35);
  ctx.quadraticCurveTo(neckCtrlX + bs * 0.1, neckCtrlY, neckTopX - bs * 0.04, neckTopY + bs * 0.1);
  ctx.stroke();

  /* --- head --- */
  const hx = neckTopX;
  const hy = neckTopY - bs * 0.05;
  const hr = bs * 0.26;
  const headGrad = ctx.createRadialGradient(hx - hr * 0.3, hy - hr * 0.3, 0, hx, hy, hr);
  headGrad.addColorStop(0, hsl(bh + 150, 85, 58));
  headGrad.addColorStop(0.7, hsl(bh + 175, 80, 40));
  headGrad.addColorStop(1, hsl(bh + 200, 75, 26));
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(hx, hy, hr, 0, Math.PI * 2);
  ctx.fill();

  /* --- beak --- */
  const beakLen = bs * 0.30;
  ctx.fillStyle = hsl(45, 70, 55);
  ctx.beginPath();
  ctx.moveTo(hx + hr * 0.7, hy - hr * 0.12);
  ctx.lineTo(hx + hr * 0.7 + beakLen, hy + hr * 0.05);
  ctx.lineTo(hx + hr * 0.7, hy + hr * 0.22);
  ctx.closePath();
  ctx.fill();

  /* --- eye --- */
  const epx = hx + hr * 0.25;
  const epy = hy - hr * 0.10;
  const er = hr * 0.22;
  ctx.fillStyle = hsl(20, 90, 15);
  ctx.beginPath(); ctx.arc(epx, epy, er, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hsl(48, 95, 60);
  ctx.beginPath(); ctx.arc(epx, epy, er * 0.55, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(epx - er * 0.2, epy - er * 0.2, er * 0.18, 0, Math.PI * 2); ctx.fill();

  /* --- crest: three small stalks with dots above head --- */
  for (let i = -1; i <= 1; i++) {
    const ca = -Math.PI / 2 + i * 0.45;
    const cl = bs * 0.30;
    const cxx = hx + Math.cos(ca) * (hr + cl);
    const cyy = hy + Math.sin(ca) * (hr + cl);
    ctx.strokeStyle = hsl(bh + 160, 80, 55, 0.8);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(hx + Math.cos(ca) * hr * 0.8, hy + Math.sin(ca) * hr * 0.8);
    ctx.lineTo(cxx, cyy);
    ctx.stroke();
    ctx.fillStyle = hsl(bh + 60 + i * 30, 95, 65, 0.95);
    ctx.beginPath();
    ctx.arc(cxx, cyy, bs * 0.045, 0, Math.PI * 2);
    ctx.fill();
  }

  /* --- breast / body ellipse --- */
  const bodyGrad = ctx.createRadialGradient(bx - bs * 0.3, by - bs * 0.3, 0, bx, by, bs * 1.1);
  bodyGrad.addColorStop(0,   hsl(bh + 150, 85, 52));
  bodyGrad.addColorStop(0.5, hsl(bh + 180, 80, 38));
  bodyGrad.addColorStop(1,   hsl(bh + 210, 75, 22));
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(bx, by, bs * 0.95, bs * 1.15, 0.15, 0, Math.PI * 2);
  ctx.fill();

  // Breast scallop texture (subtle arcs).
  ctx.strokeStyle = hsl(bh + 140, 90, 60, 0.25);
  ctx.lineWidth = 1;
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 3; col++) {
      const sx = bx - bs * 0.4 + col * bs * 0.35;
      const sy = by - bs * 0.2 + row * bs * 0.3;
      ctx.beginPath();
      ctx.arc(sx, sy, bs * 0.16, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

/* Draw the full tail fan (all layers, back-to-front). */
function drawFan(t) {
  const s = scene;
  const m = Math.min(W, H);
  const o = fanOpenness(t);          // 0..1 openness
  const span = fanSpan(o);           // total angular span
  const originAngle = -Math.PI / 2;  // fan points upward
  const ox = s.cx * W;
  const oy = s.cy * H;

  // Draw outermost (deepest) layer first.
  for (let li = s.layers.length - 1; li >= 0; li--) {
    const L = s.layers[li];
    const len = L.radius * m * (0.85 + 0.15 * o);
    const depthAlpha = 0.45 + 0.55 * ((s.layers.length - li) / s.layers.length);

    for (let i = 0; i < L.count; i++) {
      const f = L.count === 1 ? 0.5 : i / (L.count - 1); // 0..1
      // Spread across the current span; edges pull slightly inward when closed.
      const a = originAngle - span / 2 + f * span;
      // Slight per-feather wobble.
      const wob = Math.sin(t * 0.8 + i * 0.7 + L.phase) * 0.015;
      const ang = a + wob;

      // Per-feather independent pulse phase.
      const pulse = 0.5 + 0.5 * Math.sin(t * (1.1 + 0.25 * (i % 5) * 0.3) + i * 1.7 + L.phase);

      const hue = s.baseHue + L.hueOff + f * 40;
      const px = ox + Math.cos(a) * m * 0.06;
      const py = oy + Math.sin(a) * m * 0.06;

      drawFeather(px, py, ang, len, L.eyeR * m, hue, pulse, t, depthAlpha);
    }
  }
}

/* Soft vignette to focus the center. */
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- main loop ---------- */
function frame(now) {
  const t = now / 1000;
  drawBackground(t);
  drawFan(t);
  drawBody(t);
  drawVignette();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
