<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isometric City</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #0a0e1a;
    --bg-mid: #111629;
    --accent: #7dd3fc;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }

  /* ---------- Scene / viewport ---------- */
  .scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    perspective-origin: 50% 42%;
  }

  /* The rotating wrapper — seesaw motion via two nested animations */
  .city-pivot {
    transform-style: preserve-3d;
    animation: seesaw 26s ease-in-out infinite alternate;
  }

  @keyframes seesaw {
    0%   { transform: rotateX(60deg) rotateZ(38deg) translateY(-10px); }
    50%  { transform: rotateX(58deg) rotateZ(52deg) translateY(6px); }
    100% { transform: rotateX(61deg) rotateZ(44deg) translateY(-4px); }
  }

  .city {
    position: relative;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }

  /* ---------- Ground plane ---------- */
  .ground {
    position: absolute;
    left: -340px;
    top: -340px;
    width: 680px;
    height: 680px;
    transform: translateZ(0.5px);
    background:
      linear-gradient(rgba(125, 211, 252, 0.05), rgba(125, 211, 252, 0.02)),
      repeating-linear-gradient(0deg,
        transparent 0px, transparent 39px,
        rgba(125, 211, 252, 0.10) 39px, rgba(125, 211, 252, 0.10) 40px),
      repeating-linear-gradient(90deg,
        transparent 0px, transparent 39px,
        rgba(125, 211, 252, 0.10) 39px, rgba(125, 211, 252, 0.10) 40px);
    border: 1px solid rgba(125, 211, 252, 0.14);
    box-shadow: 0 0 120px rgba(125, 211, 252, 0.08);
  }

  .ground-glow {
    position: absolute;
    left: -340px;
    top: -340px;
    width: 680px;
    height: 680px;
    transform: translateZ(0.4px);
    background: radial-gradient(circle at 50% 50%,
      rgba(125, 211, 252, 0.10) 0%,
      rgba(168, 85, 247, 0.05) 40%,
      transparent 70%);
  }

  /* ---------- Buildings ---------- */
  .building {
    position: absolute;
    transform-style: preserve-3d;
  }

  .face {
    position: absolute;
    backface-visibility: visible;
  }

  /* Window cells */
  .win {
    position: absolute;
    border-radius: 1px;
  }

  /* Lit-window flicker (subtle) */
  @keyframes flickerA {
    0%, 92%, 100% { opacity: 1; }
    94% { opacity: 0.4; }
    96% { opacity: 1; }
  }
  @keyframes flickerB {
    0%, 88%, 100% { opacity: 1; }
    90% { opacity: 0.5; }
    93% { opacity: 1; }
  }
  .flicker-a { animation: flickerA 7s linear infinite; }
  .flicker-b { animation: flickerB 11s linear infinite; }

  /* Rooftop accent light pulse */
  @keyframes roofPulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .roof-light { animation: roofPulse 5s ease-in-out infinite; }

  /* ---------- Title ---------- */
  .title {
    position: fixed;
    bottom: 4.5vh;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  .title h1 {
    font-size: clamp(1.4rem, 3.4vw, 2.4rem);
    font-weight: 200;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    color: rgba(226, 232, 240, 0.92);
    text-transform: uppercase;
  }
  .title .rule {
    width: 64px;
    height: 1px;
    margin: 14px auto 0;
    background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.7), transparent);
  }
  .title p {
    margin-top: 10px;
    font-size: clamp(0.55rem, 1.2vw, 0.72rem);
    font-weight: 300;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: rgba(148, 163, 184, 0.55);
    text-transform: uppercase;
  }

  /* Ambient vignette over everything */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%,
      transparent 55%, rgba(4, 6, 14, 0.55) 100%);
    z-index: 5;
  }

  /* Responsive scale-down on small screens */
  @media (max-width: 640px) {
    .scene { perspective: 900px; }
    .city-pivot { transform: scale(0.62); }
  }
  @media (max-height: 560px) {
    .city-pivot { transform: scale(0.55); }
  }
</style>
</head>
<body>

<main class="scene" aria-label="Procedurally generated isometric cityscape">
  <div class="city-pivot">
    <div class="city" id="city"></div>
  </div>
</main>

<div class="vignette" aria-hidden="true"></div>

<header class="title">
  <h1>Isometric City</h1>
  <div class="rule" aria-hidden="true"></div>
  <p>procedural &middot; architectural study</p>
</header>

<script>
(() => {
  'use strict';

  const city = document.getElementById('city');

  /* ------------------------------------------------------------------ *
   *  Seeded RNG (mulberry32) so the city is stable per load but varied
   * ------------------------------------------------------------------ */
  let seed = (Math.random() * 0xffffffff) >>> 0;
  function rand() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const ri = (min, max) => Math.floor(rand() * (max - min + 1)) + min;
  const pick = arr => arr[Math.floor(rand() * arr.length)];

  /* ------------------------------------------------------------------ *
   *  Color palettes — blues, purples, teals, warm browns, magentas
   *  Each palette: [frontHue base, side darker, top lighter]
   * ------------------------------------------------------------------ */
  const PALETTES = [
    // deep blue
    { front: '#1e3a5f', side: '#152a45', top: '#2c5282', win: ['#7dd3fc', '#bae6fd'] },
    // indigo / purple
    { front: '#3b2a6e', side: '#2a1d52', top: '#55408f', win: ['#c4b5fd', '#ddd6fe'] },
    // teal
    { front: '#0f4c5c', side: '#0a3743', top: '#1a6b7d', win: ['#5eead4', '#99f6e4'] },
    // warm brown / bronze
    { front: '#6b4226', side: '#4e2f1b', top: '#8a5a35', win: ['#fcd34d', '#fde68a'] },
    // magenta
    { front: '#7c2d5e', side: '#5a1f45', top: '#a03d78', win: ['#f9a8d4', '#fbcfe8'] },
    // slate blue-violet
    { front: '#33415c', side: '#232e44', top: '#4a5b7d', win: ['#93c5fd', '#bfdbfe'] },
    // plum
    { front: '#5b2d5e', side: '#422044', top: '#7a3d7d', win: ['#e9d5ff', '#f3e8ff'] },
    // copper
    { front: '#8a4a2a', side: '#63331d', top: '#ab6238', win: ['#fed7aa', '#ffe4c4'] },
  ];

  /* ------------------------------------------------------------------ *
   *  Building geometry helpers
   * ------------------------------------------------------------------ */
  const CELL = 40;          // grid cell size in px
  const GRID = 7;           // 7 x 7 loose grid
  const ORIGIN = -(GRID - 1) * CELL / 2; // center the grid on 0,0

  /** Create a face element with gradient shading. */
  function makeFace(w, h, baseColor, lightDir) {
    const el = document.createElement('div');
    el.className = 'face';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    // Gradient: slightly lighter toward one edge for depth
    const angle = lightDir === 'left' ? 'to left' : lightDir === 'right' ? 'to right' : 'to top';
    el.style.background = `linear-gradient(${angle}, ${baseColor} 0%, shade(${baseColor}, -18) 100%)`;
    return el;
  }

  /** Lighten/darken a hex color by pct (-100..100). */
  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = 1 + pct / 100;
    r = Math.max(0, Math.min(255, Math.round(r * f)));
    g = Math.max(0, Math.min(255, Math.round(g * f)));
    b = Math.max(0, Math.min(255, Math.round(b * f)));
    return `rgb(${r},${g},${b})`;
  }

  /** Place randomized lit windows on a face. */
  function addWindows(faceEl, w, h, palette, density) {
    const cols = Math.max(1, Math.floor((w - 10) / 14));
    const rows = Math.max(1, Math.floor((h - 10) / 16));
    const cw = (w - 10) / cols;
    const ch = (h - 10) / rows;
    const ww = Math.min(8, cw * 0.55);
    const wh = Math.min(9, ch * 0.5);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (rand() > density) continue;
        const win = document.createElement('div');
        win.className = 'win';
        const col = pick(palette.win);
        const glow = rand();
        win.style.left = (5 + c * cw + (cw - ww) / 2) + 'px';
        win.style.top = (5 + r * ch + (ch - wh) / 2) + 'px';
        win.style.width = ww + 'px';
        win.style.height = wh + 'px';
        win.style.background = col;
        win.style.opacity = (0.35 + glow * 0.65).toFixed(2);
        win.style.boxShadow = glow > 0.55
          ? `0 0 ${3 + glow * 5}px ${col}`
          : 'none';
        // A few windows flicker
        if (rand() < 0.06) {
          win.classList.add(rand() < 0.5 ? 'flicker-a' : 'flicker-b');
        }
        faceEl.appendChild(win);
      }
    }
  }

  /** Build one isometric building and append to city. */
  function buildBuilding(x, y, w, d, h, palette) {
    const b = document.createElement('div');
    b.className = 'building';
    b.style.transformStyle = 'preserve-3d';

    // Position the building's origin at its base center
    const bx = x - w / 2;
    const by = y - d / 2;

    // --- FRONT face (faces viewer, +Y direction in iso space) ---
    const front = makeFace(w, h, palette.front, 'left');
    front.style.transform = `translate3d(${bx}px, ${y}px, 0) translateZ(${-h}px)`;
    // Front sits at the near edge, extruded upward
    front.style.transform = `translate3d(${bx}px, ${by + d}px, 0) translateZ(${-h}px)`;
    addWindows(front, w, h, palette, 0.55);
    b.appendChild(front);

    // --- SIDE face (+X direction) ---
    const side = makeFace(d, h, palette.side, 'right');
    side.style.transform = `translate3d(${bx + w}px, ${by}px, 0) rotateY(90deg) translateZ(${-h}px)`;
    addWindows(side, d, h, palette, 0.45);
    b.appendChild(side);

    // --- TOP face ---
    const top = document.createElement('div');
    top.className = 'face';
    top.style.width = w + 'px';
    top.style.height = d + 'px';
    top.style.transform = `translate3d(${bx}px, ${by}px, ${-h}px) rotateX(90deg)`;
    top.style.background = `linear-gradient(135deg, ${shade(palette.top, 8)} 0%, ${palette.top} 50%, ${shade(palette.top, -10)} 100%)`;
    top.style.borderTop = `1px solid ${shade(palette.top, 25)}`;
    // Rooftop detail: a small lit panel or antenna dot
    if (rand() < 0.4) {
      const roofLight = document.createElement('div');
      roofLight.className = 'win roof-light';
      const rs = ri(4, 8);
      roofLight.style.left = ri(4, Math.max(5, w - rs - 4)) + 'px';
      roofLight.style.top = ri(4, Math.max(5, d - rs - 4)) + 'px';
      roofLight.style.width = rs + 'px';
      roofLight.style.height = rs + 'px';
      roofLight.style.background = pick(palette.win);
      roofLight.style.boxShadow = `0 0 6px ${pick(palette.win)}`;
      roofLight.style.animationDelay = (rand() * 5).toFixed(2) + 's';
      top.appendChild(roofLight);
    }
    b.appendChild(top);

    city.appendChild(b);
  }

  /* ------------------------------------------------------------------ *
   *  Lay out the city on a loose grid with random variation
   * ------------------------------------------------------------------ */
  function generateCity() {
    // Clear
    while (city.firstChild) city.removeChild(city.firstChild);

    // Ground plane first (behind buildings)
    const ground = document.createElement('div');
    ground.className = 'ground';
    city.appendChild(ground);
    const glow = document.createElement('div');
    glow.className = 'ground-glow';
    city.appendChild(glow);

    for (let gx = 0; gx < GRID; gx++) {
      for (let gy = 0; gy < GRID; gy++) {
        // Skip some cells for an organic, non-uniform layout
        if (rand() < 0.18) continue;

        const cx = ORIGIN + gx * CELL + ri(-6, 6);
        const cy = ORIGIN + gy * CELL + ri(-6, 6);

        // Height distribution: taller toward center, shorter at edges
        const distFromCenter = Math.hypot(gx - (GRID - 1) / 2, gy - (GRID - 1) / 2);
        const centerBias = 1 - (distFromCenter / (GRID / 2)) * 0.55;
        const h = Math.round(ri(30, 130) * centerBias + 15);

        const w = ri(20, 34);
        const d = ri(20, 34);
        const palette = pick(PALETTES);

        buildBuilding(cx, cy, w, d, h, palette);
      }
    }
  }

  generateCity();
})();
</script>
</body>
</html>
