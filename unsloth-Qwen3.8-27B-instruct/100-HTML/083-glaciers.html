<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glaciers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a1520; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Crystal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = 30 + Math.random() * 80;
    this.facets = 5 + Math.floor(Math.random() * 4);
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.003;
    this.hue = 180 + Math.random() * 40; // blue-cyan range
    this.glowPhase = Math.random() * Math.PI * 2;
    this.glowSpeed = 0.5 + Math.random() * 1;
  }

  update(dt) {
    this.rotation += this.rotSpeed;
  }

  draw(ctx, time) {
    const glow = 0.3 + 0.3 * Math.sin(time * this.glowSpeed + this.glowPhase);

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    // Outer glow
    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 1.5);
    glowGrad.addColorStop(0, `hsla(${this.hue}, 60%, 70%, ${glow * 0.2})`);
    glowGrad.addColorStop(1, `hsla(${this.hue}, 60%, 50%, 0)`);
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, this.size * 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Facets as triangles radiating from center
    for (let i = 0; i < this.facets; i++) {
      const angle1 = (i / this.facets) * Math.PI * 2;
      const angle2 = ((i + 1) / this.facets) * Math.PI * 2;
      const midAngle = (angle1 + angle2) / 2;

      const r1 = this.size * (0.6 + 0.4 * Math.sin(time * 0.5 + i));
      const r2 = this.size * (0.6 + 0.4 * Math.sin(time * 0.5 + i + 1));

      const x1 = Math.cos(angle1) * r1;
      const y1 = Math.sin(angle1) * r1;
      const x2 = Math.cos(angle2) * r2;
      const y2 = Math.sin(angle2) * r2;
      const px = Math.cos(midAngle) * this.size * 0.3;
      const py = Math.sin(midAngle) * this.size * 0.3;

      // Filled facet
      const facetAlpha = 0.1 + 0.15 * Math.sin(time * 0.8 + i * 0.5);
      ctx.fillStyle = `hsla(${this.hue + i * 5}, 50%, ${60 + 10 * Math.sin(time + i)}, ${facetAlpha})`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(px, py);
      ctx.lineTo(x2, y2);
      ctx.closePath();
      ctx.fill();

      // Edge lines
      ctx.strokeStyle = `hsla(${this.hue}, 70%, 75%, ${0.3 + glow * 0.3})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // Center point
    ctx.fillStyle = `hsla(${this.hue}, 80%, 90%, ${0.5 + glow * 0.3})`;
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// Create crystals scattered across the screen
const crystals = [];
for (let i = 0; i < 12; i++) {
  crystals.push(new Crystal(
    W * 0.1 + Math.random() * W * 0.8,
    H * 0.1 + Math.random() * H * 0.8
  ));
}

let lastTime = performance.now();
function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 21, 32, 0.08)';
  ctx.fillRect(0, 0, W, H);

  for (const c of crystals) {
    c.update(dt);
    c.draw(ctx, now / 1000);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a1520';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(animate);
</script>
</body>
</html>
