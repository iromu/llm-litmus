<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Waves</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #050a15; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const BAND_COUNT = 6;

class AuroraBand {
  constructor(index) {
    this.baseY = H * (0.2 + index * 0.1);
    this.hueOffset = index * 50;
    this.speed = 0.3 + Math.random() * 0.4;
    this.amplitude = 30 + Math.random() * 50;
    this.frequency = 0.002 + Math.random() * 0.003;
    this.thickness = 40 + Math.random() * 60;
    this.phase = Math.random() * Math.PI * 2;
  }

  draw(ctx, time) {
    const hue = (this.hueOffset + time * 10) % 360;
    const yBase = this.baseY + Math.sin(time * 0.2 + this.phase) * 20;

    // Draw the band as a filled shape with gradient
    ctx.beginPath();
    ctx.moveTo(0, H);

    for (let x = 0; x <= W; x += 4) {
      const wave1 = Math.sin(x * this.frequency + time * this.speed) * this.amplitude;
      const wave2 = Math.sin(x * this.frequency * 2.3 + time * this.speed * 0.7 + 1) * this.amplitude * 0.4;
      const wave3 = Math.cos(x * this.frequency * 0.5 + time * this.speed * 0.3) * this.amplitude * 0.3;
      const y = yBase + wave1 + wave2 + wave3;
      ctx.lineTo(x, y);
    }

    ctx.lineTo(W, H);
    ctx.closePath();

    // Vertical gradient fade
    const grad = ctx.createLinearGradient(0, yBase - this.amplitude, 0, yBase + this.thickness);
    grad.addColorStop(0, `hsla(${hue}, 80%, 60%, 0)`);
    grad.addColorStop(0.2, `hsla(${hue}, 85%, 55%, 0.15)`);
    grad.addColorStop(0.5, `hsla(${(hue + 20) % 360}, 75%, 50%, 0.08)`);
    grad.addColorStop(1, `hsla(${(hue + 40) % 360}, 70%, 40%, 0)`);
    ctx.fillStyle = grad;
    ctx.fill();

    // Bright ridge line at the top of the wave
    ctx.strokeStyle = `hsla(${hue}, 90%, 65%, 0.3)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const wave1 = Math.sin(x * this.frequency + time * this.speed) * this.amplitude;
      const wave2 = Math.sin(x * this.frequency * 2.3 + time * this.speed * 0.7 + 1) * this.amplitude * 0.4;
      const wave3 = Math.cos(x * this.frequency * 0.5 + time * this.speed * 0.3) * this.amplitude * 0.3;
      const y = yBase + wave1 + wave2 + wave3;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

const bands = [];
for (let i = 0; i < BAND_COUNT; i++) {
  bands.push(new AuroraBand(i));
}

// Stars in the background
const stars = [];
for (let i = 0; i < 80; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.5,
    size: 0.3 + Math.random() * 1,
    phase: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 2
  });
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(5, 10, 21, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(time * s.speed + s.phase));
    ctx.fillStyle = `rgba(200, 220, 255, ${twinkle * 0.5})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Aurora bands
  for (const band of bands) {
    band.draw(ctx, time);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#050a15';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
