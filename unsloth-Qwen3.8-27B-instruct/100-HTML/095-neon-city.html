<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon City</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0515; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Building {
  constructor(x, width) {
    this.x = x;
    this.width = width;
    this.height = H * 0.2 + Math.random() * H * 0.45;
    this.y = H - this.height;
    this.hue = Math.random() > 0.5 ? 320 : 180; // pink or cyan
    this.windows = [];
    this.generateWindows();
  }

  generateWindows() {
    const cols = Math.floor(this.width / 14);
    const rows = Math.floor(this.height / 18);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() > 0.3) {
          this.windows.push({
            x: this.x + 4 + c * 14,
            y: this.y + 6 + r * 18,
            w: 8,
            h: 10,
            on: Math.random() > 0.3,
            flickerPhase: Math.random() * Math.PI * 2,
            flickerSpeed: 0.5 + Math.random() * 3,
            hue: Math.random() > 0.5 ? 320 : 180
          });
        }
      }
    }
  }

  draw(ctx, time) {
    // Building body
    ctx.fillStyle = 'rgba(15, 10, 25, 0.9)';
    ctx.fillRect(this.x, this.y, this.width, this.height);

    // Neon edge glow
    const edgeAlpha = 0.4 + 0.2 * Math.sin(time * 0.5 + this.x * 0.01);
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 60%, ${edgeAlpha})`;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(this.x, this.y, this.width, this.height);

    // Top edge highlight
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 70%, ${edgeAlpha * 0.6})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.width, this.y);
    ctx.stroke();

    // Windows
    for (const win of this.windows) {
      const flicker = Math.sin(time * win.flickerSpeed + win.flickerPhase);
      const isOn = win.on && flicker > -0.7;

      if (isOn) {
        const brightness = 0.4 + 0.3 * Math.abs(flicker);
        ctx.fillStyle = `hsla(${win.hue}, 80%, 65%, ${brightness})`;
        ctx.fillRect(win.x, win.y, win.w, win.h);
      } else {
        ctx.fillStyle = 'rgba(20, 15, 35, 0.8)';
        ctx.fillRect(win.x, win.y, win.w, win.h);
      }
    }
  }
}

// Generate buildings
const buildings = [];
let bx = 0;
while (bx < W + 50) {
  const bw = 30 + Math.random() * 60;
  buildings.push(new Building(bx, bw));
  bx += bw + 2 + Math.random() * 8;
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 5, 21, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  skyGrad.addColorStop(0, 'rgba(20, 5, 40, 0.05)');
  skyGrad.addColorStop(1, 'rgba(40, 10, 60, 0.03)');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.5);

  // Ground reflection glow
  const groundGrad = ctx.createLinearGradient(0, H - 30, 0, H);
  groundGrad.addColorStop(0, 'rgba(255, 0, 128, 0)');
  groundGrad.addColorStop(0.5, 'rgba(255, 0, 128, 0.05)');
  groundGrad.addColorStop(1, 'rgba(0, 200, 255, 0.08)');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H - 30, W, 30);

  // Draw buildings
  for (const b of buildings) {
    b.draw(ctx, time);
  }

  // Ground line
  ctx.strokeStyle = 'rgba(255, 0, 128, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H - 2);
  ctx.lineTo(W, H - 2);
  ctx.stroke();

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0515';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
