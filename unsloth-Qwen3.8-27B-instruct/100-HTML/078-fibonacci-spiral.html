<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fibonacci Spiral</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0a12; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const PHI = (1 + Math.sqrt(5)) / 2;
const GOLDEN_ANGLE = 2 * Math.PI / (PHI * PHI); // ~137.5 degrees in radians

function drawSpiral(time) {
  const maxPoints = 400;
  const baseScale = Math.min(W, H) * 0.45;
  const oscillation = Math.sin(time * 0.3) * 0.3 + 0.7;
  const pointCount = Math.floor(maxPoints * oscillation);
  const rotation = time * 0.1;

  // Center glow
  const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
  centerGrad.addColorStop(0, 'rgba(255, 220, 150, 0.3)');
  centerGrad.addColorStop(0.5, 'rgba(255, 180, 100, 0.1)');
  centerGrad.addColorStop(1, 'rgba(255, 150, 50, 0)');
  ctx.fillStyle = centerGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 60, 0, Math.PI * 2);
  ctx.fill();

  // Draw connection lines first (behind points)
  ctx.lineWidth = 0.5;
  for (let i = 1; i < pointCount; i++) {
    const angle1 = i * GOLDEN_ANGLE + rotation;
    const radius1 = Math.sqrt(i) * baseScale / Math.sqrt(maxPoints);
    const x1 = cx + Math.cos(angle1) * radius1;
    const y1 = cy + Math.sin(angle1) * radius1;

    const angle2 = (i - 1) * GOLDEN_ANGLE + rotation;
    const radius2 = Math.sqrt(i - 1) * baseScale / Math.sqrt(maxPoints);
    const x2 = cx + Math.cos(angle2) * radius2;
    const y2 = cy + Math.sin(angle2) * radius2;

    const hue = (i * 137.5 + time * 20) % 360;
    const alpha = 0.08 + 0.04 * Math.sin(i * 0.1 + time);
    ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${alpha})`;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Draw points
  for (let i = 0; i < pointCount; i++) {
    const angle = i * GOLDEN_ANGLE + rotation;
    const radius = Math.sqrt(i) * baseScale / Math.sqrt(maxPoints);
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;

    const hue = (i * 137.5 + time * 20) % 360;
    const size = 1.5 + (i / pointCount) * 2.5;
    const pulse = 0.7 + 0.3 * Math.sin(time * 2 + i * 0.05);

    // Point glow
    if (size > 2) {
      const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
      grad.addColorStop(0, `hsla(${hue}, 80%, 65%, ${0.3 * pulse})`);
      grad.addColorStop(1, `hsla(${hue}, 80%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Point core
    ctx.fillStyle = `hsla(${hue}, 85%, ${55 + 15 * pulse}%, ${0.6 + 0.4 * pulse})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 10, 18, 0.1)';
  ctx.fillRect(0, 0, W, H);

  drawSpiral(time);
  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0a12';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
