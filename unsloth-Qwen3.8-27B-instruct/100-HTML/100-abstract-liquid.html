<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abstract Liquid</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #050508; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const RING_COUNT = 12;
const POINTS_PER_RING = 120;

function drawRing(time, ringIndex) {
  const t = ringIndex / RING_COUNT;
  const baseRadius = Math.min(W, H) * (0.05 + t * 0.42);
  const hue = (ringIndex * 30 + time * 25) % 360;
  const alpha = 0.3 + (1 - t) * 0.3;

  // Build the organic shape with multi-frequency sinusoidal distortion
  const points = [];
  for (let i = 0; i <= POINTS_PER_RING; i++) {
    const angle = (i / POINTS_PER_RING) * Math.PI * 2;

    // Multi-frequency distortion for fluid organic feel
    const d1 = Math.sin(angle * 3 + time * 0.8 + ringIndex * 0.5) * 0.15;
    const d2 = Math.sin(angle * 5 - time * 0.5 + ringIndex * 0.3) * 0.08;
    const d3 = Math.cos(angle * 7 + time * 1.2 + ringIndex * 0.7) * 0.05;
    const d4 = Math.sin(angle * 2 - time * 0.3) * 0.1;

    const radius = baseRadius * (1 + d1 + d2 + d3 + d4);
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    points.push({ x, y });
  }

  // Fill with semi-transparent color
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.closePath();

  const fillGrad = ctx.createRadialGradient(cx, cy, baseRadius * 0.5, cx, cy, baseRadius * 1.3);
  fillGrad.addColorStop(0, `hsla(${hue}, 70%, 50%, ${alpha * 0.1})`);
  fillGrad.addColorStop(1, `hsla(${(hue + 40) % 360}, 60%, 40%, ${alpha * 0.05})`);
  ctx.fillStyle = fillGrad;
  ctx.fill();

  // Stroke outline
  ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha * 0.5})`;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// Floating particles in the liquid
class LiquidParticle {
  constructor() {
    this.angle = Math.random() * Math.PI * 2;
    this.dist = Math.random() * 0.4;
    this.size = 1 + Math.random() * 2;
    this.speed = 0.1 + Math.random() * 0.3;
    this.hueOffset = Math.random() * 360;
    this.phase = Math.random() * Math.PI * 2;
  }
  draw(ctx, time) {
    const a = this.angle + time * this.speed * 0.2;
    const d = (this.dist + Math.sin(time * 0.5 + this.phase) * 0.05) * Math.min(W, H) * 0.45;
    const x = cx + Math.cos(a) * d;
    const y = cy + Math.sin(a) * d;
    const hue = (this.hueOffset + time * 20) % 360;
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(time * 1.5 + this.phase));

    const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size * 3);
    grad.addColorStop(0, `hsla(${hue}, 80%, 70%, ${twinkle * 0.5})`);
    grad.addColorStop(1, `hsla(${hue}, 80%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, this.size * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

const particles = [];
for (let i = 0; i < 30; i++) particles.push(new LiquidParticle());

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(5, 5, 8, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Draw rings from outermost to innermost
  for (let i = RING_COUNT - 1; i >= 0; i--) {
    drawRing(time, i);
  }

  // Center glow
  const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
  centerGrad.addColorStop(0, `hsla(${(time * 30) % 360}, 80%, 70%, 0.4)`);
  centerGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = centerGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, Math.PI * 2);
  ctx.fill();

  // Particles
  for (const p of particles) {
    p.draw(ctx, time);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#050508';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
