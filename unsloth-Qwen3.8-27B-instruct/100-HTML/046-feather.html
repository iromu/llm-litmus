<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feathers — A Soft Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050a10;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }

  .hint {
    position: fixed;
    bottom: 1.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(160, 210, 230, 0.35);
    user-select: none;
    pointer-events: none;
    transition: opacity 1.2s ease;
    white-space: nowrap;
  }

  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="feather-canvas" aria-label="Animated feathers drifting in space"></canvas>
<p class="hint" id="hint">click to regrow the flock</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('feather-canvas');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  let feathers = [];
  let time = 0;
  let lastTs = 0;

  /* ------------------------------------------------------------------ */
  /*  Utilities                                                          */
  /* ------------------------------------------------------------------ */

  const rand  = (a, b) => a + Math.random() * (b - a);
  const randI = (a, b) => Math.floor(rand(a, b + 1));
  const pick  = arr => arr[randI(0, arr.length - 1)];
  const TAU   = Math.PI * 2;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ------------------------------------------------------------------ */
  /*  Feather model                                                      */
  /* ------------------------------------------------------------------ */

  /**
   * A feather is described by:
   *  - length, shaft curve offset
   *  - barb count / spread / curl
   *  - hue base + drift speed (blue → cyan → green spectrum)
   *  - fluff tuft at the base
   *  - drift parameters (position, velocity, sway phase, rotation)
   */
  function makeFeather(index, total) {
    const len = rand(H * 0.28, H * 0.55);
    const hueBase = rand(165, 215); // blue-cyan-green band

    return {
      // geometry
      len,
      shaftWobble: rand(0.04, 0.14),        // how much the rachis bends
      barbCount: randI(26, 44),
      barbSpread: rand(0.30, 0.52),         // fraction of half-length each side
      barbCurl: rand(0.15, 0.45),           // quadratic curl factor
      barbuleCount: randI(3, 6),            // fine hairs per barb
      barbuleLen: rand(0.18, 0.34),         // as fraction of barb length
      fluffSize: rand(0.10, 0.20),         // fluff radius as fraction of len
      fluffStrands: randI(14, 26),

      // colour
      hueBase,
      hueDrift: rand(0.05, 0.18),          // deg per second
      sat: rand(45, 72),
      light: rand(58, 74),
      alpha: rand(0.55, 0.9),

      // motion
      x: rand(W * 0.12, W * 0.88),
      y: rand(H * 0.15, H * 0.85),
      vx: rand(-8, 8),
      vy: rand(-5, 5),
      angle: rand(-Math.PI, Math.PI),
      angVel: rand(-0.12, 0.12),
      swayAmp: rand(10, 34),
      swayFreq: rand(0.15, 0.4),
      swayPhase: rand(0, TAU),
      bobAmp: rand(6, 20),
      bobFreq: rand(0.1, 0.3),
      bobPhase: rand(0, TAU),

      // depth layering
      scale: rand(0.55, 1.15),
      blur: rand(0, 1.4),                  // softness for "distance"
      index, total
    };
  }

  function regenerate() {
    const n = W < 640 ? randI(5, 7) : randI(8, 12);
    feathers = Array.from({ length: n }, (_, i) => makeFeather(i, n));
    // fully clear on regenerate so old trails vanish
    ctx.fillStyle = '#050a10';
    ctx.fillRect(0, 0, W, H);
  }

  /* ------------------------------------------------------------------ */
  /*  Drawing                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * Draw one feather centred at origin, pointing up (negative Y).
   * The caller sets the transform before calling.
   */
  function drawFeather(f, t) {
    const L = f.len * f.scale;
    const hue = (f.hueBase + t * f.hueDrift * 40) % 360;
    const h2  = (hue + 25) % 360;

    ctx.save();
    if (f.blur > 0.4) {
      ctx.filter = `blur(${f.blur.toFixed(1)}px)`;
    }

    /* ---- Fluff at the base ---------------------------------------- */
    {
      const r = L * f.fluffSize;
      for (let i = 0; i < f.fluffStrands; i++) {
        const a = (i / f.fluffStrands) * TAU + Math.sin(t * 0.7 + i) * 0.12;
        const rr = r * (0.55 + 0.45 * Math.abs(Math.sin(i * 2.7 + t * 0.5)));
        ctx.beginPath();
        ctx.moveTo(0, L * 0.42);
        ctx.quadraticCurveTo(
          Math.cos(a) * rr * 0.5, L * 0.42 + Math.sin(a) * rr * 0.5,
          Math.cos(a) * rr,       L * 0.42 + Math.sin(a) * rr
        );
        ctx.strokeStyle = `hsla(${hue}, ${f.sat}%, ${f.light + 8}%, ${(f.alpha * 0.35).toFixed(3)})`;
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }

    /* ---- Shaft (rachis) ------------------------------------------- */
    {
      const steps = 24;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const p = i / steps;                 // 0 at tip, 1 at base
        const y = -L * 0.5 + p * L;
        const x = Math.sin(p * Math.PI * 1.5) * L * f.shaftWobble;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `hsla(${hue}, ${f.sat - 10}%, ${f.light + 14}%, ${f.alpha})`;
      ctx.lineWidth = 1.6 * f.scale;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    /* ---- Barbs ------------------------------------------------------ */
    const barbsPerSide = f.barbCount;
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < barbsPerSide; i++) {
        const p = (i + 0.5) / barbsPerSide;  // 0..1 along shaft
        const y = -L * 0.5 + p * L * 0.92;   // stop short of the fluff zone
        const sx = Math.sin(p * Math.PI * 1.5) * L * f.shaftWobble;

        // barb length tapers toward tip and base
        const taper = Math.sin(p * Math.PI) ** 0.6;
        const blen = L * f.barbSpread * taper;
        const curl = f.barbCurl * blen;

        // slight shimmer per barb
        const shimmer = 0.85 + 0.15 * Math.sin(t * 1.3 + i * 0.8 + side);
        const bh = (hue + (side * 8) + i * 0.6) % 360;

        ctx.beginPath();
        ctx.moveTo(sx, y);
        ctx.quadraticCurveTo(
          sx + side * blen * 0.5, y - curl * 0.5,
          sx + side * blen,       y - curl
        );
        ctx.strokeStyle = `hsla(${bh}, ${f.sat}%, ${f.light * shimmer}%, ${(f.alpha * 0.8).toFixed(3)})`;
        ctx.lineWidth = 0.8 * f.scale;
        ctx.stroke();

        /* ---- Barbules (fine side hairs) ---------------------------- */
        if (f.barbuleCount > 0 && taper > 0.25) {
          for (let j = 0; j < f.barbuleCount; j++) {
            const q = (j + 0.5) / f.barbuleCount;
            // point along the quadratic
            const qx = sx + side * blen * q;
            const qy = y - curl * q;
            const dir = side * (1 - q * 0.6);
            const blen2 = blen * f.barbuleLen * (1 - q * 0.5);

            ctx.beginPath();
            ctx.moveTo(qx, qy);
            ctx.quadraticCurveTo(
              qx + dir * blen2 * 0.4, qy - blen2 * 0.3,
              qx + dir * blen2,       qy - blen2 * 0.5
            );
            ctx.strokeStyle = `hsla(${(bh + 15) % 360}, ${f.sat - 8}%, ${f.light + 6}%, ${(f.alpha * 0.3).toFixed(3)})`;
            ctx.lineWidth = 0.4 * f.scale;
            ctx.stroke();
          }
        }
      }
    }

    /* ---- Tip highlight --------------------------------------------- */
    {
      const g = ctx.createRadialGradient(0, -L * 0.5, 0, 0, -L * 0.5, L * 0.08);
      g.addColorStop(0, `hsla(${hue}, ${f.sat}%, ${f.light + 20}%, 0.5)`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, -L * 0.5, L * 0.08, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }

  /* ------------------------------------------------------------------ */
  /*  Animation loop                                                     */
  /* ------------------------------------------------------------------ */

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    time += dt;

    /* trailing fade */
    ctx.fillStyle = 'rgba(5, 10, 16, 0.085)';
    ctx.fillRect(0, 0, W, H);

    /* update + draw feathers, back-to-front by scale */
    const sorted = [...feathers].sort((a, b) => a.scale - b.scale);
    for (const f of sorted) {
      // sine-wave drift
      f.x += f.vx * dt + Math.cos(time * f.swayFreq + f.swayPhase) * f.swayAmp * dt * 0.4;
      f.y += f.vy * dt + Math.sin(time * f.bobFreq  + f.bobPhase)  * f.bobAmp  * dt * 0.4;
      f.angle += f.angVel * dt + Math.sin(time * 0.3 + f.swayPhase) * 0.0006;

      // wrap around with margin
      const m = f.len * f.scale * 0.7;
      if (f.x < -m) f.x = W + m;
      if (f.x > W + m) f.x = -m;
      if (f.y < -m) f.y = H + m;
      if (f.y > H + m) f.y = -m;

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.angle);
      drawFeather(f, time);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ */
  /*  Events                                                             */
  /* ------------------------------------------------------------------ */

  canvas.addEventListener('click', () => {
    regenerate();
    hint.classList.add('hidden');
  });

  window.addEventListener('resize', () => {
    resize();
    regenerate();
  });

  /* ------------------------------------------------------------------ */
  /*  Boot                                                               */
  /* ------------------------------------------------------------------ */

  resize();
  regenerate();
  requestAnimationFrame(frame);

  // hide hint after a while regardless
  setTimeout(() => hint.classList.add('hidden'), 9000);
})();
</script>
</body>
</html>
