<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0510; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Color patches that drift and shift hue
class ColorPatch {
  constructor() {
    this.angle = Math.random() * Math.PI * 2;
    this.dist = Math.random() * 0.4;
    this.size = 30 + Math.random() * 80;
    this.hueOffset = Math.random() * 360;
    this.driftSpeed = 0.1 + Math.random() * 0.3;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.3 + Math.random() * 0.5;
  }
  draw(ctx, time, baseRadius) {
    const a = this.angle + time * this.driftSpeed * 0.1;
    const d = this.dist * baseRadius;
    const x = cx + Math.cos(a) * d;
    const y = cy + Math.sin(a) * d;
    const pulse = 0.6 + 0.4 * Math.sin(time * this.pulseSpeed + this.pulsePhase);
    const r = this.size * pulse;
    const hue = (this.hueOffset + time * 20) % 360;

    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `hsla(${hue}, 80%, 60%, 0.25)`);
    grad.addColorStop(0.5, `hsla(${(hue + 30) % 360}, 70%, 50%, 0.12)`);
    grad.addColorStop(1, `hsla(${(hue + 60) % 360}, 60%, 40%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Shimmer dots
class ShimmerDot {
  constructor() {
    this.angle = Math.random() * Math.PI * 2;
    this.dist = Math.random() * 0.45;
    this.size = 0.5 + Math.random() * 1.5;
    this.twinklePhase = Math.random() * Math.PI * 2;
    this.twinkleSpeed = 2 + Math.random() * 4;
    this.driftSpeed = 0.05 + Math.random() * 0.15;
  }
  draw(ctx, time, baseRadius) {
    const a = this.angle + time * this.driftSpeed * 0.05;
    const d = this.dist * baseRadius;
    const x = cx + Math.cos(a) * d;
    const y = cy + Math.sin(a) * d;
    const twinkle = Math.abs(Math.sin(time * this.twinkleSpeed + this.twinklePhase));

    if (twinkle > 0.6) {
      const alpha = (twinkle - 0.6) * 2.5;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size * 4);
      grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.8})`);
      grad.addColorStop(0.5, `rgba(200, 220, 255, ${alpha * 0.3})`);
      grad.addColorStop(1, 'rgba(150, 180, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, this.size * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

const patches = [];
for (let i = 0; i < 15; i++) patches.push(new ColorPatch());

const shimmers = [];
for (let i = 0; i < 40; i++) shimmers.push(new ShimmerDot());

function drawOpal(time) {
  const baseRadius = Math.min(W, H) * 0.4;

  // Dark purple base
  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius);
  baseGrad.addColorStop(0, 'rgba(40, 20, 60, 0.15)');
  baseGrad.addColorStop(0.5, 'rgba(30, 15, 50, 0.1)');
  baseGrad.addColorStop(1, 'rgba(20, 10, 40, 0)');
  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
  ctx.fill();

  // Color patches
  for (const p of patches) {
    p.draw(ctx, time, baseRadius);
  }

  // Shimmer dots
  for (const s of shimmers) {
    s.draw(ctx, time, baseRadius);
  }

  // Subtle outer glow ring
  const ringAlpha = 0.1 + 0.05 * Math.sin(time * 0.5);
  ctx.strokeStyle = `rgba(180, 150, 255, ${ringAlpha})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, baseRadius * 0.95, 0, Math.PI * 2);
  ctx.stroke();
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 5, 16, 0.06)';
  ctx.fillRect(0, 0, W, H);

  drawOpal(time);
  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0510';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
