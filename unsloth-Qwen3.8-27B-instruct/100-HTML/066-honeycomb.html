<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honeycomb — Glowing Hexagonal Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0602;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255, 200, 100, 0.45);
    pointer-events: none;
    user-select: none;
    transition: opacity 1.2s ease;
    animation: hintFade 4s ease 3s forwards;
  }

  @keyframes hintFade {
    to { opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="hint" aria-hidden="true">click to regenerate</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  let hexes = [];
  let time = 0;
  let lastFrame = performance.now();

  // ── Resize ────────────────────────────────────────────────
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    generate();
  }

  // ── Color helpers ─────────────────────────────────────────
  // Warm gold/amber palette with slight variation per hexagon
  function warmHue(base) {
    // base around 38-48 (gold), vary ±8
    return base + (Math.random() - 0.5) * 16;
  }

  // ── Generate honeycomb grid ───────────────────────────────
  function generate() {
    hexes = [];
    time = 0;

    // Base size varies slightly for organic feel
    const baseSize = Math.max(28, Math.min(W, H) / 14);
    const hueBase = 36 + Math.random() * 14; // 36–50 range

    // Pointy-top hexagons, staggered rows
    const hexW = baseSize * Math.sqrt(3);
    const hexH = baseSize * 2;
    const vStep = hexH * 0.75;
    const hStep = hexW;

    const cols = Math.ceil(W / hStep) + 2;
    const rows = Math.ceil(H / vStep) + 2;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const x = col * hStep + (row % 2 === 1 ? hStep / 2 : 0);
        const y = row * vStep;

        // Organic variation
        const sizeJitter = 0.9 + Math.random() * 0.2;
        const size = baseSize * sizeJitter;
        const hue = warmHue(hueBase);
        const sat = 75 + Math.random() * 25;       // 75–100
        const lightBase = 45 + Math.random() * 15;  // 45–60
        const pulseSpeed = 0.4 + Math.random() * 0.6; // 0.4–1.0 rad/s
        const phase = Math.random() * Math.PI * 2;
        const glowIntensity = 0.5 + Math.random() * 0.5;

        hexes.push({ x, y, size, hue, sat, lightBase, pulseSpeed, phase, glowIntensity });
      }
    }

    // Initial full clear so we don't see stale trails on first frame
    ctx.fillStyle = '#0a0602';
    ctx.fillRect(0, 0, W, H);
  }

  // ── Draw a single hexagon path (pointy-top) ───────────────
  function hexPath(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 180) * (60 * i - 30);
      const px = cx + r * Math.cos(angle);
      const py = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // ── Render loop ───────────────────────────────────────────
  function render(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    time += dt;

    // Trailing fade — draw semi-transparent dark rect over previous frame
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(10, 6, 2, 0.18)';
    ctx.fillRect(0, 0, W, H);

    // Additive blending for glowing overlaps
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < hexes.length; i++) {
      const h = hexes[i];

      // Pulse: oscillate between 0.5 and 1.0 of base brightness
      const pulse = 0.5 + 0.5 * Math.sin(time * h.pulseSpeed + h.phase);
      const light = h.lightBase * (0.4 + 0.6 * pulse);
      const radius = h.size * (0.92 + 0.08 * pulse);

      // Radial gradient fill — bright center fading to transparent edge
      const grad = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, radius);
      grad.addColorStop(0, `hsla(${h.hue}, ${h.sat}%, ${Math.min(light + 20, 85)}%, ${0.7 * h.glowIntensity})`);
      grad.addColorStop(0.5, `hsla(${h.hue}, ${h.sat}%, ${light}%, ${0.45 * h.glowIntensity})`);
      grad.addColorStop(1, `hsla(${h.hue - 5}, ${h.sat}%, ${Math.max(light - 15, 10)}%, 0)`);

      hexPath(h.x, h.y, radius);
      ctx.fillStyle = grad;
      ctx.fill();

      // Subtle stroke for definition
      ctx.strokeStyle = `hsla(${h.hue}, ${h.sat}%, ${light + 10}%, ${0.12 * pulse * h.glowIntensity})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // Reset composite for next frame's fade
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(render);
  }

  // ── Events ────────────────────────────────────────────────
  window.addEventListener('resize', resize);
  canvas.addEventListener('click', () => {
    generate();
    // Re-show hint briefly
    const hint = document.querySelector('.hint');
    if (hint) {
      hint.style.animation = 'none';
      hint.offsetHeight; // reflow
      hint.style.animation = '';
    }
  });

  // ── Init ──────────────────────────────────────────────────
  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
