<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sierpinski</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0a14; }
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 11px; color: rgba(150,150,200,0.35);
  letter-spacing: 3px; pointer-events: none; user-select: none; text-transform: uppercase;
}
.depth-label {
  position: fixed; top: 20px; right: 24px;
  font-family: 'Courier New', monospace; font-size: 12px; color: rgba(150,150,200,0.4);
  letter-spacing: 2px; pointer-events: none; user-select: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">click to increase depth</div>
<div class="depth-label" id="depthLabel">DEPTH: 4</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let depth = 4;
const MAX_DEPTH = 7;
const MIN_DEPTH = 4;
const depthLabel = document.getElementById('depthLabel');

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

canvas.addEventListener('click', () => {
  depth++;
  if (depth > MAX_DEPTH) depth = MIN_DEPTH;
  depthLabel.textContent = 'DEPTH: ' + depth;
});

function drawTriangle(x1, y1, x2, y2, x3, y3, d, time) {
  if (d === 0) {
    const cx = (x1 + x2 + x3) / 3;
    const cy = (y1 + y2 + y3) / 3;
    const hue = ((cx / W) * 180 + (cy / H) * 180 + time * 10) % 360;
    const alpha = 0.5 + 0.3 * Math.sin(time + cx * 0.01);

    ctx.fillStyle = `hsla(${hue}, 70%, 55%, ${alpha})`;
    ctx.strokeStyle = `hsla(${hue}, 80%, 70%, ${alpha * 0.8})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    return;
  }

  const mx1 = (x1 + x2) / 2;
  const my1 = (y1 + y2) / 2;
  const mx2 = (x2 + x3) / 2;
  const my2 = (y2 + y3) / 2;
  const mx3 = (x1 + x3) / 2;
  const my3 = (y1 + y3) / 2;

  drawTriangle(x1, y1, mx1, my1, mx3, my3, d - 1, time);
  drawTriangle(mx1, my1, x2, y2, mx2, my2, d - 1, time);
  drawTriangle(mx3, my3, mx2, my2, x3, y3, d - 1, time);
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 10, 20, 0.1)';
  ctx.fillRect(0, 0, W, H);

  const size = Math.min(W, H) * 0.8;
  const x1 = W / 2;
  const y1 = H / 2 - size * 0.45;
  const x2 = W / 2 - size * 0.5;
  const y2 = H / 2 + size * 0.45;
  const x3 = W / 2 + size * 0.5;
  const y3 = H / 2 + size * 0.45;

  drawTriangle(x1, y1, x2, y2, x3, y3, depth, time);

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0a14';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
