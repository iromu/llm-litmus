<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETRO TERMINAL // CRT-9000</title>
<style>
  /* ============ RESET & BASE ============ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-bright: #4afa6b;
    --green-mid:    #2fd45a;
    --green-dim:    #1a8c3a;
    --green-faint:  #0d4f22;
    --green-glow:   rgba(74, 250, 107, 0.55);
    --bg-deep:      #030804;
    --bg-screen:    #04120a;
    --font-mono: "Courier New", Courier, "Lucida Console", Monaco, monospace;
  }

  html, body { height: 100%; }

  body {
    background: radial-gradient(ellipse at 50% 40%, #0a1a0e 0%, var(--bg-deep) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    font-family: var(--font-mono);
    overflow: hidden;
  }

  /* ============ TERMINAL WINDOW ============ */
  .terminal-window {
    width: min(920px, 100%);
    height: min(640px, calc(100vh - 32px));
    display: flex;
    flex-direction: column;
    background: #0c0f0c;
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(74, 250, 107, 0.12),
      0 0 60px rgba(74, 250, 107, 0.08),
      0 30px 80px rgba(0, 0, 0, 0.9),
      inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    overflow: hidden;
    position: relative;
  }

  /* ---- Title bar ---- */
  .title-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #161a16 0%, #0e120e 100%);
    border-bottom: 1px solid rgba(74, 250, 107, 0.15);
    user-select: none;
    flex-shrink: 0;
  }

  .traffic-lights { display: flex; gap: 8px; }
  .dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.5);
  }
  .dot.red    { background: radial-gradient(circle at 35% 30%, #ff9a8a, #ff5f56 60%); }
  .dot.yellow { background: radial-gradient(circle at 35% 30%, #ffe08a, #ffbd2e 60%); }
  .dot.green  { background: radial-gradient(circle at 35% 30%, #a8ffb0, #28c940 60%); }

  .title-text {
    flex: 1;
    text-align: center;
    color: var(--green-dim);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .title-meta {
    color: var(--green-faint);
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* ---- Screen ---- */
  .screen {
    flex: 1;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(74, 250, 107, 0.045) 0%, transparent 65%),
      var(--bg-screen);
    overflow: hidden;
    cursor: crosshair;
  }

  /* Phosphor glow vignette */
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    pointer-events: none;
    z-index: 5;
  }

  /* Scanlines */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.28) 3px,
      rgba(0, 0, 0, 0.28) 4px
    );
    pointer-events: none;
    z-index: 4;
    mix-blend-mode: multiply;
  }

  /* Subtle RGB mask (aperture grille hint) */
  .rgb-mask {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to right,
      rgba(74, 250, 107, 0.02) 0px,
      rgba(0, 0, 0, 0.05) 1px,
      transparent 2px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 3;
  }

  /* Scanning horizontal line */
  .scan-beam {
    position: absolute;
    left: 0; right: 0;
    height: 90px;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(74, 250, 107, 0.05) 40%,
      rgba(74, 250, 107, 0.12) 50%,
      rgba(74, 250, 107, 0.05) 60%,
      transparent 100%
    );
    pointer-events: none;
    z-index: 6;
    animation: beam-sweep 6s linear infinite;
  }
  @keyframes beam-sweep {
    0%   { top: -15%; }
    100% { top: 110%; }
  }

  /* Whole-screen flicker */
  .flicker {
    position: absolute;
    inset: 0;
    background: rgba(74, 250, 107, 0.015);
    pointer-events: none;
    z-index: 7;
    animation: flicker 4s steps(1) infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.4; }
    7%       { opacity: 0.9; }
    8%       { opacity: 0.2; }
    9%       { opacity: 0.7; }
    38%      { opacity: 0.5; }
    39%      { opacity: 0.1; }
    40%      { opacity: 0.8; }
    71%      { opacity: 0.35; }
    72%      { opacity: 0.75; }
  }

  /* Occasional bright flash line across the screen */
  .flash-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: rgba(74, 250, 107, 0.25);
    box-shadow: 0 0 12px 2px rgba(74, 250, 107, 0.3);
    pointer-events: none;
    z-index: 6;
    animation: flash-jump 9s steps(1) infinite;
    opacity: 0;
  }
  @keyframes flash-jump {
    0%, 96.9% { opacity: 0; }
    97%       { opacity: 1; top: 22%; }
    97.4%     { opacity: 0; }
    98%       { opacity: 1; top: 64%; }
    98.4%     { opacity: 0; }
  }

  /* ---- Terminal output area ---- */
  .output {
    position: absolute;
    inset: 0;
    padding: 22px 26px 30px;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 2;
    scrollbar-width: thin;
    scrollbar-color: var(--green-faint) transparent;
  }
  .output::-webkit-scrollbar { width: 8px; }
  .output::-webkit-scrollbar-track { background: transparent; }
  .output::-webkit-scrollbar-thumb {
    background: var(--green-faint);
    border-radius: 4px;
  }

  .line {
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--green-mid);
    text-shadow: 0 0 6px var(--green-glow);
    opacity: 0;
    animation: typefade 0.45s ease-out forwards;
  }
  @keyframes typefade {
    0%   { opacity: 0; filter: blur(2px); transform: translateY(2px); }
    60%  { opacity: 0.85; filter: blur(0.5px); }
    100% { opacity: 1; filter: blur(0); transform: translateY(0); }
  }

  .line.cmd        { color: var(--green-bright); font-weight: bold; }
  .line.info       { color: var(--green-mid); }
  .line.success    { color: #7dffa0; text-shadow: 0 0 8px rgba(125, 255, 160, 0.7); }
  .line.error      { color: #ff5f56; text-shadow: 0 0 8px rgba(255, 95, 86, 0.5); }
  .line.highlight  { color: #b8ffd0; text-shadow: 0 0 10px rgba(184, 255, 208, 0.8); }
  .line.dimmed     { color: var(--green-dim); text-shadow: 0 0 4px rgba(26, 140, 58, 0.4); }
  .line.header     {
    color: var(--green-bright);
    text-shadow: 0 0 10px var(--green-glow);
    letter-spacing: 1px;
  }

  /* ASCII banner gets a slightly larger glow */
  .line.banner {
    font-size: 11px;
    line-height: 1.25;
    color: var(--green-dim);
    text-shadow: 0 0 8px rgba(47, 212, 90, 0.5);
    white-space: pre;
  }

  /* Prompt + cursor */
  .prompt-line {
    display: flex;
    align-items: baseline;
    gap: 0;
    margin-top: 4px;
  }
  .prompt {
    color: var(--green-bright);
    font-weight: bold;
    text-shadow: 0 0 8px var(--green-glow);
    font-size: 14px;
    line-height: 1.65;
    white-space: pre;
  }
  .cursor {
    display: inline-block;
    width: 9px;
    height: 17px;
    background: var(--green-bright);
    box-shadow: 0 0 10px var(--green-glow), 0 0 3px var(--green-bright);
    margin-left: 2px;
    animation: blink 1.06s steps(1) infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Power-on effect for the whole screen */
  .power-on { animation: poweron 0.9s cubic-bezier(0.23, 1, 0.32, 1); }
  @keyframes poweron {
    0%   { transform: scaleY(0.005) scaleX(0.7); filter: brightness(6); opacity: 0.4; }
    35%  { transform: scaleY(0.02) scaleX(1);    filter: brightness(4); opacity: 0.9; }
    60%  { transform: scaleY(1) scaleX(1);       filter: brightness(1.8); }
    100% { transform: scale(1);                  filter: brightness(1); opacity: 1; }
  }

  /* Status footer inside screen */
  .status-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-between;
    padding: 5px 14px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--green-faint);
    background: rgba(4, 18, 10, 0.9);
    border-top: 1px solid rgba(74, 250, 107, 0.1);
    z-index: 8;
    pointer-events: none;
  }
  .status-bar .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 640px) {
    body { padding: 8px; }
    .terminal-window { height: calc(100vh - 16px); }
    .output { padding: 14px 14px 34px; }
    .line { font-size: 12px; }
    .line.banner { font-size: 8px; }
    .title-text { font-size: 10px; letter-spacing: 1px; }
    .title-meta { display: none; }
    .cursor { width: 7px; height: 14px; }
  }
</style>
</head>
<body>

<main class="terminal-window" aria-label="Retro terminal emulator">
  <header class="title-bar">
    <div class="traffic-lights" aria-hidden="true">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
    <h1 class="title-text">guest@phosphor: ~ — CRT-9000</h1>
    <span class="title-meta">tty/0 · 9600 baud</span>
  </header>

  <section class="screen power-on" id="screen" role="log" aria-live="polite">
    <div class="rgb-mask" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="scan-beam" aria-hidden="true"></div>
    <div class="flash-line" aria-hidden="true"></div>
    <div class="flicker" aria-hidden="true"></div>

    <div class="output" id="output"></div>

    <footer class="status-bar" aria-hidden="true">
      <span class="pulse">● LINK ACTIVE</span>
      <span id="clock">--:--:--</span>
      <span>CRT-9000 · P1-GREEN</span>
    </footer>
  </section>
</main>

<script>
(function () {
  "use strict";

  var output = document.getElementById("output");
  var screen = document.getElementById("screen");
  var clockEl = document.getElementById("clock");

  /* ---------- Clock ---------- */
  function tickClock() {
    var d = new Date();
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    clockEl.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- Line rendering ---------- */
  var promptLine = null;

  function addLine(text, cls) {
    if (promptLine) { output.removeChild(promptLine); promptLine = null; }
    var el = document.createElement("div");
    el.className = "line " + (cls || "info");
    el.textContent = text;
    output.appendChild(el);
    output.scrollTop = output.scrollHeight;
    return el;
  }

  function showPrompt() {
    if (promptLine) output.removeChild(promptLine);
    promptLine = document.createElement("div");
    promptLine.className = "prompt-line";
    var p = document.createElement("span");
    p.className = "prompt";
    p.textContent = "guest@phosphor:~$ ";
    var c = document.createElement("span");
    c.className = "cursor";
    promptLine.appendChild(p);
    promptLine.appendChild(c);
    output.appendChild(promptLine);
    output.scrollTop = output.scrollHeight;
  }

  /* ---------- Command database ---------- */
  var BANNER = [
    "    _   _ _______ ____  ___  _  ___  ___",
    "   | \\ | |  _ \\  __ \\ / _ \\| |/ _ \\/ _ \\ ",
    "   |  \\| | |_) | |  ) | | | | | | | | | |",
    "   | . ` |  _ <| |__| | |_| | | |_| | |_|",
    "   |_|\\_|_| \\_\\_____/ \\___/|_|\\___/ \\___/"
  ].join("\n");

  var commands = [
    { cmd: "whoami", lines: [["guest", "highlight"]] },
    { cmd: "uptime", lines: [[" 14:32:07 up 3 days, 7:41,  1 user,  load average: 0.42, 0.38, 0.35", "info"]] },
    { cmd: "ls -la", lines: [
      ["total 48", "dimmed"],
      ["drwxr-xr-x   7 guest  staff   224 Mar 14 09:12 .", "info"],
      ["drwxr-xr-x  12 root   root    4096 Jan  2 08:00 ..", "info"],
      ["-rw-r--r--   1 guest  staff  1024 Mar 14 09:01 notes.txt", "info"],
      ["-rw-r--r--   1 guest  staff  8192 Mar 13 22:47 dreams.log", "info"],
      ["-rwxr-xr-x   1 guest  staff  4096 Feb 28 14:33 run.sh", "success"],
      ["drwx------   2 guest  staff   512 Mar 14 07:55 .secrets", "error"]
    ]},
    { cmd: "cat /etc/motd", lines: [
      ["*** WELCOME TO PHOSPHOR NETWORK v2.4 ***", "header"],
      ["All sessions are monitored by the mainframe.", "dimmed"],
      ["Remember: the grid remembers everything you type.", "dimmed"]
    ]},
    { cmd: "df -h", lines: [
      ["Filesystem      Size  Used Avail Use% Mounted on", "dimmed"],
      ["dev/root          64G   21G   43G  33% /", "info"],
      ["tmpfs             16G  1.2G   15G   8% /tmp", "info"],
      ["grid/remote       1T   87T   91T  49% /mnt/grid", "success"]
    ]},
    { cmd: "ps aux | head -5", lines: [
      ["USER       PID %CPU %MEM    VSZ   RSS COMMAND", "dimmed"],
      ["root         1  0.0  0.1  12480  3216 init", "info"],
      ["guest      412  0.0  0.2  20480  6144 sshd", "info"],
      ["guest      517  0.1  0.4  48212 12032 phosphord", "success"],
      ["guest      601  0.0  0.0   8192  2048 bash", "info"]
    ]},
    { cmd: "ping localhost", lines: [
      ["PING localhost (127.0.0.1): 56 data bytes", "info"],
      ["64 bytes from 127.0.0.1: icmp_seq=0 ttl=64 time=0.042 ms", "info"],
      ["64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.038 ms", "info"],
      ["--- localhost ping statistics ---", "dimmed"],
      ["2 packets transmitted, 2 received, 0% packet loss", "success"]
    ]},
    { cmd: "free -m", lines: [
      ["              total   used   free shared buffers", "dimmed"],
      ["Mem:           32768  9216  23552    512    1024", "info"],
      ["Swap:          16384     0  16384", "dimmed"]
    ]},
    { cmd: "uname -a", lines: [["Linux phosphor 6.1.0-crt #9 SMP x86_64 GNU/Linux", "info"]] },
    { cmd: "date", lines: [[new Date().toUTCString(), "info"]] },
    { cmd: "history", lines: [
      ["  1  whoami", "dimmed"],
      ["  2  ls -la", "dimmed"],
      ["  3  cat /etc/motd", "dimmed"],
      ["  4  history", "highlight"]
    ]},
    { cmd: "sudo make coffee", lines: [
      ["[sudo] password for guest:", "info"],
      ["Sorry, try again.", "error"],
      ["Access denied. The machine does not brew coffee.", "error"]
    ]},
    { cmd: "neofetch", lines: [
      ["os: PhosphorOS 2.4 (CRT Edition)", "info"],
      ["kernel: 6.1.0-crt", "info"],
      ["shell: sh 4.2", "info"],
      ["display: 80x24 green phosphor", "info"],
      ["gpu: CRT-9000 (analog)", "success"],
      ["memory: 9216MiB / 32768MiB", "info"]
    ]},
    { cmd: "top -bn1 | head -4", lines: [
      ["top - 14:32:07 up 3 days, 7:41, 1 user", "dimmed"],
      ["Tasks: 142 total, 1 running, 141 sleeping", "info"],
      ["%Cpu(s):  2.1 us,  0.8 sy,  0.0 ni, 96.9 id", "info"],
      ["MiB Mem:  32768.0 total,  9216.0 used", "info"]
    ]},
    { cmd: "echo $HOME", lines: [["/home/guest", "info"]] },
    { cmd: "cd /dev/null && echo silenced", lines: [["silenced", "dimmed"]] },
    { cmd: "grep -r 'secret' . --include='*.txt'", lines: [
      ["notes.txt:the secret is in the static between channels", "highlight"],
      ["dreams.log:channel 9 never goes quiet", "info"]
    ]},
    { cmd: "reboot", lines: [
      ["Broadcast message from system:", "error"],
      ["The system will go down now for reboot.", "error"],
      "[OK] Phantoms of this session will be preserved in memory.", "dimmed"]
    ]},
    { cmd: "fortune", lines: [
      ["\"The best way to predict the future is to invent it.\" — A. Kay", "highlight"]
    ]},
    { cmd: "clear", lines: [] }
  ];

  /* ---------- Execution engine ---------- */
  var busy = false;

  function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  async function execCommand(entry) {
    if (busy) return;
    busy = true;
    await sleep(120);

    if (entry.cmd === "clear") {
      output.innerHTML = "";
      showPrompt();
      busy = false;
      return;
    }

    addLine(entry.cmd, "cmd");
    await sleep(220 + Math.random() * 200);

    for (var i = 0; i < entry.lines.length; i++) {
      addLine(entry.lines[i][0], entry.lines[i][1]);
      await sleep(90 + Math.random() * 140);
    }
    await sleep(200);
    showPrompt();
    busy = false;
  }

  function randomIndex(exclude) {
    var i;
    do { i = Math.floor(Math.random() * commands.length); } while (i === exclude);
    return i;
  }

  /* ---------- Boot sequence ---------- */
  async function boot() {
    showPrompt();
    await sleep(700);
    addLine(BANNER, "banner");
    await sleep(500);
    addLine("", "info");
    addLine("PhosphorOS 2.4 — analog terminal interface", "header");
    addLine("Type nothing. Click anywhere. The machine drives itself.", "dimmed");
    await sleep(600);
    showPrompt();
    await sleep(900);

    // Pre-programmed startup sequence
    var startup = [0, 1, 2, 3]; // whoami, uptime, ls -la, motd
    for (var s = 0; s < startup.length; s++) {
      await execCommand(commands[startup[s]]);
      await sleep(600 + Math.random() * 500);
    }

    // Then loop through random commands forever
    var last = -1;
    (async function loop() {
      while (true) {
        var idx = randomIndex(last);
        last = idx;
        await execCommand(commands[idx]);
        await sleep(1400 + Math.random() * 1800);
      }
    })();
  }

  /* ---------- Click interaction ---------- */
  screen.addEventListener("click", function () {
    if (busy) return;
    var idx = randomIndex(-1);
    execCommand(commands[idx]);
  });

  boot();
})();
</script>
</body>
</html>
