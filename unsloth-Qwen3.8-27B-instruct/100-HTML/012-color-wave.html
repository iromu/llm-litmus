<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Flow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a14;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  h1 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 200;
    font-size: clamp(2rem, 6vw, 5rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #fff;
    mix-blend-mode: overlay;
    user-select: none;
    text-align: center;
    padding: 0 1rem;
  }

  .hint {
    margin-top: 1.2rem;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(0.6rem, 1.4vw, 0.85rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    mix-blend-mode: screen;
    user-select: none;
    transition: opacity 0.8s ease;
  }

  .palette-dot {
    margin-top: 1.5rem;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    mix-blend-mode: screen;
    transition: transform 0.4s ease, background 0.4s ease;
  }

  .palette-dot.pulse {
    animation: pulse 0.5s ease;
  }

  @keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(2.2); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<canvas id="wave-canvas"></canvas>

<div class="overlay">
  <h1>Chromatic Flow</h1>
  <p class="hint" id="hint">tap to shift palette</p>
  <div class="palette-dot" id="dot"></div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');
  const dot = document.getElementById('dot');
  const hint = document.getElementById('hint');

  /* ── Palettes ─────────────────────────────────────────────── */
  const PALETTES = [
    { // 0 — pink / blue / purple
      bg: ['#0d0221', '#1a0533'],
      waves: ['#ff6ec7', '#7b68ee', '#c084fc', '#f472b6', '#818cf8', '#e879f9', '#a78bfa', '#fb7185'],
      stroke: ['#ffd6f5', '#c4b5fd', '#f9a8d4']
    },
    { // 1 — green / magenta
      bg: ['#03140e', '#0a1f14'],
      waves: ['#34d399', '#f0abfc', '#10b981', '#e879f9', '#6ee7b7', '#d946ef', '#a7f3d0', '#c026d3'],
      stroke: ['#bbf7d0', '#fae8ff', '#86efac']
    },
    { // 2 — cyan / hot pink
      bg: ['#020b1a', '#041228'],
      waves: ['#22d3ee', '#ff2d95', '#67e8f9', '#f472b6', '#06b6d4', '#ec4899', '#a5f3fc', '#fb7185'],
      stroke: ['#cffafe', '#fce7f3', '#a5f3fc']
    },
    { // 3 — orange / violet
      bg: ['#14080a', '#1f0a14'],
      waves: ['#fb923c', '#8b5cf6', '#fdba74', '#a78bfa', '#f97316', '#7c3aed', '#fed7aa', '#c4b5fd'],
      stroke: ['#ffedd5', '#ede9fe', '#fde68a']
    },
    { // 4 — pastel
      bg: ['#1a1a2e', '#16213e'],
      waves: ['#fbcfe8', '#bfdbfe', '#ddd6fe', '#fef3c7', '#bbf7d0', '#fecaca', '#e9d5ff', '#bae6fd'],
      stroke: ['#fdf2f8', '#eff6ff', '#f5f3ff']
    }
  ];

  let paletteIndex = 0;
  let currentPalette = PALETTES[0];

  /* ── Wave configuration ───────────────────────────────────── */
  const WAVE_COUNT = 8;
  let waves = [];

  function randomBetween(a, b) { return a + Math.random() * (b - a); }

  function generateWaves() {
    waves = [];
    for (let i = 0; i < WAVE_COUNT; i++) {
      const t = i / (WAVE_COUNT - 1); // 0..1 spread
      waves.push({
        // amplitude: larger in the middle of the stack
        amp1: randomBetween(30, 90) * (0.5 + 0.5 * Math.sin(Math.PI * t)),
        amp2: randomBetween(10, 40),
        // frequency (cycles across the width)
        freq1: randomBetween(0.8, 2.4),
        freq2: randomBetween(1.5, 4.0),
        // speed (radians/sec)
        speed1: randomBetween(0.25, 0.9) * (Math.random() > 0.5 ? 1 : -1),
        speed2: randomBetween(0.4, 1.4) * (Math.random() > 0.5 ? 1 : -1),
        // phase offsets
        phase1: randomBetween(0, Math.PI * 2),
        phase2: randomBetween(0, Math.PI * 2),
        // vertical offset as fraction of canvas height
        yOffset: 0.25 + t * 0.55 + randomBetween(-0.04, 0.04),
        // fill alpha
        fillAlpha: randomBetween(0.08, 0.22),
        // stroke visibility
        hasStroke: Math.random() > 0.35,
        strokeWidth: randomBetween(1, 2.5),
        // color index into palette
        colorIdx: i % currentPalette.waves.length,
        strokeIdx: i % currentPalette.stroke.length
      });
    }
  }

  /* ── Canvas sizing ────────────────────────────────────────── */
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);
  resize();

  /* ── Palette cycling ──────────────────────────────────────── */
  function cyclePalette() {
    paletteIndex = (paletteIndex + 1) % PALETTES.length;
    currentPalette = PALETTES[paletteIndex];
    generateWaves();

    // pulse the indicator dot
    dot.classList.remove('pulse');
    void dot.offsetWidth; // reflow to restart animation
    dot.classList.add('pulse');
    dot.style.background = currentPalette.waves[0];

    // fade the hint after first interaction
    if (hint.style.opacity !== '0') {
      hint.style.opacity = '0';
      setTimeout(() => { hint.textContent = ''; }, 900);
    }
  }

  canvas.addEventListener('click', cyclePalette);
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    cyclePalette();
  }, { passive: false });

  /* ── Background gradient ──────────────────────────────────── */
  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, currentPalette.bg[0]);
    grad.addColorStop(1, currentPalette.bg[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  /* ── Wave rendering ───────────────────────────────────────── */
  function waveY(x, w, time) {
    const xNorm = x / W;
    const s1 = Math.sin(xNorm * Math.PI * 2 * w.freq1 + w.phase1 + time * w.speed1);
    const s2 = Math.sin(xNorm * Math.PI * 2 * w.freq2 + w.phase2 + time * w.speed2);
    return w.yOffset * H + w.amp1 * s1 + w.amp2 * s2;
  }

  function renderWave(w, time, isLast) {
    const steps = Math.max(60, Math.floor(W / 4));
    const dx = W / steps;

    // Filled area
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let i = 0; i <= steps; i++) {
      const x = i * dx;
      ctx.lineTo(x, waveY(x, w, time));
    }
    ctx.lineTo(W, H);
    ctx.closePath();

    const fillGrad = ctx.createLinearGradient(0, 0, 0, H);
    const color = currentPalette.waves[w.colorIdx];
    fillGrad.addColorStop(0, hexToRgba(color, w.fillAlpha * 1.4));
    fillGrad.addColorStop(1, hexToRgba(color, w.fillAlpha * 0.3));
    ctx.fillStyle = fillGrad;
    ctx.fill();

    // Stroke line
    if (w.hasStroke) {
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const x = i * dx;
        const y = waveY(x, w, time);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      const strokeColor = currentPalette.stroke[w.strokeIdx];
      ctx.strokeStyle = hexToRgba(strokeColor, 0.55);
      ctx.lineWidth = w.strokeWidth;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
  }

  /* ── Hex → rgba helper ────────────────────────────────────── */
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  /* ── Subtle vignette for depth ────────────────────────────── */
  function drawVignette() {
    const grad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  /* ── Animation loop ───────────────────────────────────────── */
  let startTime = performance.now();

  function frame(now) {
    const time = (now - startTime) / 1000;

    drawBackground();

    // Render waves back-to-front (highest yOffset last = frontmost)
    const sorted = [...waves].sort((a, b) => a.yOffset - b.yOffset);
    for (const w of sorted) {
      renderWave(w, time);
    }

    drawVignette();

    requestAnimationFrame(frame);
  }

  generateWaves();
  dot.style.background = currentPalette.waves[0];
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
