<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Heart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #1a0510; }
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 11px; color: rgba(255,100,150,0.3);
  letter-spacing: 3px; pointer-events: none; user-select: none; text-transform: uppercase;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">click to regenerate</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let particles = [];
let heartScale = 1;
let heartPhase = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x, y };
}

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = -0.5 - Math.random() * 1.5;
    this.size = 1 + Math.random() * 2.5;
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.01;
    this.hue = 320 + Math.random() * 40;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.01;
    this.life -= this.decay;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    const alpha = this.life * 0.7;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
    grad.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${alpha})`);
    grad.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function spawnParticles(scale) {
  const count = 3;
  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;
    const p = heartPoint(t);
    const px = cx + p.x * scale;
    const py = cy + p.y * scale;
    particles.push(new Particle(px, py));
  }
}

canvas.addEventListener('click', () => {
  particles = [];
});

function drawHeart(time) {
  const pulse = 1 + 0.05 * Math.sin(time * 2);
  const scale = Math.min(W, H) * 0.025 * pulse;

  // Outer glow layer
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // Glow
  ctx.shadowColor = 'rgba(255, 50, 120, 0.8)';
  ctx.shadowBlur = 40;
  ctx.strokeStyle = 'rgba(255, 80, 150, 0.4)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = (i / 200) * Math.PI * 2;
    const p = heartPoint(t);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.stroke();

  // Fill with radial gradient
  ctx.shadowBlur = 0;
  const fillGrad = ctx.createRadialGradient(0, -5, 0, 0, -5, 18);
  fillGrad.addColorStop(0, 'rgba(255, 100, 160, 0.3)');
  fillGrad.addColorStop(0.5, 'rgba(255, 50, 120, 0.15)');
  fillGrad.addColorStop(1, 'rgba(200, 20, 80, 0.05)');
  ctx.fillStyle = fillGrad;
  ctx.fill();

  // Inner stroke
  ctx.strokeStyle = 'rgba(255, 150, 200, 0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const t = (i / 200) * Math.PI * 2;
    const p = heartPoint(t);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.restore();

  // Spawn particles from heart surface
  spawnParticles(scale);
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(26, 5, 16, 0.1)';
  ctx.fillRect(0, 0, W, H);

  drawHeart(time);

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Cap particles
  if (particles.length > 300) particles.splice(0, particles.length - 300);

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#1a0510';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
