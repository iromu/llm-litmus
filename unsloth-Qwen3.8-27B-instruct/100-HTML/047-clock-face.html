<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminous Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #050810;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 3vh, 32px);
  }

  .clock-wrap {
    position: relative;
    width: min(78vmin, 560px);
    height: min(78vmin, 560px);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .digital {
    display: flex;
    align-items: baseline;
    gap: 0.35em;
    color: #9fd4ff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.14em;
    text-shadow: 0 0 12px rgba(80, 170, 255, 0.55), 0 0 40px rgba(40, 120, 255, 0.25);
    user-select: none;
  }

  .digital .time {
    font-size: clamp(1.4rem, 5vmin, 2.4rem);
    font-weight: 300;
  }

  .digital .date {
    font-size: clamp(0.65rem, 2vmin, 0.9rem);
    font-weight: 400;
    opacity: 0.65;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<main>
  <div class="clock-wrap">
    <canvas id="clock" aria-label="Analog clock showing the current time"></canvas>
  </div>
  <div class="digital" role="timer" aria-live="off">
    <span class="time" id="dTime">--:--:--</span>
    <span class="date" id="dDate"></span>
  </div>
</main>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const dTime = document.getElementById('dTime');
  const dDate = document.getElementById('dDate');

  // ---- palette -----------------------------------------------------------
  const C = {
    bgInner:   '#0a1020',
    bgOuter:   '#050810',
    ring:      'rgba(70, 150, 255, 0.35)',
    ringGlow:  'rgba(50, 130, 255, 0.18)',
    hourMark:  'rgba(160, 210, 255, 0.95)',
    cardMark:  '#cfeaff',
    minuteDot: 'rgba(110, 170, 255, 0.45)',
    number:    'rgba(190, 225, 255, 0.9)',
    hourHand:  '#e8f4ff',
    minHand:   '#bfe0ff',
    secHand:   '#ff4d5e',
    secGlow:   'rgba(255, 77, 94, 0.55)',
    trail:     'rgba(255, 77, 94, 1)',
    center:    '#ffffff',
    centerGlow:'rgba(120, 190, 255, 0.9)'
  };

  let W = 0, H = 0, cx = 0, cy = 0, R = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    R  = Math.min(W, H) / 2 * 0.92;
  }

  window.addEventListener('resize', resize);
  resize();

  // ---- helpers -----------------------------------------------------------
  const TAU = Math.PI * 2;
  const angleFor = (frac) => frac * TAU - Math.PI / 2; // 12 o'clock up

  function glowLine(x1, y1, x2, y2, width, color, glowColor, blur) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    if (blur) {
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = blur;
    }
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  // ---- static face (cached to offscreen canvas for performance) ----------
  let faceCache = null;

  function drawFace() {
    faceCache = document.createElement('canvas');
    faceCache.width = canvas.width;
    faceCache.height = canvas.height;
    const f = faceCache.getContext('2d');
    f.setTransform(dpr, 0, 0, dpr, 0, 0);

    // radial gradient dial
    const grad = f.createRadialGradient(cx, cy, R * 0.05, cx, cy, R * 1.15);
    grad.addColorStop(0, C.bgInner);
    grad.addColorStop(0.75, '#070c18');
    grad.addColorStop(1, C.bgOuter);
    f.fillStyle = grad;
    f.fillRect(0, 0, W, H);

    // outer ring glow (two passes for a soft bloom)
    for (const [lw, alpha] of [[R * 0.030, 0.10], [R * 0.012, 0.30]]) {
      f.save();
      f.strokeStyle = `rgba(60, 140, 255, ${alpha})`;
      f.lineWidth = lw;
      f.shadowColor = 'rgba(60, 140, 255, 0.6)';
      f.shadowBlur = R * 0.06;
      f.beginPath();
      f.arc(cx, cy, R, 0, TAU);
      f.stroke();
      f.restore();
    }

    // faint inner ring
    f.save();
    f.strokeStyle = 'rgba(90, 160, 255, 0.12)';
    f.lineWidth = 1;
    f.beginPath();
    f.arc(cx, cy, R * 0.86, 0, TAU);
    f.stroke();
    f.restore();

    // minute dots (skip positions occupied by hour marks)
    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      const a = angleFor(i / 60);
      const r = R * 0.905;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      f.save();
      f.fillStyle = C.minuteDot;
      f.shadowColor = 'rgba(90, 160, 255, 0.8)';
      f.shadowBlur = 4;
      f.beginPath();
      f.arc(x, y, Math.max(1.1, R * 0.006), 0, TAU);
      f.fill();
      f.restore();
    }

    // hour markers — longer at cardinal positions
    for (let i = 0; i < 12; i++) {
      const cardinal = i % 3 === 0;
      const a = angleFor(i / 12);
      const rOut = R * 0.955;
      const rIn  = cardinal ? R * 0.84 : R * 0.885;
      const w    = cardinal ? Math.max(2.5, R * 0.014) : Math.max(1.5, R * 0.008);
      const x1 = cx + Math.cos(a) * rIn;
      const y1 = cy + Math.sin(a) * rIn;
      const x2 = cx + Math.cos(a) * rOut;
      const y2 = cy + Math.sin(a) * rOut;
      f.save();
      f.strokeStyle = cardinal ? C.cardMark : C.hourMark;
      f.lineWidth = w;
      f.lineCap = 'round';
      f.shadowColor = 'rgba(120, 190, 255, 0.9)';
      f.shadowBlur = cardinal ? 10 : 5;
      f.beginPath();
      f.moveTo(x1, y1);
      f.lineTo(x2, y2);
      f.stroke();
      f.restore();
    }

    // numbers at cardinal positions
    const nums = [[12, 0], [3, 1], [6, 2], [9, 3]];
    f.save();
    f.textAlign = 'center';
    f.textBaseline = 'middle';
    const fontSize = Math.max(14, R * 0.115);
    f.font = `300 ${fontSize}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    f.fillStyle = C.number;
    f.shadowColor = 'rgba(120, 190, 255, 0.8)';
    f.shadowBlur = 8;
    for (const [num, idx] of nums) {
      const a = angleFor(idx / 4);
      const r = R * 0.70;
      f.fillText(String(num), cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    f.restore();
  }

  // ---- hands -------------------------------------------------------------
  function drawHands(now) {
    const ms = now.getMilliseconds();
    const s  = now.getSeconds() + ms / 1000;
    const m  = now.getMinutes() + s / 60;
    const h  = (now.getHours() % 12) + m / 60;

    // second-hand trail: arc fading behind the hand
    const secA = angleFor(s / 60);
    const trailLen = TAU * 0.18; // ~13% of the circle
    const rTrail = R * 0.86;
    ctx.save();
    ctx.lineCap = 'round';
    const segs = 22;
    for (let i = 0; i < segs; i++) {
      const t0 = i / segs;
      const t1 = (i + 1) / segs;
      const a0 = secA - trailLen * t0;
      const a1 = secA - trailLen * t1;
      const alpha = 0.5 * (1 - t0) ** 1.6;
      ctx.strokeStyle = `rgba(255, 77, 94, ${alpha.toFixed(3)})`;
      ctx.lineWidth = Math.max(1.5, R * 0.012) * (1 - t0 * 0.7);
      ctx.beginPath();
      ctx.arc(cx, cy, rTrail, a0, a1);
      ctx.stroke();
    }
    ctx.restore();

    // hour hand
    const hA = angleFor(h / 12);
    const hLen = R * 0.48;
    glowLine(
      cx - Math.cos(hA) * R * 0.08, cy - Math.sin(hA) * R * 0.08,
      cx + Math.cos(hA) * hLen,     cy + Math.sin(hA) * hLen,
      Math.max(4, R * 0.028), C.hourHand, 'rgba(180, 220, 255, 0.9)', R * 0.03
    );

    // minute hand
    const mA = angleFor(m / 60);
    const mL = R * 0.68;
    glowLine(
      cx - Math.cos(mA) * R * 0.10, cy - Math.sin(mA) * R * 0.10,
      cx + Math.cos(mA) * mL,       cy + Math.sin(mA) * mL,
      Math.max(3, R * 0.018), C.minHand, 'rgba(140, 200, 255, 0.9)', R * 0.025
    );

    // second hand with red accent + glow
    const sLen = R * 0.80;
    glowLine(
      cx - Math.cos(secA) * R * 0.14, cy - Math.sin(secA) * R * 0.14,
      cx + Math.cos(secA) * sLen,     cy + Math.sin(secA) * sLen,
      Math.max(1.5, R * 0.007), C.secHand, C.secGlow, R * 0.04
    );

    // counterweight dot on second hand
    ctx.save();
    ctx.fillStyle = C.secHand;
    ctx.shadowColor = C.secGlow;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(cx - Math.cos(secA) * R * 0.14, cy - Math.sin(secA) * R * 0.14,
            Math.max(2.5, R * 0.014), 0, TAU);
    ctx.fill();
    ctx.restore();

    // center hub: glow disc + white core
    ctx.save();
    const hubGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.07);
    hubGrad.addColorStop(0, 'rgba(160, 210, 255, 0.9)');
    hubGrad.addColorStop(1, 'rgba(160, 210, 255, 0)');
    ctx.fillStyle = hubGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.07, 0, TAU);
    ctx.fill();
    ctx.fillStyle = C.center;
    ctx.shadowColor = C.centerGlow;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(3, R * 0.022), 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // ---- digital readout ---------------------------------------------------
  const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const pad = (n) => String(n).padStart(2, '0');
  let lastSec = -1;

  function updateDigital(now) {
    if (now.getSeconds() !== lastSec) {
      lastSec = now.getSeconds();
      dTime.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      dDate.textContent = `${DAYS[now.getDay()]} · ${MONTHS[now.getMonth()]} ${now.getDate()}`;
    }
  }

  // ---- render loop -------------------------------------------------------
  function frame() {
    const now = new Date();
    ctx.clearRect(0, 0, W, H);
    if (faceCache && faceCache.width === canvas.width && faceCache.height === canvas.height) {
      ctx.drawImage(faceCache, 0, 0, W, H);
    } else {
      drawFace();
      ctx.drawImage(faceCache, 0, 0, W, H);
    }
    drawHands(now);
    updateDigital(now);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
