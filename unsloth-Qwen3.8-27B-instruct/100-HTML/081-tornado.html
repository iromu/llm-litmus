<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tornado</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0c10; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
}
window.addEventListener('resize', resize);
resize();

const PARTICLE_COUNT = 400;
const particles = [];

class TornadoParticle {
  constructor() {
    this.reset(true);
  }
  reset(randomY) {
    this.angle = Math.random() * Math.PI * 2;
    this.y = randomY ? Math.random() * H : H + 10;
    this.speed = 2 + Math.random() * 4;
    this.riseSpeed = 0.5 + Math.random() * 1.5;
    this.baseRadius = 20 + Math.random() * 60;
    this.size = 1 + Math.random() * 2.5;
    this.alpha = 0.2 + Math.random() * 0.5;
    this.drift = (Math.random() - 0.5) * 0.3;
  }
  update(dt) {
    this.angle += this.speed * dt;
    this.y -= this.riseSpeed;
    this.x = this.drift;
    if (this.y < -10 || this.y > H + 20) {
      this.reset(false);
    }
  }
  draw(ctx, time) {
    // Funnel shape: radius shrinks as y decreases (narrower at top)
    const progress = 1 - (this.y / H); // 0 at bottom, 1 at top
    const funnelWidth = 150 * (1 - progress * 0.85);
    const wobble = Math.sin(time * 3 + this.y * 0.01) * 15;
    const radius = this.baseRadius * (funnelWidth / 150) + wobble;

    const x = cx + Math.cos(this.angle) * radius;
    const y = this.y;

    const brightness = 150 + Math.floor(Math.random() * 50);
    ctx.fillStyle = `rgba(${brightness}, ${brightness}, ${brightness + 10}, ${this.alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new TornadoParticle());
}

let lastTime = performance.now();
function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 12, 16, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Ground mist
  const mistGrad = ctx.createRadialGradient(cx, H, 0, cx, H, W * 0.4);
  mistGrad.addColorStop(0, 'rgba(80, 80, 90, 0.05)');
  mistGrad.addColorStop(1, 'rgba(80, 80, 90, 0)');
  ctx.fillStyle = mistGrad;
  ctx.fillRect(0, H - 100, W, 100);

  for (const p of particles) {
    p.update(dt);
    p.draw(ctx, now / 1000);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0c10';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(animate);
</script>
</body>
</html>
