<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Double Helix — Bioluminescent Visualization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04081a;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .hud {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(140, 200, 255, 0.45);
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(80, 160, 255, 0.35);
  }

  .title {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180, 220, 255, 0.55);
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    text-shadow: 0 0 18px rgba(100, 180, 255, 0.5), 0 0 40px rgba(255, 100, 220, 0.25);
  }
</style>
</head>
<body>
<canvas id="c" aria-label="3D DNA double helix visualization"></canvas>
<header class="title">Deoxyribonucleic Acid</header>
<footer class="hud">move cursor to twist the helix</footer>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Helix parameters ----------
  const NUM_PAIRS   = 46;      // base pairs along the axis
  const PITCH       = 0.42;    // radians of twist per pair index (spiral tightness)
  const RADIUS      = () => Math.min(W, H) * 0.24;   // helix radius, responsive
  const SPREAD      = () => Math.min(H * 0.72, W * 0.9); // vertical span of helix
  const TILT        = 0.35;    // slight camera tilt for depth
  const ROT_SPEED   = 0.0035;  // passive rotation speed (rad/frame @60fps)

  // Perspective projection
  const CAM_DIST    = 620;     // camera distance in projected units
  const FOCAL       = 520;     // focal length for perspective

  // Mouse-driven twist offset
  let mouseX = 0.5;            // normalized 0..1
  let targetTwist = 0;
  let twist = 0;               // smoothed

  window.addEventListener("mousemove", (e) => {
    mouseX = e.clientX / W;
  });
  window.addEventListener("touchmove", (e) => {
    if (e.touches.length > 0) mouseX = e.touches[0].clientX / W;
  }, { passive: true });

  // Nucleotide data: each base pair has two spheres + a bond
  // Colors cycle through HSL along the helix for bioluminescent variety
  const bases = [];
  for (let i = 0; i < NUM_PAIRS; i++) {
    bases.push({
      t: i / (NUM_PAIRS - 1),          // 0..1 along axis
      hueA: (i * 7.5) % 360,           // strand A hue drift
      hueB: (i * 7.5 + 180) % 360,     // strand B opposite hue
      phase: Math.random() * Math.PI * 2, // subtle per-base shimmer phase
    });
  }

  // Precompute a soft radial glow sprite for nucleotides (offscreen canvas)
  const GLOW_SIZE = 128;
  const glowCanvas = document.createElement("canvas");
  glowCanvas.width = glowCanvas.height = GLOW_SIZE;
  const gctx = glowCanvas.getContext("2d");

  function makeGlowSprite(hue, sat, light) {
    const c = document.createElement("canvas");
    c.width = c.height = GLOW_SIZE;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(GLOW_SIZE/2, GLOW_SIZE/2, 0, GLOW_SIZE/2, GLOW_SIZE/2, GLOW_SIZE/2);
    grad.addColorStop(0.0, `hsla(${hue}, ${sat}%, ${Math.min(light + 30, 95)}%, 1)`);
    grad.addColorStop(0.15, `hsla(${hue}, ${sat}%, ${light + 15}%, 0.85)`);
    grad.addColorStop(0.4, `hsla(${hue}, ${sat}%, ${light}%, 0.35)`);
    grad.addColorStop(0.7, `hsla(${hue}, ${sat}%, ${light - 10}%, 0.08)`);
    grad.addColorStop(1.0, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);
    return c;
  }

  // Build a palette of pre-rendered glow sprites across the hue range we use.
  // Strand A: cyan-blue family (hue 180-260). Strand B: pink-magenta (hue 300-360/0-40).
  const SPRITES_A = [];
  const SPRITES_B = [];
  for (let h = 0; h < 360; h += 15) {
    SPRITES_A.push(makeGlowSprite(h, 95, 62));
    SPRITES_B.push(makeGlowSprite(h, 90, 60));
  }
  function spriteFor(sprites, hue) {
    return sprites[Math.round(((hue % 360) + 360) % 360 / 15) % sprites.length];
  }

  // ---------- Projection helpers ----------
  // World coords: x right, y up, z toward viewer (positive z = closer)
  function project(x, y, z) {
    // Apply a slight tilt around X axis so the helix leans back
    const cy = y * Math.cos(TILT) - z * Math.sin(TILT);
    const cz = y * Math.sin(TILT) + z * Math.cos(TILT);
    const scale = FOCAL / (FOCAL + CAM_DIST - cz);
    return {
      sx: W / 2 + x * scale,
      sy: H / 2 - cy * scale,
      scale,
      depth: cz // larger = closer to camera
    };
  }

  // ---------- Render loop ----------
  let time = 0;
  let lastFrame = performance.now();

  function frame(now) {
    const dt = Math.min((now - lastFrame) / 16.667, 3); // normalized to 60fps steps
    lastFrame = now;
    time += dt;

    // Smooth mouse twist
    targetTwist = (mouseX - 0.5) * Math.PI * 1.2; // -0.6π .. +0.6π
    twist += (targetTwist - twist) * 0.06 * dt;

    // Trailing fade: paint semi-transparent dark blue over previous frame
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(4, 8, 26, 0.28)";
    ctx.fillRect(0, 0, W, H);

    const rot = time * ROT_SPEED * 60 * 0.016; // accumulated rotation
    const R = RADIUS();
    const spread = SPREAD();

    // Compute all projected points first so we can sort by depth
    const nodes = []; // {x, y, size, sprite, alpha, kind, depth}
    const bonds = []; // {x1,y1,x2,y2,alpha,depth,hue}
    const backboneA = [];
    const backboneB = [];

    for (let i = 0; i < NUM_PAIRS; i++) {
      const b = bases[i];
      const angleBase = i * PITCH + rot + twist;
      const yWorld = (b.t - 0.5) * spread;

      // Strand A at angle, strand B at angle + π
      const ax = Math.cos(angleBase) * R;
      const az = Math.sin(angleBase) * R;
      const bx = Math.cos(angleBase + Math.PI) * R;
      const bz = Math.sin(angleBase + Math.PI) * R;

      const pa = project(ax, yWorld, az);
      const pb = project(bx, yWorld, bz);

      // Depth-based sizing & alpha
      const depthNormA = (pa.depth + R) / (2 * R); // ~0 far .. ~1 near
      const depthNormB = (pb.depth + R) / (2 * R);

      const baseSize = 14 * pa.scale;
      const baseSizeB = 14 * pb.scale;

      const shimmer = 0.85 + 0.15 * Math.sin(time * 0.05 + b.phase);

      nodes.push({
        x: pa.sx, y: pa.sy,
        size: baseSize * (0.6 + 0.55 * depthNormA),
        sprite: spriteFor(SPRITES_A, b.hueA + rot * 20),
        alpha: (0.35 + 0.65 * depthNormA) * shimmer,
        core: `hsla(${(b.hueA + rot * 20) % 360}, 100%, 88%, ${(0.5 + 0.5 * depthNormA) * shimmer})`,
        depth: pa.depth
      });
      nodes.push({
        x: pb.sx, y: pb.sy,
        size: baseSizeB * (0.6 + 0.55 * depthNormB),
        sprite: spriteFor(SPRITES_B, b.hueB + rot * 20),
        alpha: (0.35 + 0.65 * depthNormB) * shimmer,
        core: `hsla(${(b.hueB + rot * 20) % 360}, 100%, 86%, ${(0.5 + 0.5 * depthNormB) * shimmer})`,
        depth: pb.depth
      });

      // Base-pair bond (horizontal rung)
      const bondAlpha = 0.12 + 0.45 * ((depthNormA + depthNormB) / 2);
      bonds.push({
        x1: pa.sx, y1: pa.sy, x2: pb.sx, y2: pb.sy,
        alpha: bondAlpha,
        depth: (pa.depth + pb.depth) / 2,
        hue: (b.hueA + b.hueB) / 2 % 360
      });

      backboneA.push(pa);
      backboneB.push(pb);
    }

    // Sort everything by depth (far first)
    nodes.sort((a, b) => a.depth - b.depth);
    bonds.sort((a, b) => a.depth - b.depth);

    // Additive blending for glow
    ctx.globalCompositeOperation = "lighter";

    // Draw bonds (rungs) with glow
    for (const bd of bonds) {
      const grad = ctx.createLinearGradient(bd.x1, bd.y1, bd.x2, bd.y2);
      grad.addColorStop(0, `hsla(200, 100%, 70%, ${bd.alpha})`);
      grad.addColorStop(0.5, `hsla(${(bd.hue + 200) % 360}, 100%, 75%, ${bd.alpha * 0.7})`);
      grad.addColorStop(1, `hsla(320, 100%, 70%, ${bd.alpha})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(bd.x1, bd.y1);
      ctx.lineTo(bd.x2, bd.y2);
      ctx.stroke();

      // Soft glow pass on the bond
      ctx.strokeStyle = `hsla(${(bd.hue + 200) % 360}, 100%, 65%, ${bd.alpha * 0.3})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(bd.x1, bd.y1);
      ctx.lineTo(bd.x2, bd.y2);
      ctx.stroke();
    }

    // Draw backbone strands as connected polylines (far-to-near segments)
    function drawBackbone(pts, hueOffset) {
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i], p1 = pts[i + 1];
        const segDepth = (p0.depth + p1.depth) / 2;
        const dNorm = (segDepth + R) / (2 * R);
        const alpha = 0.15 + 0.55 * dNorm;
        const hue = (hueOffset + i * 4) % 360;

        // Glow layer
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha * 0.35})`;
        ctx.lineWidth = 5 * ((p0.scale + p1.scale) / 2);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p0.sx, p0.sy);
        ctx.lineTo(p1.sx, p1.sy);
        ctx.stroke();

        // Core line
        ctx.strokeStyle = `hsla(${hue}, 95%, 72%, ${alpha})`;
        ctx.lineWidth = 1.8 * ((p0.scale + p1.scale) / 2);
        ctx.beginPath();
        ctx.moveTo(p0.sx, p0.sy);
        ctx.lineTo(p1.sx, p1.sy);
        ctx.stroke();
      }
    }
    drawBackbone(backboneA, 200);
    drawBackbone(backboneB, 320);

    // Draw nucleotide spheres (glow sprite + bright core)
    for (const n of nodes) {
      const s = n.size;
      // Glow sprite
      ctx.globalAlpha = n.alpha * 0.9;
      ctx.drawImage(n.sprite, n.x - s, n.y - s, s * 2, s * 2);
      // Bright core
      ctx.globalAlpha = 1;
      const coreR = s * 0.32;
      const cg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, coreR);
      cg.addColorStop(0, n.core);
      cg.addColorStop(1, "transparent");
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(n.x, n.y, coreR, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(frame);
  }

  // Initial clear
  ctx.fillStyle = "#04081a";
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
