<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lissajous</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #050508; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const A = 3; // x frequency
const B = 4; // y frequency
const POINTS = 600;

function drawLissajous(time) {
  const amplitude = Math.min(W, H) * 0.35;
  const phase = time * 0.3;

  for (let i = 0; i < POINTS; i++) {
    const t = (i / POINTS) * Math.PI * 2;
    const x = cx + amplitude * Math.sin(A * t + phase);
    const y = cy + amplitude * Math.sin(B * t);

    const nextT = ((i + 1) / POINTS) * Math.PI * 2;
    const nx = cx + amplitude * Math.sin(A * nextT + phase);
    const ny = cy + amplitude * Math.sin(B * nextT);

    const hue = (i / POINTS * 360 + time * 30) % 360;
    const alpha = 0.3 + 0.7 * (i / POINTS);

    ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
    ctx.lineWidth = 1.5 + (i / POINTS) * 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(nx, ny);
    ctx.stroke();
  }

  // Draw a bright dot at the leading edge
  const leadT = Math.PI * 2;
  const lx = cx + amplitude * Math.sin(A * leadT + phase);
  const ly = cy + amplitude * Math.sin(B * leadT);
  const leadHue = (time * 30) % 360;

  const grad = ctx.createRadialGradient(lx, ly, 0, lx, ly, 12);
  grad.addColorStop(0, `hsla(${leadHue}, 100%, 80%, 0.9)`);
  grad.addColorStop(0.5, `hsla(${leadHue}, 100%, 60%, 0.4)`);
  grad.addColorStop(1, `hsla(${leadHue}, 100%, 50%, 0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(lx, ly, 12, 0, Math.PI * 2);
  ctx.fill();
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(5, 5, 8, 0.06)';
  ctx.fillRect(0, 0, W, H);

  drawLissajous(time);
  requestAnimationFrame(animate);
}

ctx.fillStyle = '#050508';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
