<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kaleidoscope Flowers — Botanical Psychedelia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0518;
    touch-action: none;
    cursor: crosshair;
  }

  canvas {
    display: block;
    position: fixed;
    inset: 0;
  }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(216, 180, 255, 0.55);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    animation: hintFade 3s ease-in-out infinite alternate;
    z-index: 10;
    text-shadow: 0 0 12px rgba(180, 120, 255, 0.4);
    white-space: nowrap;
  }

  @keyframes hintFade {
    from { opacity: 0.35; }
    to   { opacity: 0.75; }
  }
</style>
</head>
<body>
<canvas id="garden"></canvas>
<p class="hint">click anywhere to plant a flower</p>

<script>
(() => {
  'use strict';

  // ─────────────────────────────────────────────
  // Canvas setup
  // ─────────────────────────────────────────────
  const canvas = document.getElementById('garden');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ─────────────────────────────────────────────
  // Flower model
  // ─────────────────────────────────────────────
  const MAX_FLOWERS = 25;
  const PETALS = 8;
  const flowers = [];

  // Deterministic pseudo-random from seed for reproducible variety
  function mulberry32(seed) {
    let s = seed >>> 0;
    return () => {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let nextSeed = 1;

  function createFlower(x, y) {
    const rnd = mulberry32(nextSeed++ * 7919 + 13);
    const baseHue = rnd() * 360;
    const size = 40 + rnd() * 55;            // petal length range
    const hueSpeed = 0.15 + rnd() * 0.35;    // degrees per frame-ish
    const bloomSpeed = 0.008 + rnd() * 0.012;
    const bloomPhase = rnd() * Math.PI * 2;
    const rotSpeed = (rnd() - 0.5) * 0.004;
    const driftAmpX = 12 + rnd() * 30;
    const driftAmpY = 8 + rnd() * 22;
    const driftFreqX = 0.0004 + rnd() * 0.0006;
    const driftFreqY = 0.0005 + rnd() * 0.0008;
    const driftPhaseX = rnd() * Math.PI * 2;
    const driftPhaseY = rnd() * Math.PI * 2;
    const petalWidthFactor = 0.55 + rnd() * 0.35;
    const innerRing = rnd() > 0.4;           // some flowers get a second smaller ring
    const corePulseSpeed = 0.02 + rnd() * 0.02;
    const corePulsePhase = rnd() * Math.PI * 2;

    return {
      x, y,
      baseX: x, baseY: y,
      size,
      baseHue,
      hueShift: 0,
      hueSpeed,
      bloomPhase,
      bloomSpeed,
      rotation: rnd() * Math.PI * 2,
      rotSpeed,
      driftAmpX, driftAmpY,
      driftFreqX, driftFreqY,
      driftPhaseX, driftPhaseY,
      petalWidthFactor,
      innerRing,
      corePulseSpeed,
      corePulsePhase,
      born: performance.now(),
      spawnScale: 0,
    };
  }

  function addFlower(x, y) {
    if (flowers.length >= MAX_FLOWERS) {
      // recycle the oldest
      flowers.shift();
    }
    flowers.push(createFlower(x, y));
  }

  // Seed the garden with a few flowers on load
  function seedGarden() {
    const n = 5;
    for (let i = 0; i < n; i++) {
      const x = W * (0.2 + 0.6 * (i / (n - 1))) + (Math.random() - 0.5) * 80;
      const y = H * (0.25 + 0.5 * Math.sin(i * 1.3)) + (Math.random() - 0.5) * 80;
      const f = createFlower(x, y);
      f.spawnScale = 1; // pre-bloomed so the opening scene isn't empty
      f.born = performance.now() - 5000;
      flowers.push(f);
    }
  }
  seedGarden();

  // ─────────────────────────────────────────────
  // Petal drawing — bezier curves, 8-fold symmetry
  // ─────────────────────────────────────────────
  function drawPetal(ctx, len, widthFactor, hue, sat, light, alpha) {
    // Petal drawn pointing up (-y direction), origin at flower center.
    // Two cubic beziers form the outline: base → tip → back to base.
    const w = len * widthFactor;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    // Left edge: curve out then sweep to tip
    ctx.bezierCurveTo(
      -w * 0.9, -len * 0.25,
      -w * 0.75, -len * 0.72,
      0, -len
    );
    // Right edge: mirror back down
    ctx.bezierCurveTo(
      w * 0.75, -len * 0.72,
      w * 0.9, -len * 0.25,
      0, 0
    );
    ctx.closePath();

    // Radial gradient fill — soft glow from base to tip
    const grad = ctx.createRadialGradient(0, -len * 0.15, 0, 0, -len * 0.5, len);
    grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 22}%, ${alpha})`);
    grad.addColorStop(0.45, `hsla(${hue + 18}, ${sat}%, ${light}%, ${alpha * 0.85})`);
    grad.addColorStop(0.85, `hsla(${hue + 40}, ${sat - 10}%, ${light - 12}%, ${alpha * 0.4})`);
    grad.addColorStop(1, `hsla(${hue + 55}, ${sat - 20}%, ${light - 20}%, 0)`);
    ctx.fillStyle = grad;
    ctx.fill();

    // Delicate vein line down the middle
    ctx.beginPath();
    ctx.moveTo(0, -len * 0.08);
    ctx.quadraticCurveTo(w * 0.06, -len * 0.5, 0, -len * 0.92);
    ctx.strokeStyle = `hsla(${hue + 30}, ${sat}%, ${light + 30}%, ${alpha * 0.25})`;
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  function drawFlower(f, now) {
    const age = now - f.born;
    // Spawn scale-in over ~1.2s with easing
    const spawnT = Math.min(age / 1200, 1);
    f.spawnScale = 1 - Math.pow(1 - spawnT, 3);

    // Sine-based blooming: petals open and close
    const bloom = 0.55 + 0.45 * Math.sin(now * f.bloomSpeed + f.bloomPhase);
    const petalLen = f.size * f.spawnScale * (0.45 + 0.55 * bloom);
    const petalW = f.petalWidthFactor * (0.7 + 0.3 * bloom);

    // Hue shifts slowly over time
    f.hueShift += f.hueSpeed;
    const hue = (f.baseHue + f.hueShift) % 360;

    // Drift position via sine modulation around base point
    const dx = Math.sin(now * f.driftFreqX + f.driftPhaseX) * f.driftAmpX;
    const dy = Math.cos(now * f.driftFreqY + f.driftPhaseY) * f.driftAmpY;
    const px = f.baseX + dx;
    const py = f.baseY + dy;

    // Slow rotation
    f.rotation += f.rotSpeed;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(f.rotation);

    // Outer petal ring — 8 petals with slight hue offset each
    for (let i = 0; i < PETALS; i++) {
      const angle = (i / PETALS) * Math.PI * 2;
      ctx.save();
      ctx.rotate(angle);
      const petalHue = (hue + i * 8) % 360;
      drawPetal(ctx, petalLen, petalW, petalHue, 72, 58, 0.55);
      ctx.restore();
    }

    // Inner ring — smaller, brighter, counter-rotating slightly
    if (f.innerRing) {
      const innerLen = petalLen * 0.55;
      const innerW = petalW * 0.8;
      for (let i = 0; i < PETALS; i++) {
        const angle = (i / PETALS) * Math.PI * 2 + Math.PI / PETALS;
        ctx.save();
        ctx.rotate(angle);
        const innerHue = (hue + 120 + i * 6) % 360;
        drawPetal(ctx, innerLen, innerW, innerHue, 80, 68, 0.5);
        ctx.restore();
      }
    }

    // Glowing core — concentric circles
    const pulse = 0.8 + 0.2 * Math.sin(now * f.corePulseSpeed + f.corePulsePhase);
    const coreR = f.size * 0.16 * f.spawnScale * pulse;

    // Outer glow halo
    const haloGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 4);
    haloGrad.addColorStop(0, `hsla(${(hue + 60) % 360}, 90%, 80%, 0.35)`);
    haloGrad.addColorStop(0.5, `hsla(${(hue + 90) % 360}, 80%, 60%, 0.12)`);
    haloGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(0, 0, coreR * 4, 0, Math.PI * 2);
    ctx.fill();

    // Concentric core rings
    for (let r = 3; r >= 1; r--) {
      const rr = coreR * (r / 3);
      const ringAlpha = 0.25 + 0.2 * (r / 3);
      const ringHue = (hue + 40 + r * 20) % 360;
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${ringHue}, 85%, ${70 + r * 8}%, ${ringAlpha})`;
      ctx.fill();
    }

    // Bright center dot
    ctx.beginPath();
    ctx.arc(0, 0, coreR * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${(hue + 50) % 360}, 100%, 92%, 0.9)`;
    ctx.fill();

    ctx.restore();
  }

  // ─────────────────────────────────────────────
  // Background — dark purple with trailing fade
  // ─────────────────────────────────────────────
  function drawBackground() {
    // Semi-transparent fill creates the trailing fade effect
    ctx.fillStyle = 'rgba(13, 5, 24, 0.18)';
    ctx.fillRect(0, 0, W, H);
  }

  // Subtle vignette overlay (drawn once per frame, very faint)
  function drawVignette() {
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'transparent');
    vg.addColorStop(1, 'rgba(5, 0, 15, 0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ─────────────────────────────────────────────
  // Render loop
  // ─────────────────────────────────────────────
  let lastTime = 0;

  function frame(now) {
    const dt = now - lastTime;
    lastTime = now;

    drawBackground();

    // Draw flowers back-to-front (oldest first, newest on top)
    for (const f of flowers) {
      drawFlower(f, now);
    }

    drawVignette();

    requestAnimationFrame(frame);
  }

  // Initial solid clear so the first frame isn't transparent
  ctx.fillStyle = '#0d0518';
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);

  // ─────────────────────────────────────────────
  // Interaction — click / tap to plant
  // ─────────────────────────────────────────────
  function plant(e) {
    let x, y;
    if (e.touches && e.touches.length > 0) {
      x = e.touches[0].clientX;
      y = e.touches[0].clientY;
    } else {
      x = e.clientX;
      y = e.clientY;
    }
    addFlower(x, y);
  }

  canvas.addEventListener('pointerdown', plant);
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    plant(e);
  }, { passive: false });

  // Fade the hint after first interaction
  const hintEl = document.querySelector('.hint');
  let interacted = false;
  function dismissHint() {
    if (interacted) return;
    interacted = true;
    hintEl.style.transition = 'opacity 1.5s ease';
    hintEl.style.opacity = '0';
    setTimeout(() => hintEl.remove(), 1600);
  }
  canvas.addEventListener('pointerdown', dismissHint, { once: true });
  canvas.addEventListener('touchstart', dismissHint, { once: true, passive: true });
})();
</script>
</body>
</html>
