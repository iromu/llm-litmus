<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy — Deep Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    cursor: crosshair;
  }

  .hud {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180, 190, 220, 0.45);
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    transition: opacity 1.2s ease;
  }

  .hud.hidden { opacity: 0; }

  .title {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(200, 210, 240, 0.35);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    transition: opacity 1.2s ease;
  }

  .title.hidden { opacity: 0; }

  .flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(255, 240, 220, 0.12) 0%, transparent 60%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .flash.on { opacity: 1; transition: opacity 0.15s ease; }
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<div class="title" id="title">Spiral Galaxy</div>
<div class="hud" id="hud">click to regenerate &middot; deep field survey</div>
<div class="flash" id="flash"></div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('galaxy');
  const ctx = canvas.getContext('2d');
  const flashEl = document.getElementById('flash');
  const hudEl = document.getElementById('hud');
  const titleEl = document.getElementById('title');

  let W, H, CX, CY, SCALE;
  let stars = [];
  let bgStars = [];
  let galaxyAngle = 0;
  let lastTime = 0;
  let seed = Math.random() * 1e9;

  // --- Seeded PRNG (mulberry32) for reproducible regeneration ---
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  let rng = mulberry32(seed);
  function rand() { return rng(); }
  function randRange(min, max) { return min + rand() * (max - min); }
  function gaussRand() {
    // Box-Muller
    let u = 1 - rand(), v = 1 - rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // --- Color palettes ---
  // Core: warm yellow/orange/white
  const CORE_COLORS = [
    [255, 244, 214], [255, 230, 180], [255, 214, 150],
    [255, 255, 240], [255, 200, 130], [255, 248, 230]
  ];
  // Arms: cool blue/purple/violet with some pink
  const ARM_COLORS = [
    [160, 180, 255], [140, 160, 255], [180, 150, 255],
    [200, 170, 255], [130, 150, 240], [220, 160, 230],
    [170, 200, 255], [150, 140, 255], [210, 180, 255],
    [120, 140, 230], [190, 150, 240], [255, 200, 220]
  ];
  // Transition zone
  const TRANS_COLORS = [
    [220, 210, 240], [200, 190, 250], [240, 220, 200],
    [190, 180, 240], [230, 210, 190]
  ];

  function pickColor(t) {
    // t: 0 = core, 1 = outer arm
    if (t < 0.25) return CORE_COLORS[(rand() * CORE_COLORS.length) | 0];
    if (t < 0.45) return TRANS_COLORS[(rand() * TRANS_COLORS.length) | 0];
    return ARM_COLORS[(rand() * ARM_COLORS.length) | 0];
  }

  // --- Galaxy parameters (randomized per generation) ---
  let params = {};

  function generateParams() {
    params = {
      numArms: 4,
      armTightness: randRange(0.28, 0.42),   // logarithmic spiral tightness
      armScatter: randRange(0.12, 0.22),      // gaussian scatter around arms
      bulgeRadius: randRange(0.06, 0.10),     // fraction of R_MAX
      diskRadius: 1.0,                        // normalized
      starCount: Math.min(6500, Math.max(5000, (W * H / 200) | 0)),
      rotationSpeed: randRange(0.015, 0.035), // rad/s base (outer edge)
      tilt: randRange(-0.35, 0.35),           // perspective tilt factor
      coreBrightness: randRange(0.8, 1.3),
      hueShift: randRange(-0.05, 0.05)
    };
  }

  // --- Star generation ---
  function generateStars() {
    stars = [];
    const count = params.starCount;
    const R_MAX = SCALE; // max radius in px

    for (let i = 0; i < count; i++) {
      // Radial distribution: dense core, exponential falloff
      // Use r = R_MAX * pow(rand, power) for concentration toward center
      let rNorm;
      const roll = rand();
      if (roll < 0.18) {
        // Bulge: very concentrated
        rNorm = Math.abs(gaussRand()) * params.bulgeRadius * 0.6;
      } else if (roll < 0.55) {
        // Inner disk
        rNorm = 0.08 + Math.pow(rand(), 1.4) * 0.45;
      } else {
        // Outer disk
        rNorm = 0.35 + Math.pow(rand(), 0.9) * 0.65;
      }
      rNorm = Math.min(rNorm, 1.0);

      // Spiral arm assignment
      const armIndex = (rand() * params.numArms) | 0;
      const armAngleOffset = (armIndex / params.numArms) * Math.PI * 2;

      // Logarithmic spiral: theta = armAngleOffset + tightness * ln(r/r0)
      const r0 = 0.05;
      const logR = Math.log(Math.max(rNorm, 0.02) / r0);
      const spiralAngle = armAngleOffset + params.armTightness * logR * 4.5;

      // Scatter: more scatter for outer stars, less for inner
      const scatterAmount = params.armScatter * (0.5 + rNorm * 0.8);
      const scatter = gaussRand() * scatterAmount;

      // Some stars are not in arms (field stars)
      const inArm = rand() < 0.78;
      const angle = inArm ? spiralAngle + scatter : rand() * Math.PI * 2;

      // Position
      const rPx = rNorm * R_MAX;
      const x = Math.cos(angle) * rPx;
      const y = Math.sin(angle) * rPx;

      // Differential rotation: angular velocity ~ 1/sqrt(r) or flat curve
      // Flat rotation curve: omega = v_c / r -> inner rotates faster
      const distFromCenter = Math.sqrt(x * x + y * y) / R_MAX;
      const omega = params.rotationSpeed / Math.max(distFromCenter, 0.05);

      // Star size: mostly small, few large
      let size;
      const sizeRoll = rand();
      if (sizeRoll < 0.7) size = randRange(0.4, 1.0);
      else if (sizeRoll < 0.92) size = randRange(1.0, 1.8);
      else if (sizeRoll < 0.98) size = randRange(1.8, 2.8);
      else size = randRange(2.8, 4.5);

      // Core stars slightly larger on average
      if (rNorm < 0.15) size *= randRange(1.0, 1.4);

      // Color based on distance from center
      const colorT = Math.min(1, rNorm / 0.5);
      const col = pickColor(colorT);

      // Twinkle parameters
      const twinkleSpeed = randRange(0.5, 3.0);
      const twinklePhase = rand() * Math.PI * 2;
      const twinkleAmp = randRange(0.15, 0.55);

      // Base brightness
      let brightness = randRange(0.4, 1.0);
      if (rNorm < 0.12) brightness = Math.min(1.2, brightness * 1.3);

      // Depth layer: 0=far, 1=near (affects rendering order and size)
      const depth = rand();

      stars.push({
        x, y,
        angle,
        r: rPx,
        omega,
        size,
        col,
        twinkleSpeed,
        twinklePhase,
        twinkleAmp,
        brightness,
        depth
      });
    }

    // Sort by depth for painter's algorithm (far first)
    stars.sort((a, b) => a.depth - b.depth);
  }

  // --- Background stars (static, non-rotating) ---
  function generateBgStars() {
    bgStars = [];
    const count = Math.min(400, (W * H / 4000) | 0);
    for (let i = 0; i < count; i++) {
      bgStars.push({
        x: rand() * W,
        y: rand() * H,
        size: randRange(0.3, 1.2),
        brightness: randRange(0.1, 0.4),
        twinkleSpeed: randRange(0.3, 1.5),
        twinklePhase: rand() * Math.PI * 2
      });
    }
  }

  // --- Resize ---
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2;
    CY = H / 2;
    SCALE = Math.min(W, H) * 0.48;
    generateStars();
    generateBgStars();
  }

  // --- Render ---
  function render(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    galaxyAngle += params.rotationSpeed * dt * 0.3;

    // Trailing fade: semi-transparent black overlay
    ctx.fillStyle = 'rgba(2, 3, 8, 0.18)';
    ctx.fillRect(0, 0, W, H);

    // Background stars
    for (const s of bgStars) {
      const tw = 0.5 + 0.5 * Math.sin(time * 0.001 * s.twinkleSpeed + s.twinklePhase);
      const alpha = s.brightness * (0.5 + 0.5 * tw);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#c8d0e8';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Core glow (radial gradient)
    const coreR = SCALE * 0.35;
    const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR);
    const cb = params.coreBrightness;
    grad.addColorStop(0, `rgba(255, 240, 210, ${0.25 * cb})`);
    grad.addColorStop(0.2, `rgba(255, 220, 170, ${0.12 * cb})`);
    grad.addColorStop(0.5, `rgba(200, 160, 255, ${0.04 * cb})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(CX, CY, coreR, 0, Math.PI * 2);
    ctx.fill();

    // Stars
    const cosG = Math.cos(galaxyAngle);
    const sinG = Math.sin(galaxyAngle);
    const tiltFactor = 1 - Math.abs(params.tilt) * 0.4;

    for (const s of stars) {
      // Rotate star position by its own differential angle
      const totalAngle = s.angle + s.omega * time * 0.001 * 0.5;
      const sx = Math.cos(totalAngle) * s.r;
      const sy = Math.sin(totalAngle) * s.r * tiltFactor;

      // Apply global slow rotation
      const rx = sx * cosG - sy * sinG;
      const ry = sx * sinG + sy * cosG;

      const px = CX + rx;
      const py = CY + ry;

      // Skip off-screen
      if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue;

      // Twinkle
      const tw = 0.5 + 0.5 * Math.sin(time * 0.001 * s.twinkleSpeed + s.twinklePhase);
      const alpha = s.brightness * (1 - s.twinkleAmp + s.twinkleAmp * tw);
      const sz = s.size * (0.85 + 0.15 * tw);

      // Color with slight depth dimming
      const depthDim = 0.5 + 0.5 * s.depth;
      const r = (s.col[0] * depthDim) | 0;
      const g = (s.col[1] * depthDim) | 0;
      const b = (s.col[2] * depthDim) | 0;

      ctx.globalAlpha = Math.min(1, alpha);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.arc(px, py, sz, 0, Math.PI * 2);
      ctx.fill();

      // Glow for larger/brighter stars
      if (sz > 1.5 && alpha > 0.5) {
        ctx.globalAlpha = alpha * 0.15;
        ctx.beginPath();
        ctx.arc(px, py, sz * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Central bright point
    ctx.globalAlpha = 0.9;
    const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, SCALE * 0.06);
    cg.addColorStop(0, 'rgba(255, 255, 240, 0.9)');
    cg.addColorStop(0.3, 'rgba(255, 230, 180, 0.4)');
    cg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(CX, CY, SCALE * 0.06, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    requestAnimationFrame(render);
  }

  // --- Regeneration ---
  function regenerate() {
    seed = Math.random() * 1e9;
    rng = mulberry32(seed);
    generateParams();
    galaxyAngle = 0;
    generateStars();

    // Flash effect
    flashEl.classList.add('on');
    setTimeout(() => flashEl.classList.remove('on'), 200);

    // Clear canvas fully
    ctx.fillStyle = '#020308';
    ctx.fillRect(0, 0, W, H);
  }

  // --- Events ---
  canvas.addEventListener('click', regenerate);
  window.addEventListener('resize', () => { resize(); });

  // Hide HUD after 6s
  setTimeout(() => { hudEl.classList.add('hidden'); titleEl.classList.add('hidden'); }, 6000);

  // --- Init ---
  resize();
  ctx.fillStyle = '#020308';
  ctx.fillRect(0, 0, W, H);
  lastTime = performance.now();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
