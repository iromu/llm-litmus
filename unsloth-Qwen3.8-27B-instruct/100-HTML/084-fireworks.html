<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 11px; color: rgba(255,255,255,0.25);
  letter-spacing: 3px; pointer-events: none; user-select: none; text-transform: uppercase;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">click to launch</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const MAX_PARTICLES = 2000;
let particles = [];
let lastLaunch = 0;
let nextLaunchInterval = 1500 + Math.random() * 2000;

class FireworkParticle {
  constructor(x, y, hue) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.gravity = 0.05 + Math.random() * 0.03;
    this.drag = 0.98 - Math.random() * 0.02;
    this.life = 1;
    this.decay = 0.008 + Math.random() * 0.015;
    this.size = 1.5 + Math.random() * 2;
    this.hue = hue + (Math.random() - 0.5) * 30;
    this.trail = [];
    this.maxTrail = 8;
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.vx *= this.drag;
    this.vy *= this.drag;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = i / this.trail.length;
      const alpha = this.life * t * 0.5;
      ctx.fillStyle = `hsla(${this.hue}, 90%, ${50 + 30 * t}%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, this.size * t, 0, Math.PI * 2);
      ctx.fill();
    }
    // Head
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
    grad.addColorStop(0, `hsla(${this.hue}, 100%, 80%, ${this.life})`);
    grad.addColorStop(0.5, `hsla(${this.hue}, 90%, 60%, ${this.life * 0.5})`);
    grad.addColorStop(1, `hsla(${this.hue}, 80%, 40%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function explode(x, y) {
  const hue = Math.random() * 360;
  const count = 50 + Math.floor(Math.random() * 80);
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    particles.push(new FireworkParticle(x, y, hue));
  }
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  explode(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  for (const t of e.touches) {
    explode(t.clientX - rect.left, t.clientY - rect.top);
  }
});

let time = 0;
function animate() {
  time += 16;

  // Auto-launch
  if (time - lastLaunch > nextLaunchInterval) {
    explode(W * 0.2 + Math.random() * W * 0.6, H * 0.1 + Math.random() * H * 0.4);
    lastLaunch = time;
    nextLaunchInterval = 1500 + Math.random() * 2000;
  }

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 10, 26, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
