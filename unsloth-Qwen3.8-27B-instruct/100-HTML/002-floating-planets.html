<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmos — Orbital Meditation</title>
<style>
  :root {
    --orbit-duration: 40s;
    --scene-size: min(90vmin, 820px);
    --glow-purple: rgba(168, 120, 255, 0.55);
    --bg-deep: #05030f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
  }

  /* ---------- Canvas starfield ---------- */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  /* ---------- Scene wrapper (3D perspective) ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: grid;
    place-items: center;
    perspective: 1200px;
  }

  .scene {
    position: relative;
    width: var(--scene-size);
    height: var(--scene-size);
    transform-style: preserve-3d;
    transform: rotateX(12deg);
  }

  /* ---------- Central title ---------- */
  .cosmos-title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 200;
    font-size: clamp(2rem, 7vmin, 4.5rem);
    letter-spacing: clamp(0.6em, 3vmin, 1.4em);
    text-indent: clamp(0.6em, 3vmin, 1.4em); /* balance trailing letter-space */
    color: #e8dcff;
    text-shadow:
      0 0 12px var(--glow-purple),
      0 0 40px var(--glow-purple),
      0 0 90px rgba(140, 90, 255, 0.35);
    user-select: none;
    pointer-events: none;
    animation: title-breathe 8s ease-in-out infinite;
    z-index: 10;
  }

  @keyframes title-breathe {
    0%, 100% { opacity: 0.85; filter: brightness(1); }
    50%      { opacity: 1;    filter: brightness(1.25); }
  }

  /* ---------- Orbit rings (semi-transparent, rotating) ---------- */
  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    border: 1px solid rgba(160, 130, 255, 0.18);
    box-shadow:
      0 0 18px rgba(140, 100, 255, 0.10),
      inset 0 0 30px rgba(140, 100, 255, 0.06);
    transform-style: preserve-3d;
    pointer-events: none;
  }

  .ring--a {
    width: 62%;
    height: 62%;
    margin: -31% 0 0 -31%;
    border-color: rgba(170, 140, 255, 0.22);
    animation: ring-spin-a 90s linear infinite;
  }

  .ring--b {
    width: 88%;
    height: 88%;
    margin: -44% 0 0 -44%;
    border-color: rgba(120, 160, 255, 0.14);
    animation: ring-spin-b 140s linear infinite reverse;
  }

  @keyframes ring-spin-a {
    from { transform: rotateX(64deg) rotateZ(0deg); }
    to   { transform: rotateX(64deg) rotateZ(360deg); }
  }

  @keyframes ring-spin-b {
    from { transform: rotateX(58deg) rotateY(8deg) rotateZ(0deg); }
    to   { transform: rotateX(58deg) rotateY(8deg) rotateZ(360deg); }
  }

  /* ---------- Orbiters: each planet rides a rotating arm ---------- */
  .orbiter {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    animation: orbit var(--dur) linear infinite;
    animation-delay: var(--delay, 0s);
  }

  @keyframes orbit {
    from { transform: rotateZ(0deg)     translateX(var(--radius)); }
    to   { transform: rotateZ(360deg)   translateX(var(--radius)); }
  }

  @keyframes orbit-reverse {
    from { transform: rotateZ(360deg)   translateX(var(--radius)); }
    to   { transform: rotateZ(0deg)     translateX(var(--radius)); }
  }

  /* Counter-rotate so the planet itself stays upright while its arm spins */
  .planet {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--size);
    height: var(--size);
    margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
    border-radius: 50%;
    transform-style: preserve-3d;
    animation: counter-orbit var(--dur) linear infinite, float var(--float-dur, 6s) ease-in-out infinite;
    animation-delay: var(--delay, 0s), var(--float-delay, 0s);
    box-shadow:
      inset calc(var(--size) * -0.18) calc(var(--size) * -0.12) calc(var(--size) * 0.35) rgba(0, 0, 0, 0.75),
      inset calc(var(--size) * 0.10) calc(var(--size) * 0.08) calc(var(--size) * 0.20) rgba(255, 255, 255, 0.12),
      0 0 calc(var(--size) * 0.55) var(--glow);
  }

  @keyframes counter-orbit {
    from { transform: rotateZ(0deg); }
    to   { transform: rotateZ(-360deg); }
  }

  @keyframes counter-orbit-reverse {
    from { transform: rotateZ(0deg); }
    to   { transform: rotateZ(360deg); }
  }

  @keyframes float {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 calc(var(--size) * -0.12); }
  }

  /* Reverse-direction planets override both animations */
  .orbiter--reverse { animation-name: orbit-reverse; }
  .orbiter--reverse .planet { animation-name: counter-orbit-reverse, float; }

  /* ---------- Planet palettes (radial gradient spheres) ---------- */
  .planet--ember {
    --size: 3.4vmin;
    --glow: rgba(255, 120, 60, 0.55);
    background: radial-gradient(circle at 32% 30%,
      #ffd9a8 0%, #ff9a4d 28%, #e85d2a 55%, #7a1f0c 82%, #2a0803 100%);
  }

  .planet--ocean {
    --size: 5.2vmin;
    --glow: rgba(80, 170, 255, 0.5);
    background: radial-gradient(circle at 34% 32%,
      #d8f4ff 0%, #7cc4ff 25%, #2f7fd8 52%, #123a7a 78%, #050f2e 100%);
  }

  .planet--verdant {
    --size: 4.2vmin;
    --glow: rgba(110, 230, 150, 0.45);
    background: radial-gradient(circle at 33% 30%,
      #eaffd8 0%, #8fe08a 26%, #3fa85c 52%, #1c5a33 78%, #071c0e 100%);
  }

  .planet--violet {
    --size: 6.4vmin;
    --glow: rgba(190, 130, 255, 0.55);
    background: radial-gradient(circle at 35% 30%,
      #f3e2ff 0%, #c98fff 24%, #8a4de0 50%, #4a1d8a 76%, #150830 100%);
  }

  .planet--ash {
    --size: 2.8vmin;
    --glow: rgba(200, 200, 220, 0.4);
    background: radial-gradient(circle at 32% 30%,
      #f4f4f8 0%, #b8b8c8 30%, #6e6e82 58%, #33333f 80%, #0c0c14 100%);
  }

  /* ---------- Per-orbit parameters (CSS custom properties drive everything) ---------- */
  .orbiter--p1 {
    --radius: calc(var(--scene-size) * 0.18);
    --dur: 26s;
    --delay: -4s;
    --float-dur: 5.2s;
    --float-delay: -1s;
  }
  .orbiter--p2 {
    --radius: calc(var(--scene-size) * 0.27);
    --dur: 44s;
    --delay: -18s;
    --float-dur: 6.8s;
    --float-delay: -3s;
  }
  .orbiter--p3 {
    --radius: calc(var(--scene-size) * 0.34);
    --dur: 62s;
    --delay: -9s;
    --float-dur: 7.5s;
    --float-delay: -2s;
  }
  .orbiter--p4 {
    --radius: calc(var(--scene-size) * 0.40);
    --dur: 88s;
    --delay: -30s;
    --float-dur: 8.4s;
    --float-delay: -4s;
  }
  .orbiter--p5 {
    --radius: calc(var(--scene-size) * 0.45);
    --dur: 118s;
    --delay: -55s;
    --float-dur: 9.2s;
    --float-delay: -5s;
  }

  /* ---------- Subtle vignette for depth ---------- */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 45%,
      rgba(3, 2, 10, 0.55) 85%,
      rgba(2, 1, 8, 0.85) 100%);
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .orbiter, .planet, .ring, .cosmos-title {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main class="stage">
    <div class="scene" role="img" aria-label="Five planets orbiting in slow circles around the glowing word Cosmos">
      <h1 class="cosmos-title">COSMOS</h1>

      <div class="ring ring--a" aria-hidden="true"></div>
      <div class="ring ring--b" aria-hidden="true"></div>

      <div class="orbiter orbiter--p1" aria-hidden="true"><span class="planet planet--ember"></span></div>
      <div class="orbiter orbiter--p2 orbiter--reverse" aria-hidden="true"><span class="planet planet--ocean"></span></div>
      <div class="orbiter orbiter--p3" aria-hidden="true"><span class="planet planet--verdant"></span></div>
      <div class="orbiter orbiter--p4 orbiter--reverse" aria-hidden="true"><span class="planet planet--violet"></span></div>
      <div class="orbiter orbiter--p5" aria-hidden="true"><span class="planet planet--ash"></span></div>
    </div>
  </main>

  <div class="vignette" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');

  let stars = [];
  let w = 0, h = 0, dpr = 1;

  // Star colors: mostly white-blue, a few warm and violet accents
  const STAR_TINTS = [
    [255, 255, 255],
    [200, 215, 255],
    [180, 195, 255],
    [255, 235, 210],
    [220, 190, 255]
  ];

  function makeStar() {
    const tint = STAR_TINTS[Math.floor(Math.random() * STAR_TINTS.length)];
    return {
      x: Math.random(),                       // normalized 0..1
      y: Math.random(),
      r: 0.4 + Math.random() * 1.4,           // base radius (css px)
      twinkleSpeed: 0.4 + Math.random() * 1.6,// cycles per second-ish
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleDepth: 0.35 + Math.random() * 0.5,
      tint: tint
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Density scales with area (~1 star per 2200 css px²), clamped
    const target = Math.max(90, Math.min(420, Math.round((w * h) / 2200)));
    if (stars.length < target) {
      while (stars.length < target) stars.push(makeStar());
    } else if (stars.length > target) {
      stars.length = target;
    }
  }

  let lastTime = performance.now();

  function draw(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    // Deep space backdrop with a faint central nebula wash
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2, cy = h / 2;
    const nebula = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
    nebula.addColorStop(0, 'rgba(40, 24, 80, 0.30)');
    nebula.addColorStop(0.4, 'rgba(20, 14, 50, 0.16)');
    nebula.addColorStop(1, 'rgba(5, 3, 15, 0)');
    ctx.fillStyle = nebula;
    ctx.fillRect(0, 0, w, h);

    // Stars
    const t = now / 1000;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const twinkle = 1 - s.twinkleDepth * (0.5 + 0.5 * Math.sin(t * s.twinkleSpeed * Math.PI * 2 + s.twinklePhase));
      const alpha = 0.25 + 0.75 * twinkle;
      const x = s.x * w;
      const y = s.y * h;
      const r = s.r * (0.75 + 0.25 * twinkle);

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + s.tint[0] + ',' + s.tint[1] + ',' + s.tint[2] + ',' + alpha.toFixed(3) + ')';
      ctx.fill();

      // Soft halo on the brightest stars
      if (s.r > 1.3 && twinkle > 0.75) {
        const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
        halo.addColorStop(0, 'rgba(' + s.tint[0] + ',' + s.tint[1] + ',' + s.tint[2] + ',0.28)');
        halo.addColorStop(1, 'rgba(' + s.tint[0] + ',' + s.tint[1] + ',' + s.tint[2] + ',0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(x, y, r * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize, { passive: true });
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
