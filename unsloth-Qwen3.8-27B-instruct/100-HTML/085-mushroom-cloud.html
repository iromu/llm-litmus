<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushroom Cloud</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #0a0808; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
}
window.addEventListener('resize', resize);
resize();

const MAX_PARTICLES = 500;
let particles = [];
let cycleTimer = 0;

class CloudParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed * 0.5;
    this.vy = -(2 + Math.random() * 5);
    this.size = 3 + Math.random() * 8;
    this.growRate = 0.05 + Math.random() * 0.1;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.005;
    this.hue = 15 + Math.random() * 30; // warm orange-brown
    this.lightness = 30 + Math.random() * 30;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy *= 0.99;
    this.vx *= 0.995;
    this.size += this.growRate;
    this.life -= this.decay;
    // Spread outward as it rises (mushroom cap effect)
    if (this.y < H * 0.35) {
      this.vx += (Math.random() - 0.5) * 0.3;
      this.vy *= 0.98;
    }
  }
  draw(ctx) {
    if (this.life <= 0) return;
    const alpha = this.life * 0.4;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `hsla(${this.hue}, 60%, ${this.lightness}%, ${alpha})`);
    grad.addColorStop(0.6, `hsla(${this.hue}, 50%, ${this.lightness * 0.7}%, ${alpha * 0.5})`);
    grad.addColorStop(1, `hsla(${this.hue}, 40%, ${this.lightness * 0.4}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function erupt() {
  const count = 80 + Math.floor(Math.random() * 60);
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    const x = cx + (Math.random() - 0.5) * 40;
    const y = H * 0.85 + Math.random() * 20;
    particles.push(new CloudParticle(x, y));
  }
}

let time = 0;
function animate() {
  time += 16;
  cycleTimer += 16;

  // Continuous eruption
  if (cycleTimer > 100) {
    erupt();
    cycleTimer = 0;
  }

  // Trailing fade
  ctx.fillStyle = 'rgba(10, 8, 8, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Ground glow
  const groundGrad = ctx.createRadialGradient(cx, H * 0.88, 0, cx, H * 0.88, W * 0.3);
  groundGrad.addColorStop(0, 'rgba(255, 120, 30, 0.15)');
  groundGrad.addColorStop(0.5, 'rgba(200, 80, 20, 0.05)');
  groundGrad.addColorStop(1, 'rgba(100, 40, 10, 0)');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H * 0.7, W, H * 0.3);

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0 || particles[i].y < -50) particles.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#0a0808';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
