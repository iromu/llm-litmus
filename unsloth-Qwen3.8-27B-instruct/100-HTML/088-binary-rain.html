<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Rain</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const FONT_SIZE = 16;
const FONT = 'Courier New, monospace';
let columns = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const colCount = Math.floor(W / FONT_SIZE);
  columns = [];
  for (let i = 0; i < colCount; i++) {
    columns.push({
      x: i * FONT_SIZE,
      y: Math.random() * -H,
      speed: 2 + Math.random() * 5,
      length: 10 + Math.floor(Math.random() * 25),
      chars: []
    });
    // Pre-fill characters
    for (let j = 0; j < 40; j++) {
      columns[i].chars.push(Math.random() > 0.5 ? '1' : '0');
    }
  }
}
window.addEventListener('resize', resize);
resize();

function animate() {
  // Trailing fade
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, W, H);

  ctx.font = `${FONT_SIZE}px ${FONT}`;

  for (const col of columns) {
    // Draw the stream
    for (let i = 0; i < col.length; i++) {
      const charY = col.y - i * FONT_SIZE;
      if (charY < -FONT_SIZE || charY > H + FONT_SIZE) continue;

      const progress = i / col.length;
      let alpha, lightness;

      if (i === 0) {
        // Leading character — brightest
        alpha = 1;
        lightness = 90;
      } else {
        // Trail fades out
        alpha = (1 - progress) * 0.8;
        lightness = 40 + (1 - progress) * 30;
      }

      // Shift characters occasionally
      if (Math.random() > 0.97) {
        col.chars[i] = Math.random() > 0.5 ? '1' : '0';
      }

      ctx.fillStyle = `rgba(0, ${Math.floor(180 + 75 * (1 - progress))}, 0, ${alpha})`;
      ctx.fillText(col.chars[i % col.chars.length], col.x, charY);
    }

    // Move down
    col.y += col.speed;

    // Reset when fully off screen
    if (col.y - col.length * FONT_SIZE > H) {
      col.y = Math.random() * -200;
      col.speed = 2 + Math.random() * 5;
      col.length = 10 + Math.floor(Math.random() * 25);
    }
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#000';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
