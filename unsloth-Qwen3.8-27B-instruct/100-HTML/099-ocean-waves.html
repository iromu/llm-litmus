<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Waves</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #051520; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const WAVE_COUNT = 8;

class OceanWave {
  constructor(index) {
    this.baseY = H * (0.3 + index * 0.09);
    this.amplitude = 15 + Math.random() * 25;
    this.frequency = 0.003 + Math.random() * 0.004;
    this.speed = 0.4 + Math.random() * 0.6;
    this.phase = Math.random() * Math.PI * 2;
    this.hue = 190 + index * 8; // blue-cyan range
    this.alpha = 0.15 + (index / WAVE_COUNT) * 0.15;
  }

  getY(x, time) {
    const wave1 = Math.sin(x * this.frequency + time * this.speed + this.phase) * this.amplitude;
    const wave2 = Math.sin(x * this.frequency * 2.1 + time * this.speed * 0.7 + this.phase * 0.5) * this.amplitude * 0.4;
    return this.baseY + wave1 + wave2;
  }

  draw(ctx, time) {
    // Filled wave
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      ctx.lineTo(x, this.getY(x, time));
    }
    ctx.lineTo(W, H);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, this.baseY - this.amplitude, 0, this.baseY + this.amplitude + 50);
    grad.addColorStop(0, `hsla(${this.hue}, 60%, 40%, ${this.alpha})`);
    grad.addColorStop(1, `hsla(${this.hue + 10}, 50%, 25%, ${this.alpha * 0.5})`);
    ctx.fillStyle = grad;
    ctx.fill();

    // Ridge highlight
    ctx.strokeStyle = `hsla(${this.hue}, 70%, 65%, ${this.alpha * 0.6})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = this.getY(x, time);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

const waves = [];
for (let i = 0; i < WAVE_COUNT; i++) {
  waves.push(new OceanWave(i));
}

// Bubbles/particles floating up
class Bubble {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 10;
    this.size = 1 + Math.random() * 3;
    this.speed = 0.3 + Math.random() * 0.8;
    this.wobblePhase = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 1 + Math.random() * 2;
  }
  update(time) {
    this.y -= this.speed;
    this.x += Math.sin(time * this.wobbleSpeed + this.wobblePhase) * 0.3;
    if (this.y < -10) this.reset();
  }
  draw(ctx) {
    ctx.fillStyle = 'rgba(150, 220, 255, 0.15)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const bubbles = [];
for (let i = 0; i < 20; i++) {
  const b = new Bubble();
  b.y = Math.random() * H;
  bubbles.push(b);
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(5, 21, 32, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Light rays from above
  for (let i = 0; i < 4; i++) {
    const rayX = W * 0.15 + i * W * 0.25 + Math.sin(time * 0.15 + i * 2) * 40;
    const grad = ctx.createLinearGradient(rayX, 0, rayX + 20, H * 0.6);
    grad.addColorStop(0, 'rgba(100, 200, 255, 0.015)');
    grad.addColorStop(1, 'rgba(100, 200, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rayX - 15, 0);
    ctx.lineTo(rayX + 15, 0);
    ctx.lineTo(rayX + 50, H * 0.6);
    ctx.lineTo(rayX - 50, H * 0.6);
    ctx.closePath();
    ctx.fill();
  }

  // Draw waves back to front
  for (const wave of waves) {
    wave.draw(ctx, time);
  }

  // Bubbles
  for (const b of bubbles) {
    b.update(time);
    b.draw(ctx);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#051520';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
