<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #050508; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const planets = [
  { name: 'Mercury', radius: 3, orbit: 0.08, speed: 4.15, color: '#b5a7a7' },
  { name: 'Venus', radius: 5, orbit: 0.12, speed: 1.62, color: '#e8cda0' },
  { name: 'Earth', radius: 5, orbit: 0.17, speed: 1.0, color: '#4a90d9' },
  { name: 'Mars', radius: 4, orbit: 0.22, speed: 0.53, color: '#c1440e' },
  { name: 'Jupiter', radius: 12, orbit: 0.30, speed: 0.084, color: '#c88b3a' },
  { name: 'Saturn', radius: 10, orbit: 0.38, speed: 0.034, color: '#ead6a8', rings: true },
  { name: 'Uranus', radius: 7, orbit: 0.45, speed: 0.012, color: '#72b5c4' },
  { name: 'Neptune', radius: 7, orbit: 0.52, speed: 0.006, color: '#3f54ba' }
];

// Initialize angles
planets.forEach(p => { p.angle = Math.random() * Math.PI * 2; });

function drawSun(time) {
  const sunRadius = 18 + Math.sin(time * 0.5) * 2;

  // Outer glow layers
  for (let i = 3; i >= 1; i--) {
    const r = sunRadius * i * 1.5;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, `rgba(255, 200, 50, ${0.1 / i})`);
    grad.addColorStop(1, 'rgba(255, 150, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sun body
  const sunGrad = ctx.createRadialGradient(cx - 4, cy - 4, 0, cx, cy, sunRadius);
  sunGrad.addColorStop(0, '#fff8e0');
  sunGrad.addColorStop(0.3, '#ffdd44');
  sunGrad.addColorStop(0.7, '#ff9900');
  sunGrad.addColorStop(1, '#cc5500');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, sunRadius, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlanet(p, time, baseScale) {
  const orbitR = p.orbit * baseScale;
  p.angle += p.speed * 0.003;

  const x = cx + Math.cos(p.angle) * orbitR;
  const y = cy + Math.sin(p.angle) * orbitR;

  // Orbit path
  ctx.strokeStyle = 'rgba(100, 120, 160, 0.1)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
  ctx.stroke();

  // Saturn rings
  if (p.rings) {
    ctx.strokeStyle = 'rgba(210, 190, 150, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y, p.radius * 1.8, p.radius * 0.5, -0.3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Planet with radial gradient for 3D effect
  const grad = ctx.createRadialGradient(x - p.radius * 0.3, y - p.radius * 0.3, 0, x, y, p.radius);
  grad.addColorStop(0, lightenColor(p.color, 40));
  grad.addColorStop(0.5, p.color);
  grad.addColorStop(1, darkenColor(p.color, 40));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, p.radius, 0, Math.PI * 2);
  ctx.fill();

  // Saturn ring front (drawn over planet)
  if (p.rings) {
    ctx.strokeStyle = 'rgba(230, 210, 170, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y, p.radius * 1.8, p.radius * 0.5, -0.3, 0, Math.PI);
    ctx.stroke();
  }
}

function lightenColor(hex, amt) {
  const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amt);
  return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, amt) {
  const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amt);
  const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amt);
  const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amt);
  return `rgb(${r},${g},${b})`;
}

let time = 0;
function animate() {
  time += 0.016;

  // Trailing fade
  ctx.fillStyle = 'rgba(5, 5, 8, 0.15)';
  ctx.fillRect(0, 0, W, H);

  const baseScale = Math.min(W, H);

  // Draw orbit paths first
  for (const p of planets) {
    ctx.strokeStyle = 'rgba(80, 100, 140, 0.08)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(cx, cy, p.orbit * baseScale, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Draw sun
  drawSun(time);

  // Draw planets
  for (const p of planets) {
    drawPlanet(p, time, baseScale);
  }

  requestAnimationFrame(animate);
}

ctx.fillStyle = '#050508';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
