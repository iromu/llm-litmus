<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0b1020; height: 100%; }
  #app { position: fixed; inset: 0; }

  }
  #hud b { color: #ffd9a0; }
  #title {
    position: fixed; left: 14px; top: 12px; z-index: 10;

<body>
<div id="app"></div>
<div id="title">Voxel Pagoda Garden<small>drag to orbit · scroll to zoom</small></div>
<div id="hud"><b>voxel pagoda</b> · cherry blossom garden<br/>three.js + instanced voxels</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Voxel Pagoda Garden — single-file Three.js scene
   All geometry is built from unit cubes via InstancedMesh.
   ============================================================ */

// ---------- Renderer / Scene / Camera ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0xbfe3ff, 60, 220);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(46, 34, 58);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 12;
controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * 0.495; // keep above ground
controls.update();

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0xbfe8ff, 0x3a5a2a, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d6, 1.55);
sun.position.set(40, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 260;
const S = 70;
sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
sun.shadow.camera.top = S;   sun.shadow.camera.bottom = -S;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9fc4ff, 0.35);
fill.position.set(-30, 40, -25);
scene.add(fill);

// ---------- Voxel system ----------
const UNIT = 1; // voxel size
const boxGeo = new THREE.BoxGeometry(UNIT, UNIT, UNIT);
boxGeo.translate(0, 0.5, 0); // pivot at base so y = ground level of the cube

const matCache = new Map();
function getMat(color, opts = {}) {
  const key = `${color}|${opts.emissive ?? ''}|${opts.emissiveIntensity ?? 0}|${opts.transparent ? 1 : 0}|${opts.opacity ?? 1}`;
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.85,
    metalness: opts.metalness ?? 0.0,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
    transparent: !!opts.transparent,
    opacity: opts.opacity ?? 1,
  });
  matCache.set(key, m);
  return m;
}

// Group instances by material, then create one InstancedMesh per material.
class VoxelBuilder {
  constructor() { this.groups = new Map(); }
  add(x, y, z, color, opts = {}) {
    const mat = getMat(color, opts);
    let g = this.groups.get(mat);
    if (!g) { g = []; this.groups.set(mat, g); }
    g.push([x, y, z]);
  }
  build(scene) {
    const meshes = [];
    for (const [mat, list] of this.groups) {
      const mesh = new THREE.InstancedMesh(boxGeo, mat, list.length);
      const m4 = new THREE.Matrix4();
      for (let i = 0; i < list.length; i++) {
        const [x, y, z] = list[i];
        m4.makeTranslation(x, y, z);
        mesh.setMatrixAt(i, m4);
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      meshes.push(mesh);
    }
    return meshes;
  }
}

// Helpers
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const jitter = v => v + rnd(-0.04, 0.04);

// Color palettes
const C = {
  grassA: 0x5fae4f, grassB: 0x6fbf5c, grassC: 0x4f9e44, grassD: 0x7cc867,
  dirt: 0x7a5230, dirtDark: 0x5f3f24,
  stone: 0x9aa0a6, stoneLight: 0xb8bec4, stoneDark: 0x767c82,
  path: 0xc9b79a, pathLight: 0xd8c8ab,
  wood: 0x8a4b2a, woodDark: 0x6b3a1f, woodLight: 0xa8623a,
  roofRed: 0xb5382f, roofRedDark: 0x8f2a23, roofGold: 0xe8b23a,
  gold: 0xf2c14e, goldBright: 0xffd873,
  white: 0xf3efe6, cream: 0xf7f0dc,
  trunk: 0x6b4423, trunkDark: 0x523419,
  leaf: 0x3f8f3a, leafLight: 0x57b04a, leafDark: 0x2f7029,
  sakura: 0xffb7cd, sakuraLight: 0xffd3e0, sakuraDeep: 0xff9bb8, sakuraWhite: 0xffe9f0,
  lantern: 0xffe08a, lanternGlow: 0xffcf5a,
  water: 0x3f8fd0, waterLight: 0x63b3e6,
  rock: 0x8b8f94, rockDark: 0x6b6f74,
};

const main = new VoxelBuilder();

/* ============================================================
   GROUND — gentle rolling terrain with a stone path
   ============================================================ */
const HALF = 34; // ground extends -HALF..HALF
function groundHeight(x, z) {
  // gentle hills, flattened near center for the pagoda platform
  const d = Math.hypot(x, z);
  const flat = THREE.MathUtils.smoothstep(d, 6, 16); // 0 near center -> 1 far
  const h = (Math.sin(x * 0.12) * Math.cos(z * 0.13) + Math.sin((x + z) * 0.07)) * 1.6 * flat;
  return h;
}

for (let x = -HALF; x <= HALF; x++) {
  for (let z = -HALF; z <= HALF; z++) {
    const d = Math.hypot(x, z);
    const h = Math.round(groundHeight(x, z));
    // Only render the top layer + a thin subsoil to keep instance count sane.
    const onPath = isOnPath(x, z);
    let col;
    if (onPath) {
      col = Math.random() < 0.5 ? C.path : C.pathLight;
    } else {
      // varied grass with occasional flowers/dirt speckle
      const r = Math.random();
      if (r < 0.03) col = C.dirt;
      else if (r < 0.05) col = pick([C.grassA, C.grassB, C.grassC, C.grassD]);
      else col = pick([C.grassA, C.grassB, C.grassC, C.grassD]);
    }
    main.add(x, h, z, col);
    // subsoil (darker) below the surface for depth at edges
    if (d > HALF - 2 || Math.random() < 0.15) {
      main.add(x, h - 1, z, C.dirtDark);
    }
  }
}

// Path: a winding walkway from the front edge toward the pagoda
function isOnPath(x, z) {
  // main approach along +Z axis curving slightly
  const t = (z + HALF) / (HALF * 2); // 0 back .. 1 front
  const cx = Math.sin(t * Math.PI * 1.3) * 3.0; // gentle curve
  if (Math.abs(x - cx) <= 2 && z >= -4 && z <= HALF) return true;
  // side branch to the pond
  if (Math.abs(z - 14) <= 1.5 && x >= 2 && x <= 16) return true;
  return false;
}

/* ============================================================
   PAGODA — five-tiered Japanese-style tower
   ============================================================ */
function buildPagoda(cx, cz, baseY) {
  const tiers = 5;
  let y = baseY;
  // Stone foundation platform
  const platR = 13;
  for (let dx = -platR; dx <= platR; dx++) {
    for (let dz = -platR; dz <= platR; dz++) {
      const d = Math.hypot(dx, dz);
      if (d <= platR) {
        const ring = Math.floor(d);
        const col = ring % 2 === 0 ? C.stone : C.stoneLight;
        main.add(cx + dx, y, cz + dz, col);
        main.add(cx + dx, y - 1, cz + dz, C.stoneDark);
      }
    }
  }
  y += 1;

  // Stairs up the front (+Z)
  for (let s = 0; s < 6; s++) {
    const sz = platR - 1 + s;
    main.add(cx, y + s, cz + sz, C.stoneLight);
    main.add(cx - 1, y + s, cz + sz, C.stone);
    main.add(cx + 1, y + s, cz + sz, C.stone);
  }

  for (let tier = 0; tier < tiers; tier++) {
    const scale = 1 - tier * 0.16;            // shrink upward
    const bodyHalf = Math.max(3, Math.round(7 * scale));
    const wallH = 4;
    const roofOverhang = Math.round(4 * scale) + 1;

    // --- Walls (hollow box with corner pillars) ---
    for (let dx = -bodyHalf; dx <= bodyHalf; dx++) {
      for (let dz = -bodyHalf; dz <= bodyHalf; dz++) {
        const edge = Math.abs(dx) === bodyHalf || Math.abs(dz) === bodyHalf;
        const corner = Math.abs(dx) === bodyHalf && Math.abs(dz) === bodyHalf;
        if (!edge) continue;
        for (let wy = 0; wy < wallH; wy++) {
          if (corner) {
            main.add(cx + dx, y + wy, cz + dz, C.woodDark); // pillar
          } else if (wy === 0 || wy === wallH - 1) {
            main.add(cx + dx, y + wy, cz + dz, C.wood);     // beams
          } else {
            // wall panels; leave door openings on the front face of lower tiers
            const isFront = dz === bodyHalf;
            const doorOpen = isFront && tier < 3 && Math.abs(dx) <= 1 && wy > 0 && wy < wallH - 1;
            if (doorOpen) continue;
            const panelCol = (dx + dz) % 2 === 0 ? C.cream : C.white;
            main.add(cx + dx, y + wy, cz + dz, panelCol);
          }
        }
      }
    }

    // --- Roof: flared eaves (wider at the base of the roof, tapering up) ---
    const roofLevels = 4;
    for (let rl = 0; rl < roofLevels; rl++) {
      const over = roofOverhang - rl;
      const ry = y + wallH + rl;
      for (let dx = -over; dx <= over; dx++) {
        for (let dz = -over; dz <= over; dz++) {
          const d = Math.max(Math.abs(dx), Math.abs(dz));
          if (d > over) continue;
          // skip interior so it's a shell, but cap the top
          const rim = d === over || rl === roofLevels - 1;
          if (!rim) continue;
          // curved eave: lift corners for a swooping look
          const lift = (rl === 0) ? (Math.abs(dx) === over && Math.abs(dz) === over ? 1 : 0) : 0;
          const col = rl === roofLevels - 1 ? C.roofRedDark : (d % 2 === 0 ? C.roofRed : C.roofRedDark);
          main.add(cx + dx, ry + lift, cz + dz, col);
        }
      }
    }
    // Gold ridge ornament on top of each roof
    const topRoofY = y + wallH + roofLevels;
    main.add(cx, topRoofY, cz, C.gold);
    main.add(cx, topRoofY + 1, cz, C.goldBright);

    y = topRoofY + 2;
  }

  // --- Spire (sōrin) on top ---
  const spireBase = y;
  for (let s = 0; s < 6; s++) {
    main.add(cx, spireBase + s, cz, s % 2 === 0 ? C.gold : C.goldBright);
  }
  main.add(cx, spireBase + 6, cz, C.goldBright);
  main.add(cx, spireBase + 7, cz, C.sakuraDeep); // little finial bead
}

buildPagoda(0, 0, 0);

/* ============================================================
   TREES — procedural trunk + blobby canopy
   ============================================================ */
function treeCanopyColors(type) {
  if (type === 'sakura') return [C.sakura, C.sakuraLight, C.sakuraDeep, C.sakuraWhite];
  if (type === 'autumn') return [0xd98a3a, 0xc96a2a, 0xe0a84a, 0xb85a24];
  return [C.leaf, C.leafLight, C.leafDark];
}

function makeTree(x, z, type = 'green', size = 1) {
  const gy = Math.round(groundHeight(x, z));
  const trunkH = Math.round(rnd(4, 6) * size);
  const cols = treeCanopyColors(type);
  // Trunk with slight lean
  let tx = x, tz = z;
  for (let ty = 0; ty < trunkH; ty++) {
    main.add(tx, gy + ty, tz, Math.random() < 0.3 ? C.trunkDark : C.trunk);
    if (ty > 1 && Math.random() < 0.25) {
      main.add(tx + (Math.random() < 0.5 ? 1 : -1), gy + ty, tz, C.trunkDark);
    }
    if (Math.random() < 0.15) { tx += pick([-1, 1]); tz += pick([-1, 1]); }
  }
  // Canopy: several overlapping blobs
  const blobs = 3 + ((Math.random() * 3) | 0);
  const cy = gy + trunkH;
  for (let b = 0; b < blobs; b++) {
    const bx = tx + rnd(-2, 2) * size;
    const bz = tz + rnd(-2, 2) * size;
    const by = cy + rnd(0, 2) * size;
    const r = rnd(2, 3.4) * size;
    for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++) {
      for (let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++) {
        for (let dz = -Math.ceil(r); dz <= Math.ceil(r); dz++) {
          const dd = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (dd <= r && Math.random() < 0.7) {
            main.add(Math.round(bx + dx), Math.round(by + dy), Math.round(bz + dz), pick(cols));
          }
        }
      }
    }
  }
}

// Place trees around the garden (avoid the central platform & path)
const treeSpots = [
  [-20, -18, 'sakura'], [-16, 12, 'sakura'], [18, -16, 'sakura'],
  [22, 8, 'green'], [-24, 4, 'green'], [14, 20, 'sakura'],
  [-12, -24, 'green'], [24, -4, 'autumn'], [-22, 22, 'green'],
  [8, -22, 'sakura'], [-8, 24, 'green'], [26, 18, 'sakura'],
];
treeSpots.forEach(([x, z, t]) => {
  if (isOnPath(x, z)) return;
  makeTree(x, z, t, rnd(0.9, 1.3));
});

/* ============================================================
   POND — blue water basin with rocks and lily pads
   ============================================================ */
function buildPond(cx, cz) {
  const R = 7;
  for (let dx = -R; dx <= R; dx++) {
    for (let dz = -R; dz <= R; dz++) {
      const d = Math.hypot(dx, dz);
      if (d <= R) {
        const gy = Math.round(groundHeight(cx + dx, cz + dz));
        const rim = d > R - 1.5;
        if (rim) {
          main.add(cx + dx, gy, cz + dz, pick([C.rock, C.rockDark]));
        } else {
          main.add(cx + dx, gy - 1, cz + dz, C.water);
          if (Math.random() < 0.3) main.add(cx + dx, gy, cz + dz, C.waterLight);
        }
      }
    }
  }
  // Lily pads
  for (let i = 0; i < 5; i++) {
    const lx = cx + rnd(-4, 4), lz = cz + rnd(-4, 4);
    if (Math.hypot(lx - cx, lz - cz) < R - 1.5) {
      const gy = Math.round(groundHeight(lx, lz));
      main.add(Math.round(lx), gy, Math.round(lz), 0x3fae4a);
      main.add(Math.round(lx) + 1, gy, Math.round(lz), 0x4cbf58);
    }
  }
}
buildPond(14, 14);

/* ============================================================
   LANTERNS — glowing paper lanterns along the path
   ============================================================ */
const lanternPositions = [];
function makeLantern(x, z) {
  const gy = Math.round(groundHeight(x, z));
  // stone base
  main.add(x, gy, z, C.stoneDark);
  main.add(x, gy + 1, z, C.stone);
  // post
  main.add(x, gy + 2, z, C.woodDark);
  // lantern body (glowing)
  main.add(x, gy + 3, z, C.lanternGlow, { emissive: C.lanternGlow, emissiveIntensity: 0.9, roughness: 0.5 });
  main.add(x + 1, gy + 3, z, C.lantern, { emissive: C.lantern, emissiveIntensity: 0.7 });
  main.add(x - 1, gy + 3, z, C.lantern, { emissive: C.lantern, emissiveIntensity: 0.7 });
  main.add(x, gy + 3, z + 1, C.lantern, { emissive: C.lantern, emissiveIntensity: 0.7 });
  main.add(x, gy + 3, z - 1, C.lantern, { emissive: C.lantern, emissiveIntensity: 0.7 });
  main.add(x, gy + 4, z, C.lantern, { emissive: C.lantern, emissiveIntensity: 0.6 });
  // cap
  main.add(x, gy + 5, z, C.roofRedDark);
  lanternPositions.push(new THREE.Vector3(x, gy + 3.5, z));
}
[[-2, 8], [2, 14], [-3, 20], [3, 26], [10, 14], [-6, 14]].forEach(([x, z]) => makeLantern(x, z));

// Point lights for a few lanterns (cheap glow)
lanternPositions.slice(0, 4).forEach(p => {
  const pl = new THREE.PointLight(C.lanternGlow, 1.2, 14, 2);
  pl.position.copy(p);
  scene.add(pl);
});

/* ============================================================
   FLOWERS & BUSHES scattered across the lawn
   ============================================================ */
function makeFlower(x, z) {
  const gy = Math.round(groundHeight(x, z));
  const stem = 0x3f8f3a;
  main.add(x, gy, z, stem);
  const head = pick([0xff5a7a, 0xffd23a, 0xffffff, 0xc46bff, 0xff8a3a, 0x6ba8ff]);
  main.add(x, gy + 1, z, head);
  if (Math.random() < 0.5) main.add(x + 1, gy + 1, z, head);
}
for (let i = 0; i < 120; i++) {
  const x = Math.round(rnd(-HALF + 2, HALF - 2));
  const z = Math.round(rnd(-HALF + 2, HALF - 2));
  if (isOnPath(x, z) || Math.hypot(x, z) < 14) continue;
  makeFlower(x, z);
}

function makeBush(x, z) {
  const gy = Math.round(groundHeight(x, z));
  const r = rnd(1.5, 2.5);
  for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++)
    for (let dy = 0; dy <= Math.ceil(r); dy++)
      for (let dz = -Math.ceil(r); dz <= Math.ceil(r); dz++) {
        if (Math.sqrt(dx*dx + dy*dy + dz*dz) <= r && Math.random() < 0.6)
          main.add(x + dx, gy + dy, z + dz, pick([C.leaf, C.leafLight, C.leafDark]));
      }
}
for (let i = 0; i < 24; i++) {
  const x = Math.round(rnd(-HALF + 2, HALF - 2));
  const z = Math.round(rnd(-HALF + 2, HALF - 2));
  if (isOnPath(x, z) || Math.hypot(x, z) < 14) continue;
  makeBush(x, z);
}

/* ============================================================
   STONE TORII GATE at the front of the path
   ============================================================ */
function makeTorii(x, z) {
  const gy = Math.round(groundHeight(x, z));
  const red = 0xc0392b;
  const H = 7;
  // two posts
  for (let py = 0; py < H; py++) {
    main.add(x - 3, gy + py, z, red);
    main.add(x + 3, gy + py, z, red);
  }
  // top beam (kasagi) wider
  for (let bx = -4; bx <= 4; bx++) {
    main.add(x + bx, gy + H, z, red);
    main.add(x + bx, gy + H + 1, z, 0x2b2b2b);
  }
  // second beam (nuki)
  for (let bx = -3; bx <= 3; bx++) main.add(x + bx, gy + H - 2, z, red);
  // center plaque
  main.add(x, gy + H - 2, z + 1, C.gold);
}
makeTorii(0, 28);

/* ============================================================
   BUILD all static voxels
   ============================================================ */
main.build(scene);

/* ============================================================
   FALLING PETALS — animated instanced planes
   ============================================================ */
const PETAL_COUNT = 220;
const petalGeo = new THREE.PlaneGeometry(0.5, 0.35);
const petalMat = new THREE.MeshStandardMaterial({
  color: C.sakuraLight, side: THREE.DoubleSide, roughness: 0.7,
  emissive: 0xffd3e0, emissiveIntensity: 0.15,
});
const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETAL_COUNT);
petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(petals);

const petalData = [];
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), tmpS = new THREE.Vector3();
for (let i = 0; i < PETAL_COUNT; i++) {
  petalData.push({
    pos: new THREE.Vector3(rnd(-30, 30), rnd(2, 40), rnd(-30, 30)),
    vel: rnd(0.6, 1.6),
    sway: rnd(0.5, 2.0),
    phase: rnd(0, Math.PI * 2),
    rotSpeed: rnd(-1.5, 1.5),
    rot: rnd(0, Math.PI * 2),
    scale: rnd(0.7, 1.4),
  });
}

function updatePetals(dt, t) {
  for (let i = 0; i < PETAL_COUNT; i++) {
    const p = petalData[i];
    p.pos.y -= p.vel * dt;
    p.pos.x += Math.sin(t * p.sway + p.phase) * dt * 0.8;
    p.pos.z += Math.cos(t * p.sway * 0.7 + p.phase) * dt * 0.8;
    p.rot += p.rotSpeed * dt;
    if (p.pos.y < 0.2) {
      // respawn near the top of a random cherry tree or from the sky
      p.pos.set(rnd(-28, 28), rnd(24, 40), rnd(-28, 28));
    }
    tmpE.set(p.rot, p.rot * 0.6, p.rot * 0.3);
    tmpQ.setFromEuler(tmpE);
    tmpS.setScalar(p.scale);
    tmpM.compose(p.pos, tmpQ, tmpS);
    petals.setMatrixAt(i, tmpM);
  }
  petals.instanceMatrix.needsUpdate = true;
}

/* ============================================================
   DRIFTING CLOUDS — soft white voxel clusters
   ============================================================ */
const clouds = [];
function makeCloud(x, y, z) {
  const g = new THREE.Group();
  const cm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.12 });
  const n = 6 + ((Math.random() * 5) | 0);
  for (let i = 0; i < n; i++) {
    const w = rnd(2, 5), h = rnd(1, 2.4), d = rnd(2, 4);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cm);
    m.position.set(rnd(-4, 4), rnd(-1, 1), rnd(-2, 2));
    g.add(m);
  }
  g.position.set(x, y, z);
  scene.add(g);
  clouds.push({ g, speed: rnd(0.3, 0.8) });
}
for (let i = 0; i < 7; i++) makeCloud(rnd(-80, 80), rnd(45, 60), rnd(-80, 80));

function updateClouds(dt) {
  for (const c of clouds) {
    c.g.position.x += c.speed * dt;
    if (c.g.position.x > 90) c.g.position.x = -90;
  }
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  updatePetals(dt, t);
  updateClouds(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
