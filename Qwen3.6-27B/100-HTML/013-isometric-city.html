<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isometric City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;perspective:1000px}
.scene{transform-style:preserve-3d;animation:rotate 30s ease-in-out infinite alternate}
@keyframes rotate{0%{transform:rotateX(60deg) rotateZ(45deg) translateY(-20px)}100%{transform:rotateX(60deg) rotateZ(45deg) rotateY(15deg) translateY(-20px)}}
.grid{display:grid;grid-template-columns:repeat(6,60px);grid-template-rows:repeat(6,60px);gap:4px;transform-style:preserve-3d}
.building{position:relative;transform-style:preserve-3d;width:60px;height:60px}
.face{position:absolute;width:60px;backface-visibility:hidden}
.front{height:var(--h);bottom:0;left:0;background:var(--c1);border:1px solid rgba(255,255,255,0.05)}
.side{height:var(--h);bottom:0;left:0;width:60px;background:var(--c2);transform:rotateY(90deg) translateZ(0px);transform-origin:left;border:1px solid rgba(255,255,255,0.05)}
.top{width:60px;height:60px;background:var(--c3);transform:rotateX(90deg) translateZ(0px);transform-origin:top;border:1px solid rgba(255,255,255,0.08)}
.window{position:absolute;width:8px;height:8px;background:rgba(255,255,200,0.6);border-radius:1px}
.ground{position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(50,50,80,0.3),transparent);transform:translate(-50%,-50%)}
.title{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.8rem;color:rgba(255,255,255,0.3);letter-spacing:0.2em;text-transform:uppercase;z-index:10}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="grid" id="grid"></div>
</div>
<div class="title">Isometric City</div>
<script>
const grid=document.getElementById('grid');
const palettes=[
{c1:'#1a1a3e',c2:'#151535',c3:'#252550'},
{c1:'#2d1b4e',c2:'#251540',c3:'#3d2560'},
{c1:'#1b3a4e',c2:'#153040',c3:'#254a5e'},
{c1:'#4e1b2d',c2:'#401525',c3:'#5e253d'},
{c1:'#1b4e3a',c2:'#154030',c3:'#255e4a'},
{c1:'#3a1b4e',c2:'#301540',c3:'#4a255e'}
];
for(let i=0;i<36;i++){const b=document.createElement('div');const p=palettes[Math.floor(Math.random()*palettes.length)];const h=40+Math.random()*120;b.className='building';b.style.cssText=`--h:${h}px;--c1:${p.c1};--c2:${p.c2};--c3:${p.c3};transform:translateZ(${h/2}px)`;b.innerHTML=`<div class="face front" style="height:${h}px"></div><div class="face side" style="height:${h}px"></div><div class="face top" style="transform:rotateX(90deg) translateZ(${h}px)"></div>`;
// Add windows
const front=b.querySelector('.front');const side=b.querySelector('.side');
const wRows=Math.floor(h/20),wCols=2;
for(let r=0;r<wRows;r++){for(let c=0;c<wCols;c++){const w=document.createElement('div');w.className='window';w.style.top=(10+r*20)+'px';w.style.left=(8+c*22)+'px';w.style.opacity=Math.random()>0.3?'0.6':'0.1';front.appendChild(w)}}
for(let r=0;r<wRows;r++){for(let c=0;c<wCols;c++){const w=document.createElement('div');w.className='window';w.style.top=(10+r*20)+'px';w.style.left=(8+c*22)+'px';w.style.opacity=Math.random()>0.3?'0.4':'0.1';side.appendChild(w)}}
grid.appendChild(b)}
</script>
</body>
</html>
