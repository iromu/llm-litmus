<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleidoscope Flowers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08060d}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, minDim;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
  minDim = Math.min(W, H);
}
window.addEventListener('resize', resize);
resize();

// ── Flower layer definition ──
function createLayer(petals, baseRadius, bloomSpeed, bloomPhase, colorOffset, petalWidth, petalCurve, alpha, rotationSpeed, layerPhase) {
  return {
    petals, baseRadius, bloomSpeed, bloomPhase,
    colorOffset, petalWidth, petalCurve, alpha,
    rotationSpeed, layerPhase
  };
}

const layers = [
  createLayer(6,  0.06, 0.30, 0.00, 0,   0.38, 0.55, 0.85, 0.015,  0.0),
  createLayer(8,  0.10, 0.22, 0.45, 30,  0.32, 0.50, 0.70, -0.022, 0.3),
  createLayer(10, 0.15, 0.18, 0.90, 60,  0.28, 0.45, 0.60, 0.018,  0.6),
  createLayer(12, 0.20, 0.25, 1.35, 90,  0.25, 0.40, 0.55, -0.012, 0.9),
  createLayer(7,  0.26, 0.20, 1.80, 120, 0.30, 0.52, 0.50, 0.025,  1.2),
  createLayer(14, 0.32, 0.15, 2.25, 150, 0.22, 0.38, 0.45, -0.018, 1.5),
  createLayer(9,  0.38, 0.28, 2.70, 180, 0.26, 0.48, 0.40, 0.010,  1.8),
  createLayer(16, 0.44, 0.12, 3.15, 210, 0.20, 0.35, 0.35, -0.028, 2.1),
  createLayer(11, 0.50, 0.24, 3.60, 240, 0.24, 0.42, 0.30, 0.020,  2.4),
  createLayer(20, 0.56, 0.16, 4.05, 270, 0.18, 0.32, 0.25, -0.015, 2.7),
  createLayer(13, 0.62, 0.21, 4.50, 300, 0.22, 0.44, 0.22, 0.012,  3.0),
  createLayer(24, 0.68, 0.14, 4.95, 330, 0.16, 0.30, 0.18, -0.022, 3.3),
];

// ── Draw a single petal using bezier curves ──
function drawPetal(ctx, layer, angle, bloom, radius, hue, saturation, lightness, alpha) {
  const r = radius * bloom;
  const pw = layer.petalWidth * r;
  const curve = layer.petalCurve;
  const cp1 = r * curve;
  const cp2 = r * (1 - curve * 0.3);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  grad.addColorStop(0, `hsla(${hue}, ${saturation}%, ${Math.min(lightness + 20, 90)}%, ${alpha})`);
  grad.addColorStop(0.4, `hsla(${hue + 15}, ${saturation}%, ${lightness}%, ${alpha * 0.85})`);
  grad.addColorStop(1, `hsla(${hue + 30}, ${saturation - 10}%, ${Math.max(lightness - 15, 15)}%, ${alpha * 0.3})`);

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(pw, -cp1 * 0.5, pw * 0.8, -cp2, 0, -r);
  ctx.bezierCurveTo(-pw * 0.8, -cp2, -pw, -cp1 * 0.5, 0, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Petal vein line
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(pw * 0.1, -r * 0.4, 0, -r * 0.85);
  ctx.strokeStyle = `hsla(${hue + 20}, ${saturation + 10}%, ${lightness + 15}%, ${alpha * 0.25})`;
  ctx.lineWidth = Math.max(0.5, r * 0.015);
  ctx.stroke();

  ctx.restore();
}

// ── Draw a full flower layer ──
function drawLayer(ctx, layer, time) {
  const bloomCycle = Math.sin(time * layer.bloomSpeed + layer.bloomPhase);
  const bloom = 0.3 + 0.7 * ((bloomCycle + 1) / 2);
  const rotation = time * layer.rotationSpeed + layer.layerPhase;
  const radius = layer.baseRadius * minDim;
  const hueShift = time * 8;

  for (let i = 0; i < layer.petals; i++) {
    const angle = (Math.PI * 2 / layer.petals) * i + rotation;
    const hue = (layer.colorOffset + hueShift + i * (360 / layer.petals * 0.3)) % 360;
    const saturation = 75 + 15 * Math.sin(time * 0.5 + i);
    const lightness = 50 + 12 * Math.sin(time * 0.3 + i * 0.7);
    drawPetal(ctx, layer, angle, bloom, radius, hue, saturation, lightness, layer.alpha * bloom);
  }
}

// ── Center glow ──
function drawCenterGlow(ctx, time) {
  const pulse = 0.7 + 0.3 * Math.sin(time * 0.8);
  const r = minDim * 0.04 * pulse;

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 4);
  grad.addColorStop(0, `hsla(${(time * 15) % 360}, 90%, 85%, 0.6)`);
  grad.addColorStop(0.3, `hsla(${(time * 15 + 40) % 360}, 80%, 60%, 0.2)`);
  grad.addColorStop(1, 'transparent');

  ctx.beginPath();
  ctx.arc(cx, cy, r * 4, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Tiny bright core
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  coreGrad.addColorStop(0, `hsla(${(time * 20) % 360}, 60%, 95%, 0.9)`);
  coreGrad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = coreGrad;
  ctx.fill();
}

// ── Background glow rings ──
function drawBackgroundGlow(ctx, time) {
  for (let i = 0; i < 3; i++) {
    const ringR = minDim * (0.3 + i * 0.15) * (0.8 + 0.2 * Math.sin(time * 0.4 + i * 1.2));
    const hue = (time * 5 + i * 120) % 360;
    const grad = ctx.createRadialGradient(cx, cy, ringR * 0.8, cx, cy, ringR * 1.2);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.5, `hsla(${hue}, 60%, 30%, 0.04)`);
    grad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(cx, cy, ringR * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// ── Floating pollen particles ──
const pollen = [];
const POLLEN_COUNT = 60;
for (let i = 0; i < POLLEN_COUNT; i++) {
  pollen.push({
    angle: Math.random() * Math.PI * 2,
    dist: 0.1 + Math.random() * 0.85,
    speed: 0.002 + Math.random() * 0.008,
    drift: (Math.random() - 0.5) * 0.003,
    size: 1 + Math.random() * 2.5,
    hueOffset: Math.random() * 360,
    alpha: 0.2 + Math.random() * 0.4
  });
}

function drawPollen(ctx, time) {
  for (const p of pollen) {
    const a = p.angle + time * p.speed;
    const d = p.dist * minDim * (0.9 + 0.1 * Math.sin(time * p.drift * 100));
    const x = cx + Math.cos(a) * d;
    const y = cy + Math.sin(a) * d;
    const hue = (time * 10 + p.hueOffset) % 360;
    const alpha = p.alpha * (0.5 + 0.5 * Math.sin(time * 1.5 + p.hueOffset));

    const grad = ctx.createRadialGradient(x, y, 0, x, y, p.size * 2);
    grad.addColorStop(0, `hsla(${hue}, 80%, 75%, ${alpha})`);
    grad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(x, y, p.size * 2, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// ── Main render loop ──
let start = null;
function render(ts) {
  if (!start) start = ts;
  const time = (ts - start) / 1000;

  // Dark background with subtle gradient
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.7);
  bgGrad.addColorStop(0, '#120e1a');
  bgGrad.addColorStop(1, '#08060d');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Background glow rings
  drawBackgroundGlow(ctx, time);

  // Flower layers (outer to inner for proper overlap)
  ctx.globalCompositeOperation = 'lighter';
  for (let i = layers.length - 1; i >= 0; i--) {
    drawLayer(ctx, layers[i], time);
  }

  // Pollen particles
  drawPollen(ctx, time);

  // Center glow on top
  drawCenterGlow(ctx, time);
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
