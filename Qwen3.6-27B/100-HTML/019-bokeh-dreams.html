<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bokeh Dreams</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a1a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(2rem,5vw,4rem);font-weight:200;color:rgba(255,255,255,0.15);letter-spacing:0.2em;text-transform:uppercase;pointer-events:none;z-index:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Bokeh</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,circles=[];
class Circle{constructor(){this.x=Math.random()*w;this.y=Math.random()*h;this.r=20+Math.random()*80;this.vx=(Math.random()-0.5)*0.3;this.vy=(Math.random()-0.5)*0.3;this.hue=Math.random()*360;this.alpha=0.05+Math.random()*0.15;this.phase=Math.random()*Math.PI*2}
update(){this.x+=this.vx;this.y+=this.vy;this.phase+=0.01;this.hue+=0.2;if(this.x<-this.r)this.x=w+this.r;if(this.x>w+this.r)this.x=-this.r;if(this.y<-this.r)this.y=h+this.r;if(this.y>h+this.r)this.y=-this.r}
draw(){const a=this.alpha+Math.sin(this.phase)*0.03;const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);g.addColorStop(0,`hsla(${this.hue},70%,70%,${a})`);g.addColorStop(0.7,`hsla(${this.hue},70%,50%,${a*0.5})`);g.addColorStop(1,`hsla(${this.hue},70%,40%,0)`);ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=`hsla(${this.hue},70%,70%,${a*0.3})`;ctx.lineWidth=0.5;ctx.stroke()}}
function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;circles=[];for(let i=0;i<40;i++)circles.push(new Circle())}
function animate(){ctx.fillStyle='rgba(10,10,26,0.08)';ctx.fillRect(0,0,w,h);circles.forEach(c=>{c.update();c.draw()});requestAnimationFrame(animate)}
window.addEventListener('resize',init);
init();animate();
</script>
</body>
</html>
