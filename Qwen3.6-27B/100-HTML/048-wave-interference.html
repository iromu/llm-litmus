<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Interference</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.info{position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:0.8rem;color:rgba(255,255,255,0.45);letter-spacing:0.12em;font-family:monospace;z-index:2;text-align:center;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,0.8)}
.sources{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:0.75rem;color:rgba(255,255,255,0.35);letter-spacing:0.1em;font-family:monospace;z-index:2;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,0.8)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="info">Click to add sources · Right-click to clear</div>
<div class="sources" id="sources"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const sourcesEl = document.getElementById('sources');

let W, H, imgData, buf;
const sources = [];
const WAVE_SPEED = 2.5;
const WAVE_FREQ = 6;
const DAMPING = 0.012;
const WAVE_AMPLITUDE = 1.0;
const PIXEL_SCALE = 2;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    imgData = ctx.createImageData(W, H);
    buf = imgData.data;
}

function addSource(x, y) {
    sources.push({ x, y, phase: Math.random() * Math.PI * 2 });
    updateSourcesDisplay();
}

function clearSources() {
    sources.length = 0;
    updateSourcesDisplay();
}

function updateSourcesDisplay() {
    sourcesEl.textContent = sources.length + ' source' + (sources.length !== 1 ? 's' : '');
}

function render(t) {
    const k = WAVE_FREQ;
    const omega = WAVE_FREQ * WAVE_SPEED;
    const maxBuf = W * H * 4;

    for (let y = 0; y < H; y += PIXEL_SCALE) {
        for (let x = 0; x < W; x += PIXEL_SCALE) {
            let amplitude = 0;

            for (let s = 0; s < sources.length; s++) {
                const src = sources[s];
                const dx = x - src.x;
                const dy = y - src.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const wave = Math.sin(k * dist - omega * t + src.phase);
                const damp = Math.exp(-DAMPING * dist);
                amplitude += wave * damp * WAVE_AMPLITUDE;
            }

            amplitude = Math.max(-2, Math.min(2, amplitude));

            let r, g, b;
            if (amplitude > 0.01) {
                const v = Math.min(1, amplitude / 2);
                r = Math.floor(20 + 235 * v);
                g = Math.floor(20 + 30 * (1 - Math.abs(v - 0.5) * 2));
                b = Math.floor(20 + 200 * (1 - v));
            } else if (amplitude < -0.01) {
                const v = Math.min(1, -amplitude / 2);
                r = Math.floor(20 + 30 * (1 - v));
                g = Math.floor(20 + 80 * v);
                b = Math.floor(20 + 235 * v);
            } else {
                r = 8;
                g = 8;
                b = 18;
            }

            const endY = Math.min(y + PIXEL_SCALE, H);
            const endX = Math.min(x + PIXEL_SCALE, W);
            for (let py = y; py < endY; py++) {
                const rowOff = py * W * 4;
                for (let px = x; px < endX; px++) {
                    const idx = rowOff + px * 4;
                    if (idx + 3 < maxBuf) {
                        buf[idx] = r;
                        buf[idx + 1] = g;
                        buf[idx + 2] = b;
                        buf[idx + 3] = 255;
                    }
                }
            }
        }
    }

    ctx.putImageData(imgData, 0, 0);

    for (let s = 0; s < sources.length; s++) {
        const src = sources[s];
        const pulse = 0.5 + 0.5 * Math.sin(omega * t + src.phase);
        const radius = 4 + pulse * 3;
        ctx.beginPath();
        ctx.arc(src.x, src.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.6 + pulse * 0.4})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(src.x, src.y, radius + 6, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,255,${0.15 + pulse * 0.1})`;
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    requestAnimationFrame(render);
}

canvas.addEventListener('click', (e) => {
    addSource(e.clientX, e.clientY);
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    clearSources();
});

window.addEventListener('resize', () => {
    resize();
});

resize();

const initialPositions = [
    { x: W * 0.35, y: H * 0.45 },
    { x: W * 0.65, y: H * 0.45 },
    { x: W * 0.5, y: H * 0.65 }
];
for (const pos of initialPositions) {
    addSource(pos.x, pos.y);
}

requestAnimationFrame(render);
</script>
</body>
</html>
