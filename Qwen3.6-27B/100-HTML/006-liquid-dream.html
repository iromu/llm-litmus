<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Dream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a1a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(3rem,8vw,6rem);font-weight:100;color:rgba(255,255,255,0.08);letter-spacing:0.2em;text-transform:uppercase;pointer-events:none;z-index:1}
.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:rgba(255,255,255,0.25);letter-spacing:0.15em;font-family:monospace;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Liquid Dream</div>
<div class="hint">click to shift palette</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,palette=0;
const palettes=[
[{r:120,g:50,b:200},{r:50,g:100,b:220}],
[{r:220,g:50,b:80},{r:255,g:120,b:30}],
[{r:30,g:180,b:160},{r:50,g:200,b:120}],
[{r:200,g:50,b:150},{r:150,g:30,b:200}]
];
class Blob{constructor(cx,cy,points,baseR){this.cx=cx;this.cy=cy;this.points=points;this.baseR=baseR;this.phase=Math.random()*Math.PI*2;this.speed=0.005+Math.random()*0.01;this.driftX=(Math.random()-0.5)*0.3;this.driftY=(Math.random()-0.5)*0.3;this.targetX=cx;this.targetX=cx;this.targetY=cy}
update(){this.phase+=this.speed;this.cx+=this.driftX;this.cy+=this.driftY;const dx=this.targetX-this.cx;const dy=this.targetY-this.cy;this.cx+=dx*0.001;this.cy+=dy*0.001}
draw(colors){ctx.beginPath();for(let i=0;i<=this.points;i++){const angle=(i/this.points)*Math.PI*2;const noise=Math.sin(angle*3+this.phase)*20+Math.cos(angle*5-this.phase*1.5)*15;const r=this.baseR+noise;const x=this.cx+Math.cos(angle)*r;const y=this.cy+Math.sin(angle)*r;if(i===0)ctx.moveTo(x,y);else{const prevAngle=((i-1)/this.points)*Math.PI*2;const prevNoise=Math.sin(prevAngle*3+this.phase)*20+Math.cos(prevAngle*5-this.phase*1.5)*15;const prevR=this.baseR+prevNoise;const mx=this.cx+Math.cos((angle+prevAngle)/2)*(prevR+r)/2;const my=this.cy+Math.sin((angle+prevAngle)/2)*(prevR+r)/2;ctx.quadraticCurveTo(mx,my,x,y)}}
ctx.closePath();const g=ctx.createRadialGradient(this.cx,this.cy,0,this.cx,this.cy,this.baseR+30);const c1=colors[0],c2=colors[1];g.addColorStop(0,`rgba(${c1.r},${c1.g},${c1.b},0.3)`);g.addColorStop(0.6,`rgba(${c2.r},${c2.g},${c2.b},0.15)`);g.addColorStop(1,`rgba(${c2.r},${c2.g},${c2.b},0)`);ctx.fillStyle=g;ctx.fill()}}
let blobs=[];
function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;blobs=[];const cx=w/2,cy=h/2;blobs.push(new Blob(cx-100,cy-50,12,120));blobs.push(new Blob(cx+120,cy+30,10,100));blobs.push(new Blob(cx,cy+80,14,90));blobs.push(new Blob(cx-50,cy-100,8,80));blobs.push(new Blob(cx+80,cy-70,11,70))}
function animate(){ctx.fillStyle='rgba(10,10,26,0.08)';ctx.fillRect(0,0,w,h);const colors=palettes[palette];blobs.forEach(b=>{b.update();b.draw(colors)});requestAnimationFrame(animate)}
c.addEventListener('click',()=>{palette=(palette+1)%palettes.length;init()});
window.addEventListener('resize',init);
init();animate();
</script>
</body>
</html>
