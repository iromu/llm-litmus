<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#060a14;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:1}
h1{font-size:clamp(2rem,5vw,4rem);font-weight:200;color:rgba(0,220,255,0.7);text-transform:uppercase;letter-spacing:0.3em;text-shadow:0 0 40px rgba(0,180,255,0.35)}
.stats{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.75rem;color:rgba(0,200,255,0.45);letter-spacing:0.15em;font-family:monospace;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
<h1>Data Flow</h1>
</div>
<div class="stats" id="stats"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;
const mouse={x:-2000,y:-2000,active:false};

/* ── configuration ── */
const LAYERS=5;
const NODES_PER_LAYER=[4,7,10,7,4];
const CONNECTION_DIST=220;
const MOUSE_RADIUS=180;
const MAX_PACKETS=80;
const SPAWN_RATE=0.08;
const PACKET_SPEED_MIN=0.003;
const PACKET_SPEED_MAX=0.008;

let nodes=[],packets=[],connections=[];

/* ── resize ── */
function resize(){
  W=c.width=window.innerWidth;
  H=c.height=window.innerHeight;
  buildGraph();
}

/* ── colour helpers ── */
function cyanHue(){return 175+Math.random()*30}
function packetColor(){
  const h=Math.random()<0.7?cyanHue():(220+Math.random()*40);
  const s=80+Math.random()*20;
  const l=55+Math.random()*20;
  return`hsl(${h},${s}%,${l}%)`;
}

/* ── node class ── */
class Node{
  constructor(x,y,layer,label){
    this.x=x;this.y=y;this.layer=layer;this.label=label;
    this.baseR=8+Math.random()*6;
    this.r=this.baseR;
    this.glow=0;
    this.phase=Math.random()*Math.PI*2;
    this.hue=cyanHue();
    this.pulseSpeed=0.015+Math.random()*0.01;
  }
  update(){
    this.phase+=this.pulseSpeed;
    const pulse=Math.sin(this.phase)*0.3+0.7;
    let target=this.baseR*pulse;
    const dx=this.x-mouse.x;
    const dy=this.y-mouse.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<MOUSE_RADIUS){
      this.glow+=(1-dist/MOUSE_RADIUS)*0.15;
      target+=6*(1-dist/MOUSE_RADIUS);
    }
    this.glow*=0.96;
    this.r+=(target-this.r)*0.1;
  }
  draw(){
    const intensity=Math.min(1,0.4+this.glow*2+Math.sin(this.phase)*0.15);
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*4);
    g.addColorStop(0,`hsla(${this.hue},90%,65%,${intensity*0.5})`);
    g.addColorStop(0.4,`hsla(${this.hue},80%,50%,${intensity*0.15})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.fillRect(this.x-this.r*4,this.y-this.r*4,this.r*8,this.r*8);
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.hue},85%,70%,${intensity})`;
    ctx.fill();
    ctx.strokeStyle=`hsla(${this.hue},90%,80%,${intensity*0.6})`;
    ctx.lineWidth=1.2;
    ctx.stroke();
    ctx.fillStyle=`hsla(${this.hue},80%,85%,${intensity*0.7})`;
    ctx.font=`${Math.max(9,this.r*0.8)}px monospace`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(this.label,this.x,this.y);
  }
}

/* ── packet class ── */
class Packet{
  constructor(from,to){
    this.from=from;this.to=to;
    this.progress=0;
    this.speed=PACKET_SPEED_MIN+Math.random()*(PACKET_SPEED_MAX-PACKET_SPEED_MIN);
    this.color=packetColor();
    this.trail=[];
    this.maxTrail=12+Math.floor(Math.random()*8);
    this.alive=true;
  }
  update(){
    this.progress+=this.speed;
    if(this.progress>=1){this.alive=false;return}
    const x=this.from.x+(this.to.x-this.from.x)*this.progress;
    const y=this.from.y+(this.to.y-this.from.y)*this.progress;
    this.trail.unshift({x,y});
    if(this.trail.length>this.maxTrail)this.trail.pop();
  }
  draw(){
    const x=this.from.x+(this.to.x-this.from.x)*this.progress;
    const y=this.from.y+(this.to.y-this.from.y)*this.progress;
    for(let i=0;i<this.trail.length;i++){
      const t=this.trail[i];
      const a=(1-i/this.trail.length)*0.6;
      const r=3*(1-i/this.trail.length);
      const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,r*3);
      g.addColorStop(0,this.color.replace(')',`,${a})`).replace('hsl','hsla'));
      g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
      ctx.fillRect(t.x-r*3,t.y-r*3,r*6,r*6);
    }
    const g=ctx.createRadialGradient(x,y,0,x,y,8);
    g.addColorStop(0,this.color.replace(')',',1)').replace('hsl','hsla'));
    g.addColorStop(0.5,this.color.replace(')',`,0.5)').replace('hsl','hsla'));
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.fillRect(x-8,y-8,16,16);
    ctx.beginPath();
    ctx.arc(x,y,2.5,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.fill();
  }
}

/* ── build layered graph ── */
function buildGraph(){
  nodes=[];packets=[];connections=[];
  const marginX=W*0.12;
  const marginY=H*0.15;
  const usableW=W-marginX*2;
  const usableH=H-marginY*2;
  const layerSpacing=usableH/(LAYERS-1);
  const labels='ABCDEFGHIJKLMNO';
  let idx=0;
  for(let l=0;l<LAYERS;l++){
    const count=NODES_PER_LAYER[l];
    const y=marginY+l*layerSpacing;
    const jitterX=usableW*0.08;
    for(let i=0;i<count;i++){
      const baseX=marginX+(count>1?usableW/(count-1)*i:usableW/2);
      const x=baseX+(Math.random()-0.5)*jitterX*2;
      const yj=y+(Math.random()-0.5)*layerSpacing*0.25;
      const label=labels[idx%labels.length]+(idx>=labels.length?Math.floor(idx/labels.length):'');
      nodes.push(new Node(x,yj,l,label));
      idx++;
    }
  }
  connections=[];
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x;
      const dy=nodes[i].y-nodes[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<CONNECTION_DIST){
        connections.push({from:i,to:j,dist,alpha:(1-dist/CONNECTION_DIST)*0.25});
      }
    }
  }
}

/* ── spawn packet ── */
function spawnPacket(){
  if(packets.length>=MAX_PACKETS||connections.length===0)return;
  const conn=connections[Math.floor(Math.random()*connections.length)];
  const reverse=Math.random()<0.5;
  const from=reverse?nodes[conn.to]:nodes[conn.from];
  const to=reverse?nodes[conn.from]:nodes[conn.to];
  packets.push(new Packet(from,to));
}

/* ── draw connections ── */
function drawConnections(){
  connections.forEach(conn=>{
    const a=conn.alpha;
    const f=nodes[conn.from];
    const t=nodes[conn.to];
    const mx=Math.max(f.glow,t.glow);
    const boosted=Math.min(0.6,a+mx*0.4);
    ctx.beginPath();
    ctx.moveTo(f.x,f.y);
    ctx.lineTo(t.x,t.y);
    ctx.strokeStyle=`rgba(0,180,220,${boosted})`;
    ctx.lineWidth=0.8;
    ctx.stroke();
  });
}

/* ── loop ── */
function animate(){
  ctx.fillStyle='rgba(6,10,20,0.12)';
  ctx.fillRect(0,0,W,H);
  drawConnections();
  nodes.forEach(n=>{n.update();n.draw()});
  if(Math.random()<SPAWN_RATE)spawnPacket();
  packets.forEach(p=>{p.update();p.draw()});
  packets=packets.filter(p=>p.alive);
  const activePackets=packets.length;
  const activeConns=connections.length;
  document.getElementById('stats').textContent=
    `${activePackets} packets · ${nodes.length} nodes · ${activeConns} links`;
  requestAnimationFrame(animate);
}

/* ── events ── */
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
c.addEventListener('mouseleave',()=>{mouse.active=false});
window.addEventListener('resize',()=>{resize()});
resize();
animate();
</script>
</body>
</html>
