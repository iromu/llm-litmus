<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Wave</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a1a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(2.5rem,6vw,5rem);font-weight:200;color:rgba(255,255,255,0.7);letter-spacing:0.15em;text-transform:uppercase;mix-blend-mode:overlay;pointer-events:none;z-index:1}
.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:rgba(255,255,255,0.25);letter-spacing:0.15em;font-family:monospace;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Chromatic Flow</div>
<div class="hint">click to shift palette</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,palette=0,time=0;
const palettes=[
['#ff6b9d','#c44dff','#6b5ce7','#00c8ff'],
['#00ff87','#ff00ff','#ff6b35','#7b2ff7'],
['#00f5d4','#00bbf9','#9b5de5','#f15bb5'],
['#ff9e00','#ff006e','#8338ec','#3a86ff'],
['#fb5607','#ffbe0b','#ff006e','#8338ec']
];
class Wave{constructor(i,total){this.i=i;this.total=total;this.amp=30+Math.random()*40;this.freq=0.005+Math.random()*0.01;this.speed=0.01+Math.random()*0.02;this.phase=Math.random()*Math.PI*2;this.yOff=h/2+(Math.random()-0.5)*200;this.amp2=15+Math.random()*20;this.freq2=0.01+Math.random()*0.02;this.speed2=0.008+Math.random()*0.015}
getY(x,t){return this.yOff+Math.sin(x*this.freq+t*this.speed+this.phase)*this.amp+Math.sin(x*this.freq2+t*this.speed2+this.phase)*this.amp2}
draw(t,color){ctx.beginPath();for(let x=0;x<=w;x+=2){const y=this.getY(x,t);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=color.replace(')',',0.08)').replace('rgb','rgba');ctx.fill();ctx.beginPath();for(let x=0;x<=w;x+=2){const y=this.getY(x,t);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=color.replace(')',',0.3)').replace('rgb','rgba');ctx.lineWidth=1.5;ctx.stroke()}}
let waves=[];
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${r},${g},${b})`}
function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;waves=[];const colors=palettes[palette];for(let i=0;i<8;i++)waves.push(new Wave(i,8))}
function animate(){time++;ctx.fillStyle='rgba(10,10,26,0.15)';ctx.fillRect(0,0,w,h);const colors=palettes[palette];waves.forEach((w,i)=>{const color=hexToRgb(colors[i%colors.length]);w.draw(time,color)});requestAnimationFrame(animate)}
c.addEventListener('click',()=>{palette=(palette+1)%palettes.length});
window.addEventListener('resize',init);
init();animate();
</script>
</body>
</html>
