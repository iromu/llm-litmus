<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Helix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#06060f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:1}
h1{font-size:clamp(1.5rem,4vw,3rem);font-weight:200;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.4em;text-shadow:0 0 40px rgba(100,180,255,0.2)}
.subtitle{font-size:0.7rem;color:rgba(255,255,255,0.25);letter-spacing:0.2em;margin-top:12px}
.legend{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:20px;font-size:0.65rem;color:rgba(255,255,255,0.35);letter-spacing:0.1em;font-family:monospace;z-index:2}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
<h1>Double Helix</h1>
<div class="subtitle">drag to twist</div>
</div>
<div class="legend">
<span><span class="dot" style="background:#ff4757"></span>A</span>
<span><span class="dot" style="background:#2ed573"></span>T</span>
<span><span class="dot" style="background:#1e90ff"></span>G</span>
<span><span class="dot" style="background:#ffa502"></span>C</span>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,rotation=0,twist=0,mouseX=0,mouseY=0,dragging=false,lastMouseX=0,autoRotate=0.003;
const BASES=['A','T','G','C'];
const COLORS={A:'#ff4757',T:'#2ed573',G:'#1e90ff',C:'#ffa502'};
const PAIRS={A:'T',T:'A',G:'C',C:'G'};
const HELIX_RADIUS=120,TURN_HEIGHT=160,NUM_TURNS=5,NODES_PER_TURN=12;
const TOTAL_NODES=NUM_TURNS*NODES_PER_TURN;
const nodes=[];
for(let i=0;i<TOTAL_NODES;i++){const t=i/NODES_PER_TURN;const base=BASES[i%4];nodes.push({base,pair:PAIRS[base],t})}
function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
function project(x,y,z){const fov=800;const scale=fov/(fov+z);return{x:x*scale+w/2,y:y*scale+h/2,s:scale}}
function drawGlow(){const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.min(w,h)*0.5);g.addColorStop(0,'rgba(30,60,120,0.15)');g.addColorStop(0.5,'rgba(15,30,60,0.08)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function drawBasePair(x1,y1,s1,x2,y2,s2,color1,color2,alpha){const mx=(x1+x2)/2,my=(y1+y2)/2;const dx=x2-x1,dy=y2-y1;const len=Math.sqrt(dx*dx+dy*dy);if(len<5)return;ctx.save();ctx.globalAlpha=alpha*0.6;ctx.beginPath();ctx.moveTo(x1,y1);const cx=mx+(dy/len)*15*0.3,cy=my-(dx/len)*15*0.3;ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.strokeStyle=`rgba(255,255,255,${alpha*0.3})`;ctx.lineWidth=1.5*s1;ctx.stroke();ctx.restore();ctx.save();ctx.globalAlpha=alpha*0.4;ctx.beginPath();ctx.arc(mx,my,2*s1,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();ctx.restore()}
function drawNode(x,y,r,color,alpha,glow){ctx.save();ctx.globalAlpha=alpha;if(glow){ctx.shadowColor=color;ctx.shadowBlur=15}ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.restore();ctx.save();ctx.globalAlpha=alpha*0.3;ctx.beginPath();ctx.arc(x,y,r*2.5,0,Math.PI*2);const g=ctx.createRadialGradient(x,y,0,x,y,r*2.5);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fill();ctx.restore()}
function drawStrand(points,color,alpha){if(points.length<2)return;ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++){const prev=points[i-1],curr=points[i];const cpx=(prev.x+curr.x)/2;const cpy=(prev.y+curr.y)/2;ctx.quadraticCurveTo(cpx,cpy,curr.x,curr.y)}ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function render(){ctx.fillStyle='rgba(6,6,15,1)';ctx.fillRect(0,0,w,h);drawGlow();const cx=w/2,cy=h/2;const strand1=[],strand2=[];const depthSorted=[];for(let i=0;i<TOTAL_NODES;i++){const node=nodes[i];const angle=node.t*Math.PI*2+rotation+twist*Math.sin(node.t*Math.PI);const zAngle=angle;const x1=Math.cos(zAngle)*HELIX_RADIUS;const y1=(node.t-NUM_TURNS/2)*TURN_HEIGHT;const z1=Math.sin(zAngle)*HELIX_RADIUS;const x2=Math.cos(zAngle+Math.PI)*HELIX_RADIUS;const y2=y1;const z2=Math.sin(zAngle+Math.PI)*HELIX_RADIUS;const p1=project(x1,y1,z1+400);const p2=project(x2,y2,z2+400);depthSorted.push({i,p1,p2,z1,z2,color1:COLORS[node.base],color2:COLORS[node.pair],base1:node.base,base2:node.pair});strand1.push(p1);strand2.push(p2)}depthSorted.sort((a,b)=>(a.z1+a.z2)/2-(b.z1+b.z2)/2);for(const d of depthSorted){const avgZ=(d.z1+d.z2)/2;const alpha=Math.max(0.15,Math.min(1,(avgZ+HELIX_RADIUS)/(HELIX_RADIUS*2)));const r1=Math.max(2,6*d.p1.s);const r2=Math.max(2,6*d.p2.s);drawBasePair(d.p1.x,d.p1.y,d.p1.s,d.p2.x,d.p2.y,d.p2.s,d.color1,d.color2,alpha);drawNode(d.p1.x,d.p1.y,r1,d.color1,alpha,true);drawNode(d.p2.x,d.p2.y,r2,d.color2,alpha,true)}drawStrand(strand1,'rgba(255,255,255,0.08)',0.4);drawStrand(strand2,'rgba(255,255,255,0.08)',0.4)}
function animate(){rotation+=autoRotate;if(!dragging){twist*=0.95;autoRotate+=(0.003-autoRotate)*0.01}else{autoRotate*=0.98}render();requestAnimationFrame(animate)}
c.addEventListener('mousedown',e=>{dragging=true;lastMouseX=e.clientX;mouseX=e.clientX});
c.addEventListener('mousemove',e=>{if(dragging){const dx=e.clientX-lastMouseX;twist+=dx*0.005;lastMouseX=e.clientX}});
c.addEventListener('mouseup',()=>{dragging=false});
c.addEventListener('mouseleave',()=>{dragging=false});
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;lastMouseX=e.touches[0].clientX},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging){const dx=e.touches[0].clientX-lastMouseX;twist+=dx*0.005;lastMouseX=e.touches[0].clientX}},{passive:false});
c.addEventListener('touchend',()=>{dragging=false});
window.addEventListener('resize',resize);resize();animate();
</script>
</body>
</html>
