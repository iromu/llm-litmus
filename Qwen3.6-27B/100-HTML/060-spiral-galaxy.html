<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#020208;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,cx,cy,scale;
const STAR_COUNT=5000;
const ARM_COUNT=3;
const ARM_SPREAD=0.45;
const STARS=[];
const DUST_LANES=[];
const NEBULAE=[];

function init(){
W=c.width=window.innerWidth;
H=c.height=window.innerHeight;
cx=W/2;cy=H/2;
scale=Math.min(W,H)*0.0035;
generateStars();
generateDustLanes();
generateNebulae();
}

function generateStars(){
STARS.length=0;
for(let i=0;i<STAR_COUNT;i++){
const arm=Math.floor(Math.random()*ARM_COUNT);
const armAngle=(arm/ARM_COUNT)*Math.PI*2;
const r=Math.pow(Math.random(),0.6)*Math.min(W,H)*0.42;
const logSpiralAngle=Math.log(1+r*0.008)*2.5;
const spread=(Math.random()-0.5)*ARM_SPREAD*(1+r*0.003);
const angle=armAngle+logSpiralAngle+spread;
const x=cx+Math.cos(angle)*r;
const y=cy+Math.sin(angle)*r;
const distFromCenter=r/Math.min(W,H)*0.42;
const color=starColor(distFromCenter);
const brightness=0.3+Math.random()*0.7;
const size=(1-distFromCenter*0.6)*(0.5+Math.random()*2.2);
const twinkleSpeed=0.5+Math.random()*3;
const twinklePhase=Math.random()*Math.PI*2;
STARS.push({x,y,color,size,brightness,twinkleSpeed,twinklePhase,distFromCenter});
}
}

function starColor(dist){
if(dist<0.15){
const t=Math.random();
if(t<0.5)return{r:255,g:220+Math.random()*35|0,b:150+Math.random()*60|0};
return{r:255,g:200+Math.random()*55|0,b:120+Math.random()*50|0};
}else if(dist<0.35){
const t=Math.random();
if(t<0.6)return{r:255,g:210+Math.random()*45|0,b:160+Math.random()*50|0};
return{r:180+Math.random()*40|0,g:190+Math.random()*40|0,b:255};
}else if(dist<0.55){
const t=Math.random();
if(t<0.4)return{r:200+Math.random()*55|0,g:200+Math.random()*55|0,b:255};
if(t<0.7)return{r:150+Math.random()*50|0,g:180+Math.random()*50|0,b:255};
return{r:255,g:220+Math.random()*35|0,b:160+Math.random()*60|0};
}else{
const t=Math.random();
if(t<0.5)return{r:140+Math.random()*60|0,g:170+Math.random()*60|0,b:255};
if(t<0.8)return{r:170+Math.random()*50|0,g:190+Math.random()*50|0,b:255};
return{r:255,g:230+Math.random()*25|0,b:180+Math.random()*40|0};
}
}

function generateDustLanes(){
DUST_LANES.length=0;
for(let i=0;i<ARM_COUNT;i++){
const armAngle=(i/ARM_COUNT)*Math.PI*2;
const points=[];
const steps=80;
for(let s=0;s<steps;s++){
const r=(s/steps)*Math.min(W,H)*0.4;
const logSpiralAngle=Math.log(1+r*0.008)*2.5;
const angle=armAngle+logSpiralAngle+0.08;
points.push({x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r});
}
DUST_LANES.push(points);
}
}

function generateNebulae(){
NEBULAE.length=0;
const colors=[
{r:60,g:40,b:180},{r:120,g:30,b:150},
{r:40,g:80,b:200},{r:180,g:50,b:100},
{r:30,g:120,b:180},{r:100,g:40,b:140}
];
for(let i=0;i<6;i++){
const angle=Math.random()*Math.PI*2;
const r=Math.random()*Math.min(W,H)*0.25;
NEBULAE.push({
x:cx+Math.cos(angle)*r,
y:cy+Math.sin(angle)*r,
radius:80+Math.random()*160,
color:colors[i%colors.length],
alpha:0.02+Math.random()*0.03
});
}
}

let rotation=0;
function drawBackground(){
ctx.fillStyle='#020208';
ctx.fillRect(0,0,W,H);
NEBULAE.forEach(n=>{
const grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.radius);
grad.addColorStop(0,`rgba(${n.color.r},${n.color.g},${n.color.b},${n.alpha})`);
grad.addColorStop(0.5,`rgba(${n.color.r},${n.color.g},${n.color.b},${n.alpha*0.4})`);
grad.addColorStop(1,`rgba(${n.color.r},${n.color.g},${n.color.b},0)`);
ctx.fillStyle=grad;
ctx.fillRect(n.x-n.radius,n.y-n.radius,n.radius*2,n.radius*2);
});
}

function drawGalacticCenter(){
const maxR=Math.min(W,H)*0.06;
const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR);
grad.addColorStop(0,'rgba(255,245,220,0.9)');
grad.addColorStop(0.15,'rgba(255,220,160,0.6)');
grad.addColorStop(0.4,'rgba(255,180,100,0.25)');
grad.addColorStop(0.7,'rgba(200,120,80,0.08)');
grad.addColorStop(1,'rgba(100,60,40,0)');
ctx.fillStyle=grad;
ctx.beginPath();
ctx.arc(cx,cy,maxR,0,Math.PI*2);
ctx.fill();
const coreGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR*3);
coreGrad.addColorStop(0,'rgba(255,230,180,0.15)');
coreGrad.addColorStop(0.5,'rgba(255,180,100,0.04)');
coreGrad.addColorStop(1,'rgba(200,120,80,0)');
ctx.fillStyle=coreGrad;
ctx.beginPath();
ctx.arc(cx,cy,maxR*3,0,Math.PI*2);
ctx.fill();
}

function drawDustLanes(){
ctx.save();
DUST_LANES.forEach(lane=>{
if(lane.length<3)return;
ctx.beginPath();
ctx.moveTo(lane[0].x,lane[0].y);
for(let i=1;i<lane.length-1;i++){
const xc=(lane[i].x+lane[i+1].x)/2;
const yc=(lane[i].y+lane[i+1].y)/2;
ctx.quadraticCurveTo(lane[i].x,lane[i].y,xc,yc);
}
ctx.strokeStyle='rgba(15,10,25,0.12)';
ctx.lineWidth=scale*18;
ctx.lineCap='round';
ctx.stroke();
ctx.strokeStyle='rgba(20,12,30,0.08)';
ctx.lineWidth=scale*35;
ctx.stroke();
});
ctx.restore();
}

function drawStars(time){
STARS.forEach(star=>{
const rx=star.x-cx;
const ry=star.y-cy;
const nx=rx*Math.cos(rotation)-ry*Math.sin(rotation)+cx;
const ny=rx*Math.sin(rotation)+ry*Math.cos(rotation)+cy;
const twinkle=0.6+0.4*Math.sin(time*star.twinkleSpeed+star.twinklePhase);
const alpha=star.brightness*twinkle;
const sz=star.size*(0.8+twinkle*0.2);
ctx.beginPath();
ctx.arc(nx,ny,sz,0,Math.PI*2);
ctx.fillStyle=`rgba(${star.color.r},${star.color.g},${star.color.b},${alpha})`;
ctx.fill();
if(sz>1.2){
const glow=ctx.createRadialGradient(nx,ny,0,nx,ny,sz*3);
glow.addColorStop(0,`rgba(${star.color.r},${star.color.g},${star.color.b},${alpha*0.3})`);
glow.addColorStop(1,`rgba(${star.color.r},${star.color.g},${star.color.b},0)`);
ctx.fillStyle=glow;
ctx.beginPath();
ctx.arc(nx,ny,sz*3,0,Math.PI*2);
ctx.fill();
}
});
}

function drawCenterStars(time){
for(let i=0;i<300;i++){
const angle=Math.random()*Math.PI*2;
const r=Math.pow(Math.random(),1.5)*Math.min(W,H)*0.05;
const x=cx+Math.cos(angle+rotation*2)*r;
const y=cy+Math.sin(angle+rotation*2)*r;
const twinkle=0.5+0.5*Math.sin(time*2+i*0.1);
const alpha=0.3+twinkle*0.7;
const sz=0.3+Math.random()*1.5;
const warm=Math.random();
const cr=255;
const cg=200+warm*55|0;
const cb=120+warm*80|0;
ctx.beginPath();
ctx.arc(x,y,sz,0,Math.PI*2);
ctx.fillStyle=`rgba(${cr},${cg},${cb},${alpha})`;
ctx.fill();
}
}

function animate(ts){
const time=ts/1000;
rotation+=0.0008;
drawBackground();
drawGalacticCenter();
drawDustLanes();
drawStars(time);
drawCenterStars(time);
requestAnimationFrame(animate);
}

window.addEventListener('resize',init);
init();
requestAnimationFrame(animate);
</script>
</body>
</html>
