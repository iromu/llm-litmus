<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Letterforms</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a1a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:rgba(255,255,255,0.2);letter-spacing:0.15em;font-family:monospace;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">move mouse to repel · click to reshuffle</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,mouse={x:-1000,y:-1000};
const word='KINETIC';
class Letter{constructor(char,targetX,targetY,isMain){this.char=char;this.x=targetX+Math.random()*40-20;this.y=targetY+Math.random()*40-20;this.targetX=targetX;this.targetY=targetY;this.vx=0;this.vy=0;this.isMain=isMain;this.size=isMain?48+Math.random()*12:16+Math.random()*12;this.rotation=Math.random()*0.4-0.2;this.targetRotation=0;this.phase=Math.random()*Math.PI*2;this.glow=0}
update(){const dx=this.targetX-this.x;const dy=this.targetY-this.y;this.vx+=dx*0.03;this.vy+=dy*0.03;this.vx*=0.85;this.vy*=0.85;this.x+=this.vx;this.y+=this.vy;this.phase+=0.03;this.glow=0;const mdx=this.x-mouse.x;const mdy=this.y-mouse.y;const mdist=Math.sqrt(mdx*mdx+mdy*mdy);if(mdist<200){const force=(200-mdist)/200;this.vx-=mdx/mdist*force*8;this.vy-=mdy/mdist*force*8;this.glow=force;this.rotation+=(Math.random()-0.5)*0.1}}
draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation+Math.sin(this.phase)*0.05);ctx.font=`${this.isMain?700:300} ${this.size}px -apple-system,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';if(this.glow>0.1){ctx.shadowColor='rgba(150,200,255,0.8)';ctx.shadowBlur=this.glow*20}else{ctx.shadowColor='transparent';ctx.shadowBlur=0}const alpha=this.isMain?0.9:0.3;ctx.fillStyle=`rgba(200,220,255,${alpha})`;ctx.fillText(this.char,0,0);ctx.restore();this.rotation*=0.9}}
let letters=[];
function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;letters=[];const totalWidth=word.length*55;const startX=w/2-totalWidth/2;const y=h/2;word.split('').forEach((char,i)=>{letters.push(new Letter(char,startX+i*55,y,true))});for(let i=0;i<30;i++){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const char=chars[Math.floor(Math.random()*chars.length)];letters.push(new Letter(char,Math.random()*w,Math.random()*h,false))}}
function drawConnections(){for(let i=0;i<letters.length;i++){if(!letters[i].isMain)continue;for(let j=i+1;j<letters.length;j++){if(!letters[j].isMain)continue;const dx=letters[i].x-letters[j].x;const dy=letters[i].y-letters[j].y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){const a=(1-dist/100)*0.2;ctx.beginPath();ctx.moveTo(letters[i].x,letters[i].y);ctx.lineTo(letters[j].x,letters[j].y);ctx.strokeStyle=`rgba(150,200,255,${a})`;ctx.lineWidth=1;ctx.stroke()}}}}
function animate(){ctx.fillStyle='rgba(10,10,26,0.15)';ctx.fillRect(0,0,w,h);letters.forEach(l=>{l.update();l.draw()});drawConnections();requestAnimationFrame(animate)}
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
c.addEventListener('mouseleave',()=>{mouse.x=-1000;mouse.y=-1000});
c.addEventListener('click',()=>{init()});
window.addEventListener('resize',init);
init();animate();
</script>
</body>
</html>
