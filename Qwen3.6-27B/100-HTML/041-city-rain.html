<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Rain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#000;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,streetY,buildings=[],windows=[],neonSigns=[],raindrops=[],cars=[],splashes=[];
const NEON_PINK='#ff2d7b',NEON_CYAN='#00f0ff',NEON_PURPLE='#b44dff',NEON_YELLOW='#ffe04a',NEON_GREEN='#39ff14';
const NEONS=[NEON_PINK,NEON_CYAN,NEON_PURPLE,NEON_YELLOW,NEON_GREEN];
let time=0;

function resize(){
W=c.width=window.innerWidth;H=c.height=window.innerHeight;
streetY=H*0.68;
generateCity();
initRain();
}

function generateCity(){
buildings=[];windows=[];neonSigns=[];
const count=Math.floor(W/60)+Math.floor(Math.random()*8)+12;
let x=0;
for(let i=0;i<count;i++){
const bw=40+Math.random()*70;
const bh=80+Math.random()*Math.min(H*0.45,350);
const bx=x;
const by=streetY-bh;
const shade=Math.random()*0.15+0.05;
buildings.push({x:bx,y:by,w:bw,h:bh,shade});
const cols=Math.floor(bw/18);
const rows=Math.floor(bh/22);
for(let r=0;r<rows;r++){
for(let col=0;cols>col;col++){
if(Math.random()>0.35){
const lit=Math.random()>0.4;
const warmth=Math.random();
const wc=lit?(warmth>0.5?[255,220,120]:[180,210,255]):[20,25,40];
const wa=lit?(0.3+Math.random()*0.5):0.08;
windows.push({x:bx+8+col*18,y:by+10+r*22,w:10,h:14,c:wc,a:wa,lit,
flicker:Math.random()*0.008+0.002,phase:Math.random()*Math.PI*2});
}}
if(Math.random()>0.55){
const nc=NEONS[Math.floor(Math.random()*NEONS.length)];
const nsx=bx+Math.random()*bw*0.6+bw*0.1;
const nsy=by+Math.random()*bh*0.3+20;
const nsw=30+Math.random()*60;
const nsh=8+Math.random()*14;
const ntype=Math.floor(Math.random()*3);
neonSigns.push({x:nsx,y:nsy,w:nsw,h:nsh,color:nc,type:ntype,
flickerTimer:Math.random()*200,flickerDur:Math.random()*8+2,
on:true,brightness:0.8+Math.random()*0.2,phase:Math.random()*Math.PI*2});
}
x+=bw+Math.random()*15+5;
if(x>W+100)break;
}
}

function initRain(){
raindrops=[];
const count=Math.floor(W*0.8);
for(let i=0;i<count;i++){
raindrops.push({
x:Math.random()*W*1.2-W*0.1,
y:Math.random()*H,
speed:12+Math.random()*10,
length:15+Math.random()*25,
opacity:0.15+Math.random()*0.35,
wind:2.5+Math.random()*1.5
});
}
}

function initCars(){
cars=[];
for(let i=0;i<3;i++){
cars.push(createCar());
}
}

function createCar(){
const dir=Math.random()>0.5?1:-1;
const lane=Math.random()>0.5?streetY-4:streetY+12;
const color=Math.random()>0.5?'#ff3344':'#ffffff';
return{
x:dir>0?-80:W+80,
y:lane,
speed:(2+Math.random()*3)*dir,
color,
length:40+Math.random()*30,
headlight:Math.random()>0.3?'#ffffff':'#ffcc44',
tailColor:'#ff2233'
};
}

function drawSky(){
const g=ctx.createLinearGradient(0,0,0,streetY);
g.addColorStop(0,'#050510');
g.addColorStop(0.3,'#0a0a1e');
g.addColorStop(0.6,'#0f0f28');
g.addColorStop(1,'#151530');
ctx.fillStyle=g;
ctx.fillRect(0,0,W,streetY);
const fog=ctx.createLinearGradient(0,streetY-80,0,streetY);
fog.addColorStop(0,'transparent');
fog.addColorStop(1,'rgba(15,15,35,0.6)');
ctx.fillStyle=fog;
ctx.fillRect(0,streetY-80,W,80);
}

function drawBuildings(){
buildings.forEach(b=>{
const g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);
const base=b.shade;
g.addColorStop(0,`rgb(${Math.floor(18+base*40)},${Math.floor(18+base*35)},${Math.floor(30+base*30)})`);
g.addColorStop(1,`rgb(${Math.floor(12+base*25)},${Math.floor(12+base*20)},${Math.floor(22+base*20)})`);
ctx.fillStyle=g;
ctx.fillRect(b.x,b.y,b.w,b.h);
ctx.strokeStyle=`rgba(25,25,50,0.4)`;
ctx.lineWidth=0.5;
ctx.strokeRect(b.x,b.y,b.w,b.h);
ctx.fillStyle=`rgba(30,30,55,0.5)`;
ctx.fillRect(b.x,b.y,b.w,3);
ctx.fillRect(b.x,b.y,2,b.h);
});
}

function drawWindows(){
windows.forEach(w=>{
w.phase+=w.flicker;
if(w.lit&&Math.random()<0.0003)w.lit=!w.lit;
const flicker=w.lit?Math.sin(w.phase)*0.08:0;
const a=Math.max(0.05,w.a+flicker);
const[r,g2,b2]=w.c;
ctx.fillStyle=`rgba(${r},${g2},${b2},${a})`;
ctx.fillRect(w.x,w.y,w.w,w.h);
if(w.lit){
const glow=ctx.createRadialGradient(w.x+w.w/2,w.y+w.h/2,0,w.x+w.w/2,w.y+w.h/2,w.w*2);
glow.addColorStop(0,`rgba(${r},${g2},${b2},${a*0.15})`);
glow.addColorStop(1,'transparent');
ctx.fillStyle=glow;
ctx.fillRect(w.x-w.w,w.y-w.h,w.w*3,w.h*3);
}
});
}

function drawNeonSigns(){
neonSigns.forEach(n=>{
n.phase+=0.03;
n.flickerTimer++;
if(n.flickerTimer>n.flickerDur+Math.random()*150){
n.flickerTimer=0;
if(Math.random()<0.15){
n.on=!n.on;
n.flickerDur=Math.random()*6+1;
}
}
const base=n.on?n.brightness:0.05;
const pulse=Math.sin(n.phase)*0.1;
const brightness=Math.max(0.02,base+pulse);
if(n.type===0){
ctx.save();
ctx.shadowColor=n.color;
ctx.shadowBlur=20*brightness;
ctx.fillStyle=n.color;
ctx.globalAlpha=brightness;
ctx.fillRect(n.x,n.y,n.w,n.h);
ctx.shadowBlur=40*brightness;
ctx.fillRect(n.x,n.y,n.w,n.h);
ctx.restore();
ctx.save();
ctx.globalAlpha=brightness*0.4;
ctx.fillStyle=n.color;
ctx.fillRect(n.x-2,n.y-2,n.w+4,n.h+4);
ctx.restore();
}else if(n.type===1){
ctx.save();
ctx.shadowColor=n.color;
ctx.shadowBlur=15*brightness;
ctx.strokeStyle=n.color;
ctx.lineWidth=2;
ctx.globalAlpha=brightness;
ctx.strokeRect(n.x,n.y,n.w,n.h);
ctx.shadowBlur=30*brightness;
ctx.strokeRect(n.x,n.y,n.w,n.h);
ctx.restore();
}else{
ctx.save();
ctx.shadowColor=n.color;
ctx.shadowBlur=25*brightness;
ctx.fillStyle=n.color;
ctx.globalAlpha=brightness;
ctx.font=`bold ${Math.floor(n.h*0.8)}px monospace`;
const chars='NEONBARCYBER2077DATA';
const label=chars.substring(Math.floor(n.x)%chars.length,Math.floor(n.x)%chars.length+Math.floor(n.w/8));
ctx.fillText(label,n.x,n.y+n.h*0.75);
ctx.shadowBlur=45*brightness;
ctx.fillText(label,n.x,n.y+n.h*0.75);
ctx.restore();
}
const reflectionY=streetY+(streetY-n.y);
if(reflectionY<H){
ctx.save();
ctx.globalAlpha=brightness*0.12;
ctx.shadowColor=n.color;
ctx.shadowBlur=15*brightness;
ctx.fillStyle=n.color;
if(n.type===0){
ctx.fillRect(n.x,reflectionY,n.w,n.h*0.5);
}else{
ctx.strokeStyle=n.color;
ctx.lineWidth=1.5;
ctx.strokeRect(n.x,reflectionY,n.w,n.h*0.5);
}
ctx.restore();
}
});
}

function drawStreet(){
const g=ctx.createLinearGradient(0,streetY,0,H);
g.addColorStop(0,'#1a1a2e');
g.addColorStop(0.3,'#151528');
g.addColorStop(1,'#0a0a18');
ctx.fillStyle=g;
ctx.fillRect(0,streetY,W,H-streetY);
ctx.strokeStyle='rgba(255,200,50,0.15)';
ctx.lineWidth=1;
ctx.setLineDash([20,15]);
ctx.beginPath();
ctx.moveTo(0,streetY+6);
ctx.lineTo(W,streetY+6);
ctx.stroke();
ctx.setLineDash([]);
ctx.strokeStyle='rgba(255,255,255,0.06)';
ctx.lineWidth=0.5;
ctx.beginPath();
ctx.moveTo(0,streetY);
ctx.lineTo(W,streetY);
ctx.stroke();
}

function drawReflections(){
const shimmer=Math.sin(time*0.01)*0.02;
neonSigns.forEach(n=>{
if(!n.on)return;
const ry=streetY+5;
const rw=n.w*1.5;
const rx=n.x-n.w*0.25+Math.sin(time*0.02+n.phase)*3;
const grad=ctx.createLinearGradient(rx,ry,rx,ry+80);
const alpha=0.06+shimmer;
grad.addColorStop(0,n.color);
grad.addColorStop(1,'transparent');
ctx.save();
ctx.globalAlpha=alpha*n.brightness;
ctx.fillStyle=grad;
ctx.fillRect(rx,ry,rw,80);
ctx.restore();
});
buildings.forEach(b=>{
const wCount=windows.filter(w=>w.lit&&w.x>=b.x&&w.x<b.x+b.w).length;
if(wCount>3){
const cx=b.x+b.w/2;
const grad=ctx.createRadialGradient(cx,streetY+20,0,cx,streetY+60,b.w);
grad.addColorStop(0,'rgba(255,220,140,0.03)');
grad.addColorStop(1,'transparent');
ctx.fillStyle=grad;
ctx.fillRect(b.x,streetY,b.w,80);
}
});
}

function drawRain(){
raindrops.forEach(r=>{
r.y+=r.speed;
r.x+=r.wind;
if(r.y>H){
r.y=-r.length;
r.x=Math.random()*W*1.2-W*0.1;
if(Math.random()<0.02){
splashes.push({x:r.x,y:H-3,r:0,maxR:3+Math.random()*4,life:1});
}
}
if(r.x>W+50){r.x=-20;r.y=Math.random()*H;}
ctx.save();
ctx.globalAlpha=r.opacity;
ctx.strokeStyle='rgba(180,200,230,0.6)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.moveTo(r.x,r.y);
ctx.lineTo(r.x+r.wind*2,r.y-r.length);
ctx.stroke();
ctx.restore();
});
}

function drawSplashes(){
for(let i=splashes.length-1;i>=0;i--){
const s=splashes[i];
s.r+=0.3;
s.life-=0.06;
if(s.life<=0){splashes.splice(i,1);continue;}
ctx.save();
ctx.globalAlpha=s.life*0.3;
ctx.strokeStyle='rgba(180,200,230,0.5)';
ctx.lineWidth=0.5;
ctx.beginPath();
ctx.ellipse(s.x,s.y,s.r,s.r*0.3,0,0,Math.PI*2);
ctx.stroke();
ctx.restore();
}
}

function drawCars(){
if(cars.length<2&&Math.random()<0.005){
cars.push(createCar());
}
for(let i=cars.length-1;i>=0;i--){
const car=cars[i];
car.x+=car.speed;
if((car.speed>0&&car.x>W+200)||(car.speed<0&&car.x<-200)){
cars.splice(i,1);
continue;
}
ctx.save();
ctx.shadowColor=car.headlight;
ctx.shadowBlur=30;
const hlDir=car.speed>0?1:-1;
const hlX=car.x+car.length/2*hlDir;
const hlGrad=ctx.createRadialGradient(hlX,car.y,0,hlX+hlDir*60,car.y,80);
hlGrad.addColorStop(0,car.headlight);
hlGrad.addColorStop(0.3,'rgba(255,255,220,0.3)');
hlGrad.addColorStop(1,'transparent');
ctx.globalAlpha=0.8;
ctx.fillStyle=hlGrad;
ctx.beginPath();
ctx.ellipse(hlX+hlDir*30,car.y,70,12,0,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
ctx.globalAlpha=0.9;
ctx.fillStyle=car.color;
ctx.beginPath();
ctx.arc(hlX,car.y,3,0,Math.PI*2);
ctx.fill();
ctx.shadowColor=car.tailColor;
ctx.shadowBlur=15;
const tlX=car.x-car.length/2*hlDir;
ctx.fillStyle=car.tailColor;
ctx.beginPath();
ctx.arc(tlX,car.y,2,0,Math.PI*2);
ctx.fill();
const tailGrad=ctx.createRadialGradient(tlX,car.y,0,tlX-hlDir*40,car.y,40);
tailGrad.addColorStop(0,'rgba(255,30,30,0.4)');
tailGrad.addColorStop(1,'transparent');
ctx.shadowBlur=0;
ctx.fillStyle=tailGrad;
ctx.beginPath();
ctx.ellipse(tlX-hlDir*20,car.y,40,8,0,0,Math.PI*2);
ctx.fill();
ctx.restore();
const reflGrad=ctx.createLinearGradient(car.x,streetY,car.x,streetY+30);
reflGrad.addColorStop(0,car.headlight);
reflGrad.addColorStop(1,'transparent');
ctx.save();
ctx.globalAlpha=0.08;
ctx.fillStyle=reflGrad;
ctx.fillRect(car.x-30,streetY,60,30);
ctx.restore();
}
}

function drawRainOverlay(){
const g=ctx.createLinearGradient(0,0,W*0.3,H);
g.addColorStop(0,'rgba(100,120,160,0.03)');
g.addColorStop(0.5,'rgba(100,120,160,0.05)');
g.addColorStop(1,'rgba(100,120,160,0.03)');
ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);
}

function drawVignette(){
const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.8);
g.addColorStop(0,'transparent');
g.addColorStop(1,'rgba(0,0,0,0.5)');
ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);
}

function animate(){
time++;
ctx.clearRect(0,0,W,H);
drawSky();
drawBuildings();
drawWindows();
drawNeonSigns();
drawStreet();
drawReflections();
drawCars();
drawRain();
drawSplashes();
drawRainOverlay();
drawVignette();
requestAnimationFrame(animate);
}

initCars();
window.addEventListener('resize',resize);
resize();
animate();
</script>
</body>
</html>
