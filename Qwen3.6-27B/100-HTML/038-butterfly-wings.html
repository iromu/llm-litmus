<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Butterfly Wings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#06060f;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Wing shape definition (right half, mirrored at runtime) ---
// Each wing is defined by a series of bezier control points forming the upper and lower edges.
// The points are relative to the wing root (0, 0), which sits at the butterfly's center.
function wingShape(t) {
  // t goes from 0 (root) to 1 (tip)
  // Returns { upperX, upperY, lowerX, lowerY } for the right wing
  const u = t;
  const upperX = u * 1.0;
  const upperY = -0.3 * Math.sin(u * Math.PI * 0.9) * (1 - u * 0.3);
  const lowerX = u * 0.85;
  const lowerY = 0.25 * Math.sin(u * Math.PI * 0.85) * (1 - u * 0.2);
  return { upperX, upperY, lowerX, lowerY };
}

// --- HSV to RGB ---
function hsvToRgb(h, s, v, a) {
  h = ((h % 360) + 360) % 360;
  const hi = Math.floor(h / 60) % 6;
  const f = h / 60 - Math.floor(h / 60);
  const vv = v / 255;
  const p = vv * (1 - s / 100);
  const q = vv * (1 - f * s / 100);
  const t = vv * (1 - (1 - f) * s / 100);
  let r, g, b;
  switch (hi) {
    case 0: r = vv; g = t; b = p; break;
    case 1: r = q; g = vv; b = p; break;
    case 2: r = p; g = vv; b = t; break;
    case 3: r = p; g = q; b = vv; break;
    case 4: r = t; g = p; b = vv; break;
    case 5: r = vv; g = p; b = q; break;
  }
  return `rgba(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)},${a})`;
}

// --- Butterfly class ---
class Butterfly {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.targetX = Math.random() * W;
    this.targetY = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.maxSpeed = 0.6 + Math.random() * 0.8;
    this.maxForce = 0.015 + Math.random() * 0.01;
    this.scale = 25 + Math.random() * 35;
    this.hueOffset = Math.random() * 360;
    this.hueSpeed = 0.15 + Math.random() * 0.3;
    this.flapSpeed = 3 + Math.random() * 4;
    this.flapPhase = Math.random() * Math.PI * 2;
    this.wingSegments = 40;
    this.direction = Math.random() * Math.PI * 2;
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.glowIntensity = 0.3 + Math.random() * 0.4;
    this.opacity = 0.75 + Math.random() * 0.25;
    this.bodyLength = 0.35;
    this.antennaLength = 0.3;
  }

  update(time) {
    // Steering behavior — wander toward target
    let dx = this.targetX - this.x;
    let dy = this.targetY - this.y;
    let dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 30) {
      // Pick a new target
      this.targetX = 80 + Math.random() * (W - 160);
      this.targetY = 80 + Math.random() * (H - 160);
    }

    // Desired velocity
    let desiredX = (dx / dist) * this.maxSpeed;
    let desiredY = (dy / dist) * this.maxSpeed;

    // Steering force
    let steerX = desiredX - this.vx;
    let steerY = desiredY - this.vy;
    let steerMag = Math.sqrt(steerX * steerX + steerY * steerY);
    if (steerMag > this.maxForce) {
      steerX = (steerX / steerMag) * this.maxForce;
      steerY = (steerY / steerMag) * this.maxForce;
    }

    // Add wander behavior
    this.wanderAngle += (Math.random() - 0.5) * 0.5;
    steerX += Math.cos(this.wanderAngle) * 0.005;
    steerY += Math.sin(this.wanderAngle) * 0.005;

    this.vx += steerX;
    this.vy += steerY;

    // Clamp speed
    let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > this.maxSpeed) {
      this.vx = (this.vx / speed) * this.maxSpeed;
      this.vy = (this.vy / speed) * this.maxSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Update direction based on velocity
    if (speed > 0.01) {
      this.direction = Math.atan2(this.vy, this.vx);
    }

    // Keep within bounds with soft wrapping
    const margin = 60;
    if (this.x < -margin) this.x = W + margin;
    if (this.x > W + margin) this.x = -margin;
    if (this.y < -margin) this.y = H + margin;
    if (this.y > H + margin) this.y = -margin;

    // Flap phase
    this.flapPhase += this.flapSpeed * 0.03;
  }

  draw(time) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Rotate to face direction of travel (add PI/2 because wings point up in local space)
    ctx.rotate(this.direction + Math.PI / 2);

    // Flap angle — sine-based morphing
    const flapAngle = Math.sin(this.flapPhase) * 0.7;

    // Iridescent hue cycling
    const hue = (this.hueOffset + time * this.hueSpeed) % 360;

    // Draw wings
    this.drawWing(ctx, flapAngle, hue, time, 1);   // right wing
    this.drawWing(ctx, -flapAngle, hue, time, -1); // left wing (mirrored)

    // Draw body
    this.drawBody(hue);

    ctx.restore();
  }

  drawWing(ctx, flapAngle, baseHue, time, side) {
    ctx.save();

    // Apply flap rotation
    ctx.rotate(flapAngle * side * 0.3);

    // Scale
    const s = this.scale;
    ctx.scale(s, s);

    // Mirror for left wing
    ctx.scale(side, 1);

    // Glow
    ctx.shadowColor = hsvToRgb(baseHue, 80, 200, 0.6);
    ctx.shadowBlur = 15 * s * this.glowIntensity;

    // Build wing path
    const segs = this.wingSegments;
    ctx.beginPath();

    // Upper edge from root to tip
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const pt = wingShape(t);
      if (i === 0) {
        ctx.moveTo(pt.upperX, pt.upperY);
      } else {
        const prev = wingShape((i - 1) / segs);
        const cpx = (prev.upperX + pt.upperX) / 2;
        const cpy = (prev.upperY + pt.upperY) / 2 + 0.02 * Math.sin(t * Math.PI);
        ctx.quadraticCurveTo(cpx, cpy, pt.upperX, pt.upperY);
      }
    }

    // Lower edge from tip back to root
    for (let i = segs; i >= 0; i--) {
      const t = i / segs;
      const pt = wingShape(t);
      if (i === segs) {
        ctx.lineTo(pt.lowerX, pt.lowerY);
      } else {
        const next = wingShape((i + 1) / segs);
        const cpx = (next.lowerX + pt.lowerX) / 2;
        const cpy = (next.lowerY + pt.lowerY) / 2 - 0.015 * Math.sin(t * Math.PI);
        ctx.quadraticCurveTo(cpx, cpy, pt.lowerX, pt.lowerY);
      }
    }

    ctx.closePath();

    // Iridescent gradient fill
    const grad = ctx.createLinearGradient(0, -0.4, 1, 0.3);
    const sat = 85;
    const val = 180;
    grad.addColorStop(0, hsvToRgb(baseHue, sat, val, this.opacity));
    grad.addColorStop(0.3, hsvToRgb(baseHue + 40, sat + 5, val + 20, this.opacity * 0.95));
    grad.addColorStop(0.6, hsvToRgb(baseHue + 80, sat, val + 10, this.opacity * 0.9));
    grad.addColorStop(1, hsvToRgb(baseHue + 120, sat - 10, val - 20, this.opacity * 0.7));

    ctx.fillStyle = grad;
    ctx.fill();

    // Wing outline
    ctx.shadowBlur = 0;
    ctx.strokeStyle = hsvToRgb(baseHue + 60, 60, 220, 0.4);
    ctx.lineWidth = 0.008;
    ctx.stroke();

    // Wing veins
    this.drawVeins(ctx, baseHue, time);

    ctx.restore();
  }

  drawVeins(ctx, hue, time) {
    ctx.save();
    ctx.shadowBlur = 0;

    const segs = 12;
    const veinAlpha = 0.15 + Math.sin(time * 0.5 + this.hueOffset) * 0.05;

    // Main vein along upper edge
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const pt = wingShape(t);
      const midX = (pt.upperX + pt.lowerX) / 2;
      const midY = (pt.upperY + pt.lowerY) / 2;
      if (i === 0) ctx.moveTo(midX, midY);
      else ctx.lineTo(midX, midY);
    }
    ctx.strokeStyle = hsvToRgb(hue + 180, 40, 200, veinAlpha);
    ctx.lineWidth = 0.006;
    ctx.stroke();

    // Branch veins
    for (let i = 2; i <= 8; i += 2) {
      const t = i / segs;
      const pt = wingShape(t);
      const midX = (pt.upperX + pt.lowerX) / 2;
      const midY = (pt.upperY + pt.lowerY) / 2;

      ctx.beginPath();
      ctx.moveTo(midX, midY);
      ctx.lineTo(pt.upperX * 0.95, pt.upperY);
      ctx.strokeStyle = hsvToRgb(hue + 200, 30, 180, veinAlpha * 0.6);
      ctx.lineWidth = 0.004;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(midX, midY);
      ctx.lineTo(pt.lowerX * 0.95, pt.lowerY);
      ctx.stroke();
    }

    ctx.restore();
  }

  drawBody(hue) {
    const s = this.scale;
    ctx.save();

    // Body
    ctx.shadowColor = hsvToRgb(hue + 180, 50, 100, 0.3);
    ctx.shadowBlur = 5;

    ctx.beginPath();
    ctx.ellipse(0, 0, 0.02 * s, this.bodyLength * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = hsvToRgb(hue + 180, 30, 40, 0.9);
    ctx.fill();

    // Antennae
    ctx.shadowBlur = 0;
    const antLen = this.antennaLength * s;
    ctx.beginPath();
    ctx.moveTo(0, -this.bodyLength * s * 0.5);
    ctx.quadraticCurveTo(-0.08 * s, -this.bodyLength * s * 0.5 - antLen * 0.6,
      -0.12 * s, -this.bodyLength * s * 0.5 - antLen);
    ctx.strokeStyle = hsvToRgb(hue + 180, 20, 80, 0.6);
    ctx.lineWidth = 0.008 * s;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -this.bodyLength * s * 0.5);
    ctx.quadraticCurveTo(0.08 * s, -this.bodyLength * s * 0.5 - antLen * 0.6,
      0.12 * s, -this.bodyLength * s * 0.5 - antLen);
    ctx.stroke();

    ctx.restore();
  }
}

// --- Create butterflies ---
const butterflyCount = Math.min(12, Math.max(5, Math.floor((W * H) / 120000)));
const butterflies = [];
for (let i = 0; i < butterflyCount; i++) {
  butterflies.push(new Butterfly());
}

// --- Background stars ---
const stars = [];
const starCount = 80;
for (let i = 0; i < starCount; i++) {
  stars.push({
    x: Math.random() * 3000,
    y: Math.random() * 3000,
    r: Math.random() * 1.2 + 0.3,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.01 + Math.random() * 0.02
  });
}

function drawBackground(time) {
  // Dark background with subtle gradient
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#0d0d1a');
  bg.addColorStop(0.5, '#080812');
  bg.addColorStop(1, '#040408');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(star => {
    const alpha = 0.3 + Math.sin(star.twinkle + time * star.speed) * 0.25;
    ctx.beginPath();
    ctx.arc(star.x % W, star.y % H, star.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,190,220,${alpha})`;
    ctx.fill();
  });
}

// --- Animation loop ---
let startTime = performance.now();

function animate(now) {
  const time = (now - startTime) / 1000;

  drawBackground(time);

  // Sort butterflies by y for depth ordering
  butterflies.sort((a, b) => a.scale - b.scale);

  // Update and draw
  butterflies.forEach(b => {
    b.update(time);
    b.draw(time);
  });

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
