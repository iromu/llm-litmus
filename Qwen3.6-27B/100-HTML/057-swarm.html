<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#06060c;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:1}
h1{font-size:clamp(2rem,5vw,4rem);font-weight:200;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.3em;text-shadow:0 0 40px rgba(80,180,120,0.25)}
.stats{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.75rem;color:rgba(80,180,120,0.45);letter-spacing:0.15em;font-family:monospace;z-index:2;text-align:center}
.mode-indicator{position:fixed;top:24px;right:28px;font-size:0.7rem;color:rgba(80,180,120,0.5);letter-spacing:0.12em;font-family:monospace;z-index:2;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
<h1>Swarm</h1>
</div>
<div class="stats" id="stats"></div>
<div class="mode-indicator" id="mode">click to toggle mode</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;

/* ── Config ────────────────────────────────────────────── */
const BOID_COUNT   = 350;
const NEIGHBOR_R   = 80;
const SEPARATION_R = 22;
const MAX_SPEED    = 3.5;
const MIN_SPEED    = 1.8;
const MAX_FORCE    = 0.12;
const TRAIL_ALPHA  = 0.08;
const GRID_SIZE    = NEIGHBOR_R;
const MOUSE_RADIUS = 160;
const MOUSE_FORCE  = 0.6;

/* ── State ─────────────────────────────────────────────── */
let boids = [];
let mouse = { x: -2000, y: -2000, active: false };
let mouseMode = 'repel'; // 'repel' | 'attract'

/* ── Spatial Grid ──────────────────────────────────────── */
let grid = {};

function gridKey(cx, cy) { return cx + ',' + cy; }

function buildGrid() {
    grid = {};
    for (let i = 0; i < boids.length; i++) {
        const b = boids[i];
        const cx = Math.floor(b.x / GRID_SIZE);
        const cy = Math.floor(b.y / GRID_SIZE);
        const k = gridKey(cx, cy);
        if (!grid[k]) grid[k] = [];
        grid[k].push(i);
    }
}

function getNeighborIndices(boid) {
    const cx = Math.floor(boid.x / GRID_SIZE);
    const cy = Math.floor(boid.y / GRID_SIZE);
    const out = [];
    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            const k = gridKey(cx + dx, cy + dy);
            if (grid[k]) out.push(...grid[k]);
        }
    }
    return out;
}

/* ── Boid ──────────────────────────────────────────────── */
class Boid {
    constructor(x, y) {
        this.x = x !== undefined ? x : Math.random() * W;
        this.y = y !== undefined ? y : Math.random() * H;
        const a = Math.random() * Math.PI * 2;
        const s = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.hue = 140 + Math.random() * 40 - 20; // green-cyan range
        this.sat = 50 + Math.random() * 30;
        this.light = 55 + Math.random() * 20;
        this.size = 4 + Math.random() * 3;
    }

    update() {
        this.vx += this.ax;
        this.vy += this.ay;
        const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (spd > MAX_SPEED) {
            this.vx = (this.vx / spd) * MAX_SPEED;
            this.vy = (this.vy / spd) * MAX_SPEED;
        } else if (spd < MIN_SPEED && spd > 0.001) {
            this.vx = (this.vx / spd) * MIN_SPEED;
            this.vy = (this.vy / spd) * MIN_SPEED;
        }
        this.x += this.vx;
        this.y += this.vy;
        this.ax = 0;
        this.ay = 0;
        // Wrap around edges with margin
        const m = 30;
        if (this.x < -m) this.x = W + m;
        if (this.x > W + m) this.x = -m;
        if (this.y < -m) this.y = H + m;
        if (this.y > H + m) this.y = -m;
    }

    draw() {
        const angle = Math.atan2(this.vy, this.vx);
        const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        const alpha = 0.5 + (spd / MAX_SPEED) * 0.5;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(this.size * 2, 0);
        ctx.lineTo(-this.size, -this.size * 0.6);
        ctx.lineTo(-this.size * 0.4, 0);
        ctx.lineTo(-this.size, this.size * 0.6);
        ctx.closePath();
        ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${alpha})`;
        ctx.shadowColor = `hsla(${this.hue},${this.sat}%,${this.light}%,0.6)`;
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
    }
}

/* ── Flocking Rules ────────────────────────────────────── */
function applyFlocking() {
    buildGrid();
    for (let i = 0; i < boids.length; i++) {
        const b = boids[i];
        const neighbors = getNeighborIndices(b);
        let sepX = 0, sepY = 0, sepCount = 0;
        let aliVx = 0, aliVy = 0, aliCount = 0;
        let cohX = 0, cohY = 0, cohCount = 0;

        for (let n = 0; n < neighbors.length; n++) {
            const j = neighbors[n];
            if (j === i) continue;
            const other = boids[j];
            const dx = b.x - other.x;
            const dy = b.y - other.y;
            const distSq = dx * dx + dy * dy;

            // Separation
            if (distSq < SEPARATION_R * SEPARATION_R && distSq > 0.01) {
                const dist = Math.sqrt(distSq);
                sepX += dx / dist / dist;
                sepY += dy / dist / dist;
                sepCount++;
            }

            // Alignment & Cohesion (within neighbor radius)
            if (distSq < NEIGHBOR_R * NEIGHBOR_R) {
                aliVx += other.vx;
                aliVy += other.vy;
                aliCount++;
                cohX += other.x;
                cohY += other.y;
                cohCount++;
            }
        }

        // Separation steering
        if (sepCount > 0) {
            sepX /= sepCount;
            sepY /= sepCount;
            const sMag = Math.sqrt(sepX * sepX + sepY * sepY);
            if (sMag > 0.001) {
                sepX = (sepX / sMag) * MAX_SPEED - b.vx;
                sepY = (sepY / sMag) * MAX_SPEED - b.vy;
                const fMag = Math.sqrt(sepX * sepX + sepY * sepY);
                if (fMag > MAX_FORCE) {
                    sepX = (sepX / fMag) * MAX_FORCE;
                    sepY = (sepY / fMag) * MAX_FORCE;
                }
            }
        }

        // Alignment steering
        if (aliCount > 0) {
            aliVx /= aliCount;
            aliVy /= aliCount;
            const aMag = Math.sqrt(aliVx * aliVx + aliVy * aliVy);
            if (aMag > 0.001) {
                aliVx = (aliVx / aMag) * MAX_SPEED - b.vx;
                aliVy = (aliVy / aMag) * MAX_SPEED - b.vy;
                const fMag = Math.sqrt(aliVx * aliVx + aliVy * aliVy);
                if (fMag > MAX_FORCE) {
                    aliVx = (aliVx / fMag) * MAX_FORCE;
                    aliVy = (aliVy / fMag) * MAX_FORCE;
                }
            }
        }

        // Cohesion steering
        if (cohCount > 0) {
            cohX /= cohCount;
            cohY /= cohCount;
            cohX = cohX - b.x;
            cohY = cohY - b.y;
            const cMag = Math.sqrt(cohX * cohX + cohY * cohY);
            if (cMag > 0.001) {
                cohX = (cohX / cMag) * MAX_SPEED - b.vx;
                cohY = (cohY / cMag) * MAX_SPEED - b.vy;
                const fMag = Math.sqrt(cohX * cohX + cohY * cohY);
                if (fMag > MAX_FORCE) {
                    cohX = (cohX / fMag) * MAX_FORCE;
                    cohY = (cohY / fMag) * MAX_FORCE;
                }
            }
        }

        // Weighted sum
        b.ax = sepX * 1.8 + aliVx * 1.0 + cohX * 1.0;
        b.ay = sepY * 1.8 + aliVy * 1.0 + cohY * 1.0;

        // Mouse interaction
        if (mouse.active) {
            const mdx = b.x - mouse.x;
            const mdy = b.y - mouse.y;
            const mDistSq = mdx * mdx + mdy * mdy;
            if (mDistSq < MOUSE_RADIUS * MOUSE_RADIUS && mDistSq > 1) {
                const mDist = Math.sqrt(mDistSq);
                let mx = (mdx / mDist) * MOUSE_FORCE;
                let my = (mdy / mDist) * MOUSE_FORCE;
                if (mouseMode === 'attract') {
                    mx = -mx;
                    my = -my;
                }
                b.ax += mx;
                b.ay += my;
            }
        }
    }
}

/* ── Init ──────────────────────────────────────────────── */
function resize() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
}

function init() {
    boids = [];
    for (let i = 0; i < BOID_COUNT; i++) {
        boids.push(new Boid());
    }
}

/* ── Render ────────────────────────────────────────────── */
function animate() {
    // Trail fade
    ctx.fillStyle = `rgba(6,6,12,${TRAIL_ALPHA})`;
    ctx.fillRect(0, 0, W, H);

    applyFlocking();

    // Draw boids
    ctx.shadowBlur = 0; // reset for batch
    for (let i = 0; i < boids.length; i++) {
        boids[i].update();
        boids[i].draw();
    }

    // Mouse glow
    if (mouse.active) {
        const glowColor = mouseMode === 'repel' ? '255,100,100' : '100,255,180';
        const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, MOUSE_RADIUS);
        g.addColorStop(0, `rgba(${glowColor},0.08)`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, MOUSE_RADIUS, 0, Math.PI * 2);
        ctx.fill();
    }

    // Stats
    let avgSpeed = 0;
    for (let i = 0; i < boids.length; i++) {
        avgSpeed += Math.sqrt(boids[i].vx * boids[i].vx + boids[i].vy * boids[i].vy);
    }
    avgSpeed = (avgSpeed / boids.length).toFixed(1);
    document.getElementById('stats').textContent = `${boids.length} agents · avg speed ${avgSpeed}`;

    requestAnimationFrame(animate);
}

/* ── Events ────────────────────────────────────────────── */
c.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
});

c.addEventListener('mouseleave', () => {
    mouse.active = false;
});

c.addEventListener('click', () => {
    mouseMode = mouseMode === 'repel' ? 'attract' : 'repel';
    const modeEl = document.getElementById('mode');
    modeEl.textContent = mouseMode === 'repel' ? 'repel mode' : 'attract mode';
    modeEl.style.opacity = '1';
    clearTimeout(modeEl._timer);
    modeEl._timer = setTimeout(() => {
        modeEl.style.transition = 'opacity 1.5s';
        modeEl.style.opacity = '0.35';
    }, 800);
});

// Touch support
c.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
}, { passive: false });

c.addEventListener('touchend', () => {
    mouse.active = false;
});

c.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
    mouseMode = mouseMode === 'repel' ? 'attract' : 'repel';
    const modeEl = document.getElementById('mode');
    modeEl.textContent = mouseMode === 'repel' ? 'repel mode' : 'attract mode';
    modeEl.style.opacity = '1';
    clearTimeout(modeEl._timer);
    modeEl._timer = setTimeout(() => {
        modeEl.style.transition = 'opacity 1.5s';
        modeEl.style.opacity = '0.35';
    }, 800);
});

window.addEventListener('resize', () => {
    resize();
});

resize();
init();
animate();
</script>
</body>
</html>
