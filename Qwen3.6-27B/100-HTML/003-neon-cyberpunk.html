<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Cyberpunk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0012;color:#fff;font-family:'Courier New',monospace;overflow-x:hidden;position:relative}
.grid-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(transparent 0%,rgba(255,0,128,0.03) 50%,transparent 100%),linear-gradient(90deg,rgba(0,200,255,0.02) 1px,transparent 1px),linear-gradient(0deg,rgba(0,200,255,0.02) 1px,transparent 1px);background-size:100% 100%,60px 60px,60px 60px;perspective:500px;transform:rotateX(60deg);transform-origin:center top;animation:grid-scroll 20s linear infinite}
@keyframes grid-scroll{to{background-position:0 0,0 60px,0 60px}}
.scanline{position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px);pointer-events:none;z-index:100}
.scanline::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:rgba(255,0,128,0.3);animation:scan 3s linear infinite;box-shadow:0 0 20px rgba(255,0,128,0.5)}
@keyframes scan{0%{top:-10%}100%{top:110%}}
.container{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:60px 24px}
.glitch{position:relative;font-size:clamp(3rem,8vw,6rem);font-weight:900;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:60px;text-shadow:0 0 10px rgba(0,200,255,0.8),0 0 40px rgba(0,200,255,0.4)}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch::before{color:#ff0080;animation:glitch-1 2s infinite;z-index:-1}
.glitch::after{color:#00c8ff;animation:glitch-2 2s infinite;z-index:-2}
@keyframes glitch-1{0%,100%{clip-path:inset(0 0 95% 0);transform:translate(-3px)}20%{clip-path:inset(20% 0 40% 0);transform:translate(3px)}40%{clip-path:inset(60% 0 10% 0);transform:translate(-2px)}60%{clip-path:inset(40% 0 30% 0);transform:translate(2px)}80%{clip-path:inset(80% 0 5% 0);transform:translate(-1px)}}
@keyframes glitch-2{0%,100%{clip-path:inset(95% 0 0 0);transform:translate(3px)}20%{clip-path:inset(40% 0 20% 0);transform:translate(-3px)}40%{clip-path:inset(10% 0 60% 0);transform:translate(2px)}60%{clip-path:inset(30% 0 40% 0);transform:translate(-2px)}80%{clip-path:inset(5% 0 80% 0);transform:translate(1px)}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.card{position:relative;background:rgba(10,0,18,0.8);border:1px solid rgba(255,0,128,0.2);padding:24px;transition:all 0.3s ease}
.card::before,.card::after{content:'';position:absolute;width:20px;height:20px;border-color:#00c8ff;border-style:solid;opacity:0;transition:opacity 0.3s}
.card::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.card:hover{border-color:rgba(255,0,128,0.6);box-shadow:0 0 30px rgba(255,0,128,0.2),inset 0 0 30px rgba(255,0,128,0.05);transform:translateY(-4px)}
.card:hover::before,.card:hover::after{opacity:1}
.card h3{color:#00c8ff;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:12px}
.card .metric{font-size:2.5rem;font-weight:700;color:#ff0080;margin-bottom:8px;text-shadow:0 0 10px rgba(255,0,128,0.5)}
.card .label{font-size:0.75rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px}
.progress{height:3px;background:rgba(255,255,255,0.1);overflow:hidden;border-radius:2px}
.progress-bar{height:100%;background:linear-gradient(90deg,#ff0080,#00c8ff);width:0;transition:width 1.5s cubic-bezier(0.25,0.46,0.45,0.94);border-radius:2px;box-shadow:0 0 10px rgba(255,0,128,0.5)}
.card:hover .progress-bar{width:var(--target)}
.status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:rgba(0,200,255,0.5);letter-spacing:0.2em;text-transform:uppercase;z-index:101}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="container">
<h1 class="glitch" data-text="NEON//DREAM">NEON//DREAM</h1>
<div class="cards">
<div class="card">
<h3>System Load</h3>
<div class="metric">87%</div>
<div class="label">CPU utilization</div>
<div class="progress"><div class="progress-bar" style="--target:87%"></div></div>
</div>
<div class="card">
<h3>Memory</h3>
<div class="metric">16TB</div>
<div class="label">Quantum allocation</div>
<div class="progress"><div class="progress-bar" style="--target:64%"></div></div>
</div>
<div class="card">
<h3>Network</h3>
<div class="metric">∞ Gb</div>
<div class="label">Neural throughput</div>
<div class="progress"><div class="progress-bar" style="--target:92%"></div></div>
</div>
<div class="card">
<h3>Uptime</h3>
<div class="metric">99.9%</div>
<div class="label">System reliability</div>
<div class="progress"><div class="progress-bar" style="--target:99%"></div></div>
</div>
</div>
</div>
<div class="status">[ System Online ] [ All Nodes Active ]</div>
<script>
document.querySelectorAll('.progress-bar').forEach((bar,i)=>{setTimeout(()=>{bar.style.width=bar.style.getPropertyValue('--target')},300+i*200)});
setInterval(()=>{document.querySelector('.glitch').style.animation='none';requestAnimationFrame(()=>{document.querySelector('.glitch').style.animation=''})},5000);
</script>
</body>
</html>
