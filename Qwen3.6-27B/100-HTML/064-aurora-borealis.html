<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
  #title {
    position: fixed;
    bottom: 2rem;
    width: 100%;
    text-align: center;
    font-family: system-ui, sans-serif;
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.12);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Aurora Borealis</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Stars
const stars = [];
for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 800,
    r: Math.random() * 1.5 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 2 + 1
  });
}

// Aurora bands
let bands = [];
function generateBands() {
  bands = [];
  const count = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    bands.push({
      y: H * (0.15 + Math.random() * 0.35),
      height: 40 + Math.random() * 80,
      hue: 100 + Math.random() * 160, // green to purple
      sat: 60 + Math.random() * 40,
      light: 40 + Math.random() * 30,
      alpha: 0.15 + Math.random() * 0.2,
      freq1: 0.002 + Math.random() * 0.003,
      freq2: 0.004 + Math.random() * 0.006,
      amp1: 20 + Math.random() * 40,
      amp2: 10 + Math.random() * 25,
      speed1: 0.3 + Math.random() * 0.5,
      speed2: 0.5 + Math.random() * 0.8,
      phase1: Math.random() * Math.PI * 2,
      phase2: Math.random() * Math.PI * 2,
      layers: 2 + Math.floor(Math.random() * 3)
    });
  }
}
generateBands();

canvas.addEventListener('click', () => { generateBands(); });

let t = 0;

function drawStars() {
  for (const s of stars) {
    const twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    const sx = (s.x / 2000) * W;
    const sy = (s.y / 800) * H * 0.6;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${twinkle * 0.8})`;
    ctx.fill();
  }
}

function drawGround() {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 3) {
    const y = H * 0.82
      + Math.sin(x * 0.003) * H * 0.04
      + Math.sin(x * 0.007 + 1) * H * 0.02
      + Math.sin(x * 0.015 + 2) * H * 0.01;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = '#0a0f0a';
  ctx.fill();
}

function drawAurora() {
  for (const band of bands) {
    for (let l = 0; l < band.layers; l++) {
      const layerOffset = l * 8;
      const layerAlpha = band.alpha / (l + 1);

      ctx.beginPath();
      ctx.moveTo(0, H);

      for (let x = 0; x <= W; x += 3) {
        const wave1 = Math.sin(x * band.freq1 + t * band.speed1 + band.phase1) * band.amp1;
        const wave2 = Math.sin(x * band.freq2 + t * band.speed2 + band.phase2) * band.amp2;
        const y = band.y + wave1 + wave2 + layerOffset;
        ctx.lineTo(x, y);
      }

      ctx.lineTo(W, H);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, band.y - band.height, 0, band.y + band.height);
      grad.addColorStop(0, `hsla(${band.hue}, ${band.sat}%, ${band.light}%, 0)`);
      grad.addColorStop(0.3, `hsla(${band.hue}, ${band.sat}%, ${band.light}%, ${layerAlpha})`);
      grad.addColorStop(0.7, `hsla(${band.hue + 20}, ${band.sat}%, ${band.light - 10}%, ${layerAlpha * 0.7})`);
      grad.addColorStop(1, `hsla(${band.hue + 40}, ${band.sat}%, ${band.light}%, 0)`);
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }
}

function animate() {
  // Trailing fade
  ctx.fillStyle = 'rgba(2, 4, 10, 0.15)';
  ctx.fillRect(0, 0, W, H);

  drawStars();
  drawAurora();
  drawGround();

  t += 0.016;
  requestAnimationFrame(animate);
}

// Initial clear
ctx.fillStyle = '#02040a';
ctx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
