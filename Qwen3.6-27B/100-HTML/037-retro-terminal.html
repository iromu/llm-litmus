<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Terminal</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --phosphor: #33ff33;
    --phosphor-dim: #1a801a;
    --phosphor-bright: #66ff66;
    --bg: #0a0a0a;
    --screen-bg: #050c05;
    --amber: #ffb000;
  }

  body {
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }

  /* ── Monitor shell ── */
  .monitor {
    position: relative;
    width: min(92vw, 860px);
    background: #1a1a1a;
    border-radius: 24px;
    padding: 32px 28px 40px;
    box-shadow:
      0 0 0 3px #2a2a2a,
      0 0 0 6px #111,
      0 20px 60px rgba(0,0,0,.8),
      inset 0 1px 0 rgba(255,255,255,.06);
  }

  .monitor::before {
    content: '';
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 4px;
    background: #333;
    border-radius: 2px;
  }

  .monitor-brand {
    text-align: center;
    color: #444;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-weight: bold;
  }

  /* ── CRT screen ── */
  .screen-wrapper {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: var(--screen-bg);
    box-shadow:
      inset 0 0 80px rgba(0,0,0,.9),
      inset 0 0 12px rgba(0,0,0,.6);
  }

  .screen {
    position: relative;
    padding: 24px 28px 20px;
    min-height: 480px;
    max-height: 70vh;
    overflow-y: auto;
    color: var(--phosphor);
    font-size: 14px;
    line-height: 1.6;
    text-shadow: 0 0 6px var(--phosphor), 0 0 12px var(--phosphor-dim);
    z-index: 1;
  }

  .screen::-webkit-scrollbar { width: 6px; }
  .screen::-webkit-scrollbar-track { background: transparent; }
  .screen::-webkit-scrollbar-thumb { background: var(--phosphor-dim); border-radius: 3px; }

  /* ── Scanlines ── */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.12) 2px,
      rgba(0, 0, 0, 0.12) 4px
    );
  }

  /* ── Screen curvature vignette ── */
  .curvature {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    border-radius: 12px;
    box-shadow: inset 0 0 120px rgba(0,0,0,.7);
    background: radial-gradient(
      ellipse at center,
      transparent 60%,
      rgba(0, 0, 0, 0.45) 100%
    );
  }

  /* ── Phosphor flicker ── */
  .flicker {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    animation: flicker 0.15s infinite;
    background: transparent;
  }

  @keyframes flicker {
    0%   { opacity: 0.97; }
    5%   { opacity: 0.95; }
    10%  { opacity: 0.98; }
    15%  { opacity: 0.96; }
    20%  { opacity: 0.99; }
    50%  { opacity: 0.97; }
    80%  { opacity: 0.98; }
    90%  { opacity: 0.96; }
    100% { opacity: 0.97; }
  }

  /* ── Power-on flash ── */
  .power-on {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: var(--phosphor);
    animation: powerFlash 1.2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes powerFlash {
    0%   { opacity: 0.8; }
    100% { opacity: 0; }
  }

  /* ── Text elements ── */
  .line {
    opacity: 0;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .line.visible {
    opacity: 1;
  }

  .line.typed {
    overflow: hidden;
    border-right: 2px solid var(--phosphor);
    animation: blink-caret .6s step-end infinite;
  }

  .line.typed.done {
    border-right: none;
    animation: none;
  }

  @keyframes blink-caret {
    0%, 100% { border-color: var(--phosphor); }
    50%      { border-color: transparent; }
  }

  .prompt {
    color: var(--phosphor-bright);
    text-shadow: 0 0 8px var(--phosphor-bright), 0 0 16px var(--phosphor);
  }

  .path { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
  .dir  { color: var(--phosphor-bright); }
  .file { color: var(--phosphor); }
  .size { color: var(--phosphor-dim); }
  .date { color: var(--phosphor-dim); }

  .separator {
    color: var(--phosphor-dim);
    text-shadow: none;
  }

  .ascii-art {
    color: var(--phosphor-dim);
    text-shadow: 0 0 4px var(--phosphor-dim);
    font-size: 12px;
    line-height: 1.2;
  }

  .warning { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
  .error   { color: #ff3333; text-shadow: 0 0 6px #ff3333; }

  /* ── Command prompt (interactive) ── */
  .cmd-line {
    display: flex;
    align-items: center;
    margin-top: 4px;
  }

  .cmd-line .prompt-text {
    white-space: nowrap;
    margin-right: 4px;
  }

  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--phosphor);
    font-family: inherit;
    font-size: inherit;
    text-shadow: 0 0 6px var(--phosphor), 0 0 12px var(--phosphor-dim);
    caret-color: var(--phosphor);
  }

  #cmd-input::placeholder {
    color: var(--phosphor-dim);
    text-shadow: none;
  }

  /* ── Boot progress bar ── */
  .progress-bar {
    display: inline-block;
    width: 240px;
    height: 14px;
    border: 1px solid var(--phosphor-dim);
    position: relative;
    vertical-align: middle;
  }

  .progress-fill {
    height: 100%;
    background: var(--phosphor);
    box-shadow: 0 0 8px var(--phosphor);
    width: 0%;
    transition: width 0.1s linear;
  }

  /* ── Section fade-in ── */
  .section {
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .section + .section { margin-top: 16px; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .monitor { padding: 16px 12px 24px; border-radius: 16px; }
    .screen { padding: 16px 14px 14px; font-size: 12px; min-height: 360px; }
    .ascii-art { font-size: 8px; }
    .progress-bar { width: 160px; }
  }
</style>
</head>
<body>

<div class="monitor">
  <div class="monitor-brand">Videoterminal</div>
  <div class="screen-wrapper">
    <div class="screen" id="screen">
      <div class="scanlines"></div>
      <div class="curvature"></div>
      <div class="flicker"></div>
      <div class="power-on" id="powerOn"></div>
      <div id="content"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const content = document.getElementById('content');
  const screenEl = document.getElementById('screen');

  /* ── Helpers ── */
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function addLine(text, cls) {
    const d = el('div', 'line' + (cls ? ' ' + cls : ''));
    d.textContent = text;
    content.appendChild(d);
    requestAnimationFrame(() => d.classList.add('visible'));
    return d;
  }

  function addSection(html, cls) {
    const s = el('div', 'section' + (cls ? ' ' + cls : ''));
    s.innerHTML = html;
    content.appendChild(s);
    requestAnimationFrame(() => s.classList.add('visible'));
    return s;
  }

  async function typeLine(text, cls, speed) {
    speed = speed || 35;
    const d = el('div', 'line typed visible');
    content.appendChild(d);
    for (let i = 0; i < text.length; i++) {
      d.textContent = text.slice(0, i + 1);
      await sleep(speed + Math.random() * 25);
    }
    d.classList.add('done');
    return d;
  }

  /* ── Boot sequence ── */
  async function boot() {
    await sleep(600);

    const lines = [
      'BIOS v3.2.1 — Videoterminal Systems Inc. 1987',
      'POST in progress...',
      '  CPU: Motorola 68000 @ 8 MHz ............ OK',
      '  RAM: 512 KB Dynamic RAM ................. OK',
      '  ROM: 128 KB Monitor ROM ................. OK',
      '  DMA Controller .......................... OK',
      '  Video Adapter (CGA) ..................... OK',
      '  Keyboard Interface ...................... OK',
      '  Floppy Drive A: ........................ OK',
      '  Floppy Drive B: ......................... OK',
      '  HDD Controller .......................... OK',
      '',
      'Memory Test: 512K/512K ............ OK',
      '',
    ];

    for (const l of lines) {
      await typeLine(l, '', 22);
      await sleep(60);
    }

    /* Progress bar */
    const progWrap = el('div', 'line visible');
    progWrap.innerHTML = 'Booting OS <span class="progress-bar"><span class="progress-fill" id="progFill"></span></span>';
    content.appendChild(progWrap);
    const fill = document.getElementById('progFill');

    for (let p = 0; p <= 100; p += 2) {
      fill.style.width = p + '%';
      await sleep(30);
    }
    await sleep(300);

    /* Clear boot */
    content.innerHTML = '';

    /* ── ASCII art logo ── */
    const logo = [
      '╔══════════════════════════════════════════════════╗',
      '║                                                  ║',
      '║   ██████╗ ██████╗  █████╗ ███╗   ██╗███████╗    ║',
      '║   ██╔══██╗██╔══██╗██╔══██╗████╗  ██║██╔════╝    ║',
      '║   ██████╔╝██████╔╝███████║██╔██╗ ██║█████╗      ║',
      '║   ██╔══██╗██╔══██╗██╔══██║██║╚██╗██║██╔══╝      ║',
      '║   ██║  ██║██║  ██║██║  ██║██║ ╚████║███████╗    ║',
      '║   ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝╚══════╝    ║',
      '║                                                  ║',
      '║        N E X U S   O P E R A T I N G           ║',
      '║              S Y S T E M  v 4 . 1 2             ║',
      '║                                                  ║',
      '╚══════════════════════════════════════════════════╝',
    ];

    const logoDiv = el('div', 'line visible ascii-art');
    logoDiv.textContent = logo.join('\n');
    content.appendChild(logoDiv);
    await sleep(800);

    addLine('');
    addLine('Nexus OS 4.12 (C) 1987 Videoterminal Systems Inc.', '');
    addLine('All rights reserved. Unauthorized use prohibited.', '');
    addLine('');
    await sleep(400);

    /* ── System info section ── */
    const sysInfo = `
<span class="separator">┌──────────────────────────────────────────────────────┐</span>
<span class="separator">│</span>  <span class="prompt">SYSTEM INFORMATION</span>
<span class="separator">│</span>
<span class="separator">│</span>  Hostname ......... <span class="dir">TERMINAL-037</span>
<span class="separator">│</span>  Kernel ........... <span class="file">NX-4.12.7</span>
<span class="separator">│</span>  Uptime ........... <span class="size">00:00:04</span>
<span class="separator">│</span>  Load Average ..... <span class="size">0.02, 0.05, 0.03</span>
<span class="separator">│</span>  Memory ........... <span class="size">487K / 512K used</span>
<span class="separator">│</span>  Disk ............. <span class="size">23.4 MB / 40 MB used</span>
<span class="separator">│</span>  Network .......... <span class="dir">ETHERNET ACTIVE</span>
<span class="separator">│</span>  Processes ........ <span class="size">14</span>
<span class="separator">│</span>  Users Logged In .. <span class="size">1</span>
<span class="separator">│</span>
<span class="separator">└──────────────────────────────────────────────────────┘</span>`;
    addSection(sysInfo);
    await sleep(500);

    /* ── File listing section ── */
    const fileList = `
<span class="separator">┌──────────────────────────────────────────────────────┐</span>
<span class="separator">│</span>  <span class="prompt">/home/operator/</span> — Directory Listing
<span class="separator">│</span>
<span class="separator">│</span>  <span class="date">DATE</span>        <span class="date">TIME</span>     <span class="date">SIZE</span>    <span class="date">NAME</span>
<span class="separator">│</span>  <span class="separator">──────────────────────────────────────────────</span>
<span class="separator">│</span>  <span class="date">08-12-87</span>  <span class="date">09:14</span>   <span class="size">&lt;DIR&gt;</span>   <span class="dir">projects/</span>
<span class="separator">│</span>  <span class="date">08-12-87</span>  <span class="date">09:14</span>   <span class="size">&lt;DIR&gt;</span>   <span class="dir">documents/</span>
<span class="separator">│</span>  <span class="date">08-12-87</span>  <span class="date">09:14</span>   <span class="size">&lt;DIR&gt;</span>   <span class="dir">.config/</span>
<span class="separator">│</span>  <span class="date">08-11-87</span>  <span class="date">16:42</span>   <span class="size">2,341</span>   <span class="file">readme.txt</span>
<span class="separator">│</span>  <span class="date">08-11-87</span>  <span class="date">16:42</span>   <span class="size">15,872</span>  <span class="file">notes.dat</span>
<span class="separator">│</span>  <span class="date">08-10-87</span>  <span class="date">11:03</span>   <span class="size">4,096</span>   <span class="file">backup.arc</span>
<span class="separator">│</span>  <span class="date">08-09-87</span>  <span class="date">22:17</span>   <span class="size">1,024</span>   <span class="file">.profile</span>
<span class="separator">│</span>  <span class="date">08-09-87</span>  <span class="date">22:17</span>     <span class="size">512</span>   <span class="file">.bashrc</span>
<span class="separator">│</span>  <span class="date">08-08-87</span>  <span class="date">14:55</span>   <span class="size">8,192</span>   <span class="file">secret.key</span>
<span class="separator">│</span>
<span class="separator">│</span>  <span class="size">3 directories, 6 files</span>
<span class="separator">└──────────────────────────────────────────────────────┘`;
    addSection(fileList);
    await sleep(500);

    /* ── Network status ── */
    const netStatus = `
<span class="separator">┌──────────────────────────────────────────────────────┐</span>
<span class="separator">│</span>  <span class="prompt">NETWORK STATUS</span>
<span class="separator">│</span>
<span class="separator">│</span>  <span class="dir">●</span> Ethernet ......... <span class="dir">CONNECTED</span>  (10 Mbps)
<span class="separator">│</span>  <span class="dir">●</span> Node ............. <span class="file">192.168.1.42</span>
<span class="separator">│</span>  <span class="dir">●</span> Gateway .......... <span class="file">192.168.1.1</span>
<span class="separator">│</span>  <span class="dir">●</span> DNS .............. <span class="file">192.168.1.10</span>
<span class="separator">│</span>  <span class="warning">●</span> Firewall ......... <span class="warning">ACTIVE</span>  (3 rules loaded)
<span class="separator">│</span>  <span class="dir">●</span> Active Sessions .. <span class="size">2</span>
<span class="separator">│</span>
<span class="separator">│</span>  <span class="warning">⚠ WARNING: Unencrypted channel detected on port 23</span>
<span class="separator">└──────────────────────────────────────────────────────┘`;
    addSection(netStatus);
    await sleep(500);

    /* ── System messages ── */
    const messages = `
<span class="separator">┌──────────────────────────────────────────────────────┐</span>
<span class="separator">│</span>  <span class="prompt">SYSTEM MESSAGES</span>
<span class="separator">│</span>
<span class="separator">│</span>  [<span class="date">09:14:01</span>] <span class="dir">INFO</span>  System initialized successfully
<span class="separator">│</span>  [<span class="date">09:14:02</span>] <span class="dir">INFO</span>  Network interface eth0 up
<span class="separator">│</span>  [<span class="date">09:14:02</span>] <span class="dir">INFO</span>  Filesystem mounted: /dev/hda1 on /
<span class="separator">│</span>  [<span class="date">09:14:03</span>] <span class="warning">WARN</span>  Disk usage at 58% — consider cleanup
<span class="separator">│</span>  [<span class="date">09:14:03</span>] <span class="dir">INFO</span>  Cron daemon started
<span class="separator">│</span>  [<span class="date">09:14:04</span>] <span class="error">ALERT</span> Unauthorized access attempt from 10.0.0.99
<span class="separator">│</span>  [<span class="date">09:14:04</span>] <span class="dir">INFO</span>  Firewall blocked connection from 10.0.0.99
<span class="separator">│</span>  [<span class="date">09:14:04</span>] <span class="dir">INFO</span>  Session established: operator@TERMINAL-037
<span class="separator">└──────────────────────────────────────────────────────┘`;
    addSection(messages);
    await sleep(400);

    addLine('');
    await sleep(300);

    /* ── Interactive prompt ── */
    const cmdWrap = el('div', 'cmd-line');
    const promptSpan = el('span', 'prompt-text prompt');
    promptSpan.innerHTML = '<span class="path">operator@TERMINAL-037</span>:<span class="path">~</span>$ ';
    cmdWrap.appendChild(promptSpan);

    const input = document.createElement('input');
    input.id = 'cmd-input';
    input.type = 'text';
    input.placeholder = 'type a command...';
    input.autocomplete = 'off';
    input.spellcheck = false;
    cmdWrap.appendChild(input);
    content.appendChild(cmdWrap);

    /* Scroll to bottom */
    screenEl.scrollTop = screenEl.scrollHeight;

    /* Focus input on click */
    screenEl.addEventListener('click', () => input.focus());
    input.focus();

    /* Command handling */
    const commands = {
      help: 'Available commands: help, date, whoami, ls, pwd, clear, echo, uptime, fortune, neofetch',
      whoami: 'operator',
      pwd: '/home/operator',
      date: () => new Date().toLocaleString('en-US', { year: '2-digit' }),
      uptime: '00:' + String(Math.floor(Math.random()*60)).padStart(2,'0') + ':' + String(Math.floor(Math.random()*60)).padStart(2,'0'),
      ls: 'projects/  documents/  .config/  readme.txt  notes.dat  backup.arc  .profile  .bashrc  secret.key',
      fortune: [
        'The computer doesn\'t care how angry you are.',
        'There is no place like 127.0.0.1',
        'To err is human; to really foul things up requires a computer.',
        'A day without sunshine is like, you know, night.',
        'The more you explain about technology, the dumber it sounds.',
      ][Math.floor(Math.random() * 5)],
      neofetch: `
       .--.        operator@TERMINAL-037
      |o_o |       ─────────────────────
      |:_/ |       OS: Nexus OS 4.12
     //   \\ \\      Kernel: NX-4.12.7
    (|     | )     Shell: nxsh 2.1
    //'\\_//'\\\\    Terminal: Videoterminal CRT
    \\___)=(___/   CPU: Motorola 68000 @ 8MHz
                   Memory: 487K / 512K
                   Uptime: ${commands.uptime()}`,
    };

    input.addEventListener('keydown', async function (e) {
      if (e.key !== 'Enter') return;
      const raw = input.value.trim();
      input.value = '';

      /* Echo the command */
      const echoLine = el('div', 'line visible');
      echoLine.innerHTML = '<span class="prompt"><span class="path">operator@TERMINAL-037</span>:<span class="path">~</span>$</span> ' + raw;
      content.insertBefore(echoLine, cmdWrap);

      if (!raw) {
        screenEl.scrollTop = screenEl.scrollHeight;
        return;
      }

      const parts = raw.split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1);

      let output;
      if (cmd === 'clear') {
        /* Remove everything except cmdWrap */
        while (content.firstChild && content.firstChild !== cmdWrap) {
          content.removeChild(content.firstChild);
        }
      } else if (cmd === 'echo') {
        output = args.join(' ');
      } else if (commands[cmd] !== undefined) {
        output = typeof commands[cmd] === 'function' ? commands[cmd]() : commands[cmd];
      } else {
        output = `<span class="error">nxsh: command not found: ${cmd}</span>`;
      }

      if (output !== undefined) {
        const outDiv = el('div', 'line visible');
        if (output.includes('<span')) {
          outDiv.innerHTML = output;
        } else {
          outDiv.textContent = output;
        }
        content.insertBefore(outDiv, cmdWrap);
      }

      screenEl.scrollTop = screenEl.scrollHeight;
    });

  } /* end boot() */

  /* ── Remove power-on flash after animation ── */
  document.getElementById('powerOn').addEventListener('animationend', function () {
    this.remove();
  });

  /* ── Start ── */
  boot();

})();
</script>
</body>
</html>
