<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Dust</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#050510;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(3rem,8vw,6rem);font-weight:100;color:rgba(255,255,255,0.06);letter-spacing:0.2em;text-transform:uppercase;pointer-events:none;z-index:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Cosmic Dust</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,particles=[],nebulae=[];
const PARTICLE_COUNT=3000;
const nebulaColors=[
{r:50,g:100,b:255},{r:150,g:50,b:200},{r:255,g:50,b:150},{r:50,g:200,b:200}
];
class Nebula{constructor(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-0.5)*0.3;this.vy=(Math.random()-0.5)*0.3;this.radius=150+Math.random()*200;this.color=nebulaColors[Math.floor(Math.random()*nebulaColors.length)]}
update(){this.x+=this.vx;this.y+=this.vy;if(this.x<this.radius||this.x>w-this.radius)this.vx*=-1;if(this.y<this.radius||this.y>h-this.radius)this.vy*=-1}}
class Particle{constructor(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-0.5)*0.2;this.vy=(Math.random()-0.5)*0.2;this.r=Math.random()*1.5+0.3;this.phase=Math.random()*Math.PI*2;this.baseAlpha=Math.random()*0.5+0.2}
update(){this.x+=this.vx;this.y+=this.vy;this.phase+=0.02;if(this.x<0)this.x=w;if(this.x>w)this.x=0;if(this.y<0)this.y=h;if(this.y>h)this.y=0}
draw(){let alpha=this.baseAlpha+Math.sin(this.phase)*0.2;let color=`255,255,255`;let closest=null,minDist=Infinity;nebulae.forEach(n=>{const d=Math.sqrt((this.x-n.x)**2+(this.y-n.y)**2);if(d<n.radius&&d<minDist){minDist=d;closest=n}});if(closest){const influence=1-minDist/closest.radius;const r=closest.color.r,g=closest.color.g,b=closest.color.b;color=`${r},${g},${b}`;alpha=influence*0.8}ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(${color},${Math.max(0,alpha)})`;ctx.fill()}}
function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;particles=[];nebulae=[];for(let i=0;i<4;i++)nebulae.push(new Nebula());for(let i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle())}
function animate(){ctx.fillStyle='rgba(5,5,16,0.05)';ctx.fillRect(0,0,w,h);nebulae.forEach(n=>n.update());particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animate)}
c.addEventListener('click',()=>{init()});
window.addEventListener('resize',init);
init();animate();
</script>
</body>
</html>
