<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometric Dreams</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a1a;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.title{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:rgba(255,255,255,0.25);letter-spacing:0.15em;font-family:monospace;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Geometric Dreams</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,time=0;
function drawSolid(sides,radius,x,y,rotation,hue,alpha){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.beginPath();for(let i=0;i<sides;i++){const angle=(i/sides)*Math.PI*2-Math.PI/2;const px=Math.cos(angle)*radius;const py=Math.sin(angle)*radius;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.strokeStyle=`hsla(${hue},70%,60%,${alpha})`;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=`hsla(${hue},70%,60%,${alpha*0.1})`;ctx.fill();ctx.restore()}
function drawIcosahedron(x,y,radius,rotation,hue,alpha){const phi=(1+Math.sqrt(5))/2;const s=radius/phi;const vertices=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]].map(v=>{const nx=v[0]/phi,ny=v[1]/phi,nz=v[2]/phi;const cosR=Math.cos(rotation),sinR=Math.sin(rotation);return{x:nx*s*Math.cosR-nz*s*Math.sinR,y:ny*s,z:nx*s*Math.sinR+nz*s*Math.cosR}});const edges=[[0,1],[0,5],[0,11],[1,5],[1,8],[2,3],[2,7],[2,10],[3,7],[3,9],[4,6],[4,8],[4,9],[5,8],[5,11],[6,7],[6,9],[6,10],[9,10],[11,10]];edges.forEach(e=>{const v1=vertices[e[0]],v2=vertices[e[1]];const avgZ=(v1.z+v2.z)/2;const a=alpha*(0.5+avgZ/radius*0.5);ctx.beginPath();ctx.moveTo(x+v1.x,y+v1.y);ctx.lineTo(x+v2.x,y+v2.y);ctx.strokeStyle=`hsla(${hue},70%,60%,Math.max(0.1,a))`;ctx.lineWidth=1;ctx.stroke()})}
function animate(){time++;ctx.fillStyle='rgba(10,10,26,0.1)';ctx.fillRect(0,0,w,h);const cx=w/2,cy=h/2;const rot=time*0.005;drawIcosahedron(cx,cy,120,rot,time*0.1,0.8);drawSolid(6,80,cx-200,cy+100,rot*1.3,time*0.1+60,0.5);drawSolid(5,60,cx+220,cy-80,-rot*0.8,time*0.1+120,0.5);drawSolid(4,50,cx-150,cy-150,rot*1.5,time*0.1+180,0.4);drawSolid(8,40,cx+180,cy+120,-rot*1.2,time*0.1+240,0.4);drawSolid(3,35,cx,cy+180,rot*0.7,time*0.1+300,0.3);requestAnimationFrame(animate)}
function init(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
window.addEventListener('resize',init);
init();animate();
</script>
</body>
</html>
