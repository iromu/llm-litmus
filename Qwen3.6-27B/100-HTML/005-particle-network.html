<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0e27;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:1}
h1{font-size:clamp(2rem,5vw,4rem);font-weight:200;color:rgba(255,255,255,0.8);text-transform:uppercase;letter-spacing:0.3em;text-shadow:0 0 30px rgba(100,150,255,0.3)}
.stats{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:0.75rem;color:rgba(100,150,255,0.5);letter-spacing:0.15em;font-family:monospace;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
<h1>Connected</h1>
</div>
<div class="stats" id="stats"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,particles=[],mouse={x:-1000,y:-1000,active:false};
const PARTICLE_COUNT=120,CONNECTION_DIST=150,MOUSE_RADIUS=200;
function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
class Particle{constructor(x,y){this.x=x||Math.random()*w;this.y=y||Math.random()*h;this.vx=(Math.random()-0.5)*0.5;this.vy=(Math.random()-0.5)*0.5;this.r=Math.random()*2+1;this.phase=Math.random()*Math.PI*2}
update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w)this.vx*=-1;if(this.y<0||this.y>h)this.vy*=-1;this.phase+=0.02}
draw(){const a=0.3+Math.sin(this.phase)*0.2;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(100,150,255,${a})`;ctx.fill()}}
function init(){particles=[];for(let i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle())}
function drawConnections(){let connections=0;for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x;const dy=particles[i].y-particles[j].y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<CONNECTION_DIST){const a=(1-dist/CONNECTION_DIST)*0.3;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(100,150,255,${a})`;ctx.lineWidth=0.5;ctx.stroke();connections++}}}
// Mouse connections
if(mouse.active){particles.forEach(p=>{const dx=p.x-mouse.x;const dy=p.y-mouse.y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<MOUSE_RADIUS){const a=(1-dist/MOUSE_RADIUS)*0.6;ctx.beginPath();ctx.moveTo(mouse.x,mouse.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=`rgba(150,200,255,${a})`;ctx.lineWidth=1;ctx.stroke();connections++}})}
return connections}
function drawMouse(){if(!mouse.active)return;const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,MOUSE_RADIUS);g.addColorStop(0,'rgba(100,150,255,0.1)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(mouse.x-MOUSE_RADIUS,mouse.y-MOUSE_RADIUS,MOUSE_RADIUS*2,MOUSE_RADIUS*2)}
function animate(){ctx.fillStyle='rgba(10,14,39,0.15)';ctx.fillRect(0,0,w,h);particles.forEach(p=>{p.update();p.draw()});const connections=drawConnections();drawMouse();document.getElementById('stats').textContent=`${connections} connections · ${particles.length} nodes`;requestAnimationFrame(animate)}
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
c.addEventListener('mouseleave',()=>{mouse.active=false});
c.addEventListener('click',e=>{for(let i=0;i<8;i++)particles.push(new Particle(e.clientX,e.clientY))});
window.addEventListener('resize',()=>{resize();init()});
resize();init();animate();
</script>
</body>
</html>
