<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagoda in a Spring Garden — Voxel Art</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #87ceeb;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #1a1a2e;
  }
  #c { display: block; width: 100%; height: 100%; }
  #title {
    position: fixed; top: 22px; left: 26px; z-index: 10;
    background: rgba(255,255,255,0.82);
    border: 2px solid #7c3f12; border-radius: 8px;
    padding: 12px 18px; pointer-events: none;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
  }
  #title h1 { margin: 0 0 4px 0; font-size: 19px; letter-spacing: 1px; color: #7c3f12; }
  #title p { margin: 0; font-size: 12px; color: #444; }
  #legend {
    position: fixed; bottom: 26px; right: 26px; z-index: 10;
    background: rgba(255,255,255,0.72);
    border: 1px solid #aaa; border-radius: 6px;
    padding: 8px 12px; font-size: 11px; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>Pagoda in a Spring Garden</h1>
  <p>5-tier voxel pagoda · cherry blossoms · pond & bridge — drag to orbit, scroll to zoom</p>
</div>
<div id="legend">▲ camera auto-orbits · voxels built procedurally</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/* Palette                                                             */
/* ------------------------------------------------------------------ */
const C = {
  grass:     0x7cb342, grassDark: 0x669a2b, grassLight: 0x9ccc65,
  dirt:      0x8d6e63,
  stone:     0xb0bec5, stoneDark: 0x90a4ae, stoneG: 0x9e9e9e,
  wood:      0x8d6e63, woodRed: 0xa0522d,  woodDark: 0x7a4a1e,
  roof:      0xd2691e, roofDark: 0x9a3f0f,  roofGold: 0xffd700,
  gold:      0xffd700,
  door:      0x5d4037,
  cherry:    0xffa7b8, cherryDark: 0xee7b9a, cherryLight: 0xffd7e0,
  green:     0x66bb6a, greenDark: 0x43a047,
  water:     0x4fc3f7, waterDeep: 0x0288d1, waterLight: 0xb3e5fc,
  flowerR:0xe53935, flowerY:0xfbc02d, flowerP:0x8e24aa,
  flowerW:0xfafafa, flowerO:0xf57c00, flowerL:0x7cb342,
  lantern:0xffd740,
  cloud:0xffffff,
};

/* deterministic RNG for scatter */
let seed = 42;
function rng(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
function hash(a,b,c){ return ((a*31 + b*57 + c*113) & 0xffff) / 0xffff; }

/* ------------------------------------------------------------------ */
/* Voxel list                                                          */
/* ------------------------------------------------------------------ */
const voxels = [];
function V(x,y,z,c){ voxels.push([x,y,z,c]); }

const HALF = 44;

/* rolling-hill terrain (flat plaza in the middle) */
function terrainY(x,z){
  if (Math.abs(x) <= 12 && Math.abs(z) <= 12) return 0;
  return 0.45*Math.sin(x*0.11 + 1.3)*Math.cos(z*0.095 + 0.6)
       + 0.5 *Math.sin(x*0.06 + 0.3)*Math.sin(z*0.08 + 0.9)
       + 0.35*Math.cos(x*0.045 + 1.7)*Math.cos(z*0.05 + 2.2);
}
function inPond(x,z){ const dx=x+20, dz=z-16; return dx*dx + dz*dz < 42; }
function onPath(x,z){ return Math.abs(x) <= 2 && z >= 10; }

/* grass tint */
function grassC(x,z,gy){
  const h = hash(x, z, gy);
  if (h < 0.30) return C.grassDark;
  if (h > 0.70) return C.grassLight;
  return C.grass;
}

/* --- terrain --- */
for (let x=-HALF; x<=HALF; x++){
  for (let z=-HALF; z<=HALF; z++){
    const ty = terrainY(x,z);
    const gy = Math.round(ty);
    if (inPond(x,z)){
      V(x,-1,z,C.dirt);
      const ripple = ((x + z) & 3) === 0;
      V(x,0,z, ripple ? C.waterLight : C.water);
      continue;
    }
    if (onPath(x,z)){
      V(x,gy,z,C.stone);
      V(x,gy-1,z,C.stoneDark);
      continue;
    }
    V(x,gy,z,grassC(x,z,gy));
    V(x,gy-1,z,C.dirt);
    if (gy > 0) V(x,gy-2,z,C.dirt);
  }
}

/* ------------------------------------------------------------------ */
/* Pagoda platform (stone plaza)                                       */
/* ------------------------------------------------------------------ */
const PL = 10;
for (let y=1; y<=3; y++){
  const solid = (y === 3);
  for (let dx=-PL; dx<=PL; dx++){
    for (let dz=-PL; dz<=PL; dz++){
      const border = (Math.abs(dx)===PL || Math.abs(dz)===PL);
      if (solid || border) V(dx, y, dz, C.stone);
    }
  }
}
/* front stairs (descend onto the path, clear of the solid platform) */
for (let i=0;i<4;i++){
  const y = 3 - i; const w = 4 - i;
  for (let dx=-w; dx<=w; dx++) V(dx, y, PL + i + 1, C.stone);
}

/* ------------------------------------------------------------------ */
/* Pagoda — 5 tiers                                                    */
/* ------------------------------------------------------------------ */
const sides = [14,12,10,8,6];
const tierY = [4,11,18,25,32];
const TIER_H = 7;

for (let i=0; i<5; i++){
  const s = sides[i];
  const half = s/2;
  const fy = tierY[i];

  /* walls (square ring) */
  for (let y=fy; y<=fy+2; y++){
    for (let dx=-half; dx<=half; dx++){
      for (let dz=-half; dz<=half; dz++){
        if (Math.abs(dx)===half || Math.abs(dz)===half){
          V(dx, y, dz, C.woodRed);
        }
      }
    }
  }
  /* corner columns */
  for (let y=fy; y<=fy+2; y++){
    V( half, y,  half, C.woodDark);
    V(-half, y,  half, C.woodDark);
    V( half, y, -half, C.woodDark);
    V(-half, y, -half, C.woodDark);
  }

  /* roof: tapering stacked slabs */
  const base = s + 3;
  const top  = 4;
  const roofBaseY = fy + 3;
  for (let L=0; L<4; L++){
    const sideL = Math.round(base + (top - base)*(L/3));
    const hL = Math.round(sideL/2);
    const ry = roofBaseY + L;
    for (let dx=-hL; dx<=hL; dx++){
      for (let dz=-hL; dz<=hL; dz++){
        const edge   = (Math.abs(dx)===hL || Math.abs(dz)===hL);
        const corner = (Math.abs(dx)===hL && Math.abs(dz)===hL);
        let c;
        if (corner && L < 2)      c = C.roofGold;
        else if (edge)            c = C.roofDark;
        else if (hash(dx,ry,dz)<0.28) c = C.roofDark;
        else                      c = C.roof;
        V(dx, ry, dz, c);
      }
    }
    /* upturned golden eaves at the first roof layer's corners */
    if (L === 0){
      const h0 = hL;
      for (let k=1; k<=2; k++){
        V( h0, roofBaseY + k,  h0, C.roofGold);
        V(-h0, roofBaseY + k,  h0, C.roofGold);
        V( h0, roofBaseY + k, -h0, C.roofGold);
        V(-h0, roofBaseY + k, -h0, C.roofGold);
      }
    }
  }

  /* windows + door */
  const wy = fy + 1;
  if (i === 0){
    /* door on front (+z) */
    V(0,  fy,  half, C.door);
    V(0,  fy+1, half, C.door);
    V(0,  fy+2, half, C.gold);
    V(1,  fy+2, half, C.gold);
    V(-1, fy+2, half, C.gold);
    /* side windows */
    V(-half, wy, 0, C.gold);
    V( half, wy, 0, C.gold);
    V(0, wy, -half, C.gold);
  } else {
    V(0,  wy,  half, C.gold);
    V(0,  wy, -half, C.gold);
    V(-half, wy, 0, C.gold);
    V( half, wy, 0, C.gold);
  }
}

/* golden spire + orb (base clears the tier-4 roof-top voxel at y=38) */
for (let y=39; y<=42; y++) V(0, y, 0, C.gold);
V(0, 43, 0, C.gold);
V(0, 44, 0, C.gold);
V(0, 45, 0, C.gold);

/* ------------------------------------------------------------------ */
/* Pond + stone bridge                                                 */
/* ------------------------------------------------------------------ */
const cx = -20;
for (let x=-27; x<=-13; x++){
  const t = (x + 27) / 14;
  const a = Math.sin(Math.PI * t);            /* 0..1..0 arch */
  const y = 1 + Math.round(a * 2.0);
  for (let dz=-1; dz<=1; dz++) V(x, y, 16 + dz, C.stone);
  V(x, y-1, 16, C.stoneDark);
}
/* little rocks around pond */
for (let i=0;i<10;i++){
  const rx = cx + (rng()*14 - 7);
  const rz = 16 + (rng()*14 - 7);
  if (inPond(rx,rz)) continue;
  const gy = Math.round(terrainY(rx,rz));
  V(rx, gy+1, rz, C.stoneG);
  V(rx, gy+2, rz, C.stoneG);
}

/* ------------------------------------------------------------------ */
/* Trees: cherry blossoms (pink) + leafy (green)                       */
/* ------------------------------------------------------------------ */
function buildTree(tx,tz,type){
  const gy = Math.round(terrainY(tx,tz));
  /* trunk */
  const trunk = type==='cherry' ? C.woodDark : C.wood;
  for (let y=gy+1; y<=gy+3; y++) V(tx, y, tz, trunk);
  /* canopy blob */
  const r = 3.2;
  const cy = gy + 5;
  for (let dx=-4; dx<=4; dx++){
    for (let dy=-4; dy<=4; dy++){
      for (let dz=-4; dz<=4; dz++){
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 > r*r * (0.82 + rng()*0.5)) continue;
        /* keep the centre column clear above the trunk (avoid overlap) */
        if (dx===0 && dz===0 && (cy+dy) <= gy+3) continue;
        let c;
        if (type==='cherry'){
          const h = hash(tx+dx, cy+dy, tz+dz);
          c = h<0.35 ? C.cherryDark : (h>0.8 ? C.cherryLight : C.cherry);
        } else {
          c = hash(tx+dx, cy+dy, tz+dz)<0.5 ? C.green : C.greenDark;
        }
        V(tx+dx, cy+dy, tz+dz, c);
      }
    }
  }
}

const cherryTrees = [
  [-18,-22],[18,-20],[24,-10],[30,12],[-26,4],
  [-8,-28],[6,30],[30,-22],[12,26],[-32,-12]
];
const greenTrees = [
  [38,16],[40,-28],[30,34],[-40,-22],[-34,24],[44,2],
  [20,40],[-44,8],[34,-34],[-22,40],[-30,36],[36,-6]
];

for (const [x,z] of cherryTrees){ buildTree(x,z,'cherry'); }
for (const [x,z] of greenTrees){  buildTree(x,z,'green');  }

/* scattered blossom petals under cherry trees */
for (const [tx,tz] of cherryTrees){
  const gy = Math.round(terrainY(tx,tz));
  for (let i=0;i<9;i++){
    const px = tx + Math.round(rng()*10 - 5);
    const pz = tz + Math.round(rng()*10 - 5);
    if (inPond(px,pz) || onPath(px,pz)) continue;
    const pc = rng()<0.4 ? C.cherryDark : C.cherryLight;
    V(px, Math.round(terrainY(px,pz)) + 1, pz, pc);
  }
}

/* ------------------------------------------------------------------ */
/* Flowers, rocks, lanterns, clouds                                    */
/* ------------------------------------------------------------------ */
const flowerColors = [C.flowerR, C.flowerY, C.flowerP, C.flowerW, C.flowerO, C.flowerL];
for (let i=0;i<160;i++){
  const fx = Math.round(rng()*80 - 40);
  const fz = Math.round(rng()*80 - 40);
  if (Math.abs(fx)<=12 && Math.abs(fz)<=12) continue;
  if (inPond(fx,fz) || onPath(fx,fz)) continue;
  const gy = Math.round(terrainY(fx,fz));
  const c = flowerColors[(rng()*6)|0];
  V(fx, gy+1, fz, c);
  if (rng() < 0.3) V(fx, gy+2, fz, c);
}

/* rocks scattered on hills */
for (let i=0;i<22;i++){
  const rx = Math.round(rng()*80 - 40);
  const rz = Math.round(rng()*80 - 40);
  if (Math.abs(rx)<=12 && Math.abs(rz)<=12) continue;
  if (inPond(rx,rz)) continue;
  const gy = Math.round(terrainY(rx,rz));
  V(rx, gy+1, rz, C.stoneG);
  V(rx, gy+2, rz, C.stoneG);
}

/* garden lanterns along the path */
for (let i=0;i<5;i++){
  const lz = 20 + i*7;
  const lx = (i % 2 === 0) ? -4 : 4;
  const gy = Math.round(terrainY(lx,lz));
  V(lx, gy+1, lz, C.stone);
  V(lx, gy+2, lz, C.woodDark);
  V(lx, gy+3, lz, C.lantern);
  V(lx, gy+4, lz, C.stone);
}

/* clouds (kept off the pagoda's axis) */
const cloudCenters = [
  [38,-40,45],[-40,-42,44],[42,40,46],[-44,38,44],[10,-44,43],[-46,-10,44]
];
for (const [cx0,cz0,cy0] of cloudCenters){
  const n = 12 + (rng()*8|0);
  for (let i=0;i<n;i++){
    const ox = Math.round(rng()*4 - 2);
    const oz = Math.round(rng()*4 - 2);
    const oy = Math.round(rng()*2 - 1);
    V(cx0+ox, cy0+oy, cz0+oz, C.cloud);
  }
}

/* ------------------------------------------------------------------ */
/* Build InstancedMesh                                                 */
/* ------------------------------------------------------------------ */
const count = voxels.length;

const geo = new THREE.BoxGeometry(0.94, 0.94, 0.94);
const mat = new THREE.MeshStandardMaterial({
  roughness: 0.6, metalness: 0.08,
});
mat.instanceColor = true;

const mesh = new THREE.InstancedMesh(geo, mat, count);
mesh.castShadow = true;
mesh.receiveShadow = true;

const dummy = new THREE.Object3D();
const col = new THREE.Color();
const cc = new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3);
for (let i=0; i<count; i++){
  const [x,y,z,c] = voxels[i];
  dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
  dummy.updateMatrix();
  mesh.setMatrixAt(i, dummy.matrix);
  col.setHex(c);
  cc.setXYZ(i, col.r, col.g, col.b);
}
mesh.instanceColor = cc;
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

/* ------------------------------------------------------------------ */
/* Scene / renderer                                                    */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();

/* sky gradient background */
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 8; skyCanvas.height = 256;
{
  const ctx = skyCanvas.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0, '#4a90d9');
  g.addColorStop(0.55, '#87ceeb');
  g.addColorStop(1, '#eaf4ff');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,8,256);
}
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
scene.fog = new THREE.Fog(0xdbe9ff, 70, 150);

/* sun */
const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff6c8, fog: false });
const sun = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), sunMat);
sun.position.set(150, 120, -150);
scene.add(sun);

/* lights */
const hemi = new THREE.HemisphereLight(0xffffff, 0x9fc9b0, 0.75);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.22);
scene.add(amb);
const dir = new THREE.DirectionalLight(0xfff4dc, 1.9);
dir.position.set(55, 80, 45);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -70;
dir.shadow.camera.right = 70;
dir.shadow.camera.top = 70;
dir.shadow.camera.bottom = -70;
dir.shadow.camera.near = 10;
dir.shadow.camera.far = 220;
dir.shadow.bias = -0.002;
scene.add(dir);

scene.add(mesh);

/* ------------------------------------------------------------------ */
/* Camera + controls                                                   */
/* ------------------------------------------------------------------ */
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 400);
camera.position.set(56, 34, 56);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.maxPolarAngle = Math.PI * 0.55;
controls.minDistance = 12;
controls.maxDistance = 160;

/* ------------------------------------------------------------------ */
/* Loop                                                                 */
/* ------------------------------------------------------------------ */
function animate(){
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
