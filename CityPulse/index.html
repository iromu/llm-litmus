<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityPulse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui-layer">
    <!-- Title Screen -->
    <div id="title-screen">
      <h1 class="title-main">CityPulse</h1>
      <p class="title-sub">Explore · Interact · Discover</p>
      <p class="title-prompt">Press any key to begin</p>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="hidden">
      <h2 class="pause-title">Paused</h2>
      <p class="pause-prompt">Press ESC to resume</p>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="interaction-prompt" class="hidden">
        <span id="interaction-text">Press E to interact</span>
      </div>
      <div id="controls-hint">
        WASD — Move &nbsp;|&nbsp; SPACE — Jump &nbsp;|&nbsp; MOUSE — Orbit &nbsp;|&nbsp; SCROLL — Zoom &nbsp;|&nbsp; ESC — Pause
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
