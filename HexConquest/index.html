<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HexConquest — Turn-Based Strategy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#d0d0e0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:linear-gradient(180deg,#1a1a3a,#12122a);border-bottom:1px solid #333366;gap:12px;min-height:48px;flex-shrink:0}
#topbar .res{display:flex;gap:12px;flex-wrap:wrap}
.res-item{display:flex;align-items:center;gap:4px;font-size:13px;padding:2px 8px;background:#0d0d20;border-radius:4px;border:1px solid #2a2a4a}
.res-item .icon{font-size:15px}
.res-item .val{font-weight:700;color:#fff;min-width:20px;text-align:right}
#topbar .faction{font-weight:700;font-size:14px;padding:3px 10px;border-radius:4px}
.faction-player{color:#6af;background:rgba(102,170,255,.12);border:1px solid #6af4}
.faction-ai{color:#f66;background:rgba(255,102,102,.12);border:1px solid #f664}
#main{display:flex;flex:1;overflow:hidden}
#canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
#canvas-wrap:active{cursor:grabbing}
canvas{display:block}
#sidebar{width:260px;background:#0e0e22;border-left:1px solid #333366;padding:10px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
#sidebar h3{font-size:13px;color:#88f;margin-bottom:2px;text-transform:uppercase;letter-spacing:1px}
#sidebar .panel{background:#12122a;border:1px solid #2a2a4a;border-radius:6px;padding:8px}
#sidebar .panel p{font-size:12px;line-height:1.5;margin-bottom:4px}
#sidebar .unit-info{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px}
#sidebar .unit-info .label{color:#888}
#sidebar .unit-info .value{color:#fff;font-weight:600;text-align:right}
.btn{display:inline-block;padding:6px 14px;border:1px solid #444;border-radius:4px;background:#1a1a3a;color:#ccc;font-size:12px;cursor:pointer;text-align:center;transition:all .15s}
.btn:hover{background:#2a2a5a;color:#fff;border-color:#6af}
.btn.primary{background:#2a4a8a;border-color:#6af;color:#fff}
.btn.primary:hover{background:#3a5aaa}
.btn.danger{background:#5a2a2a;border-color:#f66;color:#faa}
.btn.danger:hover{background:#7a3a3a}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
#actions{display:flex;flex-wrap:wrap;gap:4px}
#actions .btn{flex:1;min-width:70px}
#turn-btn{padding:8px 20px;font-size:14px;font-weight:700}
#log{flex:1;min-height:60px;overflow-y:auto;font-size:11px;font-family:monospace;color:#888;line-height:1.6}
#log .msg{border-bottom:1px solid #1a1a3a;padding:2px 0}
#log .msg.important{color:#ff0}
#log .msg.combat{color:#f88}
#log .msg.build{color:#8f8}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
#overlay.hidden{display:none}
#overlay .modal{background:#14142a;border:2px solid #6af;border-radius:12px;padding:30px 40px;max-width:500px;text-align:center}
#overlay .modal h1{font-size:28px;color:#6af;margin-bottom:8px}
#overlay .modal p{font-size:14px;color:#aaa;margin-bottom:16px;line-height:1.6}
#overlay .modal .btn{font-size:16px;padding:10px 30px}
.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.build-grid .btn{text-align:left;font-size:11px;padding:6px 8px}
.build-grid .btn .cost{font-size:10px;color:#888;display:block;margin-top:2px}
#tooltip{position:fixed;background:#1a1a3a;border:1px solid #6af;border-radius:4px;padding:4px 8px;font-size:11px;pointer-events:none;z-index:50;display:none;white-space:nowrap}
.hex-label{font-size:10px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
</style>
</head>
<body>
<div id="topbar">
  <div class="res" id="player-res"></div>
  <button class="btn primary" id="turn-btn" onclick="endTurn()">End Turn</button>
  <div class="res" id="ai-res"></div>
</div>
<div id="main">
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div id="sidebar">
    <div class="panel" id="selected-panel">
      <h3>Selection</h3>
      <p>Click a hex or unit to select it.</p>
    </div>
    <div class="panel" id="build-panel">
      <h3>Build</h3>
      <div id="actions"></div>
      <div style="margin-top:8px"><h3>Units</h3><div class="build-grid" id="unit-build"></div></div>
    </div>
    <div class="panel" id="log-panel">
      <h3>Log</h3>
      <div id="log"></div>
    </div>
  </div>
</div>
<div id="overlay">
  <div class="modal">
    <h1>⚔ HexConquest</h1>
    <p>A turn-based strategy game. Build bases, train units, and conquer the map.<br>
    <b>Scout</b> (cheap, fast) · <b>Engineer</b> (builds structures) · <b>Warrior</b> (strong melee) · <b>Artillery</b> (ranged) · <b>Tank</b> (heavy armor)</p>
    <button class="btn primary" onclick="startGame()">Start Game</button>
  </div>
</div>
<div id="tooltip"></div>
<script>
// ==================== CONSTANTS ====================
const HEX_SIZE = 28;
const MAP_RADIUS = 10;
const COLS = MAP_RADIUS * 2 + 1;
const ROWS = MAP_RADIUS * 2 + 1;
const FPS = 60;

const UNIT_DEFS = {
  scout:    { name:'Scout',    hp:15, atk:4, def:1, move:4, range:1, cost:{food:5,materials:5,energy:0,intel:0}, icon:'🏃', desc:'Fast recon unit' },
  engineer: { name:'Engineer', hp:12, atk:1, def:1, move:3, range:1, cost:{food:8,materials:10,energy:5,intel:0}, icon:'🔧', desc:'Can build structures' },
  warrior:  { name:'Warrior',  hp:30, atk:8, def:4, move:2, range:1, cost:{food:15,materials:15,energy:5,intel:0}, icon:'⚔️', desc:'Strong melee fighter' },
  artillery:{ name:'Artillery',hp:20, atk:10,def:1, move:1, range:3, cost:{food:10,materials:20,energy:15,intel:5}, icon:'💣', desc:'Long-range bombardment' },
  tank:     { name:'Tank',     hp:50, atk:12,def:8, move:2, range:1, cost:{food:20,materials:30,energy:15,intel:5}, icon:'🛡️', desc:'Heavy armored unit' }
};

const STRUCT_DEFS = {
  command:  { name:'Command Center',  hp:80, prod:{food:5,materials:3,energy:2,intel:1}, cost:{food:30,materials:20,energy:10,intel:5}, icon:'🏛️', desc:'Generates all resources' },
  barracks: { name:'Barracks',        hp:50, prod:{}, cost:{food:15,materials:25,energy:10,intel:0}, icon:'⚔️', desc:'Unlocks Warrior & Tank production' },
  mine:     { name:'Mine',            hp:30, prod:{materials:6}, cost:{food:10,materials:5,energy:5,intel:0}, icon:'⛏️', desc:'Produces materials' },
  powerplant:{ name:'Power Plant',    hp:30, prod:{energy:8}, cost:{food:10,materials:10,energy:0,intel:0}, icon:'⚡', desc:'Produces energy' },
  outpost:  { name:'Outpost',         hp:40, prod:{intel:3}, cost:{food:10,materials:10,energy:5,intel:10}, icon:'📡', desc:'Produces intel' },
  fortress: { name:'Fortress',        hp:120,prod:{}, cost:{food:30,materials:40,energy:20,intel:10}, icon:'🏰', desc:'Heavy defense structure' }
};

// ==================== GAME STATE ====================
let game = null;
let canvas, ctx;
let camera = { x: 0, y: 0, zoom: 1 };
let selected = null; // {type:'hex'|'unit'|'structure', q,r, unit, structure}
let hoveredHex = null;
let animQueue = [];
let animFrame = 0;
let gameOver = false;
let turnPhase = 'player'; // 'player' or 'ai'
let messages = [];

function hexToPixel(q, r) {
  const x = HEX_SIZE * (3/2 * q);
  const y = HEX_SIZE * (Math.sqrt(3)/2 * q + Math.sqrt(3) * r);
  return { x, y };
}

function pixelToHex(px, py) {
  const x = px / HEX_SIZE;
  const y = py / HEX_SIZE;
  const q = (2/3 * x);
  const r = (-1/3 * x + Math.sqrt(3)/3 * y);
  return cubeRound(axialToCube(q, r, 0));
}

function axialToCube(q, r) { return { q, r, s: -q - r }; }
function cubeRound(frac) {
  let q = Math.round(frac.q), r = Math.round(frac.r), s = Math.round(frac.s);
  const dq = Math.abs(q - frac.q), dr = Math.abs(r - frac.r), ds = Math.abs(s - frac.s);
  if (dq > dr && dq > ds) q = -r - s;
  else if (dr > ds) r = -q - s;
  else s = -q - r;
  return { q, r };
}

function hexKey(q, r) { return `${q},${r}`; }
function hexDist(a, b) {
  const da = axialToCube(a.q, a.r), db = axialToCube(b.q, b.r);
  return (Math.abs(da.q-db.q)+Math.abs(da.r-db.r)+Math.abs(da.s-db.s))/2;
}

function hexNeighbors(q, r) {
  const dirs = [{q:1,r:0},{q:-1,r:0},{q:0,r:1},{q:0,r:-1},{q:1,r:-1},{q:-1,r:1}];
  return dirs.map(d => ({q:q+d.q, r:r+d.r})).filter(h => isValidHex(h));
}

function isValidHex(q, r) {
  if (typeof q === 'object') { r = q.r; q = q.q; }
  return hexDist({q,r}, {q:0,r:0}) <= MAP_RADIUS;
}

function createMap() {
  const map = {};
  for (let q = -MAP_RADIUS; q <= MAP_RADIUS; q++) {
    const r1 = Math.max(-MAP_RADIUS, -q - MAP_RADIUS);
    const r2 = Math.min(MAP_RADIUS, -q + MAP_RADIUS);
    for (let r = r1; r <= r2; r++) {
      const { x, y } = hexToPixel(q, r);
      // Terrain type
      const dist = hexDist({q,r}, {q:0,r:0});
      let terrain = 'plains';
      const seed = Math.sin(q*127.1+r*311.7)*43758.5453;
      const noise = seed - Math.floor(seed);
      if (dist >= MAP_RADIUS - 1) terrain = 'mountain';
      else if (noise > 0.75) terrain = 'forest';
      else if (noise > 0.65) terrain = 'mountain';
      else if (noise > 0.55) terrain = 'swamp';
      else if (noise > 0.50) terrain = 'hills';
      // Resources on map hexes
      let resource = null;
      if (noise > 0.7 && terrain !== 'mountain' && terrain !== 'swamp') resource = 'food';
      else if (noise > 0.6 && terrain !== 'mountain' && terrain !== 'swamp') resource = 'materials';
      else if (noise > 0.5 && terrain !== 'swamp') resource = 'energy';
      map[hexKey(q,r)] = {
        q, r, terrain, resource,
        x: x + COLS * HEX_SIZE * 1.5,
        y: y + ROWS * HEX_SIZE * Math.sqrt(3) * 0.75,
        structure: null,
        unit: null
      };
    }
  }
  return map;
}

function createFaction(id, name, color, colorLight) {
  return {
    id, name, color, colorLight,
    resources: { food: 30, materials: 20, energy: 10, intel: 5 },
    units: [],
    structures: [],
    hasBarracks: false
  };
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const map = createMap();

  // Place player base
  const playerStart = { q: 0, r: 2 };
  map[hexKey(playerStart.q, playerStart.r)].structure = { type:'command', hp:80, maxHp:80, owner:'player' };
  map[hexKey(playerStart.q, playerStart.r)].structure.faction = 'player';

  // Place AI base
  const aiStart = { q: 0, r: -3 };
  map[hexKey(aiStart.q, aiStart.r)].structure = { type:'command', hp:80, maxHp:80, owner:'ai' };
  map[hexKey(aiStart.q, aiStart.r)].structure.faction = 'ai';

  // Starting units
  const pScout = createUnit('scout', 'player');
  const pEng = createUnit('engineer', 'player');
  const aScout = createUnit('scout', 'ai');
  const aWar = createUnit('warrior', 'ai');

  map[hexKey(playerStart.q, playerStart.r)].unit = pScout;
  map[hexKey(playerStart.q, playerStart.r-1)].unit = pEng;
  map[hexKey(aiStart.q, aiStart.r)].unit = aScout;
  map[hexKey(aiStart.q, aiStart.r+1)].unit = aWar;

  game = {
    map,
    factions: {
      player: createFaction('player', 'Blue Command', '#4488ff', '#88bbff'),
      ai: createFaction('ai', 'Red Empire', '#ff4444', '#ff8888')
    },
    turn: 0,
    phase: 'player',
    selected: null,
    buildMode: null,
    messages: []
  };

  // Center camera on map
  camera.x = COLS * HEX_SIZE * 1.5 / 2;
  camera.y = ROWS * HEX_SIZE * Math.sqrt(3) * 0.75 / 2;

  addMessage('Game started! Build your base and conquer the map.', 'important');
  addMessage('Select a unit or hex to begin.', '');

  setupInput();
  updateUI();
  requestAnimationFrame(render);
}

function createUnit(type, faction) {
  const def = UNIT_DEFS[type];
  return {
    type, ...def,
    faction,
    currentHp: def.hp,
    hasMoved: false,
    hasAttacked: false,
    id: Math.random().toString(36).substr(2, 9)
  };
}

function createStructure(type, faction, q, r) {
  const def = STRUCT_DEFS[type];
  return {
    type, ...def,
    faction,
    q, r,
    currentHp: def.hp,
    maxHp: def.hp,
    id: Math.random().toString(36).substr(2, 9)
  };
}

// ==================== INPUT ====================
let mouse = { x: 0, y: 0, down: false, dragX: 0, dragY: 0 };

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}

function setupInput() {
  canvas.addEventListener('mousedown', e => {
    if (e.button === 2 || e.button === 1) { mouse.down = true; mouse.dragX = e.clientX; mouse.dragY = e.clientY; return; }
    if (e.button === 0) {
      mouse.down = true;
      const hex = screenToHex(e.clientX, e.clientY);
      if (hex && game.phase === 'player') {
        handleHexClick(hex);
      } else if (hex) {
        // Click during AI turn does nothing
      }
    }
  });

  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if (mouse.down && (e.button === 2 || e.button === 1)) {
      camera.x -= (e.clientX - mouse.dragX);
      camera.y -= (e.clientY - mouse.dragY);
      mouse.dragX = e.clientX;
      mouse.dragY = e.clientY;
    }
    // Update hovered hex
    const hex = screenToHex(e.clientX, e.clientY);
    if (hex) {
      hoveredHex = hex;
      showTooltip(e.clientX, e.clientY, hex);
    } else {
      hoveredHex = null;
      hideTooltip();
    }
  });

  canvas.addEventListener('mouseup', e => {
    mouse.down = false;
  });

  canvas.addEventListener('contextmenu', e => { e.preventDefault(); cancelBuild(); });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    camera.zoom = Math.max(0.3, Math.min(3, camera.zoom * delta));
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') cancelBuild();
    if (e.key === ' ' && game.phase === 'player') { e.preventDefault(); endTurn(); }
  });
}

function screenToHex(sx, sy) {
  const cx = (sx - canvas.width/2) / camera.zoom + camera.x;
  const cy = (sy - canvas.height/2) / camera.zoom + camera.y;
  const hex = pixelToHex(cx, cy);
  if (isValidHex(hex)) return hex;
  return null;
}

function showTooltip(sx, sy, hex) {
  const tt = document.getElementById('tooltip');
  const tile = game.map[hexKey(hex.q, hex.r)];
  let lines = [`[${hex.q},${hex.r}] ${tile.terrain}`];
  if (tile.resource) lines.push(`Resource: ${tile.resource}`);
  if (tile.unit) lines.push(`Unit: ${tile.unit.name} (${tile.unit.currentHp}/${tile.unit.hp})`);
  if (tile.structure) lines.push(`Structure: ${tile.structure.name}`);
  tt.textContent = lines.join(' · ');
  tt.style.display = 'block';
  tt.style.left = (sx + 14) + 'px';
  tt.style.top = (sy + 14) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

function handleHexClick(hex) {
  const tile = game.map[hexKey(hex.q, hex.r)];

  // If build mode, try to build
  if (game.buildMode) {
    tryBuild(game.buildMode, hex);
    return;
  }

  // If a unit is selected and has move/attack, try to act
  if (selected && selected.type === 'unit') {
    const unit = selected.unit;
    if (unit.faction !== 'player') {
      // Select enemy unit
      selectUnit(unit);
      return;
    }
    // Can move to adjacent hex
    if (hexDist(hex, {q:unit.q, r:unit.r}) === 1 && !tile.unit && !tile.structure && !unit.hasMoved) {
      moveUnit(unit, hex.q, hex.r);
      return;
    }
    // Can attack adjacent enemy unit or structure
    if (hexDist(hex, {q:unit.q, r:unit.r}) <= unit.range && (tile.unit || tile.structure)) {
      const target = tile.unit || tile.structure;
      if (target.faction !== 'player') {
        attack(unit, target);
        return;
      }
    }
  }

  // Select hex/unit/structure
  if (tile.unit) {
    selectUnit(tile.unit);
  } else if (tile.structure) {
    selectStructure(tile.structure);
  } else {
    selected = { type:'hex', q:hex.q, r:hex.r };
    updateSidebar();
  }
}

function selectUnit(unit) {
  selected = { type:'unit', unit };
  updateSidebar();
}

function selectStructure(structure) {
  selected = { type:'structure', structure };
  updateSidebar();
}

function cancelBuild() {
  game.buildMode = null;
  updateActions();
}

// ==================== GAME ACTIONS ====================
function moveUnit(unit, q, r) {
  const fromHex = game.map[hexKey(unit.q, unit.r)];
  const toHex = game.map[hexKey(q, r)];
  fromHex.unit = null;
  toHex.unit = unit;
  unit.q = q;
  unit.r = r;
  unit.hasMoved = true;
  addMessage(`${unit.name} moved to [${q},${r}]`, '');
  selected = { type:'unit', unit };
  updateSidebar();
}

function attack(attacker, target) {
  const damage = Math.max(1, attacker.atk - target.def + Math.floor(Math.random()*3) - 1);
  target.currentHp -= damage;
  attacker.hasAttacked = true;
  attacker.hasMoved = true;
  addMessage(`${attacker.name} attacks ${target.name} for ${damage} damage!`, 'combat');

  if (target.currentHp <= 0) {
    addMessage(`${target.name} destroyed!`, 'important');
    if (target.type && UNIT_DEFS[target.type]) {
      // It's a unit
      const tile = game.map[hexKey(target.q, target.r)];
      tile.unit = null;
      const idx = game.factions[target.faction].units.indexOf(target);
      if (idx >= 0) game.factions[target.faction].units.splice(idx, 1);
    } else {
      // It's a structure
      const tile = game.map[hexKey(target.q, target.r)];
      tile.structure = null;
      const idx = game.factions[target.faction].structures.indexOf(target);
      if (idx >= 0) game.factions[target.faction].structures.splice(idx, 1);
    }
  }
  updateSidebar();
}

function tryBuild(buildType, hex) {
  const tile = game.map[hexKey(hex.q, hex.r)];
  if (tile.unit || tile.structure) {
    addMessage('Hex is occupied!', '');
    return;
  }
  if (tile.terrain === 'mountain' || tile.terrain === 'swamp') {
    addMessage('Cannot build on ' + tile.terrain + '!', '');
    return;
  }
  if (hexDist(hex, {q:0,r:0}) > MAP_RADIUS) {
    addMessage('Out of map bounds!', '');
    return;
  }

  // Must be adjacent to player structure or unit
  const neighbors = hexNeighbors(hex.q, hex.r);
  const adjPlayer = neighbors.some(n => {
    const nt = game.map[hexKey(n.q, n.r)];
    return (nt.structure && nt.structure.faction === 'player') || (nt.unit && nt.unit.faction === 'player');
  });
  if (!adjPlayer) {
    addMessage('Must be adjacent to your territory!', '');
    return;
  }

  // Check resources
  const cost = STRUCT_DEFS[buildType].cost;
  for (const [res, amt] of Object.entries(cost)) {
    if (game.factions.player.resources[res] < amt) {
      addMessage(`Not enough ${res}!`, '');
      return;
    }
  }

  // Deduct cost
  for (const [res, amt] of Object.entries(cost)) {
    game.factions.player.resources[res] -= amt;
  }

  const struct = createStructure(buildType, 'player', hex.q, hex.r);
  tile.structure = struct;
  game.factions.player.structures.push(struct);

  if (buildType === 'barracks') game.factions.player.hasBarracks = true;

  addMessage(`Built ${struct.name} at [${hex.q},${hex.r}]`, 'build');
  game.buildMode = null;
  updateUI();
}

function buildUnit(unitType) {
  if (game.phase !== 'player') return;

  // Must be adjacent to command center
  const commands = game.factions.player.structures.filter(s => s.type === 'command');
  if (commands.length === 0) {
    addMessage('No Command Center!', '');
    return;
  }

  // Check cost
  const cost = UNIT_DEFS[unitType].cost;
  for (const [res, amt] of Object.entries(cost)) {
    if (game.factions.player.resources[res] < amt) {
      addMessage(`Not enough ${res}!`, '');
      return;
    }
  }

  // Find adjacent empty hex to a command center
  for (const cmd of commands) {
    const neighbors = hexNeighbors(cmd.q, cmd.r);
    for (const n of neighbors) {
      const nt = game.map[hexKey(n.q, n.r)];
      if (!nt.unit && !nt.structure && nt.terrain !== 'mountain' && nt.terrain !== 'swamp') {
        // Deduct cost
        for (const [res, amt] of Object.entries(cost)) {
          game.factions.player.resources[res] -= amt;
        }
        const unit = createUnit(unitType, 'player');
        nt.unit = unit;
        game.factions.player.units.push(unit);
        addMessage(`Trained ${unit.name} at [${n.q},${n.r}]`, 'build');
        updateUI();
        return;
      }
    }
  }
  addMessage('No space near Command Center!', '');
}

function updateActions() {
  const actions = document.getElementById('actions');
  const unitBuild = document.getElementById('unit-build');

  if (game.phase !== 'player') {
    actions.innerHTML = '<p style="color:#888;font-size:12px">AI turn...</p>';
    unitBuild.innerHTML = '';
    return;
  }

  // Structure build buttons
  const structures = [
    { type:'mine', label:'⛏️ Mine' },
    { type:'powerplant', label:'⚡ Power Plant' },
    { type:'outpost', label:'📡 Outpost' },
    { type:'fortress', label:'🏰 Fortress' }
  ];
  if (game.factions.player.hasBarracks) {
    structures.push({ type:'barracks', label:'⚔️ Barracks' });
  }

  actions.innerHTML = structures.map(s =>
    `<button class="btn" onclick="startBuild('${s.type}')">${s.label}</button>`
  ).join('');

  // Unit build buttons
  const units = [
    { type:'scout', label:'🏃 Scout' },
    { type:'engineer', label:'🔧 Engineer' }
  ];
  if (game.factions.player.hasBarracks) {
    units.push({ type:'warrior', label:'⚔️ Warrior' });
    units.push({ type:'tank', label:'🛡️ Tank' });
  }
  units.push({ type:'artillery', label:'💣 Artillery' });

  unitBuild.innerHTML = units.map(u => {
    const def = UNIT_DEFS[u.type];
    const c = def.cost;
    return `<button class="btn" onclick="buildUnit('${u.type}')">${u.label}<span class="cost">F:${c.food} M:${c.materials} E:${c.energy} I:${c.intel}</span></button>`;
  }).join('');
}

function startBuild(type) {
  game.buildMode = type;
  addMessage(`Click a hex to place ${STRUCT_DEFS[type].name}. (Esc to cancel)`, 'build');
  updateActions();
}

// ==================== TURN MANAGEMENT ====================
function endTurn() {
  if (game.phase !== 'player') return;
  game.phase = 'ai';
  game.turn++;
  addMessage(`--- Turn ${game.turn}: AI's turn ---`, 'important');

  // Reset player units
  game.factions.player.units.forEach(u => { u.hasMoved = false; u.hasAttacked = false; });

  updateActions();
  updateUI();

  // AI turn (delayed)
  setTimeout(aiTurn, 500);
}

function aiTurn() {
  if (gameOver) return;

  // AI production (resource generation from structures)
  aiStructureProd();

  // AI unit actions (move, attack, build)
  const aiUnits = game.factions.ai.units;
  for (const unit of aiUnits) {
    if (gameOver) return;
    aiUnitAction(unit);
  }

  // AI builds units and structures
  aiBuild();

  // Check win condition
  if (game.factions.player.structures.length === 0 && game.factions.player.units.length === 0) {
    gameOver = true;
    showEndScreen('Defeat! Your forces have been annihilated.');
    return;
  }
  if (game.factions.ai.structures.length === 0 && game.factions.ai.units.length === 0) {
    gameOver = true;
    showEndScreen('Victory! The Red Empire has fallen.');
    return;
  }

  // Start player turn
  game.phase = 'player';
  game.factions.ai.units.forEach(u => { u.hasMoved = false; u.hasAttacked = false; });

  // Player production
  playerProduction();

  addMessage(`--- Turn ${game.turn}: Your turn ---`, 'important');
  updateActions();
  updateUI();
}

function aiBuild() {
  // AI builds units and structures
  const ai = game.factions.ai;

  // Prioritize building near player
  const commands = ai.structures.filter(s => s.type === 'command');
  for (const cmd of commands) {
    // Try to build warrior
    if (ai.resources.food >= 15 && ai.resources.materials >= 15 && ai.resources.energy >= 5) {
      const neighbors = hexNeighbors(cmd.q, cmd.r);
      for (const n of neighbors) {
        const nt = game.map[hexKey(n.q, n.r)];
        if (!nt.unit && !nt.structure && nt.terrain !== 'mountain' && nt.terrain !== 'swamp') {
          ai.resources.food -= 15; ai.resources.materials -= 15; ai.resources.energy -= 5;
          const unit = createUnit('warrior', 'ai');
          nt.unit = unit;
          ai.units.push(unit);
          addMessage(`AI trained a Warrior at [${n.q},${n.r}]`, 'combat');
          break;
        }
      }
    }

    // Try to build barracks if none
    if (!ai.hasBarracks && ai.resources.food >= 15 && ai.resources.materials >= 25 && ai.resources.energy >= 10) {
      const neighbors = hexNeighbors(cmd.q, cmd.r);
      for (const n of neighbors) {
        const nt = game.map[hexKey(n.q, n.r)];
        if (!nt.unit && !nt.structure && nt.terrain !== 'mountain' && nt.terrain !== 'swamp') {
          ai.resources.food -= 15; ai.resources.materials -= 25; ai.resources.energy -= 10;
          const struct = createStructure('barracks', 'ai', n.q, n.r);
          nt.structure = struct;
          ai.structures.push(struct);
          ai.hasBarracks = true;
          addMessage('AI built a Barracks!', 'build');
          break;
        }
      }
    }

    // Try to build mine
    if (ai.resources.food >= 10 && ai.resources.materials >= 5 && ai.resources.energy >= 5) {
      const neighbors = hexNeighbors(cmd.q, cmd.r);
      for (const n of neighbors) {
        const nt = game.map[hexKey(n.q, n.r)];
        if (!nt.unit && !nt.structure && nt.terrain !== 'mountain' && nt.terrain !== 'swamp') {
          ai.resources.food -= 10; ai.resources.materials -= 5; ai.resources.energy -= 5;
          const struct = createStructure('mine', 'ai', n.q, n.r);
          nt.structure = struct;
          ai.structures.push(struct);
          addMessage('AI built a Mine!', 'build');
          break;
        }
      }
    }

    // Try to build power plant
    if (ai.resources.food >= 10 && ai.resources.materials >= 10 && ai.resources.energy >= 0 && ai.resources.energy < 20) {
      const neighbors = hexNeighbors(cmd.q, cmd.r);
      for (const n of neighbors) {
        const nt = game.map[hexKey(n.q, n.r)];
        if (!nt.unit && !nt.structure && nt.terrain !== 'mountain' && nt.terrain !== 'swamp') {
          ai.resources.food -= 10; ai.resources.materials -= 10;
          const struct = createStructure('powerplant', 'ai', n.q, n.r);
          nt.structure = struct;
          ai.structures.push(struct);
          addMessage('AI built a Power Plant!', 'build');
          break;
        }
      }
    }

    // Try to train a warrior unit
    if (ai.resources.food >= 15 && ai.resources.materials >= 15 && ai.resources.energy >= 5) {
      const neighbors = hexNeighbors(cmd.q, cmd.r);
      for (const n of neighbors) {
        const nt = game.map[hexKey(n.q, n.r)];
        if (!nt.unit && !nt.structure && nt.terrain !== 'mountain' && nt.terrain !== 'swamp') {
          ai.resources.food -= 15; ai.resources.materials -= 15; ai.resources.energy -= 5;
          const unit = createUnit('warrior', 'ai');
          nt.unit = unit;
          ai.units.push(unit);
          addMessage(`AI trained a Warrior at [${n.q},${n.r}]`, 'combat');
          break;
        }
      }
    }

    // Try to train a scout (cheap, for recon)
    if (ai.resources.food >= 5 && ai.resources.materials >= 5 && ai.units.filter(u => u.type === 'scout').length < 2) {
      const neighbors = hexNeighbors(cmd.q, cmd.r);
      for (const n of neighbors) {
        const nt = game.map[hexKey(n.q, n.r)];
        if (!nt.unit && !nt.structure && nt.terrain !== 'mountain' && nt.terrain !== 'swamp') {
          ai.resources.food -= 5; ai.resources.materials -= 5;
          const unit = createUnit('scout', 'ai');
          nt.unit = unit;
          ai.units.push(unit);
          break;
        }
      }
    }
  }
}

function aiUnitAction(unit) {
  const tile = game.map[hexKey(unit.q, unit.r)];

  // Find nearest player unit or structure
  let target = null;
  let minDist = Infinity;

  for (const pu of game.factions.player.units) {
    const pt = game.map[hexKey(pu.q, pu.r)];
    if (pt.unit) {
      const d = hexDist({q:unit.q, r:unit.r}, {q:pu.q, r:pu.r});
      if (d < minDist) { minDist = d; target = pu; }
    }
  }
  for (const ps of game.factions.player.structures) {
    const d = hexDist({q:unit.q, r:unit.r}, {q:ps.q, r:ps.r});
    if (d < minDist) { minDist = d; target = ps; }
  }

  if (!target) return;

  const targetHex = target.q !== undefined ? { q: target.q, r: target.r } : null;
  if (!targetHex) return;

  const dist = hexDist({q:unit.q, r:unit.r}, targetHex);

  // Attack if in range
  if (dist <= unit.range && (targetHex.q !== undefined)) {
    const tTile = game.map[hexKey(targetHex.q, targetHex.r)];
    if (tTile.unit || tTile.structure) {
      attack(unit, tTile.unit || tTile.structure);
      return;
    }
  }

  // Move toward target
  if (!unit.hasMoved && dist > 1) {
    // Simple path: move one step toward target
    const bestHex = findBestMove(unit, targetHex);
    if (bestHex) {
      const fromTile = game.map[hexKey(unit.q, unit.r)];
      const toTile = game.map[hexKey(bestHex.q, bestHex.r)];
      fromTile.unit = null;
      toTile.unit = unit;
      unit.q = bestHex.q;
      unit.r = bestHex.r;
      unit.hasMoved = true;
      // Check if we can now attack after moving
      const newDist = hexDist({q:unit.q, r:unit.r}, targetHex);
      if (newDist <= unit.range) {
        const tTile = game.map[hexKey(targetHex.q, targetHex.r)];
        if (tTile.unit || tTile.structure) {
          attack(unit, tTile.unit || tTile.structure);
          return;
        }
      }
    }
  } else if (!unit.hasMoved && dist <= unit.range) {
    // Already in range, just attack
    const tTile = game.map[hexKey(targetHex.q, targetHex.r)];
    if (tTile.unit || tTile.structure) {
      attack(unit, tTile.unit || tTile.structure);
    }
  }
}

function findBestMove(unit, target) {
  let best = null;
  let bestDist = hexDist({q:unit.q, r:unit.r}, target);
  const neighbors = hexNeighbors(unit.q, unit.r);

  for (const n of neighbors) {
    const nt = game.map[hexKey(n.q, n.r)];
    if (nt.unit || nt.structure || nt.terrain === 'mountain' || nt.terrain === 'swamp') continue;
    const d = hexDist(n, target);
    if (d < bestDist) {
      bestDist = d;
      best = n;
    }
  }

  // Also consider attacking potential
  if (best) {
    const nt = game.map[hexKey(best.q, best.r)];
    if (nt.unit && nt.unit.faction !== unit.faction) {
      // Check if we can kill it
      const dmg = Math.max(1, unit.atk - (nt.unit.def || 0));
      if (dmg >= nt.unit.currentHp) return best;
    }
  }

  return best;
}

function aiStructureProd() {
  // AI structures produce resources
  for (const struct of game.factions.ai.structures) {
    if (struct.prod) {
      for (const [res, amt] of Object.entries(struct.prod)) {
        game.factions.ai.resources[res] += amt;
      }
    }
  }

  // AI units attack adjacent player units/structures
  for (const unit of game.factions.ai.units) {
    const neighbors = hexNeighbors(unit.q, unit.r);
    for (const n of neighbors) {
      const nt = game.map[hexKey(n.q, n.r)];
      if (nt.unit && nt.unit.faction === 'player') {
        attack(unit, nt.unit);
      } else if (nt.structure && nt.structure.faction === 'player') {
        attack(unit, nt.structure);
      }
    }
  }
}

function playerProduction() {
  // Player structures produce resources
  for (const struct of game.factions.player.structures) {
    if (struct.prod) {
      for (const [res, amt] of Object.entries(struct.prod)) {
        game.factions.player.resources[res] += amt;
      }
    }
  }

  // Map resource bonuses
  for (const tile of Object.values(game.map)) {
    if (tile.resource && !tile.structure) {
      const dist = hexDist({q:tile.q, r:tile.r}, {q:0, r:0});
      if (dist <= 3) {
        game.factions.player.resources[tile.resource] += 2;
      }
    }
  }
}

function showEndScreen(msg) {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = gameOver && msg.includes('Victory') ? '🏆 Victory!' : '💀 Defeat';
  overlay.querySelector('p').textContent = msg;
  overlay.querySelector('.btn').textContent = 'Play Again';
  overlay.querySelector('.btn').onclick = () => location.reload();
}

// ==================== UI ====================
function updateUI() {
  updateResBars();
  updateSidebar();
  updateActions();
}

function updateResBars() {
  const pRes = game.factions.player.resources;
  const aRes = game.factions.ai.resources;

  const icons = { food:'🍖', materials:'🪨', energy:'⚡', intel:'📡' };
  const names = { food:'Food', materials:'Materials', energy:'Energy', intel:'Intel' };

  const renderRes = (res, faction) => {
    return Object.entries(res).map(([k,v]) =>
      `<span class="res-item"><span class="icon">${icons[k]}</span><span>${names[k]}:</span><span class="val">${v}</span></span>`
    ).join('');
  };

  document.getElementById('player-res').innerHTML = `<span class="faction faction-player">${game.factions.player.name}</span> ` + renderRes(pRes, 'player');
  document.getElementById('ai-res').innerHTML = renderRes(aRes, 'ai') + ` <span class="faction faction-ai">${game.factions.ai.name}</span>`;
}

function addMessage(text, cls) {
  messages.push({ text, cls });
  if (messages.length > 50) messages.shift();
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'msg' + (cls ? ' ' + cls : '');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function updateSidebar() {
  const panel = document.getElementById('selected-panel');
  if (!selected) {
    panel.innerHTML = '<h3>Selection</h3><p>Click a hex or unit to select it.</p>';
    return;
  }

  if (selected.type === 'unit') {
    const u = selected.unit;
    const tile = game.map[hexKey(u.q, u.r)];
    const isPlayer = u.faction === 'player';
    let html = `<h3>${u.icon} ${u.name} ${isPlayer ? '' : '(Enemy)'}</h3>`;
    html += `<div class="unit-info">`;
    html += `<span class="label">HP:</span><span class="value">${u.currentHp}/${u.hp}</span>`;
    html += `<span class="label">ATK:</span><span class="value">${u.atk}</span>`;
    html += `<span class="label">DEF:</span><span class="value">${u.def}</span>`;
    html += `<span class="label">Move:</span><span class="value">${u.move}</span>`;
    html += `<span class="label">Range:</span><span class="value">${u.range}</span>`;
    html += `<span class="label">Pos:</span><span class="value">[${u.q},${u.r}]</span>`;
    html += `<span class="label">Terrain:</span><span class="value">${tile.terrain}</span>`;
    html += `</div>`;
    html += `<p style="color:#888;font-size:11px;margin-top:4px">${u.desc}</p>`;
    if (isPlayer && game.phase === 'player') {
      html += `<p style="margin-top:6px;font-size:12px;color:${u.hasMoved ? '#f88' : '#8f8'}">${u.hasMoved ? 'Has acted this turn' : 'Ready to act'}</p>`;
    }
    panel.innerHTML = html;
  } else if (selected.type === 'structure') {
    const s = selected.structure;
    const isPlayer = s.faction === 'player';
    let html = `<h3>${s.icon} ${s.name} ${isPlayer ? '' : '(Enemy)'}</h3>`;
    html += `<div class="unit-info">`;
    html += `<span class="label">HP:</span><span class="value">${s.currentHp}/${s.maxHp}</span>`;
    if (s.prod) {
      const icons = { food:'🍖', materials:'🪨', energy:'⚡', intel:'📡' };
      html += `<span class="label">Produces:</span><span class="value">${Object.entries(s.prod).map(([k,v]) => `${icons[k]}${v}`).join(' ')}</span>`;
    }
    html += `<span class="label">Pos:</span><span class="value">[${s.q},${s.r}]</span>`;
    html += `</div>`;
    html += `<p style="color:#888;font-size:11px;margin-top:4px">${s.desc}</p>`;
    panel.innerHTML = html;
  } else if (selected.type === 'hex') {
    const tile = game.map[hexKey(selected.q, selected.r)];
    let html = `<h3>Hex [${selected.q},${selected.r}]</h3>`;
    html += `<div class="unit-info">`;
    html += `<span class="label">Terrain:</span><span class="value">${tile.terrain}</span>`;
    if (tile.resource) html += `<span class="label">Resource:</span><span class="value">${tile.resource}</span>`;
    html += `</div>`;
    panel.innerHTML = html;
  }
}

// ==================== RENDERING ====================
const TERRAIN_COLORS = {
  plains: '#2a4a2a',
  forest: '#1a3a1a',
  mountain: '#4a4a5a',
  swamp: '#2a3a2a',
  hills: '#3a4a2a'
};

const TERRAIN_OUTLINE = {
  plains: '#3a6a3a',
  forest: '#2a5a2a',
  mountain: '#6a6a7a',
  swamp: '#3a5a3a',
  hills: '#5a6a3a'
};

function render() {
  if (!game) { requestAnimationFrame(render); return; }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  // Draw hexes
  for (const tile of Object.values(game.map)) {
    drawHex(tile);
  }

  // Draw structures
  for (const struct of [...game.factions.player.structures, ...game.factions.ai.structures]) {
    drawStructure(struct);
  }

  // Draw units
  for (const unit of [...game.factions.player.units, ...game.factions.ai.units]) {
    drawUnit(unit);
  }

  // Highlight selected hex
  if (selected) {
    const hex = selected.type === 'hex' ? { q: selected.q, r: selected.r } :
                selected.unit ? { q: selected.unit.q, r: selected.unit.r } :
                selected.structure ? { q: selected.structure.q, r: selected.structure.r } : null;
    if (hex) {
      const { x, y } = hexToPixel(hex.q, hex.r);
      ctx.beginPath();
      drawHexPath(x, y);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  // Highlight hovered hex
  if (hoveredHex) {
    const { x, y } = hexToPixel(hoveredHex.q, hoveredHex.r);
    ctx.beginPath();
    drawHexPath(x, y);
    ctx.strokeStyle = game.buildMode ? '#ff0' : '#88f';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Highlight buildable hexes
  if (game.buildMode) {
    for (const tile of Object.values(game.map)) {
      const { x, y } = hexToPixel(tile.q, tile.r);
      const neighbors = hexNeighbors(tile.q, tile.r);
      const adjPlayer = neighbors.some(n => {
        const nt = game.map[hexKey(n.q, n.r)];
        return (nt.structure && nt.structure.faction === 'player') || (nt.unit && nt.unit.faction === 'player');
      });
      if (adjPlayer && !tile.unit && !tile.structure && tile.terrain !== 'mountain' && tile.terrain !== 'swamp') {
        ctx.beginPath();
        drawHexPath(x, y);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(0,255,0,0.1)';
        ctx.fill();
      }
    }
  }

  ctx.restore();

  // Turn indicator
  if (game.phase === 'ai') {
    ctx.fillStyle = 'rgba(255,0,0,0.3)';
    ctx.fillRect(0, 0, canvas.width, 3);
    ctx.fillStyle = '#f88';
    ctx.font = '12px sans-serif';
    ctx.fillText('AI TURN', 10, 20);
  } else {
    ctx.fillStyle = 'rgba(0,100,255,0.3)';
    ctx.fillRect(0, 0, canvas.width, 3);
    ctx.fillStyle = '#8af';
    ctx.font = '12px sans-serif';
    ctx.fillText(`TURN ${game.turn} — YOUR TURN`, 10, 20);
  }

  requestAnimationFrame(render);
}

function drawHex(tile) {
  const { x, y } = hexToPixel(tile.q, tile.r);
  const color = TERRAIN_COLORS[tile.terrain] || '#2a2a2a';
  const outline = TERRAIN_OUTLINE[tile.terrain] || '#444';

  ctx.beginPath();
  drawHexPath(x, y);

  // Gradient fill
  const grad = ctx.createRadialGradient(x, y, 0, x, y, HEX_SIZE);
  grad.addColorStop(0, lighten(color, 20));
  grad.addColorStop(1, color);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = outline;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Resource indicator
  if (tile.resource) {
    const icons = { food:'🍖', materials:'🪨', energy:'⚡', intel:'📡' };
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icons[tile.resource], x, y + HEX_SIZE * 0.55);
  }

  // Terrain type text for mountains/swamp
  if (tile.terrain === 'mountain' || tile.terrain === 'swamp') {
    ctx.font = '8px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tile.terrain === 'mountain' ? '▲' : '~', x, y);
  }
}

function drawUnit(unit) {
  const tile = game.map[hexKey(unit.q, unit.r)];
  const { x, y } = hexToPixel(unit.q, unit.r);

  // Unit circle
  const r = HEX_SIZE * 0.45;
  const color = unit.faction === 'player' ? '#4488ff' : '#ff4444';
  const lightColor = unit.faction === 'player' ? '#88bbff' : '#ff8888';

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x - 3, y - 3, 0, x, y, r);
  grad.addColorStop(0, lightColor);
  grad.addColorStop(1, color);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = unit.faction === 'player' ? '#66aaff' : '#ff6666';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Icon
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(unit.icon, x, y - 2);

  // HP bar
  const hpW = r * 1.6;
  const hpH = 3;
  const hpX = x - hpW/2;
  const hpY = y + r + 3;
  ctx.fillStyle = '#333';
  ctx.fillRect(hpX, hpY, hpW, hpH);
  const hpRatio = unit.currentHp / unit.hp;
  ctx.fillStyle = hpRatio > 0.5 ? '#4f4' : hpRatio > 0.25 ? '#ff4' : '#f44';
  ctx.fillRect(hpX, hpY, hpW * hpRatio, hpH);

  // Has acted indicator
  if (unit.hasMoved && unit.hasAttacked) {
    ctx.fillStyle = 'rgba(255,255,0,0.3)';
    ctx.beginPath();
    ctx.arc(x, y, r + 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStructure(struct) {
  const { x, y } = hexToPixel(struct.q, struct.r);
  const color = struct.faction === 'player' ? '#2266aa' : '#aa2222';
  const lightColor = struct.faction === 'player' ? '#4499dd' : '#dd4444';

  // Structure square
  const s = HEX_SIZE * 0.55;
  ctx.beginPath();
  ctx.rect(x - s/2, y - s/2, s, s);
  const grad = ctx.createLinearGradient(x - s/2, y - s/2, x + s/2, y + s/2);
  grad.addColorStop(0, lightColor);
  grad.addColorStop(1, color);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = struct.faction === 'player' ? '#66aaff' : '#ff6666';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Icon
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(struct.icon, x, y);

  // HP bar
  const hpW = s * 1.2;
  const hpH = 3;
  const hpX = x - hpW/2;
  const hpY = y + s/2 + 3;
  ctx.fillStyle = '#333';
  ctx.fillRect(hpX, hpY, hpW, hpH);
  const hpRatio = struct.currentHp / struct.maxHp;
  ctx.fillStyle = hpRatio > 0.5 ? '#4f4' : hpRatio > 0.25 ? '#ff4' : '#f44';
  ctx.fillRect(hpX, hpY, hpW * hpRatio, hpH);
}

function drawHexPath(x, y) {
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    const hx = x + HEX_SIZE * Math.cos(angle);
    const hy = y + HEX_SIZE * Math.sin(angle);
    if (i === 0) ctx.moveTo(hx, hy);
    else ctx.lineTo(hx, hy);
  }
  ctx.closePath();
}

function lighten(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xff) + amount);
  const b = Math.min(255, (num & 0xff) + amount);
  return `rgb(${r},${g},${b})`;
}
</script>
