<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neumorphic Player</title>
<style>
  :root{
    --bg:#e8ebf3;
    --light:#ffffff;
    --dark:#c3c9d9;
    --ink:#4a4f66;
    --ink-dim:#8b90a8;
    --g1:#7b6cff;
    --g2:#4f8cff;
    --press-scale:.94;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh;
    display:grid; place-items:center;
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    padding:24px;
  }

  .player{
    width:min(400px, 100%);
    background:var(--bg);
    border-radius:36px;
    padding:34px 30px 28px;
    box-shadow:18px 18px 40px var(--dark), -18px -18px 40px var(--light);
    user-select:none;
  }

  /* ---------- album art ---------- */
  .art{
    position:relative;
    width:230px; height:230px;
    margin:0 auto 26px;
    border-radius:28px;
    background:linear-gradient(135deg, var(--g1) 0%, var(--g2) 100%);
    box-shadow:inset 6px 6px 14px rgba(255,255,255,.25),
               inset -8px -8px 18px rgba(20,20,60,.35),
               10px 10px 24px var(--dark), -10px -10px 24px var(--light);
    overflow:hidden;
    display:grid; place-items:center;
    transition:background 1s ease;
  }
  .art::after{
    content:"";
    position:absolute; inset:-60%;
    background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.38) 50%, transparent 58%);
    transform:translateX(-70%) rotate(0.001deg);
    animation:shine 4.2s cubic-bezier(.6,.1,.3,.9) infinite;
  }
  @keyframes shine{
    0%  { transform:translateX(-75%); }
    45% { transform:translateX(75%); }
    100%{ transform:translateX(75%); }
  }
  .art .note{
    position:relative; z-index:1;
    width:88px; height:88px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    display:grid; place-items:center;
    backdrop-filter:blur(2px);
  }
  .art .note svg{ width:38px; height:38px; fill:#fff; opacity:.92; }

  /* ---------- meta ---------- */
  .meta{ text-align:center; margin-bottom:22px; }
  .meta .title{ font-size:19px; font-weight:700; letter-spacing:.01em; }
  .meta .artist{ font-size:13.5px; color:var(--ink-dim); margin-top:4px; letter-spacing:.04em; }

  /* ---------- progress ---------- */
  .progress{
    display:flex; align-items:center; gap:12px;
    margin-bottom:24px;
  }
  .time{ font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; min-width:34px; }
  .track{
    position:relative;
    flex:1; height:8px;
    border-radius:99px;
    box-shadow:inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light);
    cursor:pointer;
  }
  .fill{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    border-radius:99px;
    background:linear-gradient(90deg, var(--g1), var(--g2));
  }
  .knob{
    position:absolute; top:50%; left:0%;
    width:18px; height:18px;
    transform:translate(-50%, -50%);
    border-radius:50%;
    background:var(--bg);
    box-shadow:3px 3px 7px var(--dark), -3px -3px 7px var(--light);
    pointer-events:none;
  }

  /* ---------- buttons ---------- */
  .btn{
    appearance:none; border:none; cursor:pointer;
    width:52px; height:52px;
    border-radius:50%;
    background:var(--bg);
    color:var(--ink);
    display:grid; place-items:center;
    box-shadow:8px 8px 16px var(--dark), -8px -8px 16px var(--light);
    transition:box-shadow .18s ease, transform .18s ease, color .18s;
  }
  .btn svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .btn svg.fill{ fill:currentColor; stroke:none; }
  .btn:hover{ color:var(--g1); }
  .btn:active, .btn.pressed{
    transform:scale(var(--press-scale));
    box-shadow:inset 5px 5px 10px var(--dark), inset -5px -5px 10px var(--light);
  }
  .btn.on{ color:var(--g1); }
  .btn.on svg{ filter:drop-shadow(0 0 4px rgba(123,108,255,.6)); }

  .main{ display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:20px; }
  .main .btn.sm{ width:46px; height:46px; }
  .play{
    width:72px; height:72px;
    background:linear-gradient(135deg, var(--g1), var(--g2));
    color:#fff;
    box-shadow:8px 8px 18px rgba(123,108,255,.42), -8px -8px 18px var(--light);
  }
  .play svg{ width:28px; height:28px; fill:#fff; stroke:none; }
  .play:hover{ color:#fff; filter:brightness(1.06); }
  .play:active{
    transform:scale(var(--press-scale));
    box-shadow:inset 5px 5px 12px rgba(40,30,120,.4);
  }
  .play .ico-pause{ display:none; }
  .play.playing .ico-pause{ display:block; }
  .play.playing .ico-play{ display:none; }

  /* ---------- secondary row ---------- */
  .secondary{
    display:flex; align-items:center; justify-content:space-between;
  }
  .secondary .group{ display:flex; gap:14px; }
  .secondary .btn.xs{ width:42px; height:42px; }
  .secondary .btn.xs svg{ width:16px; height:16px; }

  .volume{ display:flex; align-items:center; gap:10px; }
  .vol-icon{ color:var(--ink-dim); display:grid; place-items:center; }
  .vol-icon svg{ width:16px; height:16px; fill:currentColor; }
  .vtrack{
    position:relative; width:86px; height:8px;
    border-radius:99px;
    box-shadow:inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light);
    cursor:pointer;
  }
  .vfill{
    position:absolute; left:0; top:0; bottom:0; width:70%;
    border-radius:99px;
    background:linear-gradient(90deg, var(--g1), var(--g2));
  }
  .vknob{
    position:absolute; top:50%; left:70%;
    width:16px; height:16px; transform:translate(-50%,-50%);
    border-radius:50%;
    background:var(--bg);
    box-shadow:3px 3px 6px var(--dark), -3px -3px 6px var(--light);
    pointer-events:none;
  }

  .fave svg{ width:17px; height:17px; }
  .fave .fill-heart{ display:none; }
  .fave.on .fill-heart{ display:block; }
  .fave.on .line-heart{ display:none; }
  .fave.on{ color:#ff5c8a; }
  .fave.on svg{ filter:drop-shadow(0 0 5px rgba(255,92,138,.55)); }

  @media (max-width:420px){
    .player{ padding:28px 20px 22px; }
    .art{ width:190px; height:190px; }
    .vtrack{ width:64px; }
  }
  @media (prefers-reduced-motion:reduce){
    .art::after{ animation:none; opacity:0; }
  }
</style>
</head>
<body>
  <main class="player">
    <div class="art" id="art">
      <div class="note">
        <svg viewBox="0 0 24 24"><path d="M9 18.5a3.5 3.5 0 1 1-2-3.16V5.6a1 1 0 0 1 .76-.97l8-2A1 1 0 0 1 17 3.6v11.4a3.5 3.5 0 1 1-2-3.16V7.45l-6 1.5z"/></svg>
      </div>
    </div>

    <div class="meta">
      <div class="title" id="title">Midnight Frequencies</div>
      <div class="artist" id="artist">Lumen Vale</div>
    </div>

    <div class="progress">
      <span class="time" id="cur">0:00</span>
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <span class="time" id="dur">3:34</span>
    </div>

    <div class="main">
      <button class="btn sm" id="prev" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z" /><path d="M18 5l-9 7 9 7V5z" class="fill" stroke="none" fill="currentColor"/></svg>
      </button>
      <button class="btn play" id="play" aria-label="Play / pause">
        <svg class="ico-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.4" height="15" rx="1.4"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.4"/></svg>
      </button>
      <button class="btn sm" id="next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z"/><path d="M6 5l9 7-9 7V5z" class="fill" stroke="none" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="secondary">
      <div class="group">
        <button class="btn xs" id="shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M3 6h3.5c5.5 0 6 12 11.5 12H21"/><path d="M3 18h3.5c2.2 0 3.5-1.6 4.6-3.4M21 6h-3c-1.9 0-3.2 1.2-4.2 2.6"/><path d="M18 3l3 3-3 3M18 15l3 3-3 3"/></svg>
        </button>
        <button class="btn xs" id="repeat" aria-label="Repeat">
          <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="volume">
        <span class="vol-icon"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <div class="vtrack" id="vtrack">
          <div class="vfill" id="vfill"></div>
          <div class="vknob" id="vknob"></div>
        </div>
      </div>

      <button class="btn xs fave" id="fave" aria-label="Favorite">
        <svg viewBox="0 0 24 24">
          <path class="line-heart" d="M12 20.5C7 16.5 3.5 13.4 3.5 9.7 3.5 7 5.6 5 8 5c1.7 0 3.2.9 4 2.3C12.8 5.9 14.3 5 16 5c2.4 0 4.5 2 4.5 4.7 0 3.7-3.5 6.8-8.5 10.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path class="fill-heart" d="M12 20.5C7 16.5 3.5 13.4 3.5 9.7 3.5 7 5.6 5 8 5c1.7 0 3.2.9 4 2.3C12.8 5.9 14.3 5 16 5c2.4 0 4.5 2 4.5 4.7 0 3.7-3.5 6.8-8.5 10.8z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </main>

<script>
(function(){
  "use strict";

  var tracks = [
    { t: 'Midnight Frequencies', a: 'Lumen Vale',  d: 214, g: ['#7b6cff', '#4f8cff'] },
    { t: 'Glass Horizon',        a: 'Noria',       d: 187, g: ['#4f8cff', '#38d6d0'] },
    { t: 'Soft Static Bloom',    a: 'Aster & Pine',d: 243, g: ['#9d6cff', '#ff7bc8'] },
    { t: 'Paper Moon',           a: 'Halden',      d: 198, g: ['#5b8cff', '#8bd0ff'] }
  ];

  var i = 0;
  var pos = 0;              // seconds into current track
  var playing = false;
  var repeat = false;
  var shuffle = false;
  var lastTs = 0;

  var $ = function(id){ return document.getElementById(id); };
  var titleEl = $('title'), artistEl = $('artist'),
      curEl = $('cur'), durEl = $('dur'),
      fillEl = $('fill'), knobEl = $('knob'), trackEl = $('track'),
      playEl = $('play'), artEl = $('art');

  function fmt(s){
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function loadTrack(k){
    i = (k + tracks.length) % tracks.length;
    var tr = tracks[i];
    pos = 0;
    titleEl.textContent = tr.t;
    artistEl.textContent = tr.a;
    durEl.textContent = fmt(tr.d);
    artEl.style.background =
      'linear-gradient(135deg,' + tr.g[0] + ' 0%,' + tr.g[1] + ' 100%)';
    render();
  }

  function render(){
    var tr = tracks[i];
    var pct = tr.d ? (pos / tr.d) * 100 : 0;
    fillEl.style.width = pct + '%';
    knobEl.style.left = pct + '%';
    curEl.textContent = fmt(pos);
  }

  function setPlaying(on){
    playing = on;
    playEl.classList.toggle('playing', on);
    playEl.setAttribute('aria-label', on ? 'Pause' : 'Play');
    lastTs = 0;
  }

  function tick(ts){
    if (playing){
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.1, (ts - lastTs) / 1000);
      lastTs = ts;
      pos += dt;
      if (pos >= tracks[i].d){
        if (repeat && !shuffle){
          pos = 0;
        } else {
          goTo(nextIndex());
        }
      }
      render();
    }
    requestAnimationFrame(tick);
  }

  function nextIndex(){
    if (shuffle && tracks.length > 1){
      var k;
      do { k = Math.floor(Math.random() * tracks.length); } while (k === i);
      return k;
    }
    return i + 1;
  }

  function goTo(k){ loadTrack(k); }

  playEl.addEventListener('click', function(){ setPlaying(!playing); });
  $('next').addEventListener('click', function(){ goTo(nextIndex()); });
  $('prev').addEventListener('click', function(){
    if (pos > 4){ pos = 0; render(); }
    else { goTo(i - 1); }
  });
  $('repeat').addEventListener('click', function(){
    repeat = !repeat;
    this.classList.toggle('on', repeat);
  });
  $('shuffle').addEventListener('click', function(){
    shuffle = !shuffle;
    this.classList.toggle('on', shuffle);
  });
  $('fave').addEventListener('click', function(){
    this.classList.toggle('on');
  });

  // ---- progress seek (click + drag) ----
  function seekFromEvent(ev){
    var rect = trackEl.getBoundingClientRect();
    var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    var ratio = Math.min(1, Math.max(0, x / rect.width));
    pos = ratio * tracks[i].d;
    render();
  }
  var seeking = false;
  trackEl.addEventListener('pointerdown', function(ev){
    seeking = true;
    trackEl.setPointerCapture(ev.pointerId);
    seekFromEvent(ev);
  });
  trackEl.addEventListener('pointermove', function(ev){
    if (seeking) seekFromEvent(ev);
  });
  trackEl.addEventListener('pointerup', function(){ seeking = false; });

  // ---- volume slider (visual only) ----
  var vtrackEl = $('vtrack'), vfillEl = $('vfill'), vknobEl = $('vknob');
  var vol = 0.7;
  function setVol(v){
    vol = Math.min(1, Math.max(0, v));
    vfillEl.style.width = (vol * 100) + '%';
    vknobEl.style.left = (vol * 100) + '%';
  }
  function volFromEvent(ev){
    var rect = vtrackEl.getBoundingClientRect();
    var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    setVol(x / rect.width);
  }
  var volSeeking = false;
  vtrackEl.addEventListener('pointerdown', function(ev){
    volSeeking = true;
    vtrackEl.setPointerCapture(ev.pointerId);
    volFromEvent(ev);
  });
  vtrackEl.addEventListener('pointermove', function(ev){
    if (volSeeking) volFromEvent(ev);
  });
  vtrackEl.addEventListener('pointerup', function(){ volSeeking = false; });
  setVol(0.7);

  loadTrack(0);
  setPlaying(true); // start playing to show the progress animation
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
