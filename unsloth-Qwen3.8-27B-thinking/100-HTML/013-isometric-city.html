<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isometric City</title>
<style>
  :root{
    --city-tilt-x:0deg;
    --city-tilt-y:0deg;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, #131b38 0%, #0b0f22 45%, #060812 100%),
      #060812;
    overflow:hidden;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ambient starfield + nebula */
  #stars{position:fixed;inset:0;z-index:0;}
  #stars i{
    position:absolute;border-radius:50%;background:#fff;
    animation:starTw 4s ease-in-out infinite;
  }
  @keyframes starTw{0%,100%{opacity:.12}50%{opacity:.75}}
  .nebula{
    position:fixed;z-index:0;border-radius:50%;pointer-events:none;
    filter:blur(60px);opacity:.35;
  }
  .nebula.a{width:52vmax;height:34vmax;left:-12vmax;top:-10vmax;
    background:radial-gradient(closest-side,#2a2f6e,transparent 70%);
    animation:drift 40s ease-in-out infinite alternate;}
  .nebula.b{width:46vmax;height:30vmax;right:-14vmax;bottom:-8vmax;
    background:radial-gradient(closest-side,#3d2a63,transparent 70%);
    animation:drift 52s ease-in-out infinite alternate-reverse;}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(3vmax,2vmax,0)}}

  /* 3D stage */
  .stage{
    position:fixed;inset:0;z-index:1;
    display:flex;align-items:center;justify-content:center;
    perspective:1400px;perspective-origin:50% 42%;
    animation:persDrift 26s ease-in-out infinite;
  }
  @keyframes persDrift{
    0%,100%{perspective-origin:46% 40%}
    50%{perspective-origin:54% 44%}
  }
  .city{
    position:relative;
    transform:scale(var(--city-scale,1))
      rotateX(var(--city-tilt-x))
      rotateY(var(--city-tilt-y));
  }
  .city .seesaw{
    transform-style:preserve-3d;
    animation:seesaw 16s ease-in-out infinite;
  }
  @keyframes seesaw{
    0%,100%{transform:rotateZ(33deg) rotateX(60deg);}
    50%{transform:rotateZ(57deg) rotateX(60deg);}
  }
  .bobber{
    transform-style:preserve-3d;
    animation:bob 9s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateZ(0)}50%{transform:translateZ(-7px)}}

  /* ground */
  .ground{
    position:absolute;left:0;top:0;
    width:600px;height:600px;margin:-300px 0 0 -300px;
    background:
      repeating-linear-gradient(0deg,rgba(90,120,255,.14) 0 1px,transparent 1px 16px),
      repeating-linear-gradient(90deg,rgba(90,120,255,.14) 0 1px,transparent 1px 16px),
      repeating-linear-gradient(0deg,rgba(120,150,255,.16) 0 1.5px,transparent 1.5px 64px),
      repeating-linear-gradient(90deg,rgba(120,150,255,.16) 0 1.5px,transparent 1.5px 64px),
      radial-gradient(closest-side,rgba(50,62,120,.55),rgba(28,34,72,.35) 62%,rgba(16,20,44,.05) 99%);
    border:1px solid rgba(130,160,255,.35);
    box-shadow:0 0 60px 8px rgba(70,100,255,.16), inset 0 0 80px rgba(20,26,64,.5);
    border-radius:2px;
  }

  /* buildings */
  .building{position:absolute;transform-style:preserve-3d;}
  .face{position:absolute;left:0;top:0;backface-visibility:hidden;}
  .w{position:absolute;border-radius:1px;}
  .w.lit{box-shadow:0 0 6px 1px rgba(255,199,99,.55);animation:twinkle 3.6s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.28}}
  .roof{position:absolute;left:0;top:0;transform-style:preserve-3d;pointer-events:none;}
  .beacon{
    position:absolute;width:5px;height:5px;border-radius:50%;
    background:#ff5d8f;box-shadow:0 0 12px 4px rgba(255,93,143,.8);
    animation:beacon 2.4s ease-in-out infinite;
  }
  @keyframes beacon{0%,100%{opacity:1}50%{opacity:.15}}

  /* drifting fog */
  .fog{
    position:fixed;z-index:2;pointer-events:none;border-radius:50%;
    filter:blur(46px);mix-blend-mode:screen;
    background:radial-gradient(closest-side,rgba(120,140,255,.10),transparent 70%);
  }
  .fog.f1{width:70vmax;height:34vmax;left:-18vmax;bottom:6vh;
    animation:fogA 34s ease-in-out infinite alternate;}
  .fog.f2{width:56vmax;height:26vmax;right:-16vmax;bottom:14vh;
    background:radial-gradient(closest-side,rgba(180,110,255,.09),transparent 70%);
    animation:fogB 46s ease-in-out infinite alternate-reverse;}
  @keyframes fogA{from{transform:translate3d(-4vmax,0,0)}to{transform:translate3d(6vmax,-2vmax,0)}}
  @keyframes fogB{from{transform:translate3d(5vmax,0,0)}to{transform:translate3d(-5vmax,-3vmax,0)}}

  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(3,4,10,.55) 100%);
  }

  /* title */
  .title{
    position:fixed;left:0;right:0;bottom:5.5vh;z-index:4;text-align:center;
    color:#eef2ff;pointer-events:none;
  }
  .title h1{
    font-weight:200;
    font-size:clamp(20px,3.4vw,34px);
    letter-spacing:.55em;text-indent:.55em;
    text-transform:uppercase;
    text-shadow:0 0 24px rgba(140,160,255,.45);
  }
  .title .sub{
    margin-top:10px;font-size:10px;letter-spacing:.5em;text-indent:.5em;
    text-transform:uppercase;color:rgba(190,200,235,.5);
  }
  .title .rule{
    width:64px;height:1px;margin:14px auto 0;
    background:linear-gradient(90deg,transparent,rgba(160,180,255,.8),transparent);
  }

  @media (prefers-reduced-motion: reduce){
    .seesaw,.bobber,.stage,#stars i,.nebula,.fog,.w.lit,.beacon{animation:none!important;}
  }
  @media (max-width:600px){
    .title{bottom:4vh;}
    .title h1{letter-spacing:.34em;text-indent:.34em;}
    .title .sub{letter-spacing:.3em;text-indent:.3em;}
  }
</style>
</head>
<body>
<div id="stars"></div>
<div class="nebula a"></div>
<div class="nebula b"></div>

<div class="stage">
  <div class="city" id="city">
    <div class="seesaw">
      <div class="bobber">
        <div class="ground"></div>
        <div id="buildings"></div>
      </div>
    </div>
  </div>
</div>

<div class="fog f1"></div>
<div class="fog f2"></div>
<div class="vignette"></div>

<div class="title">
  <h1>Isometric City</h1>
  <div class="sub">procedural &middot; infinite skyline</div>
  <div class="rule"></div>
</div>

<script>
(function () {
  'use strict';

  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var irnd = function (a, b) { return Math.floor(rnd(a, b + 1)); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

  /* ---------- responsive scale ---------- */
  var city = document.getElementById('city');
  function fit() {
    var s = Math.min(window.innerWidth, window.innerHeight) / 620;
    s = Math.max(0.5, Math.min(s, 1.9));
    city.style.setProperty('--city-scale', s.toFixed(4));
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- palette: blues, purples, teals, warm browns, magentas ---------- */
  var PALETTE = [
    { h: 226, s: 46, l: 46 },  // blue
    { h: 205, s: 58, l: 40 },  // teal-blue
    { h: 178, s: 38, l: 38 },  // teal
    { h: 262, s: 42, l: 44 },  // purple
    { h: 281, s: 38, l: 48 },  // violet
    { h: 24,  s: 46, l: 44 },  // warm brown
    { h: 330, s: 52, l: 46 },  // magenta
    { h: 348, s: 58, l: 52 },  // hot magenta
    { h: 196, s: 64, l: 42 },  // cyan-blue
    { h: 246, s: 36, l: 52 }   // periwinkle
  ];
  function col(c, dl, ds) {
    return 'hsl(' + c.h + ',' + Math.max(0, c.s + (ds || 0)) + '%,' +
      Math.max(4, c.l + (dl || 0)) + '%)';
  }
  function faceGradient(light, dark) {
    return 'linear-gradient(180deg,' + light + ' 0%,' + dark + ' 100%)';
  }

  /* ---------- window grid on one face ---------- */
  function windows(face, w, h, shade, litRatio) {
    var ws = 7, g = 4;
    var cols = Math.max(1, Math.floor((w - 5 + g) / (ws + g)));
    var rows = Math.max(1, Math.floor((h - 5 + g) / (ws + g)));
    for (var r = 0; r < rows; r++) {
      for (var cc = 0; cc < cols; cc++) {
        if (Math.random() > 0.94) continue; // occasional empty bay
        var win = document.createElement('i');
        win.className = 'w';
        win.style.left = (2 + cc * (ws + g)) + 'px';
        win.style.top = (2 + r * (ws + g)) + 'px';
        win.style.width = ws + 'px';
        win.style.height = ws + 'px';
        var lit = Math.random() < litRatio;
        if (lit) {
          win.classList.add('lit');
          var warm = Math.random() < 0.82;
          win.style.background = warm
            ? 'hsl(38 96% ' + irnd(55, 68) + '%)'
            : 'hsl(190 90% ' + irnd(60, 74) + '%)';
          win.style.animationDuration = rnd(2.4, 6.5).toFixed(2) + 's';
          win.style.animationDelay = (-rnd(0, 6)).toFixed(2) + 's';
        } else {
          win.style.background = 'hsla(220,25%,' + (shade + 22) + '%,0.55)';
        }
        face.appendChild(win);
      }
    }
  }

  /* ---------- building factory ---------- */
  var holder = document.getElementById('buildings');
  var GRID = 32, CELLS = 7, COUNT = 46;
  var placed = 0, guard = 0;

  function makeBuilding(x, y, w, d, h) {
    var c = pick(PALETTE);
    var b = document.createElement('div');
    b.className = 'building';
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.width = w + 'px';
    b.style.height = d + 'px';

    // TOP (brightest)
    var top = document.createElement('div');
    top.className = 'face';
    top.style.width = w + 'px';
    top.style.height = d + 'px';
    top.style.transform = 'translate3d(0,0,' + h + 'px)';
    top.style.background = faceGradient(col(c, 10), col(c, 16));
    top.style.boxShadow = 'inset 0 0 0 1.5px ' + col(c, 24, 6);
    b.appendChild(top);

    // FRONT (facing viewer at +Z)
    var front = document.createElement('div');
    front.className = 'face';
    front.style.width = w + 'px';
    front.style.height = h + 'px';
    front.style.transformOrigin = '0 100%';
    front.style.transform = 'translate3d(0,' + d + 'px,0) rotateX(-90deg)';
    front.style.background = faceGradient(col(c, 6), col(c, -8));
    b.appendChild(front);

    // SIDE (+X, darker)
    var side = document.createElement('div');
    side.className = 'face';
    side.style.width = d + 'px';
    side.style.height = h + 'px';
    side.style.transformOrigin = '100% 100%';
    side.style.transform =
      'translate3d(' + w + 'px,0,0) rotateY(90deg)';
    side.style.background = faceGradient(col(c, -6), col(c, -18));
    b.appendChild(side);

    // windows: front + side (top stays bare roof with rim light)
    windows(front, w, h, c.l, 0.44);
    windows(side, d, h, c.l, 0.36);

    // roof details
    var roof = document.createElement('div');
    roof.className = 'roof';
    if (h > 78) {
      var beacon = document.createElement('i');
      beacon.className = 'beacon';
      beacon.style.transform =
        'translate3d(' + (w * rnd(0.25, 0.75)).toFixed(1) + 'px,' +
        (d * rnd(0.25, 0.75)).toFixed(1) + 'px,' + h + 'px)';
      beacon.style.animationDuration = rnd(1.8, 3.4).toFixed(2) + 's';
      beacon.style.animationDelay = (-rnd(0, 3)).toFixed(2) + 's';
      roof.appendChild(beacon);
    } else if (Math.random() < 0.5) {
      var antenna = document.createElement('div');
      antenna.style.position = 'absolute';
      antenna.style.width = '3px';
      antenna.style.height = '10px';
      antenna.style.left = (w * rnd(0.3, 0.7)).toFixed(1) + 'px';
      antenna.style.top = (d * rnd(0.3, 0.7)).toFixed(1) + 'px';
      antenna.style.background = col(c, -10);
      antenna.style.transform =
        'translate3d(0,0,' + h + 'px)';
      roof.appendChild(antenna);
    }
    b.appendChild(roof);
    holder.appendChild(b);
  }

  /* ---------- place buildings on a loose grid ---------- */
  while (placed < COUNT && guard < 400) {
    guard++;
    var gx = irnd(0, CELLS - 1);
    var gy = irnd(0, CELLS - 1);
    if (Math.random() < 0.35) continue; // keep streets / open lots
    var w = rnd(18, 58);
    var d = rnd(18, 58);
    var x = -256 + gx * GRID + rnd(-7, 7);
    var y = -256 + gy * GRID + rnd(-7, 7);
    var cx = x + w / 2, cy = y + d / 2;
    // ground bounds
    if (cx < -262 || cx > 262 || cy < -262 || cy > 262) continue;
    // distance-based height: downtown towers, low outskirts
    var dist = Math.max(Math.abs(cx), Math.abs(cy)) / 256;
    var hMax = 150 * (1 - dist * 0.75);
    var h = Math.max(22, rnd(22, hMax));
    makeBuilding(x, y, w, d, h);
    placed++;
  }

  /* ---------- starfield ---------- */
  var stars = document.getElementById('stars');
  for (var i = 0; i < 90; i++) {
    var s = document.createElement('i');
    s.style.left = rnd(0, 100).toFixed(2) + 'vw';
    s.style.top = rnd(0, 72).toFixed(2) + 'vh';
    var sz = rnd(1, 2.4).toFixed(2);
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.animationDuration = rnd(2.5, 7).toFixed(2) + 's';
    s.style.animationDelay = (-rnd(0, 7)).toFixed(2) + 's';
    if (Math.random() < 0.12) s.style.background = 'hsl(265 80% 80%)';
    stars.appendChild(s);
  }

  /* ---------- subtle passive parallax (tilt follows pointer drift) ---------- */
  var tx = 0, ty = 0, cx = 0, cy = 0;
  window.addEventListener('mousemove', function (e) {
    tx = (e.clientX / window.innerWidth - 0.5) * 4;   // +/- 2 deg
    ty = (e.clientY / window.innerHeight - 0.5) * 3;  // +/- 1.5 deg
  });
  (function lerp() {
    cx += (tx - cx) * 0.03;
    cy += (ty - cy) * 0.03;
    city.style.setProperty('--city-tilt-x', cx.toFixed(3) + 'deg');
    city.style.setProperty('--city-tilt-y', cy.toFixed(3) + 'deg');
    requestAnimationFrame(lerp);
  })();
})();
</script>
</body>
</html>
