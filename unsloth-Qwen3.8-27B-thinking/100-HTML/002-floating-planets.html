<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmos — Floating Planets</title>
<style>
  :root {
    --scene-size: min(92vmin, 860px);
    --bg-1: #050110;
    --bg-2: #0b0524;
    --purple: #9b6dff;
    --purple-soft: #c4a4ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, var(--bg-2) 0%, var(--bg-1) 70%);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  /* ---------- starfield ---------- */
  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  /* ---------- deep-space nebula haze ---------- */
  .nebula {
    position: fixed;
    inset: -20%;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 42% 34% at 28% 30%, rgba(122, 62, 220, 0.16), transparent 70%),
      radial-gradient(ellipse 38% 30% at 74% 66%, rgba(48, 90, 220, 0.13), transparent 70%),
      radial-gradient(ellipse 30% 24% at 60% 22%, rgba(200, 80, 190, 0.07), transparent 70%);
    animation: nebulaDrift 60s ease-in-out infinite alternate;
  }
  @keyframes nebulaDrift {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    50%  { transform: translate3d(-2%, 1.5%, 0) rotate(0.5deg); }
    100% { transform: translate3d(2%, -1.5%, 0) rotate(-0.5deg); }
  }

  /* ---------- 3D scene ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
  }
  .scene {
    position: relative;
    width: var(--scene-size);
    height: var(--scene-size);
    transform-style: preserve-3d;
    transform: rotateX(8deg);
    animation: sceneSway 26s ease-in-out infinite;
  }
  @keyframes sceneSway {
    0%, 100% { transform: rotateX(8deg) rotateY(-2deg); }
    50%      { transform: rotateX(6deg) rotateY(2deg); }
  }

  /* ---------- central sun / core ---------- */
  .core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 26%;
    height: 26%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 32%, #fff8ef 0%, #ffd9a0 18%, #ff9d5c 42%, #c2410c 68%, #4c1d95 92%);
    box-shadow:
      0 0 40px 8px rgba(255, 170, 90, 0.55),
      0 0 110px 40px rgba(255, 140, 70, 0.28),
      0 0 220px 90px rgba(160, 80, 255, 0.20),
      inset -10px -12px 40px rgba(30, 5, 40, 0.55);
    animation: corePulse 7s ease-in-out infinite;
  }
  @keyframes corePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.045); }
  }
  .core::after {
    content: "";
    position: absolute;
    inset: -34%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 200, 130, 0.22) 0%, transparent 60%);
    animation: haloPulse 7s ease-in-out infinite;
  }
  @keyframes haloPulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.12); }
  }

  /* ---------- title ---------- */
  .title-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .title {
    font-size: calc(var(--scene-size) * 0.135);
    font-weight: 200;
    letter-spacing: 0.55em;
    text-indent: 0.55em; /* balance the trailing letter-space */
    color: #efe7ff;
    text-shadow:
      0 0 14px rgba(155, 109, 255, 0.9),
      0 0 42px rgba(155, 109, 255, 0.65),
      0 0 90px rgba(120, 70, 255, 0.5),
      0 0 160px rgba(90, 40, 255, 0.35);
    animation: titleGlow 6s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 14px rgba(155,109,255,0.9), 0 0 42px rgba(155,109,255,0.65), 0 0 90px rgba(120,70,255,0.5), 0 0 160px rgba(90,40,255,0.35); }
    50%      { text-shadow: 0 0 18px rgba(180,140,255,1),   0 0 55px rgba(165,120,255,0.8),  0 0 110px rgba(135,80,255,0.6), 0 0 190px rgba(100,50,255,0.45); }
  }
  .subtitle {
    margin-top: 0.5em;
    font-size: calc(var(--scene-size) * 0.019);
    letter-spacing: 0.62em;
    text-indent: 0.62em;
    font-weight: 400;
    text-transform: uppercase;
    color: rgba(200, 175, 255, 0.65);
    text-shadow: 0 0 12px rgba(150, 100, 255, 0.5);
  }

  /* ---------- orbit rings ---------- */
  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    pointer-events: none;
    transform-style: preserve-3d;
  }
  .ring-a {
    width: 74%;
    height: 74%;
    margin-left: -37%;
    margin-top: -37%;
    border: 1px solid rgba(170, 130, 255, 0.28);
    box-shadow: 0 0 30px rgba(140, 90, 255, 0.12) inset, 0 0 24px rgba(140, 90, 255, 0.10);
    transform: rotateX(74deg) rotateZ(0deg);
    animation: ringSpinA 44s linear infinite;
    border-style: dashed;
  }
  @keyframes ringSpinA {
    from { transform: rotateX(74deg) rotateZ(0deg); }
    to   { transform: rotateX(74deg) rotateZ(360deg); }
  }
  .ring-b {
    width: 47%;
    height: 47%;
    margin-left: -23.5%;
    margin-top: -23.5%;
    border: 1.5px solid rgba(120, 190, 255, 0.22);
    box-shadow: 0 0 26px rgba(100, 170, 255, 0.10) inset;
    transform: rotateX(66deg) rotateY(12deg) rotateZ(360deg);
    animation: ringSpinB 62s linear infinite reverse;
  }
  @keyframes ringSpinB {
    from { transform: rotateX(66deg) rotateY(12deg) rotateZ(0deg); }
    to   { transform: rotateX(66deg) rotateY(12deg) rotateZ(360deg); }
  }
  /* faint solid orbital guide circles */
  .orbit-path {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    border: 1px solid rgba(150, 120, 220, 0.07);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ---------- planets ---------- */
  .orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
    animation: orbitSpin var(--period) linear infinite;
  }
  .orbit.reverse { animation-direction: reverse; }
  @keyframes orbitSpin {
    from { transform: translate(-50%, -50%) rotateZ(0deg); }
    to   { transform: translate(-50%, -50%) rotateZ(360deg); }
  }
  .orbit .carrier {
    position: absolute;
    left: 0;
    top: 0;
    transform: translateX(var(--radius));
    transform-style: preserve-3d;
  }
  .planet {
    position: absolute;
    width: var(--size);
    height: var(--size);
    margin-left: calc(var(--size) / -2);
    margin-top: calc(var(--size) / -2);
    border-radius: 50%;
    background: var(--surface);
    box-shadow:
      var(--glow) ,
      inset calc(var(--size) * -0.16) calc(var(--size) * -0.12) calc(var(--size) * 0.45) rgba(2, 4, 18, 0.85),
      inset calc(var(--size) * 0.06) calc(var(--size) * 0.05) calc(var(--size) * 0.2) var(--lit);
    animation: planetFloat var(--floatPeriod) ease-in-out infinite alternate;
    animation-delay: var(--floatDelay);
  }
  @keyframes planetFloat {
    from { transform: translateY(calc(var(--size) * -0.05)); }
    to   { transform: translateY(calc(var(--size) * 0.05)); }
  }
  /* little moons */
  .moon-orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
    animation: orbitSpin var(--mPeriod) linear infinite;
  }
  .moon-orbit.reverse { animation-direction: reverse; }
  .moon-orbit .moon {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--mSize);
    height: var(--mSize);
    margin-left: calc(var(--mSize) / -2);
    margin-top: calc(var(--mSize) / -2);
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #e8e4f5, #9a92b8 55%, #3a3355 95%);
    box-shadow: inset calc(var(--mSize) * -0.25) calc(var(--mSize) * -0.18) calc(var(--mSize) * 0.5) rgba(3, 5, 20, 0.9);
  }

  /* ---------- planet palettes ---------- */
  .p-cyan {
    --surface: radial-gradient(circle at 32% 30%, #d9fbff 0%, #59d8f0 28%, #0f7ea8 62%, #062a55 95%);
    --glow: 0 0 26px 4px rgba(70, 200, 255, 0.45);
    --lit: rgba(190, 250, 255, 0.5);
  }
  .p-amber {
    --surface: radial-gradient(circle at 32% 30%, #fff3d6 0%, #ffcf6b 30%, #e07818 64%, #5e2408 95%);
    --glow: 0 0 30px 5px rgba(255, 170, 60, 0.45);
    --lit: rgba(255, 230, 170, 0.55);
  }
  .p-violet {
    --surface: radial-gradient(circle at 32% 30%, #f0e2ff 0%, #b070f0 30%, #5b21a0 64%, #1c0a3c 95%);
    --glow: 0 0 28px 5px rgba(170, 100, 255, 0.5);
    --lit: rgba(225, 190, 255, 0.55);
  }
  .p-rose {
    --surface: radial-gradient(circle at 32% 30%, #ffe4ef 0%, #ff7fa8 30%, #c2255c 64%, #43081f 95%);
    --glow: 0 0 26px 4px rgba(255, 110, 160, 0.45);
    --lit: rgba(255, 200, 225, 0.55);
  }
  .p-green {
    --surface: radial-gradient(circle at 32% 30%, #e6ffe9 0%, #6fe08d 30%, #1c7a44 64%, #06301c 95%);
    --glow: 0 0 24px 4px rgba(90, 220, 140, 0.4);
    --lit: rgba(200, 255, 215, 0.5);
  }

  /* ---------- corner caption ---------- */
  .caption {
    position: fixed;
    bottom: max(18px, 3vh);
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: rgba(190, 165, 255, 0.45);
    white-space: nowrap;
    pointer-events: none;
  }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .orbit, .moon-orbit, .ring-a, .ring-b, .planet, .scene, .core, .core::after, .nebula, .title {
      animation-duration: 300s !important;
    }
  }
</style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <div class="stage">
    <div class="scene" id="scene">
      <div class="core"></div>

      <div class="ring ring-a" aria-hidden="true"></div>
      <div class="ring ring-b" aria-hidden="true"></div>

      <div class="orbit-path" id="path1"></div>
      <div class="orbit-path" id="path2"></div>
      <div class="orbit-path" id="path3"></div>
      <div class="orbit-path" id="path4"></div>
      <div class="orbit-path" id="path5"></div>

      <!-- Planet 1 : cyan, large, slow -->
      <div class="orbit" style="--period: 42s; --radius: calc(var(--scene-size) * 0.40);">
        <div class="carrier">
          <div class="planet p-cyan" style="--size: calc(var(--scene-size) * 0.095); --floatPeriod: 5.5s; --floatDelay: 0s;">
            <div class="moon-orbit" style="--mPeriod: 9s; --mSize: calc(var(--scene-size) * 0.016);">
              <div class="moon" style="transform: translateX(calc(var(--scene-size) * 0.07));"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Planet 2 : amber, medium, faster, reversed -->
      <div class="orbit reverse" style="--period: 28s; --radius: calc(var(--scene-size) * 0.30);">
        <div class="carrier">
          <div class="planet p-amber" style="--size: calc(var(--scene-size) * 0.062); --floatPeriod: 4.4s; --floatDelay: -1.2s;"></div>
        </div>
      </div>

      <!-- Planet 3 : violet, large, medium -->
      <div class="orbit" style="--period: 64s; --radius: calc(var(--scene-size) * 0.475);">
        <div class="carrier">
          <div class="planet p-violet" style="--size: calc(var(--scene-size) * 0.11); --floatPeriod: 6.8s; --floatDelay: -2.5s;"></div>
        </div>
      </div>

      <!-- Planet 4 : rose, small, fast, reversed -->
      <div class="orbit reverse" style="--period: 19s; --radius: calc(var(--scene-size) * 0.215);">
        <div class="carrier">
          <div class="planet p-rose" style="--size: calc(var(--scene-size) * 0.034); --floatPeriod: 3.6s; --floatDelay: -0.7s;"></div>
        </div>
      </div>

      <!-- Planet 5 : green, tiny, slowest, reversed -->
      <div class="orbit reverse" style="--period: 84s; --radius: calc(var(--scene-size) * 0.44);">
        <div class="carrier">
          <div class="planet p-green" style="--size: calc(var(--scene-size) * 0.026); --floatPeriod: 5s; --floatDelay: -3.1s;"></div>
        </div>
      </div>

      <div class="title-wrap">
        <div class="title">COSMOS</div>
        <div class="subtitle">a silent orbit</div>
      </div>
    </div>
  </div>

  <div class="caption">five worlds · one quiet gravity</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stars");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var stars = [];
  var shooting = null;
  var W = 0, H = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeStar() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(0.4, 1.6),
      base: rand(0.25, 0.9),
      phase: Math.random() * Math.PI * 2,
      speed: rand(0.4, 1.8),          // twinkle speed
      hue: Math.random() < 0.15 ? rand(260, 300) : (Math.random() < 0.1 ? 205 : 0),
      tint: Math.random() < 0.2
    };
  }

  function buildStars() {
    var count = Math.round((W * H) / 3800);
    count = Math.max(140, Math.min(count, 520));
    stars = [];
    for (var i = 0; i < count; i++) stars.push(makeStar());
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStars();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    // stars
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = s.base * (0.55 + 0.45 * Math.sin(s.phase + t * 0.001 * s.speed));
      if (s.tint) {
        ctx.fillStyle = "hsla(" + s.hue + ", 90%, 78%, " + tw.toFixed(3) + ")";
      } else {
        ctx.fillStyle = "rgba(235, 238, 255, " + tw.toFixed(3) + ")";
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();

      // cross flare on the brightest few
      if (s.r > 1.35 && tw > 0.65) {
        ctx.strokeStyle = "rgba(210, 220, 255, " + (tw * 0.35).toFixed(3) + ")";
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 3.4, s.y);
        ctx.lineTo(s.x + s.r * 3.4, s.y);
        ctx.moveTo(s.x, s.y - s.r * 3.4);
        ctx.lineTo(s.x, s.y + s.r * 3.4);
        ctx.stroke();
      }
    }

    // occasional shooting star
    if (!shooting && Math.random() < 0.0028) {
      shooting = {
        x: rand(0.1, 0.9) * W,
        y: rand(0.05, 0.35) * H,
        vx: rand(-6, -3),
        vy: rand(2, 4.2),
        life: 1
      };
    }
    if (shooting) {
      shooting.x += shooting.vx;
      shooting.y += shooting.vy;
      shooting.life -= 0.016;
      if (shooting.life <= 0) {
        shooting = null;
      } else {
        var g = ctx.createLinearGradient(
          shooting.x, shooting.y,
          shooting.x - shooting.vx * 14, shooting.y - shooting.vy * 14
        );
        g.addColorStop(0, "rgba(255,255,255," + (0.9 * shooting.life).toFixed(3) + ")");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(shooting.x, shooting.y);
        ctx.lineTo(shooting.x - shooting.vx * 14, shooting.y - shooting.vy * 14);
        ctx.stroke();
      }
    }

    requestAnimationFrame(draw);
  }

  // keep orbit paths & guide rings in proportion to the scene size
  var scene = document.getElementById("scene");
  function layoutPaths() {
    var radii = [0.40, 0.30, 0.475, 0.215, 0.44];
    for (var i = 0; i < radii.length; i++) {
      var d = scene.querySelector("#path" + (i + 1));
      var size = radii[i] * 2 * 100; // percent of scene
      d.style.width = size + "%";
      d.style.height = size + "%";
    }
  }

  window.addEventListener("resize", function () {
    resize();
    layoutPaths();
  });

  resize();
  layoutPaths();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
