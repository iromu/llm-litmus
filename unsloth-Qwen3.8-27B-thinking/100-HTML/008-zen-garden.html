<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zen Garden</title>
<style>
  :root {
    --sand-0: #f2e4c4;
    --sand-1: #ead7ae;
    --sand-2: #dfc493;
    --rake: #c3a671;
    --ink-soft: #7c6b4d;
    --font-serif: Georgia, "Times New Roman", "Noto Serif", serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(120% 90% at 50% 8%, var(--sand-0) 0%, var(--sand-1) 55%, var(--sand-2) 100%);
    font-family: var(--font-serif);
    -webkit-font-smoothing: antialiased;
  }

  /* ============ the garden (full-bleed SVG) ============ */
  #garden {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .rake-pattern { fill: url(#rakedSand); }

  /* soft warm vignette for depth */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse 95% 95% at 50% 45%,
                transparent 55%, rgba(122, 90, 40, 0.10) 82%, rgba(100, 72, 30, 0.20) 100%);
  }

  /* fine paper grain */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.8'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.42%200%200%200%200%200.33%200%200%200%200%200.2%200%200%200%200.05%200'/%3E%3C/filter%3E%3Crect%20width='180'%20height='180'%20filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  /* ============ rocks ============ */
  .rock {
    cursor: grab;
    filter: drop-shadow(0px 14px 12px rgba(96, 74, 38, 0.30));
    transition: transform 0.9s cubic-bezier(0.22, 0.9, 0.3, 1.1),
                filter 0.9s cubic-bezier(0.22, 0.9, 0.3, 1.1);
    will-change: transform;
  }

  .rock.is-hover {
    transform: translateY(-13px);
    filter: drop-shadow(0px 26px 20px rgba(96, 74, 38, 0.38));
  }

  /* ============ bamboo ============ */
  .bamboo { position: fixed; top: 0; right: 0; height: 100%; width: 190px; z-index: 1; pointer-events: none; }

  .stalk {
    position: absolute;
    top: -60px;
    width: 30px;
    height: calc(100% + 120px);
    border-radius: 15px;
    background:
      repeating-linear-gradient(180deg,
        rgba(38, 48, 26, 0.28) 0 2px,
        rgba(38, 48, 26, 0) 2px 34px),
      linear-gradient(90deg, #7d9156 0%, #a4bb77 42%, #c3d49b 68%, #8fa763 100%);
    box-shadow: inset 0 0 7px rgba(34, 44, 20, 0.35), 4px 8px 22px rgba(96, 82, 44, 0.18);
    animation: stalkSway 9s ease-in-out infinite;
    transform-origin: 50% 110%;
  }

  .stalk:nth-child(1) { right: 14px;  animation-delay: 0s;    opacity: 0.97; }
  .stalk:nth-child(2) { right: 58px;  height: 82%;  animation-delay: -3.2s; opacity: 0.85; }
  .stalk:nth-child(3) { right: 104px; height: 92%;  animation-delay: -6.1s; opacity: 0.90; }
  .stalk:nth-child(4) { right: 148px; height: 68%;  width: 24px; border-radius: 12px; animation-delay: -1.8s; opacity: 0.72; }

  .leaf {
    position: absolute;
    width: 74px;
    height: 18px;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: linear-gradient(100deg, #77894c 0%, #94a862 55%, #b4c482 100%);
    box-shadow: 0 2px 6px rgba(90, 84, 40, 0.14);
    animation: leafSway 7s ease-in-out infinite alternate;
    transform-origin: 8% 50%;
    transform: rotate(var(--r, 20deg));
  }

  @keyframes stalkSway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(0.6deg); }
  }

  @keyframes leafSway {
    0%   { transform: rotate(calc(var(--r, 20deg) - 3deg)); }
    100% { transform: rotate(calc(var(--r, 20deg) + 4deg)); }
  }

  /* ============ drifting dust motes ============ */
  .mote {
    position: fixed;
    left: var(--x);
    top: var(--y);
    width: var(--s, 5px);
    height: var(--s, 5px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255, 250, 232, 0.9), rgba(255, 250, 232, 0));
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    animation: moteFloat var(--t, 16s) linear infinite;
    animation-delay: var(--d, 0s);
  }

  @keyframes moteFloat {
    0%   { transform: translate3d(0, 0, 0);        opacity: 0; }
    12%  { opacity: var(--o, 0.5); }
    50%  { transform: translate3d(14px, -45vh, 0); opacity: calc(var(--o, 0.5) * 0.55); }
    88%  { opacity: 0; }
    100% { transform: translate3d(-10px, -92vh, 0); opacity: 0; }
  }

  /* ============ typography & chrome ============ */
  .title {
    position: fixed;
    left: 0;
    right: 0;
    bottom: clamp(22px, 6vh, 52px);
    z-index: 5;
    text-align: center;
    pointer-events: none;
  }

  .title .glyph {
    font-size: clamp(20px, 2.6vw, 30px);
    color: rgba(124, 107, 77, 0.55);
    display: block;
    margin-bottom: 10px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", var(--font-serif);
  }

  .title h1 {
    font-weight: 400;
    font-size: clamp(24px, 3.4vw, 44px);
    letter-spacing: clamp(0.4em, 1.4vw, 0.75em);
    text-indent: clamp(0.4em, 1.4vw, 0.75em);
    color: var(--ink-soft);
    text-shadow: 0 1px 0 rgba(255, 248, 226, 0.65);
  }

  .corner {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    font-size: 11px;
    letter-spacing: 0.32em;
    color: rgba(124, 107, 77, 0.62);
  }

  .corner--tl { top: 22px; left: 26px; }
  .corner--tr { top: 22px; right: 26px; text-align: right; }

  .corner .kanji {
    display: block;
    font-size: 26px;
    letter-spacing: 0;
    line-height: 1;
    margin-bottom: 6px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", var(--font-serif);
  }

  /* ============ responsive ============ */
  @media (max-width: 720px) {
    .bamboo { width: 120px; }
    .stalk:nth-child(3), .stalk:nth-child(4) { display: none; }
    .stalk:nth-child(1) { right: 10px; }
    .stalk:nth-child(2) { right: 46px; }
    .leaf { width: 54px; height: 13px; }
    .leaf:nth-child(5), .leaf:nth-child(6), .leaf:nth-child(9) { display: none; }
    .corner--tr { right: 128px; }
  }

  @media (max-height: 560px) {
    .title { bottom: 12px; }
    .title .glyph { display: none; }
    .corner { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stalk, .leaf, .mote { animation: none; }
    .mote { opacity: 0.3; }
    .rock { transition: none; }
  }
</style>
</head>
<body>
  <!-- ============ the garden ============ -->
  <svg id="garden" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <!-- raked sand: horizontal lines, slightly darker than the base sand -->
      <pattern id="rakedSand" width="1200" height="16" patternUnits="userSpaceOnUse">
        <path d="M0 8 H1200" stroke="rgba(180,150,100,0.28)" stroke-width="1.4" fill="none"/>
        <path d="M0 15 H1200" stroke="rgba(160,128,80,0.10)" stroke-width="0.8" fill="none"/>
      </pattern>

      <!-- stone shading: light upper-left, sinking darker toward the base -->
      <linearGradient id="rockShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#9b9385"/>
        <stop offset="0.55" stop-color="#7b7365"/>
        <stop offset="1"    stop-color="#5f5749"/>
      </linearGradient>

      <radialGradient id="stoneMoss" cx="0.38" cy="0.34" r="0.85">
        <stop offset="0"    stop-color="rgba(255,246,224,0.35)"/>
        <stop offset="0.5"  stop-color="rgba(255,246,224,0.06)"/>
        <stop offset="1"    stop-color="rgba(58,48,28,0.18)"/>
      </radialGradient>
    </defs>

    <!-- base sand + raked lines -->
    <rect class="rake-pattern" x="-40" y="-40" width="1280" height="880"/>

    <!-- soft contact shadows under rock clusters -->
    <g fill="rgba(96,74,38,0.10)">
      <ellipse cx="445" cy="560" rx="150" ry="34"/>
      <ellipse cx="120" cy="452" rx="58"  ry="14"/>
    </g>

    <!-- ============ raked concentric rings around rock groups ============ -->
    <g id="rings" fill="none" stroke="#c3a671" stroke-width="1.6">
      <!-- ring set: main stone (524,540) -->
      <ellipse cx="524" cy="540" rx="152" ry="82" stroke-opacity="0.42"/>
      <ellipse cx="524" cy="540" rx="178" ry="97" stroke-opacity="0.30"/>
      <!-- ring set: medium stone (458,452) -->
      <ellipse cx="458" cy="452" rx="92"  ry="50" stroke-opacity="0.40"/>
      <!-- ring set: small companion (394,532) -->
      <ellipse cx="394" cy="532" rx="58"  ry="32" stroke-opacity="0.34"/>
      <!-- ring set: path stone (120,438) -->
      <ellipse cx="120" cy="438" rx="76"  ry="40" stroke-opacity="0.36"/>
      <!-- lone rake lines flowing out between clusters -->
      <path d="M640 596 q90 26 210 20" stroke-opacity="0.22" stroke-width="1.2"/>
      <path d="M238 470 q30 34 20 78" stroke-opacity="0.18" stroke-width="1.2"/>
    </g>

    <!-- ============ stepping-stone path (left) ============ -->
    <g id="stones">
      <g transform="translate(96,74) rotate(-6)">
        <ellipse rx="34" ry="20" fill="#cdbc92" stroke="rgba(120,96,56,0.35)" stroke-width="1"/>
        <ellipse rx="26" ry="13" fill="none" stroke="rgba(255,244,214,0.4)" stroke-width="1"/>
      </g>
      <g transform="translate(128,168) rotate(5)">
        <ellipse rx="30" ry="18" fill="#cdbd92" stroke="rgba(120,96,56,0.35)" stroke-width="1"/>
        <ellipse rx="22" ry="11" fill="none" stroke="rgba(255,244,214,0.4)" stroke-width="1"/>
      </g>
      <g transform="translate(88,268) rotate(-8)">
        <ellipse rx="35" ry="21" fill="#cdbc92" stroke="rgba(120,96,56,0.35)" stroke-width="1"/>
        <ellipse rx="26" ry="13" fill="none" stroke="rgba(255,244,214,0.4)" stroke-width="1"/>
      </g>
      <g transform="translate(124,368) rotate(4)">
        <ellipse rx="31" ry="19" fill="#cdbd92" stroke="rgba(120,96,56,0.35)" stroke-width="1"/>
        <ellipse rx="23" ry="12" fill="none" stroke="rgba(255,244,214,0.4)" stroke-width="1"/>
      </g>
      <g transform="translate(94,562) rotate(-5)">
        <ellipse rx="33" ry="20" fill="#cdbc92" stroke="rgba(120,96,56,0.35)" stroke-width="1"/>
        <ellipse rx="25" ry="12" fill="none" stroke="rgba(255,244,214,0.4)" stroke-width="1"/>
      </g>
      <g transform="translate(126,676) rotate(7)">
        <ellipse rx="30" ry="18" fill="#cdbd92" stroke="rgba(120,96,56,0.35)" stroke-width="1"/>
        <ellipse rx="22" ry="11" fill="none" stroke="rgba(255,244,214,0.4)" stroke-width="1"/>
      </g>
    </g>
    <!-- ============ the five stones ============ -->
    <g id="rocks">

      <!-- rock 1 — the small stone on the stepping path -->
      <g class="rock" data-depth="20" data-px="120" data-py="430" data-phase="0.6">
        <g transform="translate(120,438) rotate(-8) scale(0.55)">
          <path d="M-88 -6 C -80 -46 -40 -68 -4 -64 C 34 -72 74 -46 82 -8 C 88 22 62 52 18 58 C -28 66 -74 46 -86 10 C -90 0 -92 -2 -88 -6 Z"
                fill="url(#rockShade)" stroke="#544d40" stroke-width="1.2"/>
          <path d="M-66 -22 C -54 -46 -22 -58 6 -54 C -16 -44 -44 -26 -56 -2 C -64 -8 -67 -14 -66 -22 Z"
                fill="none" stroke="rgba(255,243,214,0.5)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M30 -30 C 46 -22 58 -6 62 10 C 52 -6 40 -16 26 -20 C 28 -24 29 -27 30 -30 Z"
                fill="rgba(58,48,28,0.22)"/>
          <ellipse cx="-8" cy="-8" rx="62" ry="44" fill="url(#stoneMoss)"/>
        </g>
      </g>

      <!-- rock 2 — the medium stone, upper of the cluster -->
      <g class="rock" data-depth="36" data-px="458" data-py="452" data-phase="2.1">
        <g transform="translate(458,452) rotate(6) scale(0.8)">
          <path d="M-95 0 C -92 -34 -60 -58 -20 -60 C 18 -66 62 -50 84 -22 C 100 0 94 30 66 48 C 34 66 -12 68 -48 54 C -78 42 -98 24 -95 0 Z"
                fill="url(#rockShade)" stroke="#544d40" stroke-width="1.2"/>
          <path d="M-70 -16 C -56 -40 -24 -52 8 -48 C -14 -36 -42 -18 -54 6 C -64 0 -71 -8 -70 -16 Z"
                fill="none" stroke="rgba(255,243,214,0.5)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M44 -14 C 58 -4 66 10 68 24 C 58 10 48 -2 36 -8 C 40 -10 42 -12 44 -14 Z"
                fill="rgba(58,48,28,0.22)"/>
          <ellipse cx="-6" cy="-4" rx="58" ry="40" fill="url(#stoneMoss)"/>
        </g>
      </g>

      <!-- rock 3 — the main stone (largest), centre of the ring sets -->
      <g class="rock" data-depth="44" data-px="524" data-py="540" data-phase="4.4">
        <g transform="translate(524,540) rotate(-3) scale(1.15)">
          <path d="M-100 -8 C -94 -48 -58 -74 -16 -76 C 24 -84 70 -66 92 -34 C 108 -10 104 28 74 52 C 40 78 -10 84 -52 68 C -86 54 -106 28 -100 -8 Z"
                fill="url(#rockShade)" stroke="#544d40" stroke-width="1.1"/>
          <path d="M-74 -24 C -58 -52 -22 -66 14 -62 C -12 -50 -44 -28 -58 -2 C -68 -8 -75 -16 -74 -24 Z"
                fill="none" stroke="rgba(255,243,214,0.55)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M52 -18 C 66 -6 74 10 78 28 C 66 10 54 -4 42 -10 C 46 -13 49 -16 52 -18 Z"
                fill="rgba(58,48,28,0.24)"/>
          <path d="M-30 34 C -10 44 14 46 34 40" fill="none" stroke="rgba(255,243,214,0.2)" stroke-width="1.6" stroke-linecap="round"/>
          <ellipse cx="-6" cy="-6" rx="64" ry="48" fill="url(#stoneMoss)"/>
        </g>
      </g>
      <!-- rock 4 — the small companion stone, lower left of the cluster -->
      <g class="rock" data-depth="30" data-px="394" data-py="532" data-phase="1.3">
        <g transform="translate(394,532) rotate(10) scale(0.5)">
          <path d="M-78 -4 C -72 -34 -42 -54 -8 -56 C 24 -60 56 -44 68 -18 C 78 4 66 30 36 42 C 4 56 -36 48 -62 28 C -76 18 -82 10 -78 -4 Z"
                fill="url(#rockShade)" stroke="#544d40" stroke-width="1.4"/>
          <path d="M-56 -14 C -46 -32 -20 -42 4 -40 C -12 -30 -32 -16 -40 2 C -48 -2 -55 -7 -56 -14 Z"
                fill="none" stroke="rgba(255,243,214,0.5)" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="-4" cy="-4" rx="46" ry="34" fill="url(#stoneMoss)"/>
        </g>
      </g>

      <!-- rock 5 — the lone accent stone, lower right of the garden -->
      <g class="rock" data-depth="40" data-px="760" data-py="620" data-phase="5.0">
        <g transform="translate(760,620) rotate(-14) scale(0.58)">
          <path d="M-70 2 C -74 -30 -48 -52 -14 -54 C 20 -58 54 -42 66 -14 C 76 8 62 34 30 44 C -4 56 -54 44 -70 2 Z"
                fill="url(#rockShade)" stroke="#544d40" stroke-width="1.3"/>
          <path d="M-50 -12 C -40 -32 -14 -42 10 -38 C -8 -28 -28 -14 -36 4 C -44 0 -50 -5 -50 -12 Z"
                fill="none" stroke="rgba(255,243,214,0.5)" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M36 -12 C 46 -2 52 10 54 22 C 46 8 38 -2 28 -8 C 31 -10 34 -11 36 -12 Z"
                fill="rgba(58,48,28,0.22)"/>
          <ellipse cx="-4" cy="-4" rx="48" ry="34" fill="url(#stoneMoss)"/>
        </g>
      </g>
    </g>
  </svg>
  <!-- ============ bamboo (right) ============ -->
  <div class="bamboo" id="bamboo" aria-hidden="true">
    <div class="stalk"></div>
    <div class="stalk"></div>
    <div class="stalk"></div>
    <div class="stalk"></div>
    <span class="leaf" style="right:6px;   top:14%; --r:-16deg; animation-delay:-1.2s"></span>
    <span class="leaf" style="right:26px;  top:18%; --r:24deg;  animation-delay:-3.4s; width:88px; height:20px"></span>
    <span class="leaf" style="right:40px;  top:9%;  --r:42deg;  animation-delay:-2.1s"></span>
    <span class="leaf" style="right:52px;  top:34%; --r:-30deg; animation-delay:-4.8s; width:64px"></span>
    <span class="leaf" style="right:88px;  top:22%; --r:18deg;  animation-delay:-0.6s"></span>
    <span class="leaf" style="right:104px; top:44%; --r:-12deg; animation-delay:-5.5s; width:60px"></span>
    <span class="leaf" style="right:70px;  top:8%;  --r:-44deg; animation-delay:-2.9s; width:80px; height:18px"></span>
    <span class="leaf" style="right:140px; top:52%; --r:28deg;  animation-delay:-6.2s; width:56px"></span>
  </div>

  <!-- drifting dust motes -->
  <span class="mote" style="--x:18%; --y:70%; --s:5px; --t:19s; --d:-3s;  --o:0.45"></span>
  <span class="mote" style="--x:34%; --y:85%; --s:4px; --t:23s; --d:-11s; --o:0.35"></span>
  <span class="mote" style="--x:52%; --y:78%; --s:6px; --t:17s; --d:-6s;  --o:0.5"></span>
  <span class="mote" style="--x:66%; --y:88%; --s:3px; --t:26s; --d:-15s; --o:0.3"></span>
  <span class="mote" style="--x:80%; --y:74%; --s:5px; --t:21s; --d:-9s;  --o:0.4"></span>
  <span class="mote" style="--x:44%; --y:95%; --s:4px; --t:24s; --d:-18s; --o:0.35"></span>

  <!-- ============ typography & chrome ============ -->
  <div class="corner corner--tl" aria-hidden="true">
    <span class="kanji">禅</span>
    STONE &middot; SAND &middot; BREATH
  </div>
  <div class="corner corner--tr" aria-hidden="true">
    No. 008 &mdash; GARDEN SERIES
  </div>

  <div class="title">
    <span class="glyph">枯山水</span>
    <h1>ZEN GARDEN</h1>
  </div>

  <!-- overlays -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
<script>
(function () {
  'use strict';

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var rocks = Array.prototype.slice.call(document.querySelectorAll('.rock'));
  var bamboo = document.getElementById('bamboo');

  var tx = 0, ty = 0;      // target drift (normalized to -1..1)
  var cx = 0, cy = 0;      // eased drift
  var hovered = null;
  var last = 0;

  function onPointer(e) {
    tx = (e.clientX / window.innerWidth) * 2 - 1;
    ty = (e.clientY / window.innerHeight) * 2 - 1;
  }

  function setHover(el) {
    if (hovered === el) return;
    if (hovered) hovered.classList.remove('is-hover');
    hovered = el;
    if (hovered) hovered.classList.add('is-hover');
  }

  rocks.forEach(function (rock) {
    rock.addEventListener('mouseenter', function () { setHover(rock); });
    rock.addEventListener('mouseleave', function () { setHover(null); });
    rock.addEventListener('touchstart', function () { setHover(rock); }, { passive: true });
  });
  window.addEventListener('touchend', function () { setHover(null); }, { passive: true });
  window.addEventListener('pointermove', onPointer, { passive: true });
  window.addEventListener('touchmove', onPointer, { passive: true });

  function applyRock(rock, t) {
    var depth = parseFloat(rock.getAttribute('data-depth')) || 24;
    var px = parseFloat(rock.getAttribute('data-px'));
    var py = parseFloat(rock.getAttribute('data-py'));
    var phase = parseFloat(rock.getAttribute('data-phase')) || 0;
    var breathe = reduced ? 0 : Math.sin(t / 1400 + phase) * 1.4;   // idle drift, px
    var x = cx * depth + breathe;
    var y = cy * depth * 0.7 - breathe * 0.6;
    var scale = 1 + (reduced ? 0 : Math.sin(t / 1800 + phase) * 0.004); // near-imperceptible breathing
    rock.style.transform =
      'translate(' + px + 'px,' + py + 'px) ' +
      'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) ' +
      'scale(' + scale.toFixed(4) + ')';
  }

  function frame(now) {
    var dt = Math.min(now - last, 64);
    last = now;
    var k = 1 - Math.pow(0.001, dt / 1000);   // frame-rate independent easing
    cx += (tx - cx) * k;
    cy += (ty - cy) * k;

    rocks.forEach(function (rock) { applyRock(rock, now); });

    if (bamboo && !reduced) {
      bamboo.style.transform = 'translate(' + (cx * -10).toFixed(2) + 'px,0)';
    }
    requestAnimationFrame(frame);
  }

  // seed each rock at its anchor before the first frame so there is no jump
  rocks.forEach(function (rock) {
    var px = rock.getAttribute('data-px');
    var py = rock.getAttribute('data-py');
    rock.style.transform = 'translate(' + px + 'px,' + py + 'px)';
  });

  if (reduced) {
    // static, contemplative scene: anchors only
  } else {
    requestAnimationFrame(function (now) { last = now; requestAnimationFrame(frame); });
  }
})();
</script>
</body>
</html>
