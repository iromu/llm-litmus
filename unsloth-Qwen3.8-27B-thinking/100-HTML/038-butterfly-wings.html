<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Butterfly Wings</title>
<style>
  :root {
    --bg-deep: #05070f;
    --bg-mid: #0a0e22;
    --text: #eaf2ff;
    --text-dim: rgba(214, 228, 255, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(ellipse 90% 70% at 70% 20%, rgba(64, 46, 128, 0.45), transparent 60%),
      radial-gradient(ellipse 80% 60% at 25% 80%, rgba(24, 84, 108, 0.4), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #070a18 100%);
    color: var(--text);
    overflow: hidden;
    cursor: crosshair;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(18px, 3.5vw, 40px);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
    user-select: none;
  }

  .brand h1 {
    font-size: clamp(1.15rem, 2.6vw, 1.7rem);
    font-weight: 300;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    background: linear-gradient(92deg, #9be7ff, #d6b3ff 45%, #ffb3e6 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(150, 120, 255, 0.25);
  }

  .brand .sub {
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .hint {
    align-self: center;
    font-size: 0.74rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 9px 18px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    background: rgba(10, 14, 34, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    user-select: none;
    animation: hintPulse 4.5s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.65; }
    50%      { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hint { animation: none; opacity: 0.85; }
  }

  @media (max-width: 560px) {
    .brand { flex-direction: column; gap: 6px; }
    .hint { font-size: 0.64rem; padding: 7px 12px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Iridescent butterflies drifting in space"></canvas>

<div class="hud">
  <div class="brand">
    <h1>Butterfly Wings</h1>
    <span class="sub">Jewel-toned &middot; Iridescent &middot; Ethereal</span>
  </div>
  <div class="hint">Drift with the cursor &nbsp;&middot;&nbsp; Click to metamorphose</div>
</div>

<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var BG = { r: 6, g: 9, b: 18 };

  var mouse = { x: 0, y: 0, active: false };
  var hueBase = Math.random() * 360;
  var butterflies = [];
  var dust = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function hsla(h, s, l, a) {
    return "hsla(" + (((h % 360) + 360) % 360) + "," + s + "%," + l + "%," + a + ")";
  }

  function paintBase(alpha) {
    ctx.fillStyle = "rgba(" + BG.r + "," + BG.g + "," + BG.b + "," + alpha + ")";
    ctx.fillRect(0, 0, W, H);
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!mouse.active) { mouse.x = W * 0.5; mouse.y = H * 0.5; }
    paintBase(1);
  }
  /* ------------------------------ dust ------------------------------ */

  function makeDust() {
    dust = [];
    var n = Math.round(clamp(W * H / 16000, 50, 140));
    for (var i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.5, 1.9),
        ph: rand(0, TAU),
        sp: rand(0.15, 0.5),
        vx: rand(-0.06, 0.06),
        vy: rand(-0.12, -0.03),
        hueShift: rand(-40, 40)
      });
    }
  }

  function drawDust(t) {
    for (var i = 0; i < dust.length; i++) {
      var p = dust[i];
      if (!reduceMotion) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
        if (p.x < -4) p.x = W + 4;
        if (p.x > W + 4) p.x = -4;
      }
      var tw = 0.5 + 0.5 * Math.sin(t * p.sp * (reduceMotion ? 0.3 : 1) + p.ph);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fillStyle = hsla(hueBase + 160 + p.hueShift, 70, 78, 0.12 + 0.38 * tw);
      ctx.fill();
    }
  }

  /* --------------------------- butterflies -------------------------- */

  function makeButterfly(followMouse) {
    return {
      follow: !!followMouse,
      x: followMouse ? W * 0.5 : rand(W * 0.15, W * 0.85),
      y: followMouse ? H * 0.5 : rand(H * 0.2, H * 0.8),
      vx: rand(-0.25, 0.25),
      vy: rand(-0.15, 0.15),
      size: followMouse ? clamp(Math.min(W, H) * 0.075, 30, 52) : rand(26, 50),
      hueA: rand(0, 360),
      hueB: rand(40, 110),
      flapPhase: rand(0, TAU),
      flapSpeed: rand(2.1, 3.3),
      bobPhase: rand(0, TAU),
      bobAmp: rand(6, 16),
      angle: rand(-0.25, 0.25),
      wander: rand(0, TAU)
    };
  }

  function regenerate() {
    hueBase = Math.random() * 360;
    butterflies = [];
    var free = reduceMotion ? 4 : 5;
    for (var i = 0; i < free; i++) butterflies.push(makeButterfly(false));
    butterflies.push(makeButterfly(true));
  }

  // Wing silhouettes in local space: origin at thorax, x+ out the right side.
  function upperWingPath(c, L) {
    c.beginPath();
    c.moveTo(0, -0.02 * L);
    c.bezierCurveTo(0.12 * L, -0.72 * L, 0.78 * L, -1.02 * L, 1.02 * L, -0.42 * L);
    c.bezierCurveTo(1.1 * L, -0.1 * L, 0.5 * L, 0.16 * L, 0, 0.08 * L);
    c.closePath();
  }

  function lowerWingPath(c, L) {
    c.beginPath();
    c.moveTo(0, 0.06 * L);
    c.bezierCurveTo(0.42 * L, 0.14 * L, 0.72 * L, 0.5 * L, 0.6 * L, 0.98 * L);
    c.bezierCurveTo(0.28 * L, 1.06 * L, 0.06 * L, 0.66 * L, 0, 0.06 * L);
    c.closePath();
  }

  // multi-stop radial gradient: hot center, shifted mid hues, dark rim.
  function wingGradient(c, L, hue, t) {
    var g = c.createRadialGradient(0.18 * L, -0.1 * L, 0.02 * L, 0.18 * L, -0.1 * L, 1.25 * L);
    var c1 = hue + t * 40;
    g.addColorStop(0.0, hsla(c1 + 30, 95, 78, 0.95));
    g.addColorStop(0.28, hsla(c1, 92, 62, 0.9));
    g.addColorStop(0.58, hsla(c1 - 45, 88, 46, 0.85));
    g.addColorStop(0.85, hsla(c1 - 90, 82, 34, 0.8));
    g.addColorStop(1.0, hsla(c1 - 120, 78, 26, 0.75));
    return g;
  }

  function wingVeins(c, L) {
    c.save();
    c.strokeStyle = "rgba(255,255,255,0.30)";
    c.lineWidth = Math.max(0.7, L * 0.012);
    c.lineCap = "round";
    var veins = [
      [[0.1, -0.12], [0.45, -0.42], [0.95, -0.5]],
      [[0.08, -0.08], [0.5, -0.22], [1.0, -0.3]],
      [[0.07, -0.04], [0.45, 0.02], [0.88, 0.06]]
    ];
    for (var i = 0; i < veins.length; i++) {
      c.beginPath();
      c.moveTo(veins[i][0][0] * L, veins[i][0][1] * L);
      c.quadraticCurveTo(veins[i][1][0] * L, veins[i][1][1] * L, veins[i][2][0] * L, veins[i][2][1] * L);
      c.stroke();
    }
    c.beginPath();
    c.moveTo(0.06 * L, 0.1 * L);
    c.quadraticCurveTo(0.4 * L, 0.32 * L, 0.58 * L, 0.9 * L);
    c.stroke();
    c.beginPath();
    c.moveTo(0.05 * L, 0.1 * L);
    c.quadraticCurveTo(0.25 * L, 0.4 * L, 0.3 * L, 0.98 * L);
    c.stroke();
    c.restore();
  }

  function wingSpots(c, L, hue, t) {
    var spots = [
      { x: 0.72, y: -0.42, r: 0.11, d: 10 },
      { x: 0.45, y: -0.55, r: 0.07, d: 60 },
      { x: 0.4, y: 0.62, r: 0.08, d: 120 },
      { x: 0.56, y: 0.45, r: 0.05, d: 180 }
    ];
    for (var i = 0; i < spots.length; i++) {
      var s = spots[i];
      var h = hue + s.d + t * 40;
      c.beginPath();
      c.arc(s.x * L, s.y * L, s.r * L, 0, TAU);
      c.fillStyle = hsla(h, 85, 82, 0.85);
      c.fill();
      c.beginPath();
      c.arc(s.x * L, s.y * L, s.r * L * 0.55, 0, TAU);
      c.fillStyle = hsla(h + 40, 95, 94, 0.9);
      c.fill();
      c.beginPath();
      c.arc(s.x * L, s.y * L, s.r * L * 1.35, 0, TAU);
      c.strokeStyle = hsla(h, 90, 88, 0.35);
      c.lineWidth = Math.max(0.6, L * 0.01);
      c.stroke();
    }
  }

  function drawWingPair(c, L, hueA, hueB, t, flap) {
    for (var side = 0; side < 2; side++) {
      c.save();
      c.scale(-1, 1);       // mirror for the left side
      c.scale(flap, 1);     // fold wings along the body axis

      c.save();
      c.shadowColor = hsla(hueA + 60, 90, 60, 0.45);
      c.shadowBlur = L * 0.5;
      upperWingPath(c, L);
      c.fillStyle = wingGradient(c, L, hueA, t);
      c.fill();
      c.shadowBlur = 0;
      upperWingPath(c, L);
      c.strokeStyle = hsla(hueA + 150, 80, 85, 0.5);
      c.lineWidth = Math.max(0.8, L * 0.014);
      c.stroke();
      wingVeins(c, L);
      c.restore();

      c.save();
      c.shadowColor = hsla(hueB + 60, 90, 55, 0.4);
      c.shadowBlur = L * 0.4;
      lowerWingPath(c, L);
      c.fillStyle = wingGradient(c, L, hueB, t);
      c.fill();
      c.shadowBlur = 0;
      lowerWingPath(c, L);
      c.strokeStyle = hsla(hueB + 150, 80, 82, 0.45);
      c.lineWidth = Math.max(0.7, L * 0.012);
      c.stroke();
      c.restore();

      wingSpots(c, L, hueA, t);
      c.restore();
    }
  }
  /* ------------------------------- body ------------------------------ */

  function drawBody(c, L) {
    c.save();
    var g = c.createLinearGradient(0, -0.36 * L, 0, 0.42 * L);
    g.addColorStop(0, hsla(hueBase, 30, 34, 0.98));
    g.addColorStop(0.55, hsla(hueBase + 30, 35, 22, 0.98));
    g.addColorStop(1, hsla(hueBase + 50, 40, 14, 0.98));
    c.beginPath();
    c.ellipse(0, 0.02 * L, 0.05 * L, 0.4 * L, 0, 0, TAU);
    c.fillStyle = g;
    c.fill();
    c.beginPath();
    c.arc(0, -0.38 * L, 0.062 * L, 0, TAU);
    c.fillStyle = hsla(hueBase + 20, 30, 30, 0.98);
    c.fill();
    c.strokeStyle = "rgba(230, 238, 255, 0.55)";
    c.lineWidth = Math.max(0.6, L * 0.008);
    c.lineCap = "round";
    for (var side = -1; side <= 1; side += 2) {
      c.beginPath();
      c.moveTo(0, -0.4 * L);
      c.quadraticCurveTo(side * 0.14 * L, -0.62 * L, side * 0.2 * L, -0.52 * L);
      c.stroke();
      c.beginPath();
      c.arc(side * 0.2 * L, -0.52 * L, Math.max(0.8, L * 0.014), 0, TAU);
      c.fillStyle = hsla(hueBase + 120, 80, 80, 0.85);
      c.fill();
    }
    c.restore();
  }

  function drawButterfly(b, t) {
    var hueT = reduceMotion ? t * 0.1 : t;
    var flap = reduceMotion ? 0.78 : 0.55 + 0.45 * Math.sin(t * b.flapSpeed + b.flapPhase);
    var bob = reduceMotion ? 0 : Math.sin(t * 0.8 + b.bobPhase) * b.bobAmp;
    var tilt = reduceMotion ? 0 : Math.sin(t * 0.6 + b.bobPhase) * 0.08;
    ctx.save();
    ctx.translate(b.x, b.y + bob);
    ctx.rotate(b.angle + tilt);
    drawWingPair(ctx, b.size, b.hueA, b.hueB, hueT, flap);
    drawBody(ctx, b.size);
    ctx.restore();
  }

  /* ------------------------------ motion ----------------------------- */

  function updateButterflies(t) {
    for (var i = 0; i < butterflies.length; i++) {
      var b = butterflies[i];
      if (b.follow) {
        b.x += (mouse.x - b.x) * 0.09;
        b.y += (mouse.y - b.y) * 0.09;
        b.angle += (0 - b.angle) * 0.06;
      } else {
        b.wander += 0.005;
        b.vx += Math.sin(t * 0.5 + b.wander) * 0.004;
        b.vy += Math.cos(t * 0.4 + b.wander * 1.3) * 0.003;
        b.vx *= 0.995;
        b.vy *= 0.995;
        b.x += b.vx;
        b.y += b.vy;
        var m = b.size * 0.9;
        if (b.x < m) { b.x = m; b.vx = Math.abs(b.vx); }
        if (b.x > W - m) { b.x = W - m; b.vx = -Math.abs(b.vx); }
        if (b.y < m) { b.y = m; b.vy = Math.abs(b.vy); }
        if (b.y > H - m) { b.y = H - m; b.vy = -Math.abs(b.vy); }
        b.angle += (clamp(-b.vx * 0.3, -0.35, 0.35) - b.angle) * 0.05;
      }
    }
  }

  /* ----------------------------- loop -------------------------------- */

  var start = performance.now();

  function frame(now) {
    var t = (now - start) / 1000;
    paintBase(reduceMotion ? 1 : 0.26);
    if (!reduceMotion) updateButterflies(t);
    drawDust(t);
    for (var i = 0; i < butterflies.length; i++) drawButterfly(butterflies[i], t);
    requestAnimationFrame(frame);
  }

  /* ----------------------------- input ------------------------------- */

  function setMouse(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
  }

  window.addEventListener("mousemove", function (e) {
    setMouse(e.clientX, e.clientY);
  });

  window.addEventListener("touchmove", function (e) {
    if (e.touches.length) setMouse(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener("click", function () {
    regenerate();
  });

  window.addEventListener("resize", function () {
    resize();
    makeDust();
  });

  /* --------------------------- bootstrap ----------------------------- */

  resize();
  regenerate();
  makeDust();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
