<body>
<div id="app"></div>
<div id="title">Voxel Pagoda Garden<small>drag to orbit &middot; scroll to zoom &middot; 5-tier pagoda &middot; cherry blossoms &middot; koi pond &middot; drifting petals</small></div>
<div id="hud"><b>voxel pagoda garden</b><br/>three.js r160 &middot; instanced voxels &middot; seeded layout</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Voxel Pagoda Garden — single-file Three.js scene
   Every block is a unit cube baked into per-color InstancedMesh
   buckets (a handful of draw calls). Deterministic via seeded PRNG.
   ============================================================ */

// ---------- Seeded PRNG (deterministic layout every load) ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260815);
const rr = (a, b) => a + rand() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];

// ---------- Renderer / Scene / Camera ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f2);
scene.fog = new THREE.Fog(0xcfe9f4, 78, 260);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 900);
camera.position.set(54, 34, 70);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 16, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 16;
controls.maxDistance = 230;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.update();
window.__debug = { camera, controls, scene, renderer };

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xcdeaff, 0x3a5830, 0.9));

const sun = new THREE.DirectionalLight(0xfff2d6, 1.55);
sun.position.set(46, 78, 34);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 300;
const S = 95;
sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
sun.shadow.camera.top = S;    sun.shadow.camera.bottom = -S;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9fc4ff, 0.32);
fill.position.set(-36, 46, -30);
scene.add(fill);

// Warm glint along the stone path (lantern ambience, cheap)
const pathGlow = new THREE.PointLight(0xffb168, 14, 30, 2);
pathGlow.position.set(0, 4, 20);
scene.add(pathGlow);

// ---------- Palette (colorful) ----------
const C = {
  stone:  [0x8b929c, 0x7c838d, 0xa0a6ae, 0x6a7078, 0x9aa1aa],
  roof:   [0x333f63, 0x2a3452, 0x3d4b6e, 0x2f3a5a],
  red:    0xb23b2a,
  vermilion: 0xd6452b,
  cream:  0xf2e6c6,
  rail:   0xe8d9b4,
  dark:   0x2c2836,
  gold:   0xe0ad42,
  trunk:  0x6d4c33,
  pineTr: 0x59422e,
  mapleTr:0x5b3a26,
  pine:   [0x35633a, 0x2f5a34, 0x40704a, 0x4a7d45],
  maple:  [0xd6531f, 0xc8361a, 0xe5842c, 0xc2531b, 0xb53a1c],
  bamboo: [0x5d9a44, 0x6fae50, 0x7cc15a],
  leaf:   0x3f7a35,
  water:  0x4d8cc2,
  lily:   0x4e9b52,
  glow:   0xffd9a0,
  dirt:   0x7a5230,
  grass:  [0x5f8f3f, 0x6f9c4a, 0x537f36, 0x74a244],
  pink:   [0xffc9dd, 0xffc9dd, 0xffc9dd, 0xff9ec7, 0xff9ec7, 0xff9ec7, 0xfff3f7, 0xfff3f7, 0xff77ae, 0xff77ae, 0xffb0d0],
  flower: [0xe74c3c, 0xf1c40f, 0xfdfefe, 0x9b59b6, 0xff8f3f, 0xf06292],
  snow:   [0xf2f6ff, 0xe4ecfa],
  mount:  [0x5b6b4a, 0x6a7a55, 0x4f6041],
  cloud:  [0xffffff, 0xf4f8ff],
  firefly:0xffe98a,
};

// ---------- Voxel builder (color-bucketed) ----------
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
boxGeo.translate(0, 0.5, 0); // pivot at base: y is the ground level of the cube

const buckets = new Map(); // key -> { color, opts, items }
let voxelCount = 0;

function addVox(x, y, z, color, opts = {}) {
  const key = color + (opts.glow ? '|g' : '') + (opts.metal ? '|m' : '') + (opts.trans ? '|t' : '');
  let b = buckets.get(key);
  if (!b) { b = { color, opts, items: [] }; buckets.set(key, b); }
  b.items.push([x, y, z, opts]);
  voxelCount++;
}

// Filled disc of voxels at height y (flat canopies, lily pads)
function disc(cx, y, cz, r, color) {
  for (let x = -r; x <= r; x++) for (let z = -r; z <= r; z++) {
    if (x * x + z * z <= r * r) addVox(cx + x, y, cz + z, color);
  }
}

// Boundary of a (2r+1)^2 square ring at height y
function squareRing(r, y, color, opts) {
  if (r === 0) { addVox(0, y, 0, color, opts); return; }
  for (let x = -r; x <= r; x++) { addVox(x, y, r, color, opts); addVox(x, y, -r, color, opts); }
  for (let z = -r + 1; z <= r - 1; z++) { addVox(r, y, z, color, opts); addVox(-r, y, z, color, opts); }
}

// Filled solid box region [x0..x1] x [z0..z1] at height y
function fillBox(x0, z0, x1, z1, y, color, opts) {
  for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) addVox(x, y, z, color, opts);
}

function randInSphere(r) {
  let x, y, z, tries = 0;
  do { x = rr(-r, r); y = rr(-r, r); z = rr(-r, r); tries++; }
  while (x * x + y * y + z * z > r * r && tries < 40);
  return [x, y, z];
}

// ============================================================
//  THE PAGODA — 5 tiers, lacquered walls, upturned gilded eaves,
//  balcony railings, gold ringed spire (sōrin), carved stone base
// ============================================================
function wallColor(c, h, ri, face) {
  if (Math.abs(c) === h) return C.red;                       // corner column
  if (c === 0) return (face === 'F') ? C.dark : C.red;        // front door / other pilaster
  const win = (ri === 1) && h - 1 >= 2 && (Math.abs(c) === h - 1 || (face === 'F' && Math.abs(c) === 1));
  if (win) return C.dark;                                      // lattice window
  return C.cream;
}

function buildWalls(cx, cz, h, rows) {
  rows.forEach((wy, ri) => {
    for (let x = -h; x <= h; x++) {
      addVox(cx + x, wy, cz + h, wallColor(x, h, ri, 'F'));
      addVox(cx + x, wy, cz - h, wallColor(x, h, ri, 'B'));
    }
    for (let z = -h + 1; z <= h - 1; z++) {
      addVox(cx + h, wy, cz + z, wallColor(z, h, ri, 'R'));
      addVox(cx - h, wy, cz + z, wallColor(z, h, ri, 'L'));
    }
  });
}

function pagodaRoof(cx, cz, baseR, baseY) {
  // gilded eave (widest) fascia ring at the lowest level
  for (let x = -baseR; x <= baseR; x++) { addVox(cx + x, baseY, cz + baseR, C.gold, { metal: true }); addVox(cx + x, baseY, cz - baseR, C.gold, { metal: true }); }
  for (let z = -baseR + 1; z <= baseR - 1; z++) { addVox(cx + baseR, baseY, cz + z, C.gold, { metal: true }); addVox(cx - baseR, baseY, cz + z, C.gold, { metal: true }); }
  // pyramidal tiled roof body stepping up to the apex
  for (let k = 1; k <= baseR; k++) {
    const r = baseR - k;
    const y = baseY + k;
    if (r === 0) { addVox(cx, y, cz, C.roof[0]); break; }
    for (let x = -r; x <= r; x++) { addVox(cx + x, y, cz + r, pick(C.roof)); addVox(cx + x, y, cz - r, pick(C.roof)); }
    for (let z = -r + 1; z <= r - 1; z++) { addVox(cx + r, y, cz + z, pick(C.roof)); addVox(cx - r, y, cz + z, pick(C.roof)); }
  }
  // upturned eave corner flicks with gold ball tips (classic silhouette)
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => {
    addVox(cx + sx * (baseR + 1), baseY + 1, cz + sz * (baseR + 1), C.roof[0]);
    addVox(cx + sx * (baseR + 1), baseY + 2, cz + sz * (baseR + 1), C.gold, { metal: true, sy: 0.6, sx: 0.6, sz: 0.6 });
  });
  return baseY + baseR; // apex y
}

function buildPagoda() {
  // stepped ziggurat stone platform
  fillBox(-9, -9, 9, 9, 0, pick(C.stone), { sy: 0.5 });
  fillBox(-8, -8, 8, 8, 0, pick(C.stone));
  fillBox(-7, -7, 7, 7, 0, pick(C.stone));
  // front steps up the platform (+z side)
  for (let i = 0; i < 3; i++) {
    fillBox(-3 + i, 8 + i, 3 - i, 8 + i, 0, pick(C.stone), { sy: 0.5 + i * 0.25 });
  }

  const halves = [7, 6, 5, 4, 3];
  let Y = 1; // top of the platform

  halves.forEach((h, tier) => {
    fillBox(-h, -h, h, h, Y, pick(C.stone));                 // floor slab
    const rows = [Y + 1, Y + 2, Y + 3];
    buildWalls(0, 0, h, rows);

    // balcony: railing ring one voxel out, with a front stair gap + red posts
    const by = Y + 3;
    squareRing(h + 1, by, C.rail);
    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => addVox(sx * (h + 1), by, sz * (h + 1), C.red));
    for (let x = -1; x <= 1; x++) addVox(x, by, h + 1, C.dark); // stair gap in railing

    // roof
    const baseR = h + 2;
    const apexY = pagodaRoof(0, 0, baseR, Y + 4);

    // gold spire on the topmost tier
    if (tier === halves.length - 1) {
      let sy = apexY + 1;
      addVox(0, sy, 0, C.gold, { metal: true, sy: 0.5, sx: 1.2, sz: 1.2 });
      for (let y = sy + 1; y <= sy + 4; y++) addVox(0, y, 0, C.gold, { metal: true, sy: 0.5, sx: 0.45, sz: 0.45 });
      [sy + 1, sy + 2.1, sy + 3.2, sy + 4.3].forEach(y => squareRing(1, y, C.gold, { metal: true, sy: 0.35 }));
      addVox(0, sy + 5.2, 0, C.gold, { metal: true, sy: 0.8, sx: 0.8, sz: 0.8 });
    }

    Y = apexY + 1; // next tier base sits above the roof apex
  });
}
buildPagoda();

// ============================================================
//  TREES — cherry blossoms, layered pines, autumn maple, bamboo
// ============================================================
function cherryTree(cx, cz, scale = 1) {
  const th = ri(5, 7);
  let x = cx, z = cz;
  for (let y = 1; y <= th; y++) {
    addVox(x, y, z, C.trunk);
    if (y > th - 2) { addVox(x + ri(-1, 1), y + 1, z + ri(-1, 1), C.trunk); }
    if (rand() < 0.16) { x += ri(-1, 1); z += ri(-1, 1); }
  }
  const topY = th;
  const R = rr(3, 4.2) * scale;
  const n = Math.floor(680 * scale * scale);
  for (let i = 0; i < n; i++) {
    const [px, py, pz] = randInSphere(R);
    const vx = Math.round(cx + px);
    const vy = Math.round(topY + 1 + R * 0.55 + py - R * 0.45);
    const vz = Math.round(cz + pz);
    if (vy < topY) continue;
    if (rand() < 0.86) addVox(vx, vy, vz, pick(C.pink));
  }
  for (let s = 0; s < 2; s++) {
    const [ox, oy, oz] = randInSphere(R * 0.9);
    const sr = rr(1.4, 2.4);
    for (let i = 0; i < 150 * scale; i++) {
      const [px, py, pz] = randInSphere(sr);
      const vx = Math.round(cx + ox + px);
      const vy = Math.round(topY + 2 + oy * 0.7 + py);
      const vz = Math.round(cz + oz + pz);
      if (vy < topY) continue;
      if (rand() < 0.9) addVox(vx, vy, vz, pick(C.pink));
    }
  }
}

function pineTree(cx, cz) {
  const th = ri(4, 6);
  for (let y = 1; y <= th; y++) {
    addVox(cx, y, cz, C.pineTr);
    if (y === Math.floor(th * 0.5)) { addVox(cx + 1, y, cz, C.pineTr); addVox(cx - 1, y + 1, cz, C.pineTr); }
  }
  [3, 2, 1].forEach((r, i) => {
    disc(cx, th + 1 + i * 2, cz, r, pick(C.pine));
    if (i < 2) addVox(cx, th + 1 + i * 2 + 1, cz, C.pineTr);
  });
}

function mapleTree(cx, cz) {
  const th = ri(5, 7);
  let x = cx, z = cz;
  for (let y = 1; y <= th; y++) {
    addVox(x, y, z, C.mapleTr);
    if (y > th - 3) { addVox(x + ri(-1, 1), y + 1, z + ri(-1, 1), C.mapleTr); }
  }
  const topY = th, R = rr(3.4, 4.4);
  const n = Math.floor(560);
  for (let i = 0; i < n; i++) {
    const [px, py, pz] = randInSphere(R);
    const vx = Math.round(cx + px);
    const vy = Math.round(topY + 1 + R * 0.5 + py - R * 0.35);
    const vz = Math.round(cz + pz);
    if (vy < topY) continue;
    if (rand() < 0.82) addVox(vx, vy, vz, pick(C.maple));
  }
}

function bambooGrove(cx, cz) {
  for (let i = 0; i < 16; i++) {
    const x = cx + ri(-3, 3), z = cz + ri(-3, 3);
    const h = ri(9, 13);
    let px = x, pz = z;
    for (let y = 1; y <= h; y++) {
      addVox(px, y, pz, pick(C.bamboo));
      if (rand() < 0.12) { px += ri(-1, 1); pz += ri(-1, 1); }
    }
    for (let l = 0; l < 4; l++) addVox(px + ri(-1, 1), h + ri(0, 1), pz + ri(-1, 1), C.leaf);
  }
  for (let a = 0; a < 12; a++) {
    const ang = (a / 12) * Math.PI * 2;
    addVox(Math.round(cx + Math.cos(ang) * 5), 0, Math.round(cz + Math.sin(ang) * 5), pick(C.stone), { sy: 0.4 });
  }
}

[[-10, 15, 1.05], [11, 14, 0.95], [17, 4, 1.1], [-15, -9, 1.0], [5, -16, 0.95], [-18, 9, 0.9]]
  .forEach(([x, z, s]) => cherryTree(x, z, s));
[[-19, -13], [22, -14], [-6, -21]].forEach(([x, z]) => pineTree(x, z));
[[-14, -15], [19, -19]].forEach(([x, z]) => mapleTree(x, z));
bambooGrove(-21, 4);

// ============================================================
//  KOI POND — water, stone rim, lilies, arched bridge, animated koi
// ============================================================
const POND = { x: 15, z: -6, rx: 6, rz: 5 };

function buildPond() {
  for (let x = -POND.rx - 2; x <= POND.rx + 2; x++) {
    for (let z = -POND.rz - 2; z <= POND.rz + 2; z++) {
      const d = (x / POND.rx) ** 2 + (z / POND.rz) ** 2;
      if (d <= 1) {
        addVox(POND.x + x, 0, POND.z + z, C.water, { trans: true });
      } else if (d <= 2.6 && rand() < 0.9) {
        addVox(POND.x + x, 0, POND.z + z, pick(C.stone), { sy: 0.7 });
      }
    }
  }
  // lily pads + a lotus blossom
  [[3, -1], [-2, 1], [0, 2], [1, -3], [-3, -2]].forEach(([ox, oz]) => {
    const px = POND.x + ox, pz = POND.z + oz;
    disc(px, 1.02, pz, 1, C.lily);
    if (rand() < 0.5) addVox(px, 1.06, pz, pick(C.pink), { sy: 0.25, sx: 0.7, sz: 0.7 });
  });
  // arched stone bridge crossing the pond (east-west)
  for (let i = 0; i <= 8; i++) {
    const t = i / 8;
    const hgt = 1 + Math.round(1.8 * Math.sin(Math.PI * t));
    addVox(POND.x - POND.rx + i, 0, POND.z, pick(C.stone), { sy: hgt });
    if (i === 0 || i === 8) addVox(POND.x - POND.rx + i, hgt, POND.z, C.vermilion, { sy: 0.5 });
  }
}
buildPond();

// koi — three little animated groups swimming in slow ellipses
const koiMats = [0xff7f2a, 0xfff2e0, 0xd94f30].map(col =>
  new THREE.MeshStandardMaterial({ color: col, roughness: 0.55 }));
const koiGeoBody = new THREE.BoxGeometry(1.5, 0.26, 0.38);
const koiGeoTail = new THREE.BoxGeometry(0.38, 0.22, 0.32);
const koiTailMat = new THREE.MeshStandardMaterial({ color: 0xfff6ea, roughness: 0.55 });
const koi = [];
for (let i = 0; i < 3; i++) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(koiGeoBody, koiMats[i]);
  const tail = new THREE.Mesh(koiGeoTail, koiTailMat);
  tail.position.x = -1.0;
  g.add(body, tail);
  scene.add(g);
  koi.push({ g, r: rr(1.7, 3.2), w: rr(0.18, 0.32), a: rr(0, 6.28) });
}

// ============================================================
//  PATH, TORII GATE, LANTERNS, FLOWERS, ROCKS, GROUND SCATTER
// ============================================================
const pathX = z => Math.round(1.8 * Math.sin(z * 0.30));

for (let z = 12; z <= 31; z++) {
  if (z % 2 === 0) {
    const x = pathX(z);
    const wide = z % 4 === 0 ? 2 : 1;
    for (let dx = -Math.floor(wide / 2); dx <= Math.floor((wide + 1) / 2) - 1; dx++) {
      addVox(x + dx, 0, z, pick(C.stone), { sy: 0.14, sz: 1 });
    }
  }
}

function toriiGate(x, z) {
  const postH = 6;
  [x - 2, x + 2].forEach(px => {
    for (let y = 0; y < postH; y++) addVox(px, y, z, C.vermilion);
  });
  fillBox(x - 3, z, x + 3, z, postH, C.vermilion);                    // mid beam (nuki)
  fillBox(x - 4, z, x + 4, z, postH + 2, C.vermilion);                // top beam (kasagi)
  addVox(x - 4, postH + 3, z, 0x2c2836, { sy: 0.4 });                 // dark end-caps
  addVox(x + 4, postH + 3, z, 0x2c2836, { sy: 0.4 });
  addVox(x, postH + 3, z, C.gold, { sy: 0.4 });                        // central plaque
}
toriiGate(pathX(16), 16);

function stoneLantern(x, z) {
  addVox(x, 0, z, pick(C.stone), { sy: 0.5, sx: 1.5, sz: 1.5 });
  addVox(x, 0.5, z, pick(C.stone), { sy: 0.9 });
  addVox(x, 1.4, z, C.glow, { glow: true, sy: 0.55 });
  addVox(x, 1.95, z, C.dark, { sy: 0.3, sx: 1.6, sz: 1.6 });
  addVox(x, 2.28, z, C.gold, { sy: 0.28, sx: 0.5, sz: 0.5 });
}
[[pathX(14) - 3, 14], [pathX(14) + 3, 14], [pathX(24) - 3, 24], [pathX(24) + 3, 24], [pathX(20) - 4, 20]]
  .forEach(([x, z]) => stoneLantern(x, z));

function flowerBed(cx, cz) {
  for (let x = -2; x <= 2; x++) for (let z = -2; z <= 2; z++) {
    if (rand() < 0.85) addVox(cx + x, 0, cz + z, C.dirt, { sy: 0.18 });
  }
  for (let i = 0; i < 14; i++) {
    const x = cx + ri(-2, 2), z = cz + ri(-2, 2);
    addVox(x, 0.1, z, 0x4e7a36, { sy: 0.55 });
    addVox(x, 0.6, z, pick(C.flower), { sy: 0.35, sx: 0.7, sz: 0.7 });
  }
}
[[-12, 9], [13, 9], [-16, -3], [13, 5], [-3, 20], [-24, -6]].forEach(([x, z]) => flowerBed(x, z));

function rockCluster(cx, cz) {
  const n = ri(3, 5);
  for (let i = 0; i < n; i++) {
    const x = cx + ri(-1, 1), z = cz + ri(-1, 1);
    const h = ri(0.4, 1.2);
    addVox(x, 0, z, pick(C.stone), { sy: h, sx: rr(0.7, 1.4), sz: rr(0.7, 1.4) });
    if (rand() < 0.4) addVox(x, h * 0.85, z, C.leaf, { sy: 0.2, sx: 0.8, sz: 0.8 });
  }
}
[[-8, -17], [9, 21], [24, 8], [-26, 12], [7, 27]].forEach(([x, z]) => rockCluster(x, z));

// grass tufts + pebbles scattered over the meadow (avoiding built areas)
function onPond(x, z) { return ((x - POND.x) / (POND.rx + 1.5)) ** 2 + ((z - POND.z) / (POND.rz + 1.5)) ** 2 <= 1; }
function onPlatform(x, z) { return Math.abs(x) <= 10.5 && Math.abs(z) <= 10.5; }
function onPath(x, z) { return z >= 11 && z <= 31 && Math.abs(x - pathX(z)) < 2.5; }
function freeGround(x, z) {
  if (Math.hypot(x, z) > 34) return false;
  if (onPond(x, z) || onPlatform(x, z) || onPath(x, z)) return false;
  return true;
}
for (let i = 0; i < 240; i++) {
  const x = ri(-34, 34), z = ri(-34, 34);
  if (!freeGround(x, z)) continue;
  if (i % 3 === 0) addVox(x, 0, z, pick(C.grass), { sy: rr(0.25, 0.5), sx: 0.5, sz: 0.5 });
  else addVox(x, 0, z, pick(C.stone), { sy: 0.22, sx: 0.55, sz: 0.55 });
}

// ground plane (meadow)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x74a256, roughness: 1.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// ============================================================
//  BACKGROUND — distant snow-capped voxel mountains + drifting clouds
// ============================================================
function mountain(cx, cz, r) {
  for (let level = 0; level <= r; level++) {
    const rad = r - level;
    const y = level;
    const snow = level > r - 3;
    const col = snow ? pick(C.snow) : pick(C.mount);
    disc(cx, y, cz, rad, col);
  }
  addVox(cx, r + 1, cz, pick(C.snow), { sy: 0.7, sx: 0.7, sz: 0.7 });
}
[[-46, -34, 9], [38, -46, 10], [-52, 14, 8], [52, 30, 9], [-30, -52, 8], [24, 52, 9], [48, -8, 7], [-40, 44, 8]]
  .forEach(([x, z, r]) => mountain(x, z, r));

function cloud(cx, cy, cz) {
  const r = rr(2.4, 4.2);
  for (let i = 0; i < Math.floor(r * r * 2.2); i++) {
    const [px, py, pz] = randInSphere(r);
    const vx = Math.round(cx + px);
    const vy = Math.round(cy + py * 0.4);
    const vz = Math.round(cz + pz);
    if (rand() < 0.85) addVox(vx, vy, vz, pick(C.cloud));
  }
}
[[-30, 40, -40], [20, 46, -50], [45, 42, 20], [-48, 44, 26], [5, 50, 48], [-14, 48, -52]]
  .forEach(([x, y, z]) => cloud(x, y, z));

// ============================================================
//  Bake every color bucket into one InstancedMesh each
// ============================================================
const dummy = new THREE.Object3D();
for (const b of buckets.values()) {
  const mat = new THREE.MeshStandardMaterial({
    color: b.color,
    roughness: b.opts.metal ? 0.35 : b.opts.trans ? 0.3 : 0.9,
    metalness: b.opts.metal ? 0.6 : 0.0,
    emissive: b.opts.glow ? b.color : 0x000000,
    emissiveIntensity: b.opts.glow ? 1.4 : 0,
    transparent: !!b.opts.trans,
    opacity: b.opts.trans ? 0.78 : 1,
  });
  const mesh = new THREE.InstancedMesh(boxGeo, mat, b.items.length);
  b.items.forEach(([x, y, z, o], i) => {
    dummy.position.set(x, y, z);
    dummy.scale.set(o.sx ?? 1, o.sy ?? 1, o.sz ?? 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });
  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = !b.opts.trans;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// ============================================================
//  ANIMATED — cherry petals, water sparkles, sky lanterns, fireflies
// ============================================================
const PETALS = 300;
const petalGeo = new THREE.BoxGeometry(0.32, 0.06, 0.32);
const petalMat = new THREE.MeshStandardMaterial({ color: 0xffb7d5, roughness: 0.85, transparent: true, opacity: 0.95 });
const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETALS);
petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const petalData = [];
for (let i = 0; i < PETALS; i++) {
  petalData.push({
    x: rr(-30, 30), y: rr(0.5, 18), z: rr(-24, 34),
    vx: rr(0.15, 0.5), vz: rr(-0.1, 0.1),
    ph: rr(0, 6.28), spin: rr(0.4, 1.2),
  });
}
scene.add(petals);

const SPARKS = 54;
const sparkGeo = new THREE.BoxGeometry(0.5, 0.05, 0.5);
const sparkMat = new THREE.MeshStandardMaterial({ color: 0xa8dcf5, roughness: 0.2, emissive: 0x6fb8dd, emissiveIntensity: 0.5 });
const sparks = new THREE.InstancedMesh(sparkGeo, sparkMat, SPARKS);
sparks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const sparkData = [];
for (let i = 0; i < SPARKS; i++) {
  const [px, pz] = randInSphere(1);
  sparkData.push({ x: POND.x + px * (POND.rx - 0.8), z: POND.z + pz * (POND.rz - 0.8), ph: rr(0, 6.28) });
}
scene.add(sparks);

const skyLanternMat = new THREE.MeshStandardMaterial({
  color: 0xffc879, emissive: 0xffa94d, emissiveIntensity: 1.15, transparent: true, opacity: 0.95,
});
const skyLanterns = [];
for (let i = 0; i < 3; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.7, 1.3), skyLanternMat);
  m.position.set(rr(-22, 22), rr(8, 42), rr(-20, 24));
  scene.add(m);
  skyLanterns.push({ m, vy: rr(0.15, 0.3), ph: rr(0, 6.28) });
}

const FIREFLIES = 40;
const fireflyGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
const fireflyMat = new THREE.MeshStandardMaterial({ color: 0xffe98a, emissive: 0xd6ff6a, emissiveIntensity: 1.6 });
const fireflies = new THREE.InstancedMesh(fireflyGeo, fireflyMat, FIREFLIES);
fireflies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const fireflyData = [];
for (let i = 0; i < FIREFLIES; i++) {
  fireflyData.push({
    cx: rr(-28, 28), cz: rr(-22, 30), cy: rr(2, 9),
    r: rr(1, 3.5), sp: rr(0.2, 0.6), ph: rr(0, 6.28),
  });
}
scene.add(fireflies);

// ============================================================
//  Animation loop
// ============================================================
const clock = new THREE.Clock();
let firstFrameDone = false;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (let i = 0; i < PETALS; i++) {
    const p = petalData[i];
    p.x += p.vx * dt * 2.2;
    p.z += p.vz * dt * 2.2;
    p.y += Math.sin(t * 0.8 + p.ph) * 0.12 * dt * 10;
    if (p.x > 32) p.x = -32;
    if (p.y < 0.4) p.y = 0.4;
    if (p.y > 20) p.y = 20;
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(0, t * p.spin + p.ph, Math.sin(t + p.ph) * 0.6);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < SPARKS; i++) {
    const s = sparkData[i];
    const w = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.9 + s.ph));
    dummy.position.set(s.x, 1.0 + 0.06 * w, s.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, w, 1);
    dummy.updateMatrix();
    sparks.setMatrixAt(i, dummy.matrix);
  }
  sparks.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < FIREFLIES; i++) {
    const f = fireflyData[i];
    const a = t * f.sp + f.ph;
    dummy.position.set(f.cx + Math.cos(a) * f.r, f.cy + Math.sin(a * 0.7 + f.ph) * 1.5, f.cz + Math.sin(a) * f.r);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    fireflies.setMatrixAt(i, dummy.matrix);
  }
  fireflies.instanceMatrix.needsUpdate = true;

  for (const k of koi) {
    k.a += k.w * dt;
    k.g.position.set(
      POND.x + Math.cos(k.a) * k.r * 0.95,
      1.02,
      POND.z + Math.sin(k.a) * k.r * 0.7
    );
    k.g.rotation.y = -k.a + Math.PI / 2;
  }

  for (const l of skyLanterns) {
    l.m.position.y += l.vy * dt * 3;
    l.m.position.x += Math.sin(t * 0.4 + l.ph) * 0.05;
    l.m.position.z += Math.cos(t * 0.3 + l.ph) * 0.05;
    if (l.m.position.y > 50) { l.m.position.y = 7; }
  }

  controls.update();
  renderer.render(scene, camera);

  if (!firstFrameDone) {
    firstFrameDone = true;
    window.__pagodaStats = {
      buckets: buckets.size,
      voxels: voxelCount,
      petals: PETALS,
      sparks: SPARKS,
      fireflies: FIREFLIES,
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
    };
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
