<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Thunderforce — Attract Mode Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #game-container {
        position: relative;
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
      }
      #game-canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%; height: 100%;
        object-fit: contain;
      }
      #ui-overlay {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; z-index: 10;
      }
      #crt-overlay {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; z-index: 20;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
        opacity: 0.4;
      }
      #flash-overlay {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; z-index: 25;
        background: white; opacity: 0;
      }
      @media (hover: none) and (pointer: coarse) {
        #touch-controls {
          display: block !important;
          position: absolute; bottom: 20px; left: 20px;
          width: 120px; height: 120px; z-index: 30;
          pointer-events: auto;
        }
        #dash-button {
          display: block !important;
          position: absolute; bottom: 40px; right: 40px;
          width: 80px; height: 80px;
          background: rgba(255, 68, 68, 0.4);
          border: 2px solid rgba(255, 68, 68, 0.7);
          border-radius: 50%; z-index: 30;
          pointer-events: auto;
          color: white; font-family: monospace; font-size: 12px;
          display: flex; align-items: center; justify-content: center;
        }
      }
      #dash-button { display: none; }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="ui-overlay"></div>
      <div id="crt-overlay"></div>
      <div id="flash-overlay"></div>
      <div id="touch-controls" aria-hidden="true">
        <div id="joystick-stick" style="
          width: 120px; height: 120px;
          background: rgba(255,255,255,0.1);
          border: 2px solid rgba(255,255,255,0.3);
          border-radius: 50%; position: relative;
        ">
          <div id="joystick-knob" style="
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
          "></div>
        </div>
        <button id="dash-button">DASH</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
