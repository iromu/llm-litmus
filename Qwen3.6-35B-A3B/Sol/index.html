<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Solar System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }

    /* ── UI Controls ── */
    #controls {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
      background: rgba(10, 10, 30, 0.75); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
      padding: 12px 24px; z-index: 10; user-select: none;
    }
    #controls button {
      background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px;
      transition: background 0.2s;
    }
    #controls button:hover { background: rgba(255,255,255,0.22); }
    #controls label { color: rgba(255,255,255,0.8); font-size: 13px; display: flex; align-items: center; gap: 8px; }
    #controls input[type=range] { width: 120px; accent-color: #6ea8fe; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; display: none; pointer-events: none;
      background: rgba(8, 8, 28, 0.88); backdrop-filter: blur(14px);
      border: 1px solid rgba(100, 160, 255, 0.3); border-radius: 12px;
      padding: 14px 18px; color: #fff; min-width: 200px; z-index: 20;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    #tooltip h3 { margin: 0 0 6px 0; font-size: 16px; color: #6ea8fe; }
    #tooltip p { margin: 3px 0; font-size: 13px; color: rgba(255,255,255,0.78); line-height: 1.45; }
    #tooltip .fact { font-style: italic; color: rgba(255,255,200,0.85); margin-top: 6px; }

    /* ── Info overlay ── */
    #info {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.6); font-size: 13px; z-index: 10;
      background: rgba(10,10,30,0.5); padding: 8px 16px; border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="info">Scroll to zoom · Drag to rotate · Hover a planet for info</div>

<div id="controls">
  <button id="btnPlay">⏸ Pause</button>
  <label>
    Speed
    <input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1">
  </label>
  <span id="speedVal" style="color:#6ea8fe;font-size:13px;min-width:30px;">1.0×</span>
</div>

<div id="tooltip">
  <h3 id="ttName"></h3>
  <p id="ttDist"></p>
  <p id="ttSize"></p>
  <p class="fact" id="ttFact"></p>
</div>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ──────────────────────────────────────────────
//  DATA
// ──────────────────────────────────────────────
const PLANETS = [
  {
    name: 'Mercury', radius: 0.38, distance: 28, speed: 4.15, color: 0xb5b5b5,
    tilt: 0.034, rotSpeed: 0.017,
    fact: 'Mercury is the smallest planet and closest to the Sun. A day on Mercury lasts 59 Earth days.',
    distText: '57.9 million km', sizeText: '4,879 km diameter'
  },
  {
    name: 'Venus', radius: 0.95, distance: 42, speed: 1.62, color: 0xe8cda0,
    tilt: 3.096, rotSpeed: -0.004,
    fact: 'Venus rotates backwards compared to most planets. It is the hottest planet at 462°C.',
    distText: '108.2 million km', sizeText: '12,104 km diameter'
  },
  {
    name: 'Earth', radius: 1.0, distance: 58, speed: 1.0, color: 0x4d9de0,
    tilt: 0.409, rotSpeed: 0.02,
    fact: 'Earth is the only known planet with life. About 71% of its surface is covered in water.',
    distText: '149.6 million km', sizeText: '12,742 km diameter'
  },
  {
    name: 'Mars', radius: 0.53, distance: 76, speed: 0.53, color: 0xc1440e,
    tilt: 0.44, rotSpeed: 0.018,
    fact: 'Mars has the tallest volcano in the solar system — Olympus Mons at 21.9 km high.',
    distText: '227.9 million km', sizeText: '6,779 km diameter'
  },
  {
    name: 'Jupiter', radius: 3.5, distance: 110, speed: 0.084, color: 0xc8a55a,
    tilt: 0.0545, rotSpeed: 0.04,
    fact: 'Jupiter is the largest planet. Its Great Red Spot is a storm larger than Earth.',
    distText: '778.5 million km', sizeText: '139,820 km diameter'
  },
  {
    name: 'Saturn', radius: 2.9, distance: 145, speed: 0.034, color: 0xe0c97e,
    tilt: 0.466, rotSpeed: 0.038, hasRings: true,
    fact: 'Saturn\'s rings are made of ice and rock particles. It could float in water.',
    distText: '1.43 billion km', sizeText: '116,460 km diameter'
  },
  {
    name: 'Uranus', radius: 2.0, distance: 180, speed: 0.012, color: 0x7ec8e3,
    tilt: 1.706, rotSpeed: 0.03,
    fact: 'Uranus rotates on its side with an axial tilt of 98°. It was the first planet found with a telescope.',
    distText: '2.87 billion km', sizeText: '50,724 km diameter'
  },
  {
    name: 'Neptune', radius: 1.9, distance: 210, speed: 0.006, color: 0x3e54e8,
    tilt: 0.494, rotSpeed: 0.032,
    fact: 'Neptune has the strongest winds in the solar system, reaching 2,100 km/h.',
    distText: '4.5 billion km', sizeText: '49,244 km diameter'
  }
];

// ──────────────────────────────────────────────
//  SCENE SETUP
// ──────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(80, 120, 200);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 30;
controls.maxDistance = 800;

// ──────────────────────────────────────────────
//  STARFIELD
// ──────────────────────────────────────────────
function createStarfield() {
  const geo = new THREE.BufferGeometry();
  const count = 8000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 800 + Math.random() * 1200;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    const c = 0.6 + Math.random() * 0.4;
    // slight colour variation
    colors[i * 3]     = c * (0.9 + Math.random() * 0.1);
    colors[i * 3 + 1] = c * (0.9 + Math.random() * 0.1);
    colors[i * 3 + 2] = c;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({ size: 0.8, vertexColors: true, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
}
createStarfield();

// ──────────────────────────────────────────────
//  LIGHTING
// ──────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x333344, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.PointLight(0xffffff, 2.5, 600);
sunLight.position.set(0, 0, 0);
sunLight.castShadow = true;
scene.add(sunLight);

// ──────────────────────────────────────────────
//  SUN
// ──────────────────────────────────────────────
const sunGeo = new THREE.SphereGeometry(6, 64, 64);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd33 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
scene.add(sunMesh);

// Sun glow sprite
const glowCanvas = document.createElement('canvas');
glowCanvas.width = 128; glowCanvas.height = 128;
const ctx = glowCanvas.getContext('2d');
const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
grad.addColorStop(0, 'rgba(255,220,80,0.6)');
grad.addColorStop(0.4, 'rgba(255,180,40,0.2)');
grad.addColorStop(1, 'rgba(255,150,0,0)');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 128, 128);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending });
const glowSprite = new THREE.Sprite(glowMat);
glowSprite.scale.set(30, 30, 1);
sunMesh.add(glowSprite);

// ──────────────────────────────────────────────
//  PLANETS
// ──────────────────────────────────────────────
const planetMeshes = [];  // for raycasting
const orbitLines = [];
const planetData = [];    // store angle per planet

PLANETS.forEach((p) => {
  // Orbit line
  const orbitGeo = new THREE.BufferGeometry();
  const orbitPts = [];
  for (let i = 0; i <= 256; i++) {
    const angle = (i / 256) * Math.PI * 2;
    orbitPts.push(Math.cos(angle) * p.distance, 0, Math.sin(angle) * p.distance);
  }
  orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(orbitPts, 3));
  const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 });
  const orbitLine = new THREE.Line(orbitGeo, orbitMat);
  scene.add(orbitLine);
  orbitLines.push(orbitLine);

  // Planet group (for tilt)
  const group = new THREE.Group();

  // Planet sphere
  const geo = new THREE.SphereGeometry(p.radius, 32, 32);
  const mat = new THREE.MeshStandardMaterial({
    color: p.color, roughness: 0.7, metalness: 0.1
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.rotation.z = p.tilt;
  group.add(mesh);

  // Saturn rings
  if (p.hasRings) {
    const ringGeo = new THREE.RingGeometry(p.radius * 1.3, p.radius * 2.2, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xc8a96e, side: THREE.DoubleSide, transparent: true, opacity: 0.55
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.2;
    group.add(ring);
  }

  // Earth: add a subtle moon
  if (p.name === 'Earth') {
    const moonGeo = new THREE.SphereGeometry(0.2, 16, 16);
    const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 });
    const moon = new THREE.Mesh(moonGeo, moonMat);
    moon.position.set(2, 0.3, 0);
    group.add(moon);
    p.moon = moon;
  }

  scene.add(group);

  // Random starting angle
  const startAngle = Math.random() * Math.PI * 2;

  planetMeshes.push(mesh);
  planetData.push({ ...p, group, mesh, angle: startAngle });
});

// ──────────────────────────────────────────────
//  RAYCASTING / TOOLTIP
// ──────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
const ttName = document.getElementById('ttName');
const ttDist = document.getElementById('ttDist');
const ttSize = document.getElementById('ttSize');
const ttFact = document.getElementById('ttFact');

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(planetMeshes);

  if (hits.length > 0) {
    const hitMesh = hits[0].object;
    const pd = planetData.find(p => p.mesh === hitMesh);
    if (pd) {
      ttName.textContent = pd.name;
      ttDist.textContent = `📏 ${pd.distText}`;
      ttSize.textContent = `🌍 ${pd.sizeText}`;
      ttFact.textContent = `💡 ${pd.fact}`;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 16) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
      renderer.domElement.style.cursor = 'pointer';
      return;
    }
  }

  // Check sun
  const sunHits = raycaster.intersectObject(sunMesh);
  if (sunHits.length > 0) {
    ttName.textContent = 'The Sun';
    ttDist.textContent = '📏 Center of the Solar System';
    ttSize.textContent = `🌍 1,391,000 km diameter`;
    ttFact.textContent = '💡 The Sun contains 99.86% of the solar system\'s mass. Surface temp: 5,500°C.';
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    renderer.domElement.style.cursor = 'pointer';
    return;
  }

  tooltip.style.display = 'none';
  renderer.domElement.style.cursor = 'grab';
});

// ──────────────────────────────────────────────
//  CONTROLS
// ──────────────────────────────────────────────
let paused = false;
let speedMultiplier = 1.0;

const btnPlay = document.getElementById('btnPlay');
btnPlay.addEventListener('click', () => {
  paused = !paused;
  btnPlay.textContent = paused ? '▶ Play' : '⏸ Pause';
});

const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', () => {
  speedMultiplier = parseFloat(speedSlider.value);
  speedVal.textContent = speedMultiplier.toFixed(1) + '×';
});

// ──────────────────────────────────────────────
//  ANIMATION LOOP
// ──────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  controls.update();

  if (!paused) {
    // Sun rotation
    sunMesh.rotation.y += delta * 0.1;

    // Sun pulse glow
    const pulse = 1 + 0.05 * Math.sin(Date.now() * 0.002);
    glowSprite.scale.set(30 * pulse, 30 * pulse, 1);

    // Planets
    planetData.forEach((pd) => {
      pd.angle += delta * pd.speed * 0.15 * speedMultiplier;
      const x = Math.cos(pd.angle) * pd.distance;
      const z = Math.sin(pd.angle) * pd.distance;
      pd.group.position.set(x, 0, z);
      pd.mesh.rotation.y += delta * pd.rotSpeed * speedMultiplier;

      // Moon orbit for Earth
      if (pd.moon) {
        const moonAngle = Date.now() * 0.001 * speedMultiplier;
        pd.moon.position.set(Math.cos(moonAngle) * 2, 0.3, Math.sin(moonAngle) * 2);
      }
    });
  }

  renderer.render(scene, camera);
}
animate();

// ──────────────────────────────────────────────
//  RESIZE
// ──────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
