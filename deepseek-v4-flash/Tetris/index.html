<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON TETRIS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0a0a0f;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Orbitron',monospace,sans-serif;
  overflow:hidden;
  user-select:none;
}

canvas#game{
  display:block;
  background:transparent;
  z-index:2;
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  image-rendering:pixelated;
  border:1px solid rgba(0,255,255,0.25);
  box-shadow:0 0 40px rgba(0,255,255,0.08),inset 0 0 40px rgba(0,255,255,0.04);
}

canvas#bg{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:0;
}

#ui{
  position:absolute;
  z-index:3;
  color:#fff;
  pointer-events:none;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
}

#info{
  position:absolute;
  left:calc(50% + 160px);
  top:50%;
  transform:translateY(-50%);
  width:200px;
  pointer-events:none;
  padding-left:30px;
}

#info div{
  margin-bottom:22px;
  text-shadow:0 0 10px currentColor,0 0 30px currentColor;
}

#info .label{
  font-size:10px;
  letter-spacing:4px;
  opacity:.45;
  margin-bottom:5px;
}

#info .value{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

#info .value.score{color:#f0f;text-shadow:0 0 15px #f0f,0 0 40px #f0f}
#info .value.level{color:#0ff;text-shadow:0 0 15px #0ff,0 0 40px #0ff}
#info .value.lines{color:#ff0;text-shadow:0 0 15px #ff0,0 0 40px #ff0}

#next-piece{
  margin-top:8px;
}
#next-piece .label{font-size:9px;margin-bottom:6px}
#next-piece canvas{
  display:block;
  image-rendering:pixelated;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:4px;
}

#gameover{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-size:34px;
  font-weight:900;
  letter-spacing:8px;
  color:#f22;
  text-shadow:0 0 20px #f22,0 0 60px #f22,0 0 120px #f22;
  opacity:0;
  transition:opacity .5s;
  pointer-events:none;
  text-align:center;
  z-index:4;
}
#gameover.show{opacity:1;pointer-events:auto;cursor:pointer}
#gameover small{
  font-size:13px;
  letter-spacing:3px;
  color:#fff;
  text-shadow:0 0 10px #fff;
}

#start-msg{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-size:16px;
  letter-spacing:6px;
  color:#0ff;
  text-shadow:0 0 15px #0ff,0 0 40px #0ff;
  animation:pulse 1.2s ease-in-out infinite;
  pointer-events:auto;cursor:pointer;
  z-index:4;
  text-align:center;
}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}

#controls-hint{
  position:absolute;
  left:50%;top:calc(50% + 170px);
  transform:translate(-50%,-50%);
  font-size:10px;
  letter-spacing:3px;
  opacity:.3;
  pointer-events:none;
  z-index:4;
  white-space:nowrap;
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="game"></canvas>
<div id="ui">
  <div id="info">
    <div><div class="label">SCORE</div><div class="value score" id="score-val">0</div></div>
    <div><div class="label">LEVEL</div><div class="value level" id="level-val">1</div></div>
    <div><div class="label">LINES</div><div class="value lines" id="lines-val">0</div></div>
    <div id="next-piece">
      <div class="label">NEXT</div>
      <canvas id="next-canvas" width="84" height="84"></canvas>
    </div>
  </div>
  <div id="gameover">GAME OVER<br><small>CLICK TO RESTART</small></div>
  <div id="start-msg">PRESS SPACE<br>TO START</div>
  <div id="controls-hint">← → ↓  ↑  SPACE</div>
</div>
<script>
// ─── CONFIG ───
const COLS=10,ROWS=20,BLOCK=28;
const BOARD_COLS=10,BOARD_ROWS=22;
const VIS_OFFSET=2;
const GAME_W=BOARD_COLS*BLOCK;
const GAME_H=BOARD_ROWS*BLOCK;

// ─── PIECES ───
const PIECE_DATA=[
  {name:'I',color:'#0ff',shadow:'#0ff',shapes:[[1,1,1,1]]},
  {name:'O',color:'#ff0',shadow:'#ff0',shapes:[[1,1],[1,1]]},
  {name:'T',color:'#a0f',shadow:'#a0f',shapes:[[0,1,0],[1,1,1]]},
  {name:'S',color:'#0f0',shadow:'#0f0',shapes:[[0,1,1],[1,1,0]]},
  {name:'Z',color:'#f00',shadow:'#f00',shapes:[[1,1,0],[0,1,1]]},
  {name:'L',color:'#fa0',shadow:'#fa0',shapes:[[1,0],[1,0],[1,1]]},
  {name:'J',color:'#00f',shadow:'#00f',shapes:[[0,1],[0,1],[1,1]]},
];

function rotate(s){return s[0].map((_,i)=>s.map(r=>r[i])).reverse()}

// ─── CANVAS ───
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
cv.width=GAME_W;cv.height=GAME_H;

const bgCv=document.getElementById('bg');
const bgCtx=bgCv.getContext('2d');
function resizeBg(){bgCv.width=innerWidth;bgCv.height=innerHeight}
resizeBg(); window.addEventListener('resize',resizeBg);

const ncv=document.getElementById('next-canvas');
const nctx=ncv.getContext('2d');

// ─── STATE ───
let board=Array.from({length:BOARD_ROWS},()=>Array(BOARD_COLS).fill(0));
let active=null,nxt=null;
let sc=0,lv=1,ln=0;
let over=false,started=false;
let dtimer=0,interval=800;
let particles=[],flash=0,flashRows=[],shake=0;
let af,lastT=0;

// ─── PIECES ───
function randPiece(){
  const p=PIECE_DATA[Math.floor(Math.random()*PIECE_DATA.length)];
  return {name:p.name,color:p.color,shadow:p.shadow,shape:p.shapes.map(r=>r.slice()),rot:0};
}

function spawn(){
  active=nxt||randPiece();
  nxt=randPiece();
  active.r=0; active.c=Math.floor((BOARD_COLS-active.shape[0].length)/2);
  if(collide(active.shape,active.r,active.c)) over=true;
  drawNext();
}

function drawNext(){
  const s=nxt.shape;
  nctx.clearRect(0,0,84,84);
  const ox=(84-s[0].length*BLOCK)/2,oy=(84-s.length*BLOCK)/2;
  for(let r=0;r<s.length;r++) for(let c=0;c<s[r].length;c++){
    if(!s[r][c]) continue;
    const x=ox+c*BLOCK,y=oy+r*BLOCK;
    nctx.shadowColor=nxt.shadow; nctx.shadowBlur=15;
    nctx.fillStyle=nxt.color;
    nctx.fillRect(x+1,y+1,BLOCK-2,BLOCK-2);
    nctx.shadowBlur=0;
    nctx.fillStyle='rgba(255,255,255,.2)';
    nctx.fillRect(x+1,y+1,BLOCK-2,BLOCK-2);
  }
}

// ─── COLLISION ───
function collide(s,r,c){
  for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
    if(!s[y][x]) continue;
    const br=r+y,bc=c+x;
    if(bc<0||bc>=BOARD_COLS||br>=BOARD_ROWS) return true;
    if(br>=0&&board[br][bc]) return true;
  }
  return false;
}

function lock(){
  const s=active.shape,c=active.color,sh=active.shadow;
  for(let r=0;r<s.length;r++) for(let c2=0;c2<s[r].length;c2++){
    if(!s[r][c2]) continue;
    const br=active.r+r,bc=active.c+c2;
    if(br>=0&&br<BOARD_ROWS) board[br][bc]={color:c,shadow:sh};
  }
  // lock particles
  for(let r=0;r<s.length;r++) for(let c2=0;c2<s[r].length;c2++){
    if(!s[r][c2]) continue;
    const px=(active.c+c2)*BLOCK+BLOCK/2;
    const py=(active.r+r)*BLOCK+BLOCK/2;
    for(let i=0;i<5;i++) emit(px,py,c,3,3,0.5);
  }
  clearLines();
  spawn();
}

// ─── PARTICLES ───
function emit(x,y,col,count=5,spd=4,grav=.2){
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2,sp=Math.random()*spd+1;
    particles.push({
      x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-grav*2,
      life:40+Math.random()*40,maxLife:80,
      color:col||'#fff',size:2+Math.random()*3
    });
  }
}

function clearLines(){
  let cleared=[];
  for(let r=0;r<BOARD_ROWS;r++) if(board[r].every(c=>c)) cleared.push(r);
  if(!cleared.length) return;
  flashRows=cleared.slice(); flash=1;
  for(let r of cleared) for(let c=0;c<BOARD_COLS;c++){
    const px=c*BLOCK+BLOCK/2,py=r*BLOCK+BLOCK/2;
    emit(px,py,['#f0f','#0ff','#ff0','#f00','#fff'][Math.floor(Math.random()*5)],10,8,.3);
  }
  // screen shake
  shake=8;
  const n=cleared.length;
  const pts=[0,100,300,500,800];
  sc+=(pts[n]||800)*lv;
  ln+=n;
  lv=Math.floor(ln/10)+1;
  interval=Math.max(100,800-(lv-1)*50);
  for(let r of cleared.sort((a,b)=>a-b)){board.splice(r,1);board.unshift(Array(BOARD_COLS).fill(0))}
  updateUI();
}

// ─── INPUT ───
document.addEventListener('keydown',e=>{
  if(!started&&e.code==='Space'){
    started=true;
    document.getElementById('start-msg').style.display='none';
    spawn();
    return;
  }
  if(over&&e.code==='Space'){reset();return}
  if(!active||over) return;
  switch(e.code){
    case 'ArrowLeft': if(!collide(active.shape,active.r,active.c-1)) active.c--; break;
    case 'ArrowRight': if(!collide(active.shape,active.r,active.c+1)) active.c++; break;
    case 'ArrowDown':
      if(!collide(active.shape,active.r+1,active.c)){active.r++;dtimer=0}
      break;
    case 'ArrowUp':{
      const rot=rotate(active.shape);
      for(let k of[0,-1,1,-2,2]) if(!collide(rot,active.r,active.c+k)){active.shape=rot;active.c+=k;break}
      break;
    }
    case 'Space':
      while(!collide(active.shape,active.r+1,active.c)) active.r++;
      lock();
      break;
  }
  e.preventDefault();
});

// ─── TICK ───
function tick(dt){
  if(!started||over) return;
  dtimer+=dt;
  if(dtimer>=interval){
    if(!collide(active.shape,active.r+1,active.c)) active.r++;
    else lock();
    dtimer=0;
  }
}

// ─── DRAW ───
function draw(){
  const vis=VIS_OFFSET;
  ctx.clearRect(0,0,GAME_W,GAME_H);
  // apply shake
  if(shake>0){ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake-=1}

  // background grid
  ctx.fillStyle='#0a0a12';
  ctx.fillRect(0,0,GAME_W,GAME_H);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const x=c*BLOCK,y=r*BLOCK;
    ctx.strokeStyle=(r%2===c%2)?'rgba(255,255,255,.04)':'rgba(255,255,255,.02)';
    ctx.strokeRect(x,y,BLOCK,BLOCK);
  }

  // placed blocks
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=board[r+vis][c];
    if(!cell) continue;
    const x=c*BLOCK,y=r*BLOCK;
    ctx.shadowColor=cell.shadow;ctx.shadowBlur=18;
    ctx.fillStyle=cell.color;
    ctx.fillRect(x+1,y+1,BLOCK-2,BLOCK-2);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.fillRect(x+1,y+1,BLOCK-2,BLOCK-2);
  }

  // ghost
  if(active&&!over){
    let gr=active.r;
    while(!collide(active.shape,gr+1,active.c)) gr++;
    for(let r=0;r<active.shape.length;r++) for(let c=0;c<active.shape[r].length;c++){
      if(!active.shape[r][c]) continue;
      const br=gr+r-vis,bc=active.c+c;
      if(br<0) continue;
      const x=bc*BLOCK,y=br*BLOCK;
      ctx.fillStyle='rgba(255,255,255,.06)';
      ctx.fillRect(x+1,y+1,BLOCK-2,BLOCK-2);
      ctx.strokeStyle='rgba(255,255,255,.12)';
      ctx.strokeRect(x+1,y+1,BLOCK-2,BLOCK-2);
    }
  }

  // active piece
  if(active&&!over){
    for(let r=0;r<active.shape.length;r++) for(let c=0;c<active.shape[r].length;c++){
      if(!active.shape[r][c]) continue;
      const br=active.r+r-vis,bc=active.c+c;
      if(br<0) continue;
      const x=bc*BLOCK,y=br*BLOCK;
      ctx.shadowColor=active.shadow;ctx.shadowBlur=25;
      ctx.fillStyle=active.color;
      ctx.fillRect(x+1,y+1,BLOCK-2,BLOCK-2);
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.fillRect(x+1,y+1,BLOCK-2,BLOCK-2);
    }
  }

  // line clear flash
  if(flash>0){
    for(let r of flashRows){
      const vr=r-vis;
      if(vr<0||vr>=ROWS) continue;
      ctx.fillStyle=`rgba(255,255,255,${flash*.5})`;
      ctx.fillRect(0,vr*BLOCK,GAME_W,BLOCK);
    }
  }

  // particles
  for(const p of particles){
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a*a;
    ctx.shadowColor=p.color;ctx.shadowBlur=20;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y-BLOCK*vis,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // border glow
  ctx.strokeStyle='rgba(0,255,255,.25)';
  ctx.lineWidth=1.5;
  ctx.strokeRect(0,0,GAME_W,GAME_H);
  if(shake>0) ctx.restore();
}

// ─── BACKGROUND ───
let bgT=0;
function drawBg(){
  bgT+=.004;
  const W=bgCv.width,H=bgCv.height;
  bgCtx.fillStyle='#0a0a0f';
  bgCtx.fillRect(0,0,W,H);
  // grid dots
  for(let i=0;i<80;i++){
    const x=(i*137+W/2)%W,y=(i*97+H/2)%H;
    const s=1+Math.sin(bgT*2+i)*.4;
    const br=.03+Math.sin(bgT+i*.7)*.025;
    bgCtx.fillStyle=`rgba(255,255,255,${Math.max(0,br)})`;
    bgCtx.fillRect(x,y,s,s);
  }
  // radial glow
  const g=bgCtx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.5);
  g.addColorStop(0,'rgba(100,0,255,.04)');
  g.addColorStop(.5,'rgba(0,255,255,.02)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  bgCtx.fillStyle=g;
  bgCtx.fillRect(0,0,W,H);
}

// ─── UI ───
function updateUI(){
  document.getElementById('score-val').textContent=sc;
  document.getElementById('level-val').textContent=lv;
  document.getElementById('lines-val').textContent=ln;
}

document.getElementById('gameover').addEventListener('click',reset);

function reset(){
  board=Array.from({length:BOARD_ROWS},()=>Array(BOARD_COLS).fill(0));
  active=null;nxt=null;
  sc=0;lv=1;ln=0;
  over=false;
  particles=[];flash=0;shake=0;
  dtimer=0;
  updateUI();
  document.getElementById('gameover').classList.remove('show');
  spawn();
}

// ─── LOOP ───
function loop(t){
  const dt=lastT?Math.min(t-lastT,50):16;
  lastT=t;

  // update particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=.05;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
  if(flash>0) flash-=.03;
  if(flash<0) flash=0;

  tick(dt);
  drawBg();
  draw();

  if(over) document.getElementById('gameover').classList.add('show');
  af=requestAnimationFrame(loop);
}
loop(0);
</script>
</body>
</html>
